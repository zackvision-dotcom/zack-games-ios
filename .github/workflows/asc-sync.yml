name: App Store listing sync
# Pushing this branch sends the listing texts, screenshots and previews of the games named in todo.txt
# to App Store Connect with the official API. It never submits anything for review.
on:
  push:
    branches: [store-media]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - name: Install App Store Connect API key
        run: |
          mkdir -p "$HOME/keys"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > "$HOME/keys/key.p8"
          chmod 600 "$HOME/keys/key.p8"
      - name: Sync
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: /home/runner/keys/key.p8
        run: |
          GAMES=$(grep -v '^#' todo.txt | grep -v '^check' | grep -v '^builds' | grep -v '^lootbox' | grep -v '^refdata' | grep -v '^previews' | grep -v '^iapshot' | grep -v '^review' | grep -v '^iapstate' | grep -v '^cleanold' | tr '\n' ' ')
          if grep -q '^check' todo.txt; then export CHECK_ONLY=1; fi
          if grep -q '^builds' todo.txt; then export BUILDS=1; fi
          if grep -q '^lootbox' todo.txt; then export LOOTBOX=1; fi
          if grep -q '^previews' todo.txt; then export PREVIEWS2=1; fi
          if grep -q '^iapshot' todo.txt; then export IAPSHOT=1; fi
          if grep -q '^review' todo.txt; then export REVIEW=1; fi
          if grep -q '^iapstate' todo.txt; then export IAPSTATE=1; fi
          if grep -q '^refdata' todo.txt; then export REFDATA=1; GAMES=x; fi
          echo "games: $GAMES"
          test -n "$GAMES" && python asc_sync.py $GAMES 2>&1 | tee report.txt
      - name: Publish the report on the branch (readable without signing in)
        if: always()
        run: |
          git config user.name "asc-sync"; git config user.email "noreply@github.com"
          git add report.txt && git commit -m "report [skip ci]" && git push || true
