name: App Store listing sync
# Pushing this branch sends the listing texts, screenshots and previews of the games named in todo.txt
# to App Store Connect with the official API. It never submits anything for review.
on:
  push:
    branches: [store-media]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - name: Install App Store Connect API key
        run: |
          mkdir -p "$HOME/keys"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > "$HOME/keys/key.p8"
          chmod 600 "$HOME/keys/key.p8"
      - name: Sync
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: /home/runner/keys/key.p8
        run: |
          GAMES=$(grep -v '^#' todo.txt | grep -v '^check' | grep -v '^builds' | grep -v '^lootbox' | grep -v '^refdata' | grep -v '^previews' | grep -v '^iapshot' | grep -v '^review' | grep -v '^iapstate' | grep -v '^textonly' | grep -v '^addkw' | grep -v '^rmkw' | grep -v '^setkw' | grep -v '^iapdesc' | grep -v '^lootboxoff' | grep -v '^copyright' | grep -v '^cleanold' | grep -v '^attach' | grep -v '^setbuild' | grep -v '^adsrating' | grep -v '^submit' | grep -v '^cancelsub' | grep -v '^draftver' | grep -v '^draftiap' | grep -v '^prep' | grep -v '^manual' | grep -v '^status' | grep -v '^newver' | grep -v '^iapnew' | tr '\n' ' ')
          if grep -q '^check' todo.txt; then export CHECK_ONLY=1; fi
          if grep -q '^builds' todo.txt; then export BUILDS=1; fi
          if grep -q '^lootbox' todo.txt; then export LOOTBOX=1; fi
          if grep -q '^previews' todo.txt; then export PREVIEWS2=1; fi
          if grep -q '^iapshot' todo.txt; then export IAPSHOT=1; fi
          if grep -q '^review' todo.txt; then export REVIEW=1; fi
          if grep -q '^attach' todo.txt; then export ATTACH=1; fi
          if grep -q '^adsrating' todo.txt; then export ADSRATING=1; fi
          if grep -q '^submit' todo.txt; then export SUBMIT=1; fi
          if grep -q '^cancelsub' todo.txt; then export CANCELSUB=1; fi
          if grep -q '^draftver' todo.txt; then export SUBMIT=1; export DRAFT_ONLY=1; fi
          if grep -q '^draftiap' todo.txt; then export SUBMIT=1; export DRAFT_ONLY=1; export WITH_IAP=1; fi
          if grep -q '^setbuild' todo.txt; then export SETBUILD=$(grep '^setbuild' todo.txt | cut -d' ' -f2); fi
          if grep -q '^iapstate' todo.txt; then export IAPSTATE=1; fi
          if grep -q '^prep' todo.txt; then export PREP=1; fi
          if grep -q '^manual' todo.txt; then export MANUAL=1; fi
          if grep -q '^status' todo.txt; then export STATUS=1; fi
          if grep -q '^release' todo.txt; then export RELEASE=1; fi
          if grep -q '^iapnew' todo.txt; then export IAPNEW=1; fi
          if grep -q '^newver' todo.txt; then export NEWVER=$(grep '^newver' todo.txt | cut -d' ' -f2); fi
          if grep -q '^prepfix' todo.txt; then export PREP=1; export FIX=1; fi
          if grep -q '^textonly' todo.txt; then export ONLY_TEXT=1; fi
          if grep -q '^copyright' todo.txt; then export COPYRIGHT="$(grep '^copyright' todo.txt | cut -d' ' -f2-)"; fi
          if grep -q '^iapdesc' todo.txt; then export IAPDESC=1; GAMES=x; fi
          if grep -q '^lootboxoff' todo.txt; then export LOOTBOX_OFF=1; fi
          if grep -q '^setkw' todo.txt; then export SETKW=1; GAMES=x; fi
          if grep -q '^rmkw' todo.txt; then export RMKW=$(grep '^rmkw' todo.txt | cut -d' ' -f2); fi
          if grep -q '^addkw' todo.txt; then export ADDKW=$(grep '^addkw' todo.txt | cut -d' ' -f2); fi
          if grep -q '^refdata' todo.txt; then export REFDATA=1; GAMES=x; fi
          echo "games: $GAMES"
          test -n "$GAMES" && python asc_sync.py $GAMES 2>&1 | tee report.txt
      - name: Publish the report on the branch (readable without signing in)
        if: always()
        run: |
          git config user.name "asc-sync"; git config user.email "noreply@github.com"
          git add report.txt && git commit -m "report [skip ci]" && git push || true
