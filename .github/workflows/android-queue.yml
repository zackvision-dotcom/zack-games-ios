name: Android build queue
# Pushing android/build-queue.txt (one flavor of android/games.json per line) builds each game:
#   - a debug APK (Google test ads, test purchases), installed on an emulator and screenshotted after 25 s (artifact "smoke-<game>");
#   - a release AAB for Google Play (signed only when the ANDROID_KEYSTORE* secrets exist; "ADS_TEST=0" = real AdMob units).
# versionCode = 1000 + this workflow's run number.
on:
  push:
    branches: [main]
    paths: [android/build-queue.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.p.outputs.games }}
      vc: ${{ steps.p.outputs.vc }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "games=$(grep -v '^#' android/build-queue.txt | grep -v '^ *$' | python3 -c 'import json,sys; print(json.dumps([{"game": l.split()[0], "ads_test": "0" if "ADS_TEST=0" in l.split()[1:] else "1", "version": next((w[8:] for w in l.split()[1:] if w.startswith("VERSION=")), "1.0")} for l in sys.stdin]))')" >> "$GITHUB_OUTPUT"
          echo "vc=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Variant name
        id: v
        run: echo "cap=$(python3 -c "print('${{ matrix.game }}'[0].upper() + '${{ matrix.game }}'[1:])")" >> "$GITHUB_OUTPUT"
      - name: Debug APK (test ads, test purchases)
        working-directory: android
        run: gradle --no-daemon :app:assemble${{ steps.v.outputs.cap }}PlayDebug -PVERSION_CODE=${{ needs.plan.outputs.vc }} -PVERSION_NAME=${{ matrix.version }}
      - name: Upload key
        id: key
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "ks=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"; else echo "no upload key: unsigned release"; fi
      - name: Release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ steps.key.outputs.ks }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -z "$ANDROID_KEYSTORE" ] && unset ANDROID_KEYSTORE
          gradle --no-daemon :app:bundle${{ steps.v.outputs.cap }}PlayRelease -PVERSION_CODE=${{ needs.plan.outputs.vc }} -PVERSION_NAME=${{ matrix.version }} -PADS_TEST=${{ matrix.ads_test }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.game }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p smoke
            adb install -r $(ls android/app/build/outputs/apk/${{ matrix.game }}Play/debug/*.apk | head -1)
            adb shell monkey -p com.zvisionclub.${{ matrix.game }} -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > smoke/${{ matrix.game }}-25s.png
            adb logcat -d | grep -iE "chromium|zvisionclub|AndroidRuntime|FATAL" | tail -200 > smoke/${{ matrix.game }}-logcat.txt || true
            WH=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1); W=${WH%x*}; H=${WH#*x}
            adb shell input tap $((W/2)) $((H*89/100)); sleep 6; adb exec-out screencap -p > smoke/${{ matrix.game }}-tap.png
            adb shell input tap $((W/2)) $((H/2)); sleep 6; adb exec-out screencap -p > smoke/${{ matrix.game }}-tap2.png
            adb logcat -d | grep -iE "Uncaught|console|FATAL" | tail -60 > smoke/${{ matrix.game }}-js.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.game }}
          path: smoke/
      - name: Publish smoke screenshots (branch smoke-<game>, readable without login)
        if: always()
        run: |
          set +e
          cp -r smoke "$RUNNER_TEMP/smoke"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan smoke-tmp
          git rm -rqf --cached . >/dev/null
          mkdir -p "$RUNNER_TEMP/pub/${{ matrix.game }}"; cp "$RUNNER_TEMP"/smoke/* "$RUNNER_TEMP/pub/${{ matrix.game }}/"
          git --work-tree="$RUNNER_TEMP/pub" add -A
          git --work-tree="$RUNNER_TEMP/pub" commit -qm "smoke ${{ matrix.game }} ${{ needs.plan.outputs.vc }}"
          git push -qf origin HEAD:refs/heads/smoke-${{ matrix.game }}
