<style>
:root{--ink:#3a2a1a;--paper:#fdf4e3;--orange:#f0a35a;--sage:#8fb98a;--lav:#a9b4e8;--brick:#c0563a;--sea:#3ab0b8;--deep:#3a2a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3c8;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 14px;font-weight:900;border:3px solid var(--deep);display:block;width:100%;margin-top:8px;transition:transform .08s}
.b1{background:linear-gradient(#ffc27a,#f08a3a);color:#fff;text-shadow:0 2px 0 rgba(58,42,26,.45);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 var(--deep)}
.b2{background:var(--paper);box-shadow:0 4px 0 var(--deep)}.b3{background:#f4d0c8;color:#8a2a1a;box-shadow:0 4px 0 var(--deep)}
.b1:active,.b2:active{transform:translateY(3px)}.b1:disabled{filter:grayscale(.8);opacity:.55}.b1 small,.b2 small{display:block;font-size:12px;font-weight:700;opacity:.9}
.big{font-size:19px;padding:13px}.row2{display:flex;gap:8px}.row2>*{flex:1}
#game{display:none}#game.on{display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 8px) 10px 0}

.pill{background:var(--paper);border:3px solid var(--deep);border-radius:999px;padding:3px 12px;font-weight:900;font-size:17px;box-shadow:0 3px 0 var(--deep)}
.lv{background:var(--deep);color:#fff;border-radius:10px;padding:2px 8px;font-weight:900;font-size:13px}
.hp{flex:1;font-size:18px;text-align:right}.hp span{opacity:.25}
.rb{width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--deep);box-shadow:0 3px 0 var(--deep);font-size:18px;font-weight:900}
.fuel,.prog{display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:900;font-size:12px;color:#fff;text-shadow:0 1px 2px #000}
.bar{flex:1;height:12px;background:rgba(0,0,0,.35);border-radius:7px;border:2px solid rgba(255,255,255,.7);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#f0a35a,#ffd34d)}.bar i.low{background:#e0402a;animation:blink .5s infinite alternate}@keyframes blink{to{opacity:.4}}
.prog .bar i{background:linear-gradient(90deg,#8fb98a,#3ab0b8)}.prog .bar em{position:absolute;top:-12px;font-style:normal;font-size:18px;transform:translateX(-50%) scaleX(-1)}
#seats{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;display:flex;justify-content:center;gap:10px;pointer-events:none}
.seat{pointer-events:auto;position:relative;width:62px;height:62px;border-radius:50%;background:var(--paper);border:3px solid var(--deep);box-shadow:0 3px 0 var(--deep);display:grid;place-items:center}
.seat .face{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 20%;font-size:30px;display:grid;place-items:center}
.seat i{position:absolute;bottom:-12px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;color:#e0402a;text-shadow:0 1px 0 #fff}
.seat .bub{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--deep);border-radius:14px;padding:2px 6px;font-size:20px;animation:pulse .6s infinite alternate}.seat.need{border-color:#e0402a}@keyframes pulse{to{transform:translateX(-50%) scale(1.15)}}
#honk{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 90px);z-index:6;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe27a,#f0a020);border:4px solid var(--deep);box-shadow:0 4px 0 var(--deep);font-size:28px}
#biscuit{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 92px);z-index:6;display:flex;align-items:flex-start;gap:6px;pointer-events:none;opacity:0;transform:translateY(-10px);transition:.25s}
#biscuit.on{opacity:1;transform:none}#biscuit .bf{width:54px;height:54px;flex:none;border-radius:50%;background:#fde8c8 center/cover;border:3px solid var(--deep);display:grid;place-items:center;font-size:30px}
#biscuit .bt{background:var(--paper);border:3px solid var(--deep);border-radius:4px 16px 16px 16px;padding:7px 11px;font-weight:800;font-size:13.5px;box-shadow:0 3px 0 var(--deep);max-width:290px}
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,30,20,.5);padding:16px}#modal.on{display:flex}
.card{background:var(--paper);border:4px solid var(--deep);border-radius:22px;padding:16px;max-width:390px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
@keyframes pop{from{transform:scale(.6);opacity:0}}.card h2{margin:4px 0 6px}.card p{margin:6px 0 10px;line-height:1.35}.sub{color:#7a5a3a;font-weight:700}
.big{font-size:19px}.card .big:not(button){font-size:56px}.gain{font-size:30px;font-weight:900;color:#c07a10}
.evcard img{width:100%;border-radius:14px;border:3px solid var(--deep);display:block}.evph{font-size:80px}
.stats{display:flex;gap:6px}.stats div{flex:1;background:#fff;border:2px solid #e2c89a;border-radius:12px;padding:6px;font-size:12px;font-weight:800;display:flex;flex-direction:column}.stats b{font-size:18px;color:#c07a10}
.pass{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}.pp{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800}.pp .face{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:2px solid var(--deep);font-size:28px;display:grid;place-items:center}.pp i{font-style:normal;font-size:9px}
.shop .it,.it{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid #e2c89a;border-radius:12px;padding:6px 8px;margin-bottom:6px}.it span{flex:1;font-weight:800}.it small{display:block;font-weight:600;color:#7a5a3a;font-size:12px}.it .b1{width:auto;margin:0;padding:6px 12px;white-space:nowrap}
.it.recruit{background:#fff6e0;border-color:var(--orange)}.it .face{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 20%;font-size:28px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pc{aspect-ratio:3/4;border-radius:10px;border:3px dashed #c9a87a;display:grid;place-items:center;font-size:28px;font-weight:900;color:#c9a87a;background:#fff}.pc.got{border:3px solid var(--deep)}.pc img{width:100%;height:100%;object-fit:cover;border-radius:7px}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.lg{background:#fff;border:2px solid #e2c89a;border-radius:10px;padding:4px 1px;font-size:14px;display:flex;flex-direction:column;align-items:center}.lg small{font-size:9px}.lg b{font-size:10px}.lg.got{opacity:.45}.lg.now{border-color:var(--orange);background:#fff1dc}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:1px solid #e2c89a}.sw input{width:22px;height:22px}.ver{font-size:11px;color:#8a6a4a;margin-top:8px}.legal{font-size:13px;text-align:left}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(40,30,20,.5);padding:20px}
.pcrev{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;background:radial-gradient(circle,rgba(253,244,227,.35),rgba(58,42,26,.35))}
.pcrev.out{opacity:0;transform:translate(35%,-40%) scale(.3);transition:.45s ease-in}
.pcflip{position:relative;width:min(56vw,230px);aspect-ratio:3/4;background:#fdf4e3;border:6px solid #fff;outline:3px solid var(--deep);border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.35);animation:flip .7s cubic-bezier(.3,1.4,.5,1)}
.pcflip img{width:100%;height:100%;object-fit:cover}.pcph{display:grid;place-items:center;height:100%;font-size:70px}
@keyframes flip{0%{transform:perspective(700px) rotateY(180deg) scale(.4)}100%{transform:perspective(700px) rotateY(0) scale(1)}}
.stamp{position:absolute;right:-10px;top:-14px;background:#c0563a;color:#fff;font-weight:900;padding:4px 10px;border-radius:6px;transform:rotate(12deg);border:3px dashed #fff;animation:stamp .4s .45s both cubic-bezier(.3,1.8,.5,1)}@keyframes stamp{from{transform:scale(3) rotate(-20deg);opacity:0}}
.pcn{font-weight:900;color:#fff;text-shadow:0 2px 3px #000;font-size:18px}
#toasts{position:fixed;top:40%;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none}.toast{background:var(--paper);border:3px solid var(--deep);border-radius:14px;padding:8px 16px;font-weight:900;box-shadow:0 3px 0 var(--deep);animation:pop .3s}
.adov{position:fixed;inset:0;z-index:50;background:#111;display:flex;align-items:center;justify-content:center}.adbox{color:#fff;text-align:center}.adart{font-size:60px;margin:20px}.adcount{font-size:40px;font-weight:900}
#mapv{position:fixed;inset:0;z-index:4;display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px 20px;background:linear-gradient(rgba(253,244,227,.55),rgba(253,244,227,.85)),#fdf4e3 url(assets/title_bg.png) center/cover}#mapv.on{display:block}
.mapc{max-width:420px;margin:0 auto;text-align:center}.mapc h2{font-size:26px;margin:8px 0 2px}
.stops{display:flex;flex-direction:column;gap:0;margin:14px auto;align-items:stretch;position:relative}.stops::before{content:'';position:absolute;left:30px;top:20px;bottom:20px;border-left:5px dotted var(--orange)}
.stop{display:flex;align-items:center;gap:12px;padding:6px 0;font-weight:800;text-align:left;position:relative}.stop b{width:42px;height:42px;margin-left:9px;border-radius:50%;background:#fff;border:3px solid var(--deep);display:grid;place-items:center;font-size:18px;flex:none}
.stop.done b{background:var(--sage);color:#fff}.stop.now b{background:var(--orange);transform:scale(1.15)}.stop.city b{background:var(--sea)}.stop.now span{color:var(--brick)}
#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 40px)}
#title.on{display:flex}#title .logo{text-align:center}#title .logo img{width:min(90vw,440px);filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
#title h1{font-size:60px;margin:0;line-height:.9;color:#fff;-webkit-text-stroke:3px var(--deep);text-shadow:0 6px 0 var(--deep)}#title p{color:#fff;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.6)}#title .b1{max-width:320px}
</style>
</head>

oyage fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. RevenueCat vérifie les reçus d’achat avec un identifiant anonyme.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) sont envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Van Voyage convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Van Voyage</h4>\n<p>Van Voyage works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Ad choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. RevenueCat checks receipts with an anonymous identifier.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) are sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Van Voyage suits all ages but is not directed at children. We do not knowingly collect personal data from children.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>

  for (let i = 0; i < 14; i++) { const y = ((i * 137 + G.dist * 1.0) % (H + 80)) - 40, x = i % 2 ? r.cx - r.w / 2 - 40 - (i * 13) % 40 : r.cx + r.w / 2 + 40 + (i * 17) % 40; cx.fillStyle = sc === 1 ? '#2f6a3a' : '#5a9a4a'; cx.beginPath(); cx.arc(x, y, 18, 0, TAU); cx.fill(); }
}
const ITEM_EMO = { coin: '🪙', fuel: '⛽', card: '📮', hole: '🕳️', cone: '🚧', sheep: '🐑' };
function drawItems() {
  const vy = VAN_Y();
  for (const it of G.items) {
    const sy = vy - (it.y - G.dist); if (sy < -60 || sy > H + 60) continue; const sx = laneX(it.x), bob = it.k === 'coin' ? Math.sin(G.t * 6 + it.y) * 3 : 0, im = IMG['it_' + it.k];
    const size = { coin: 30, fuel: 38, card: 42, hole: 50, cone: 38, sheep: 44 }[it.k];
    if (im) { const w = size, h = w * im.height / im.width; cx.save(); cx.translate(sx, sy + bob); if (it.k === 'sheep' && it.vx > 0) cx.scale(-1, 1); cx.drawImage(im, -w / 2, -h / 2, w, h); cx.restore(); }
    else { cx.font = `${size * 0.8}px system-ui`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(ITEM_EMO[it.k], sx, sy + bob); }
  }
}
function drawVan() {
  const x = laneX(G.vanX), y = VAN_Y() + Math.sin(G.t * 20) * (G.speed > 10 ? 1 : 0), tilt = (G.targetX - G.vanX) * 0.25, lvl = (S.garage.tires ? 1 : 0) + (S.garage.engine ? 1 : 0) + (S.garage.roof ? 1 : 0);
  const im = IMG['van_' + Math.min(3, lvl)] || IMG.van_0;
  cx.save(); cx.translate(x, y); cx.rotate(tilt); if (G.hit > 0 && Math.floor(G.t * 20) % 2) cx.globalAlpha = 0.5;
  cx.fillStyle = 'rgba(0,0,0,.25)'; cx.beginPath(); cx.ellipse(0, 34, 32, 10, 0, 0, TAU); cx.fill();
  if (im) { const w = Math.min(64, W * 0.15), h = w * im.height / im.width; cx.drawImage(im, -w / 2, -h / 2, w, h); }
  else { cx.fillStyle = S.paint || '#f0a35a'; rr(-26, -42, 52, 84, 12); cx.fill(); cx.fillStyle = '#fff3e0'; rr(-26, -42, 52, 30, 12); cx.fill(); cx.fillStyle = '#7ac0e0'; rr(-20, -30, 40, 16, 4); cx.fill(); cx.font = '18px system-ui'; cx.textAlign = 'center'; cx.fillText('🐶', 12, 8); }
  cx.restore();
  if (G.speed > 50 && Math.random() < 0.4) G.parts.push({ x: x + rnd(-14, 14), y: y + 40, vx: rnd(-10, 10), vy: rnd(10, 40), t: 0, life: 0.6, k: 'dust' });
}
function draw() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = G.shake * 8; cx.save(); if (sh) cx.translate(rnd(-sh, sh), rnd(-sh, sh));
  if (G.mode === 'title' && IMG.title_bg) { const im = IMG.title_bg, k = Math.max(W / im.width, H / im.height); cx.drawImage(im, (W - im.width * k) / 2, (H - im.height * k) / 2, im.width * k, im.height * k); cx.restore(); return; }
  drawScene(); if (G.mode !== 'title') { drawItems(); drawVan(); }
  for (const p of G.parts) { cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = 'rgba(230,215,180,.8)'; cx.beginPath(); cx.arc(p.x, p.y, 4 + p.t * 10, 0, TAU); cx.fill(); cx.globalAlpha = 1; }
  cx.restore();
  for (const f of G.floats) { if (f.kind === 'coin') { const k = clamp(f.t / f.d, 0, 1), e = k * k * (3 - 2 * k), x = f.x + (f.tx - f.x) * e, y = f.y + (f.ty - f.y) * e - Math.sin(k * Math.PI) * 40; const im = IMG.it_coin; if (im) cx.drawImage(im, x - 10, y - 10, 20, 20); else { cx.fillStyle = '#ffcf33'; cx.beginPath(); cx.arc(x, y, 8, 0, TAU); cx.fill(); } continue; }
    const a = clamp(1.3 - f.t / f.d * 1.3, 0, 1); cx.globalAlpha = a; cx.font = `900 ${f.cls === 'combo' ? 30 : 18}px system-ui`; cx.textAlign = 'center'; cx.lineWidth = 4; cx.strokeStyle = 'rgba(60,40,20,.85)'; cx.strokeText(f.s, f.x, f.y - f.t * 40); cx.fillStyle = f.cls === 'combo' ? '#ffcf33' : '#fff'; cx.fillText(f.s, f.x, f.y - f.t * 40); cx.globalAlpha = 1; }
}
function flyCoin(x, y) { const el = $('#hcoin'); if (!el) return; const r = el.getBoundingClientRect(); G.floats.push({ kind: 'coin', x, y, tx: r.left + r.width / 2, ty: r.top + r.height / 2, t: 0, d: 0.55 }); setTimeout(() => JUICE.bump(el), 550); }
function floatText(x, y, s, cls) { G.floats.push({ kind: 'text', x, y, s, cls, t: 0, d: 1.1 }); }

// ---------- interface ----------
function renderHud() {
  const prog = clamp(G.dist / D.stage.length, 0, 1), st = D.route.stages[Math.min(S.stage, D.route.stages.length - 1)];
  $('#hud').innerHTML = `<div class="row"><div class="pill" id="hcoin">🪙 <b>${S.coins}</b></div><div class="lv">${t('level')} ${S.level}</div><div class="hp">${'🛞'.repeat(Math.ceil(S.hp))}<span>${'🛞'.repeat(Math.max(0, D.hp - Math.ceil(S.hp)))}</span></div><button class="rb" data-a="menu">☰</button></div>
    <div class="fuel"><span>⛽</span><div class="bar"><i style="width:${S.fuel}%" class="${S.fuel < 25 ? 'low' : ''}"></i></div></div>
    <div class="prog"><span>${P(st.name)}</span><div class="bar"><i style="width:${prog * 100}%"></i><em style="left:${prog * 100}%">🚐</em></div><span>🏡</span></div>`;
}
let seatsHTML = '';
function renderSeats() {
  const h = S.pass.map((p, i) => `<button class="seat ${p.need ? 'need' : ''}" data-i="${i}">${face(p.id)}${p.need ? `<b class="bub">${{ food: '🥪', music: '🎵', pause: '☕' }[p.need]}</b>` : ''}<i>${'♥'.repeat(Math.round(p.mood || 3))}</i></button>`).join('');
  if (h !== seatsHTML) { $('#seats').innerHTML = h; seatsHTML = h; }
}
$('#seats').addEventListener('pointerdown', e => {
  const b = e.target.closest('.seat'); if (!b) return; e.stopPropagation(); const p = S.pass[+b.dataset.i]; if (!p || !p.need) return;
  p.need = null; p.mood = Math.min(5, (p.mood || 3) + (has('musician') ? 1 : 0.5)); const v = Math.round(5 * coinMult()); S.coins += v; G.stageCoins += v; SFX.happy(); buzz(8);
  const r = b.getBoundingClientRect(); floatText(r.left + r.width / 2, r.top, '+' + v + ' ♥'); flyCoin(r.left + r.width / 2, r.top); renderSeats(); renderHud();
});
$('#hud').addEventListener('click', e => { if (e.target.closest('[data-a=menu]')) { audioInit(); SFX.click(); G.paused = true; engineHum(false); menuModal(); } });
let bisT = 0;
function biscuit(key) { const el = $('#biscuit'); el.querySelector('.bf').style.backgroundImage = SPR['dog_' + ({ b_ouch: 2, b_broken: 2, b_empty: 2, b_fuel: 3, b_sheep: 2, b_honk: 1, b_new: 0, b_sea: 0 }[key] ?? (key.includes('Ahead') ? 1 : 0))] ? `url(${SPR['dog_' + ({ b_ouch: 2, b_broken: 2, b_empty: 2, b_fuel: 3, b_sheep: 2, b_honk: 1, b_new: 0, b_sea: 0 }[key] ?? (key.includes('Ahead') ? 1 : 0))]})` : ''; el.querySelector('.bt').textContent = t(key); el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); clearTimeout(bisT); bisT = setTimeout(() => el.classList.remove('on'), 3600); }
const modal = $('#modal');
function openModal(html, cls = '') { modal.innerHTML = `<div class="card ${cls}">${html}</div>`; modal.classList.add('on'); }
function closeModal() { modal.classList.remove('on'); modal.innerHTML = ''; }
const TQ = []; let tBusy = false;
function toast(s) { TQ.push(s); if (!tBusy) nextToast(); }
function nextToast() { const s = TQ.shift(); if (s == null) { tBusy = false; return; } tBusy = true; const box = $('#toasts'); box.innerHTML = ''; const el = div('toast', s); box.appendChild(el); setTimeout(() => { el.remove(); nextToast(); }, 1900); }
const LVX = n => 120 * Math.pow(1.7, n - 1);
function checkLevel() { while (S.xp >= LVX(S.level)) { S.xp -= LVX(S.level); S.level++; const v = 30 + S.level * 10; S.coins += v; setTimeout(() => { toast('⭐ ' + t('levelUp', { n: S.level }) + ` +${v} 🪙`); JUICE.confetti(50); SFX.fanfare(); }, 800); } }
function menuModal() {
  openModal(`<h2>${t('pauseT')}</h2><button class="b1 big" data-resume>▶ ${t('resume')}</button><button class="b2" data-album>📮 ${t('album')}</button><button class="b2" data-gift>🎁 ${t('login')}</button><button class="b2" data-shop>🛒 ${t('shop')}</button><button class="b2" data-set>⚙️ ${t('settings')}</button><button class="b2" data-map>🗺️ ${t('map')}</button>`);
  const back = () => { closeModal(); G.paused = false; if (G.mode === 'drive') engineHum(true); };
  modal.querySelector('[data-resume]').onclick = back;
  modal.querySelector('[data-album]').onclick = () => { albumModal(true); modal.querySelector('[data-back]').onclick = menuModal; };
  modal.querySelector('[data-gift]').onclick = giftModal; modal.querySelector('[data-shop]').onclick = shopModal; modal.querySelector('[data-set]').onclick = settingsModal;
  modal.querySelector('[data-map]').onclick = () => { G.paused = false; engineHum(false); closeModal(); mapScreen(); };
}
function ensureLogin() { if (S.login.last !== today()) { const y = new Date(Date.now() - 864e5), ys = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate(); S.login.streak = S.login.last === ys ? (S.login.streak % 7) + 1 : 1; S.login.last = today(); S.login.pending = true; save(); } }
function giftModal() {
  const k = S.login.streak;
  openModal(`<h2>${t('login')}</h2><div class="login">${D.login.map((v, i) => `<div class="lg ${i < k - (S.login.pending ? 1 : 0) ? 'got' : ''} ${i === k - 1 && S.login.pending ? 'now' : ''}"><small>${t('day')} ${i + 1}</small>🪙<b>${v}</b></div>`).join('')}</div>${S.login.pending ? `<button class="b1 big" data-claim>${t('claim')}</button>` : ''}<button class="b2" data-close>${t('close')}</button>`);
  const c = modal.querySelector('[data-claim]'); if (c) c.onclick = () => { S.coins += D.login[k - 1]; S.login.pending = false; save(); SFX.fanfare(); JUICE.confetti(50); renderHud(); giftModal(); };
  modal.querySelector('[data-close]').onclick = () => G.mode === 'map' ? mapScreen() : menuModal();
}
function shopModal() {
  openModal(`<h2>${t('shop')}</h2>${D.store.map(it => `<div class="it"><span>${t('s_' + it.id)}<small>${t('sd_' + it.id)}</small></span>${S.owned[it.id] ? '✔' : `<button class="b1" data-buy="${it.id}">${it.price}</button>`}</div>`).join('')}<button class="b2" data-close>${t('close')}</button>`);
  modal.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const it = D.store.find(x => x.id === b.dataset.buy); confirmBox(t('testBuy') + `<br><b>${it.price}</b>`).then(ok => { if (!ok) return; S.owned[it.id] = true; if (it.id === 'starter') S.coins += 300; if (it.id === 'paint') S.paint = '#6ac0b0'; save(); SFX.fanfare(); shopModal(); }); });
  modal.querySelector('[data-close]').onclick = () => G.mode === 'map' ? mapScreen() : menuModal();
}
function confirmBox(html) { return new Promise(res => { const el = div('confirm', `<div class="card"><p>${html}</p><div class="row2"><button class="b2" data-v="0">${t('cancel')}</button><button class="b1" data-v="1">${t('ok')}</button></div></div>`); el.onclick = e => { const v = e.target.dataset.v; if (v != null) { el.remove(); res(v === '1'); } }; document.body.appendChild(el); }); }
function settingsModal() {
  const sw = (k, l) => `<label class="sw"><span>${l}</span><input type="checkbox" data-k="${k}" ${S[k] ? 'checked' : ''}></label>`;
  openModal(`<h2>${t('settings')}</h2>${sw('sound', t('sound'))}${sw('music', t('music'))}${sw('vib', t('vibration'))}<label class="sw"><span>${t('language')}</span><select data-lang>${I.langs.map(l => `<option value="${l}" ${l === S.lang ? 'selected' : ''}>${I.names[l]}</option>`).join('')}</select></label>
    <button class="b2" data-privacy>${t('privacy')}</button><button class="b3" data-reset>${t('reset')}</button><button class="b2 big" data-close>${t('close')}</button><div class="ver">Van Voyage ${window.VV_VERSION || ''}</div>`);
  modal.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { S[c.dataset.k] = c.checked; save(); });
  modal.querySelector('[data-lang]').onchange = e => { S.lang = e.target.value; I.set(S.lang); save(); settingsModal(); };
  modal.querySelector('[data-privacy]').onclick = () => { openModal(`<div class="legal">${window.VV_PRIVACY || ''}</div><button class="b2 big" data-close>${t('close')}</button>`, 'wide'); modal.querySelector('[data-close]').onclick = settingsModal; };
  modal.querySelector('[data-reset]').onclick = async () => { if (await confirmBox(t('resetSure'))) { localStorage.removeItem(KEY); location.reload(); } };
  modal.querySelector('[data-close]').onclick = () => G.mode === 'map' ? mapScreen() : menuModal();
}
function consentModal() {
  openModal(`<h2>${t('consentTitle')}</h2><p>${t('consentText')}</p><div class="row2"><button class="b2" data-c="0">${t('refuse')}</button><button class="b1" data-c="1">${t('accept')}</button></div>`);
  modal.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.consent = b.dataset.c === '1'; save(); closeModal(); begin(); });
}
function mapScreen() {
  G.mode = 'map'; $('#game').classList.remove('on'); engineHum(false); const m = $('#mapv');
  m.innerHTML = `<div class="mapc"><h2>${P(D.route.name)}</h2><p class="sub">${t('trip')} ${S.trips + 1} · ${t('level')} ${S.level} · 🪙 ${S.coins}</p>
    <div class="stops">${D.route.stages.map((s, i) => `<div class="stop ${i < S.stage ? 'done' : i === S.stage ? 'now' : ''}"><b>${i < S.stage ? '✔' : i === S.stage ? '🚐' : i + 1}</b><span>${P(s.name)}</span></div>`).join('')}<div class="stop city"><b>🌊</b><span>${P(D.route.city)}</span></div></div>
    <button class="b1 big" data-go>🚐 ${S.stage ? t('continueTrip') : t('startTrip')}</button><div class="row2"><button class="b2" data-album>📮 ${S.cards.length}/${D.postcards}</button><button class="b2" data-gift>🎁</button><button class="b2" data-shop>🛒</button><button class="b2" data-set>⚙️</button></div></div>`;
  m.classList.add('on');
  m.querySelector('[data-go]').onclick = () => { audioInit(); m.classList.remove('on'); S.stage === 0 && !S.pass.length && !S.met.length ? startStage() : halt(); };
  m.querySelector('[data-album]').onclick = () => albumModal(true); m.querySelector('[data-gift]').onclick = giftModal; m.querySelector('[data-shop]').onclick = shopModal; m.querySelector('[data-set]').onclick = settingsModal;
}
function titleScreen() {
  G.mode = 'title'; const el = $('#title');
  el.innerHTML = `<div class="logo">${SPR.logo ? `<img src="${SPR.logo}" alt="Van Voyage">` : '<h1>Van<br>Voyage</h1>'}<p>${t('subtitle')}</p></div><button class="b1 big" data-play>${S.stagesDriven ? t('cont') : t('play')}</button>`;
  el.classList.add('on'); el.querySelector('[data-play]').onclick = () => { audioInit(); SFX.honk(); el.classList.remove('on'); S.consent == null ? consentModal() : begin(); };
}
function begin() { ensureLogin(); if (!S.stagesDriven) startStage(); else { mapScreen(); if (S.login.pending) setTimeout(giftModal, 500); } }
let last = performance.now(), hudT = 0;
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); musicTick(); draw(); if (G.mode === 'drive' && (hudT += dt) > 0.2) { hudT = 0; renderHud(); renderSeats(); } requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); if (G.mode === 'drive') { G.paused = true; engineHum(false); menuModal(); } } });
window.VV = { G, S: () => S, startStage, halt, update, steer, honk, D };
resize(); titleScreen(); requestAnimationFrame(frame);
})();
</script>
