<script>window.VV_VERSION="1.0";window.VV_SPR={"dog_0": "assets/dog_0.png", "dog_1": "assets/dog_1.png", "dog_2": "assets/dog_2.png", "dog_3": "assets/dog_3.png", "ev_bakery": "assets/ev_bakery.png", "ev_bike": "assets/ev_bike.png", "ev_cherry": "assets/ev_cherry.png", "ev_fair": "assets/ev_fair.png", "ev_flat": "assets/ev_flat.png", "ev_fog": "assets/ev_fog.png", "ev_garage": "assets/ev_garage.png", "ev_goat": "assets/ev_goat.png", "ev_hitch": "assets/ev_hitch.png", "ev_honey": "assets/ev_honey.png", "ev_kite": "assets/ev_kite.png", "ev_lake": "assets/ev_lake.png", "ev_lost": "assets/ev_lost.png", "ev_market": "assets/ev_market.png", "ev_picnic": "assets/ev_picnic.png", "ev_police": "assets/ev_police.png", "ev_radio": "assets/ev_radio.png", "ev_sheep": "assets/ev_sheep.png", "ev_short": "assets/ev_short.png", "ev_starry": "assets/ev_starry.png", "ev_storm": "assets/ev_storm.png", "ev_sunset": "assets/ev_sunset.png", "ev_tunnel": "assets/ev_tunnel.png", "ev_well": "assets/ev_well.png", "ev_yard": "assets/ev_yard.png", "it_card": "assets/it_card.png", "it_coin": "assets/it_coin.png", "it_cone": "assets/it_cone.png", "it_fuel": "assets/it_fuel.png", "it_hole": "assets/it_hole.png", "it_sheep": "assets/it_sheep.png", "logo": "assets/logo.png", "p_chef": "assets/p_chef.png", "p_grandma": "assets/p_grandma.png", "p_hiker": "assets/p_hiker.png", "p_kid": "assets/p_kid.png", "p_mechanic": "assets/p_mechanic.png", "p_musician": "assets/p_musician.png", "pc_0": "assets/pc_0.png", "pc_1": "assets/pc_1.png", "pc_2": "assets/pc_2.png", "pc_3": "assets/pc_3.png", "pc_4": "assets/pc_4.png", "pc_5": "assets/pc_5.png", "pc_6": "assets/pc_6.png", "pc_7": "assets/pc_7.png", "pc_8": "assets/pc_8.png", "pc_9": "assets/pc_9.png", "road_0": "assets/road_0.png", "title_bg": "assets/title_bg.png", "van_0": "assets/van_0.png", "van_1": "assets/van_1.png", "van_2": "assets/van_2.png", "van_3": "assets/van_3.png"};window.VV_PRIVACY="<h4>Politique de confidentialité — Van Voyage</h4>\n<p>Van Voyage fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. RevenueCat vérifie les reçus d’achat avec un identifiant anonyme.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) sont envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Van Voyage convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Van Voyage</h4>\n<p>Van Voyage works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Ad choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. RevenueCat checks receipts with an anonymous identifier.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) are sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Van Voyage suits all ages but is not directed at children. We do not knowingly collect personal data from children.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>
<script>// BETA IA — a simulated player inside the game, for tests and in-game video capture (spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Shared by every game: copy this file into <game>/src/beta.js, load it BEFORE the game scripts, and register the game's
// scenes after them with BETA.game({...}) (see <game>/src/beta-game.js).
// Turned on only by the address (?beta=ia) and never inside the iOS app (the native store handler is present there).
(() => {
  const Q = new URLSearchParams(location.search);

  const opts = {
    scene: Q.get('scene') || 'boucle', style: Q.get('style') || 'pro', seed: num('seed', 0), save: Q.get('save') || 'neuf',
    vitesse: num('vitesse', 1), doigt: Q.get('doigt') !== '0', ui: Q.get('ui') || 'normal', duree: num('duree', 0),
    format: Q.get('format') || '', log: Q.get('log') === '1', auto: Q.get('auto') !== '0',
  };

  // ---- seeded randomness: same seed, same game (needed to redo a take) ----
  let rnd = Math.random;
  function seedRandom(seed) {
    let a = (seed >>> 0) || 1;
    rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    Math.random = rnd;
  }

  // ---- game clock ----
  // Normal mode: time runs ×1 to ×20 (performance.now, Date.now, requestAnimationFrame stamps and timers all follow).
  // Capture mode (?capture=1, used by tools/beta-record.mjs): time stands still and only moves with BETA.step(ms),
  // timers and animation frames included, so a slow PC still gives a perfect 30 frames per second video.
  let scale = 1;
  const CAPTURE = Q.get('capture') === '1';
  const realPerf = performance.now.bind(performance), realDate = Date.now, realRaf = requestAnimationFrame.bind(window), realCaf = cancelAnimationFrame.bind(window);
  const realSetTimeout = setTimeout.bind(window), realSetInterval = setInterval.bind(window), realClearTimeout = clearTimeout.bind(window), realClearInterval = clearInterval.bind(window);
  let pBase = realPerf(), pV = pBase, dV = realDate();
  const vPerf = () => CAPTURE ? pV : pV + (realPerf() - pBase) * scale;
  function setSpeed(s) { if (CAPTURE) { scale = Math.max(0.1, s); return; } const now = realPerf(); pV = pV + (now - pBase) * scale; dV = dV + (now - pBase) * scale; pBase = now; scale = Math.max(0.1, s); }
  let vAcc = 0;   // capture mode: milliseconds of video stepped so far
  const videoNow = () => CAPTURE ? vAcc : realPerf();
  // capture-mode scheduler
  let tid = 1e6; const timers = new Map(); let rafs = [];
  function installClock() {
    performance.now = vPerf;
    Date.now = () => Math.round(dV0 + (vPerf() - pV0));
    if (!CAPTURE) {
      window.requestAnimationFrame = cb => realRaf(() => cb(vPerf()));
      window.setTimeout = (f, ms, ...a) => realSetTimeout(f, (ms || 0) / scale, ...a);
      window.setInterval = (f, ms, ...a) => realSetInterval(f, (ms || 0) / scale, ...a);

    <div class="stops">${D.route.stages.map((s, i) => `<div class="stop ${i < S.stage ? 'done' : i === S.stage ? 'now' : ''}"><b>${i < S.stage ? '✔' : i === S.stage ? '🚐' : i + 1}</b><span>${P(s.name)}</span></div>`).join('')}<div class="stop city"><b>🌊</b><span>${P(D.route.city)}</span></div></div>
    <button class="b1 big" data-go>🚐 ${S.stage ? t('continueTrip') : t('startTrip')}</button><div class="row2"><button class="b2" data-album>📮 ${S.cards.length}/${D.postcards}</button><button class="b2" data-gift>🎁</button><button class="b2" data-shop>🛒</button><button class="b2" data-set>⚙️</button></div></div>`);
  m.classList.add('on');
  m.querySelector('[data-go]').onclick = () => { audioInit(); m.classList.remove('on'); S.stage === 0 && !S.pass.length && !S.met.length ? startStage() : halt(); };
  m.querySelector('[data-album]').onclick = () => albumModal(true); m.querySelector('[data-gift]').onclick = giftModal; m.querySelector('[data-shop]').onclick = shopModal; m.querySelector('[data-set]').onclick = settingsModal;
}
function titleScreen() {
  G.mode = 'title'; const el = $('#title');
  el.innerHTML = `<div class="logo">${SPR.logo ? `<img src="${SPR.logo}" alt="Van Voyage">` : '<h1>Van<br>Voyage</h1>'}<p>${t('subtitle')}</p></div><button class="b1 big" data-play>${S.stagesDriven ? t('cont') : t('play')}</button>`;
  el.classList.add('on'); el.querySelector('[data-play]').onclick = () => { audioInit(); SFX.honk(); el.classList.remove('on'); S.consent == null ? consentModal() : begin(); };
}
function begin() { Ads.init(); ensureLogin(); Store.init(); if (!S.stagesDriven) startStage(); else { mapScreen(); if (S.login.pending) setTimeout(giftModal, 500); } }
let last = performance.now(), hudT = 0;
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); musicTick(); draw(); if (G.mode === 'drive' && (hudT += dt) > 0.2) { hudT = 0; renderHud(); renderSeats(); } requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); if (G.mode === 'drive') { G.paused = true; engineHum(false); menuModal(); } } });
window.VV = { G, S: () => S, tu: () => TU.on ? TU.step : '', tuEnd, startStage, halt, update, steer, honk, D, shopModal, SFX, laneX, VAN_Y, ROAD, mapScreen, save, seats };   // the BETA IA player reads the road (items, van, lanes) from here
resize(); titleScreen(); requestAnimationFrame(frame);
})();

<script>// Van Voyage scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// The player drives with a real finger: it slides left and right under the van (pointerdown on the road, pointermove,
// pointerup, exactly like a thumb), taps the horn when sheep wander in, taps the passengers' bubbles, picks the event
// cards and runs the village stops with the real buttons. It never touches the real-money shop, the ads or the settings.
(() => {
  if (!window.BETA || !BETA.on) return;
  const V = window.VV, G = V.G, D = V.D, S = () => V.S();
  const HAZ = { hole: 1, cone: 1, sheep: 1 };
  if (BETA.opts.ui === 'propre') { const st = document.createElement('style'); st.textContent = '.adov{display:none!important}#modal [data-double]{display:none!important}'; document.head.appendChild(st); }
  const vis = sel => { const e = document.querySelector(sel); return e && e.getClientRects().length ? e : null; };
  const modalOn = () => document.querySelector('#modal.on .card');
  const fast = A => A.opts.style === 'rapide';
  const pause = (A, a, b) => A.wait(fast(A) ? a * 0.6 : A.opts.style === 'debutant' ? b * 1.4 : A.jitter(a, b));

  // ---------- the title screen and the consent window ----------
  async function start(A) {
    if (A.opts.ui === 'propre' && S().consent == null) S().consent = false;   // clean takes: no consent window on camera (refused = no personalised ads)
    if (A.opts.ui === 'propre') S().owned.noads = true;      // clean takes: no interstitials
    if (G.mode !== 'title') return;
    await A.wait(900); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(700);
    if (vis('#modal [data-c="0"]') && !vis('#modal .eventm')) { await A.think(); await A.tapEl(A.opts.ui === 'propre' ? '#modal [data-c="0"]' : '#modal [data-c="1"]', 'consentement'); await A.wait(600); }
  }

  // ---------- driving: pick the best lane, slide the thumb there ----------
  const thumbY = () => innerHeight * 0.81;   // under the van, clear of the horn (bottom right) and the seats (bottom)
  function score(L) {
    const spd = Math.max(160, G.speed), cur = G.targetX; let s = (Math.abs(L - cur) < 0.3 ? 0.25 : 0) - Math.abs(L) * 0.05;
    for (const it of G.items) {
      if (it.hit) continue; const ahead = it.y - G.dist; if (ahead < -30 || ahead > 520) continue;
      const ix = it.vx ? it.x + it.vx * Math.max(0, ahead) / spd : it.x, near = Math.abs(ix - L);
      if (HAZ[it.k]) { if (near < 0.55) s -= ahead < 300 ? 100 * (1 - ahead / 420) : 3; }
      else if (near < 0.4) s += (it.k === 'card' ? 8 : it.k === 'fuel' ? (S().fuel < 45 ? 6 : 0.8) : 1) / (1 + Math.max(0, ahead) / 180);
      // the van sweeps through the middle lane on a long move: a hazard right there blocks it
      if (HAZ[it.k] && Math.abs(L - cur) > 1.5 && Math.abs(it.x) < 0.5 && ahead > -20 && ahead < 120) s -= 60;
    }
    return s;
  }
  function bestLane(A) {
    const sc = [-1, 0, 1].map(L => [L, score(L)]).sort((a, b) => b[1] - a[1]);
    if (A.opts.style === 'debutant' && A.rnd() < 0.12 && sc[1][1] > -50) return sc[1][0];   // a beginner sometimes picks the other lane
    return sc[0][0];
  }
  const dangerAhead = (L, range) => G.items.some(it => !it.hit && HAZ[it.k] && Math.abs(it.x - L) < 0.55 && it.y - G.dist > -20 && it.y - G.dist < range);
  async function steerTo(A, L) {
    if (A.opts.style === 'debutant' && A.rnd() < 0.3) await A.wait(A.jitter(150, 400));   // late reaction
    const y = thumbY() + A.jitter(-12, 12), x1 = V.laneX(G.targetX), x2 = V.laneX(L) + A.jitter(-6, 6);
    await A.drag(x1, y, x2, y + A.jitter(-8, 8), L < 0 ? 'gauche' : L > 0 ? 'droite' : 'milieu', A.jitter(180, 300));
  }
  const honked = new WeakSet();
  async function driveStep(A) {
    // the first-run tutorial: do the gesture the hand shows (coins: the lane picker already goes for them)
    const tu = V.tu ? V.tu() : '';
    if (tu === 'steer') { const y = thumbY(); await A.wait(A.jitter(500, 900)); await A.drag(V.laneX(0), y, V.laneX(-1), y, 'gauche', A.jitter(260, 360)); await A.wait(A.jitter(150, 300)); await A.drag(V.laneX(-1), y, V.laneX(1), y, 'droite', A.jitter(320, 420)); await A.wait(400); return; }
    if (tu === 'honk') { await A.wait(A.jitter(600, 1000)); await A.tapEl('#honk', 'klaxon'); A.ev('klaxon'); await A.wait(900); return; }
    const L = bestLane(A), cur = G.targetX;
    if (Math.abs(L - cur) > 0.3) return steerTo(A, L);
    // sheep wandering onto the road: honk (only when the lane is safe for a moment)
    const sheep = G.items.find(it => it.k === 'sheep' && !it.hit && !honked.has(it) && it.y - G.dist > 0 && it.y - G.dist < innerHeight * 0.75 && Math.abs(it.vx) < 1);
    if (sheep && !dangerAhead(cur, 160)) { G.items.forEach(it => it.k === 'sheep' && honked.add(it)); await A.tapEl('#honk', 'klaxon'); A.ev('klaxon'); return; }
    // a passenger asks for something: tap the bubble when the road ahead is clear
    const seat = vis('#seats .seat.need');
    if (seat && !dangerAhead(cur, 380) && Math.abs(bestLaneQuiet() - cur) < 0.3) { await A.tapEl(seat, 'passager'); await A.wait(250); return; }
    await A.wait(A.jitter(60, 140));
  }
  const bestLaneQuiet = () => [-1, 0, 1].map(L => [L, score(L)]).sort((a, b) => b[1] - a[1])[0][0];

  // ---------- windows: event cards, end of stage, village, arrival ----------
  function pickEvent() {
    const st = S(), val = e => Object.entries(e || {}).reduce((a, [k, v]) => a + (k === 'coins' ? v / 10 : k === 'fuel' ? v / 10 * (st.fuel < 40 ? 2 : 1) : k === 'hp' ? v * (st.hp <= 1 ? 8 : 3) : k === 'mood' ? v * (st.pass.length ? 1.5 : 0.3) : k === 'card' ? 5 : 0), 0);
    const title = (document.querySelector('#modal .evcard h2') || {}).textContent || '';
    const ev = D.events.find(e => e.t.includes(title)); if (!ev) return 'a';
    return val(ev.a[1]) >= val(ev.b[1]) ? 'a' : 'b';
  }
  async function handleWindow(A) {
    const c = vis('.confirm'); if (c) { await A.think(); await A.tapEl('.confirm [data-v="0"]', 'annuler'); return true; }
    if (document.querySelector('.adov')) { await A.wait(300); return true; }
    if (!modalOn()) return false;
    const q = s => vis('#modal ' + s);
    if (q('.eventm') || q('.evcard')) { await pause(A, 900, 1600); const ch = A.opts.style === 'debutant' && A.rnd() < 0.3 ? (A.rnd() < 0.5 ? 'a' : 'b') : pickEvent();
      A.ev('evenement', { choix: ch }); await A.tapEl(`#modal [data-c="${ch}"]`, 'choix ' + ch); await A.wait(80); return true; }
    if (q('[data-c="0"]')) { await A.think(); await A.tapEl(A.opts.ui === 'propre' ? '#modal [data-c="0"]' : '#modal [data-c="1"]', 'consentement'); await A.wait(600); return true; }
    if (q('[data-claim]')) { await A.think(); await A.tapEl(q('[data-claim]'), 'cadeau du jour'); await A.wait(1300); return true; }
    if (q('.city')) { await A.wait(2600); await A.tapEl(q('[data-go]'), 'nouveau voyage'); await A.wait(700); return true; }
    if (q('.haltm')) return village(A);
    if (q('[data-restart]')) { await A.think(); await A.tapEl(q('[data-restart]'), 'recommencer l’étape'); await A.wait(500); return true; }   // never the rewarded jerrycan
    if (q('[data-fix]')) { await A.think(); await A.tapEl(q('[data-fix]'), 'dépanneuse'); await A.wait(600); return true; }
    if (q('[data-resume]')) { await A.tapEl(q('[data-resume]'), 'reprendre'); await A.wait(300); return true; }
    if (q('[data-go]')) { await A.wait(fast(A) ? 900 : 1500); await A.tapEl(q('[data-go]'), 'vers le village'); await A.wait(700); return true; }   // end of stage: let the confetti fall
    const back = q('[data-back], [data-close]'); if (back) { await A.tapEl(back, 'fermer'); await A.wait(400); return true; }
    return false;
  }
  // the village stop: welcome a new passenger, repair, refuel, then back on the road
  async function village(A, noShop) {
    const q = s => vis('#modal ' + s), st = S();
    const rec = !noShop && q('[data-rec]:not([disabled])'), fix = !noShop && st.hp < D.hp && q('[data-fix]:not([disabled])'), fuel = !noShop && st.fuel < 55 && q('[data-fuel]:not([disabled])');
    const b = rec || fix || fuel;
    if (b) { await pause(A, 700, 1300); await A.tapEl(b, rec ? 'recruter' : fix ? 'réparer' : 'plein'); await A.wait(rec ? 2000 : 600); return true; }
    await pause(A, 600, 1200); await A.tapEl(q('[data-go]'), 'rouler'); await A.wait(500); return true;
  }
  // one tick of play, whatever the screen
  async function tick(A) {
    if (G.mode === 'title') return start(A);
    if (await handleWindow(A)) return;
    if (G.mode === 'drive' && !G.paused) return driveStep(A);
    if (G.mode === 'map' && vis('#mapv [data-go]')) { await A.think(); await A.tapEl('#mapv [data-go]', 'continuer le voyage'); await A.wait(600); return; }
    await A.wait(150);
  }
  async function play(A, ms) { const end = performance.now() + ms; while (A.running() && performance.now() < end) await tick(A); }
  // menus only, no shopping (prepare: get onto the road off camera)
  async function toDrive(A) {
    for (let i = 0; i < 40 && G.mode !== 'drive'; i++) {
      if (G.mode === 'title') await start(A);
      else if (vis('#modal .haltm')) await village(A, true);
      else if (!(await handleWindow(A)) && G.mode === 'map') await A.tapEl('#mapv [data-go]', 'continuer le voyage');
      await A.wait(200);
    }
  }

  // ---------- moments worth cutting on ----------
  function watch(A) {
    const st = S(); let cards = st.cards.length, lvl = st.level, pass = st.pass.length, trips = st.trips, stage = st.stage, tier = 0;
    const iv = setInterval(() => { if (!A.running()) return clearInterval(iv); const s = S();
      if (s.cards.length > cards) { cards = s.cards.length; A.mark('carte postale'); }
      if (s.level !== lvl) { lvl = s.level; A.mark('niveau ' + lvl); }
      if (s.pass.length > pass) A.mark('passager'); pass = s.pass.length;
      if (s.trips > trips) { trips = s.trips; A.mark('arrivée à la mer'); } else if (s.stage > stage) A.mark('étape ' + s.stage); stage = s.stage;
      const k = Math.floor(G.combo / 5); if (k > tier) A.mark('combo x' + k * 5); tier = k; }, 100);
  }

  // ---------- starting saves (written off camera) ----------
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  function setSave(save, A) {
    const s = S(); if (save !== 'milieu' && save !== 'avance') return;
    const pass = save === 'avance' ? ['mechanic', 'musician', 'grandma', 'hiker'] : ['mechanic', 'musician'];
    Object.assign(s, save === 'avance'
      ? { stage: 3, trips: 2, stagesDriven: 30, level: 9, coins: 1200, cards: [0, 1, 2, 3, 4, 5, 6, 7], garage: { tank: 1, tires: 1, engine: 1, roof: 1 }, met: [...pass, 'chef'] }
      : { stage: 2, trips: 0, stagesDriven: 8, level: 4, coins: 240, cards: [0, 2, 5], garage: { tank: 1 }, met: pass.slice() });
    s.pass = pass.map(id => ({ id, mood: 4 })); s.hp = D.hp; s.fuel = 90; s.xp = 0; s.tut = 2; s.tutoDone = true; s.consent = A.opts.ui !== 'propre';
    s.login = { last: today(), streak: 3, pending: false }; V.save();
  }

  BETA.game({
    sfx: V.SFX,
    logo: () => (window.VV_SPR || {}).logo || '',
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => [G.mode, S().stage, S().trips, Math.floor(G.dist / 200)],
    async prepare(save, A) {
      if (A.opts.ui === 'propre') S().owned.noads = true;
      if (A.opts.scene === 'onboarding') return;            // onboarding always starts on the title screen of a new game (and plays the tutorial)
      S().tutoDone = true;                                    // the other scenes skip the first-run tutorial
      setSave(A.opts.scene === 'moment' && save === 'neuf' ? 'milieu' : save, A);
      if (A.opts.scene === 'moment') { S().stage = D.route.stages.length - 1; V.save(); }   // the last stage: the sea is near
      await toDrive(A);

        G.dist = D.stage.length - 1500; G.eventDone = true; G.items = []; G.nextSpawn = G.dist + 1000; G.speed = D.stage.speed;
        for (let i = 0; i < 12; i++) G.items.push({ k: 'coin', x: 0, y: G.dist + 170 + i * 40 });
        G.items.push({ k: 'card', x: 0, y: G.dist + 670 });
        for (let i = 0; i < 6; i++) G.items.push({ k: 'coin', x: 1, y: G.dist + 800 + i * 40 });
      }
      await A.wait(200);
    },
    scenes: {
      // title -> consent -> the first drive with Biscuit's tips -> first event -> first village
      async onboarding(A) { watch(A); await start(A); await play(A, 29000); },
      // the satisfying core: weaving between potholes, coin combos, honking at sheep, happy passengers
      async boucle(A) { watch(A); await play(A, 30000); },
      // before/after, sped up: stages roll by, passengers join, the trip reaches the sea
      async progression(A) { watch(A); const k = Math.max(2, A.opts.vitesse); A.speed(k); await play(A, 30000 * k); },
      // the wow: a coin combo, a postcard flips in, then the arrival at the sea
      async moment(A) { watch(A); const end = performance.now() + 9500; while (A.running() && performance.now() < end && !vis('#modal .city')) await tick(A); await A.wait(2600); },
      // plays on until stopped (long tests, balance, memory)
      async idle(A) { watch(A); while (A.running()) await tick(A); },
    },
  });
})();
