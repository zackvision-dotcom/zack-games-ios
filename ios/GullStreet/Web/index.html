<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fc04a">

<title>Gull Street</title>
<style>
:root{--ink:#4b2e2a;--paper:#fdf0d5;--paperHi:#fff8ea;--wood:#b8743f;--woodDk:#7e4a2a;--teal:#2f8f94;--green:#5aa83c;--accent:#f08a3c;--accent2:#f6c23b;--red:#e2553f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc04a;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block;image-rendering:pixelated}
img.pi,img.pd,img.por{image-rendering:pixelated}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.pi{width:1.2em;height:1.2em;vertical-align:-.25em;display:inline-block}
.pd{width:34px;height:42px;object-fit:contain;vertical-align:middle}
.panel,.pill,.goals,.card,#sheet,.toast,.tabs button,.item,.tile,.quest,.sitem,.pp,.chest,.lg,.tut{background:var(--paper);border:3px solid var(--wood);box-shadow:inset 0 0 0 2px #fff8ea,0 3px 0 var(--woodDk)}
.b1,.b2,.b3{border-radius:14px;padding:10px 16px;font-weight:900;letter-spacing:.2px;transition:transform .08s;position:relative;border:3px solid var(--woodDk)}
.b1{background:linear-gradient(#ffb15e,#f08a3c);color:#fff;text-shadow:0 2px 0 rgba(126,74,42,.55);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 var(--woodDk)}
.b2{background:var(--paperHi);box-shadow:inset 0 0 0 2px #fff,0 3px 0 var(--woodDk)}
.b3{background:#f8d3c6;color:#a8403a;box-shadow:0 3px 0 var(--woodDk)}
.b1:active,.b2:active,.b3:active{transform:translateY(2px);box-shadow:0 1px 0 var(--woodDk)}
button:disabled{opacity:.45;filter:grayscale(.5)}
.big{display:block;width:100%;font-size:19px;padding:12px;margin-top:10px}
.b1 .pi,.b2 .pi{width:1em;height:1em}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;gap:8px;align-items:center}
.pill{border-radius:999px;padding:3px 4px 3px 8px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px;min-width:96px}
.pill b{flex:1}
.pill .pi{width:24px;height:24px}
.plus{width:24px;height:24px;border-radius:50%;background:linear-gradient(#8fd45a,#5aa83c);color:#fff;font-weight:900;font-size:18px;line-height:20px;border:2px solid #3d7a28;padding:0}
.gear{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--paper);border:3px solid var(--wood);box-shadow:inset 0 0 0 2px #fff8ea,0 3px 0 var(--woodDk);display:grid;place-items:center}
.gear .pi{width:28px;height:28px}
.badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:15px;font-weight:900;border:2px solid #fff}
.goals{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 58px);max-width:64%;border-radius:14px;padding:0 0 6px;font-size:12.5px;line-height:1.45;font-weight:800;overflow:hidden}
.goals .gh{background:var(--teal);color:#fff;padding:4px 10px;font-size:13px;margin-bottom:4px}
.goals .gh small{opacity:.8;font-weight:700}
.goals .gl{display:flex;gap:6px;align-items:flex-start;padding:2px 10px}
.goals .gl i{flex:none;width:16px;height:16px;border-radius:4px;border:2px solid var(--wood);background:#fff;color:#3d9a2c;font-style:normal;font-weight:900;font-size:13px;line-height:12px;text-align:center;margin-top:1px}
.goals .gl.ok{opacity:.8}.goals .gl small{opacity:.65}
.bottom{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 86px);display:flex;gap:8px;align-items:center}
.bottom .big{margin:0}
.timer{flex:1;height:18px;background:var(--paperHi);border-radius:999px;overflow:hidden;border:3px solid var(--wood);box-shadow:0 2px 0 var(--woodDk)}
.timer i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#ffd06a 0 8px,#f6b23b 8px 16px);transition:width .25s linear}
.spd{padding:6px 12px}
.tabs{position:absolute;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 6px);display:flex;gap:5px}
.tabs button{flex:1;border-radius:14px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:900;position:relative}
.tabs button .pi{width:30px;height:30px}
.tabs button:active{transform:translateY(2px)}
.tuto{position:fixed;inset:0;z-index:7;pointer-events:none;display:none}.tuto.on{display:block}.tuveil{position:absolute;inset:0}
.tuhand{position:absolute;width:48px;height:56px;pointer-events:none}.tuhand i{display:block;font-style:normal;font-size:46px;line-height:1;filter:drop-shadow(0 4px 3px rgba(60,30,10,.55));animation:tuTap .9s ease-in-out infinite}
@keyframes tuTap{0%,100%{transform:translateY(-4px)}45%{transform:translateY(8px) scale(.88)}}
.tuhand::before{content:'';position:absolute;left:2px;top:-20px;width:44px;height:44px;border-radius:50%;border:4px solid #fff;animation:tuRing .9s ease-out infinite}@keyframes tuRing{0%,40%{transform:scale(.3);opacity:0}50%{opacity:1}100%{transform:scale(1.6);opacity:0}}
.tubub{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--paper);border:3px solid var(--accent);box-shadow:inset 0 0 0 2px #fff8ea,0 3px 0 var(--woodDk);border-radius:14px;padding:9px 14px;font-weight:900;font-size:17px;text-align:center;animation:tuPop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes tuPop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.tuskip{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 64px);min-width:96px;min-height:46px;padding:0 14px;pointer-events:auto;background:var(--paper);border:3px solid var(--wood);box-shadow:inset 0 0 0 2px #fff8ea,0 3px 0 var(--woodDk);border-radius:999px;font:inherit;font-weight:900;font-size:16px;color:var(--ink)}
.tut{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 146px);border-color:var(--accent);border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-4px)}}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62%;overflow:auto;border-radius:20px 20px 0 0;border-bottom:0;padding:6px 14px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(105%);transition:transform .22s ease;z-index:5}
#sheet.on{transform:none}
.grip{width:44px;height:5px;border-radius:9px;background:rgba(126,74,42,.35);margin:4px auto 6px}
h2,h3{margin:4px 0 10px;color:var(--woodDk)}
h2{background:var(--teal);color:#fff;border-radius:10px;padding:5px 12px;font-size:18px;display:inline-block}
h3 small{font-weight:700;color:var(--ink);opacity:.75;font-size:13px}
.ic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--paperHi)!important;border:2px solid var(--wood);vertical-align:middle}
.ic .pi{width:30px;height:30px}
.list{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:center;gap:10px;border-radius:14px;padding:5px 10px;text-align:left}
.item .nm{flex:1;font-weight:900}.item small{display:block;font-weight:700;opacity:.7}
.item .cost{font-weight:900;color:var(--woodDk)}.red{opacity:.5}
.off{opacity:.45}
.pulse{animation:pulse 1s ease-in-out infinite;border-color:var(--accent)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(240,138,60,.4)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px}
.tile{border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center}
.tile small{font-size:11px;font-weight:800}
.lbl{margin:6px 0;font-weight:800}
.seg{display:flex;border-radius:12px;overflow:hidden;margin:6px 0 10px;border:3px solid var(--wood);background:var(--paperHi)}
.seg button{flex:1;padding:9px;font-weight:900}.seg button.on{background:var(--accent2)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}
#modal{position:fixed;inset:0;background:rgba(75,46,42,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
#modal.on{display:flex}
.card{border-radius:20px;padding:12px 14px;width:100%;max-width:400px;max-height:92%;overflow:auto}
.card.wide{max-width:520px}
.card p{line-height:1.45;font-weight:700}
.card a{color:var(--ink);display:block;text-align:center;margin-top:10px}
.stars{text-align:center;letter-spacing:6px}.stars .pi{width:46px;height:46px;filter:grayscale(1) opacity(.25)}.stars .on .pi{filter:none;animation:pop .45s backwards}.stars .on:nth-child(2) .pi{animation-delay:.3s}.stars .on:nth-child(3) .pi{animation-delay:.6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}}
.objs div{padding:3px 0;font-size:14px;font-weight:700}.objs .ok{font-weight:900}
.stat{display:flex;justify-content:space-between;border-bottom:2px dotted rgba(184,116,63,.4);padding:4px 0;font-weight:800}
.chest{margin:10px 0;padding:8px 10px;border-radius:12px;font-weight:900}
.ads{display:flex;flex-direction:column;gap:7px}.ads button{font-size:13px;text-align:left}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.lg{border-radius:10px;text-align:center;font-size:12px;padding:4px 0;font-weight:900;border-width:2px}.lg small{display:block;font-weight:700;font-size:9px}.lg .pd{width:20px;height:24px}
.lg.got{background:#d8ecc0}.lg.now{background:var(--accent2);animation:pulse 1s infinite}
.quest,.sitem{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:14px;padding:7px 10px;margin-bottom:8px;font-weight:900}
.sitem .b1{white-space:nowrap;flex:none}
.quest small,.sitem small{display:block;font-weight:700;opacity:.75;font-size:12px}.sitem .pd{width:20px;height:24px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pp{border-radius:14px;padding:6px;text-align:center;font-size:13px}
.por{width:60px;height:80px;object-fit:contain}.pp small{display:block;opacity:.75}.pp:not(.met){opacity:.55}
.story{font-size:11px;margin-top:4px;font-style:italic}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800}
.sw input{width:22px;height:22px;accent-color:var(--accent)}.sw select{font:inherit;padding:4px;border-radius:10px;border:2px solid var(--wood);background:var(--paperHi);color:var(--ink)}
.card>.b2,.card>.b3{display:block;width:100%;margin-top:8px}
.note{font-size:12px;background:#fff0b8;border-radius:10px;padding:5px 9px;margin-bottom:8px;font-weight:800}
.ver{text-align:center;font-size:11px;opacity:.6;margin-top:8px}
.legal{font-size:13px;line-height:1.45}.legal h4{margin:10px 0 4px;color:var(--woodDk)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px;transition:opacity .4s,transform .4s;max-width:92%;text-align:center}
.toast.out{opacity:0;transform:translateY(-10px)}
.confirm{position:fixed;inset:0;background:rgba(75,46,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.adov{position:fixed;inset:0;background:#2f8f94;z-index:30;display:flex;align-items:center;justify-content:center}
.adbox{text-align:center;color:#fff8ea}.adtag{background:#f6c23b;color:#4b2e2a;font-weight:900;border-radius:8px;padding:4px 10px;display:inline-block}
.adart{margin:20px}.adart .pi{width:56px;height:56px}.adcount{font-size:28px;font-weight:900}
#title{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;padding:24px 24px calc(env(safe-area-inset-bottom) + 40px);background:#f6ac86 center/cover no-repeat;image-rendering:pixelated;z-index:10}
#title.on{display:flex}
#title .logo{position:absolute;top:calc(env(safe-area-inset-top) + 7%);left:0;right:0;text-align:center}
#title h1{font-size:64px;line-height:.9;margin:0;font-weight:900;letter-spacing:-1px;transform:rotate(-4deg)}
#title h1 span{display:block;-webkit-text-stroke:3px #fff8ea;paint-order:stroke fill;text-shadow:0 5px 0 #7e4a2a}
#title h1 span:first-child{color:#2f8f94}
#title h1 span:last-child{color:#e2553f;margin-left:40px}
#title p{display:inline-block;margin:14px 0 0;font-weight:900;font-size:17px;background:#fff8ea;color:#4b2e2a;border-radius:999px;padding:4px 14px;border:3px solid #b8743f}
#title .tgull{width:64px;height:86px;object-fit:contain;animation:bob 2s ease-in-out infinite;image-rendering:pixelated}
#title .big{max-width:280px}
.evt{background:var(--paperHi);border-radius:999px;padding:4px 14px;font-weight:900;border:3px solid var(--wood)}.evt .pd{width:22px;height:26px}
#title .tlogo{width:min(92vw,460px);filter:drop-shadow(0 6px 4px rgba(60,30,10,.35));animation:bob 3s ease-in-out infinite}
#title{background-size:cover!important;background-position:center!important;image-rendering:auto}
#title .logo{top:calc(env(safe-area-inset-top) + 4%)}
</style>
</head>

;window.GS_PRIVACY="<h4>Politique de confidentialité — Gull Street</h4>\n<p><b>En bref :</b> aucun compte, aucune inscription. Ta progression reste sur ton appareil, les achats passent par Apple, et le jeu affiche des publicités Google AdMob que tu peux refuser.</p>\n<h4>Ta sauvegarde reste sur ton appareil</h4>\n<p>Niveaux, objets et réglages sont enregistrés uniquement sur ton appareil. Nous ne les recevons jamais. Supprimer le jeu efface la sauvegarde.</p>\n<h4>Achats intégrés</h4>\n<p>Les paiements sont gérés par Apple (App Store, StoreKit). Nous ne recevons ni coordonnées bancaires ni identité, seulement la liste des produits que tu possèdes. « Restaurer les achats » te permet de les récupérer sur un autre appareil. Aucun achat ne donne d’objet tiré au hasard, et il n’y a aucun abonnement.</p>\n<h4>Publicité (Google AdMob)</h4>\n<p>Des publicités plein écran apparaissent entre deux parties, et des vidéos bonus sont proposées si tu le veux. L’achat « Sans pub » retire les publicités plein écran. Le SDK Google Mobile Ads peut collecter l’identifiant publicitaire de l’appareil (IDFA), seulement si tu l’autorises dans la demande d’Apple (« Autoriser le suivi »), ainsi que des données techniques et d’interaction avec les annonces. Dans l’EEE, au Royaume-Uni et en Suisse, un écran de consentement de Google (UMP) te permet d’accepter, de refuser ou de gérer tes choix. Si tu refuses, seules des publicités non personnalisées s’affichent. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires. Comment Google utilise ces données : <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<h4>Mesure d’audience et plantages (Google Firebase)</h4>\n<p>Le jeu utilise Google Firebase Analytics et Firebase Crashlytics pour savoir comment il est joué (niveaux, durée des parties, écrans ouverts) et corriger les plantages. Ils collectent un identifiant d’installation aléatoire (pas l’identifiant publicitaire), le modèle d’appareil, la version du système, la langue, le pays déduit de l’adresse IP, des événements de jeu et, en cas de plantage, un rapport technique. Ces données ne servent pas à la publicité et ne sont pas reliées à ton identité : <a href=\"https://firebase.google.com/support/privacy\" target=\"_blank\" rel=\"noopener\">https://firebase.google.com/support/privacy</a></p>\n<h4>Ce que nous ne faisons pas</h4>\n<p>Aucun autre outil tiers que Google AdMob et Google Firebase, aucun profil, aucune vente de données, aucun accès aux contacts, photos, micro, caméra ou position GPS.</p>\n<h4>Enfants</h4>\n<p>Gull Street s’adresse à un public général. Nous ne collectons sciemment aucune donnée d’enfant, et les publicités excluent les contenus sensibles.</p>\n<h4>Tes droits et contact</h4>\n<p>Nous ne détenons aucune donnée qui t’identifie : il n’y a donc rien à consulter ni à supprimer chez nous. Tu peux effacer ta partie dans les Réglages. Les données publicitaires se gèrent avec Réglages → Choix publicitaires ou les outils de Google. Pour toute question : <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Politique complète : <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n<hr>\n<h4>Privacy policy — Gull Street</h4>\n<p><b>In short:</b> no account, no sign-up. Your progress stays on your device, purchases go through Apple, and the game shows Google AdMob ads that you can decline.</p>\n<p><b>Your save stays on your device:</b> levels, items and settings are kept only on your device. We never receive them. Deleting the game erases the save.</p>\n<p><b>In-app purchases:</b> payments are handled by Apple (App Store, StoreKit). We receive no payment or identity details, only which products you own. Restore purchases lets you get them back on another device. No purchase gives a random item, and there is no subscription.</p>\n<p><b>Advertising (Google AdMob):</b> full-screen ads appear between games, and bonus videos are offered if you want them. The “No ads” purchase removes full-screen ads. The Google Mobile Ads SDK may collect your device’s advertising identifier (IDFA), only if you allow it in Apple’s prompt (“Allow tracking”), as well as technical data and ad interaction data. In the EEA, the UK and Switzerland, Google’s consent screen (UMP) lets you accept, decline or manage your choices. If you decline, only non-personalised ads are shown. Change your mind any time in Settings → Ad choices. How Google uses this data: <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<p><b>Analytics and crash reports (Google Firebase):</b> the game uses Google Firebase Analytics and Firebase Crashlytics to understand how it is played (levels, session length, screens opened) and to fix crashes. They collect a random installation identifier (not the advertising identifier), device model, system version, language, the country inferred from the IP address, game events and, if the game crashes, a technical report. This data is not used for advertising and is not linked to your identity: <a href=\"https://firebase.google.com/support/privacy\" target=\"_blank\" rel=\"noopener\">https://firebase.google.com/support/privacy</a></p>\n<p><b>What we don’t do:</b> no third-party tools other than Google AdMob and Google Firebase, no profiles, no data sales, no access to contacts, photos, microphone, camera or GPS location.</p>\n<p><b>Children:</b> Gull Street is meant for a general audience. We do not knowingly collect children’s data, and ads exclude sensitive content.</p>\n<p><b>Your rights and contact:</b> we hold no data that identifies you, so there is nothing to access or delete on our side. You can erase your progress in Settings. Ad data is managed with Settings → Ad choices or Google’s tools. Questions: <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Full policy: <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n";</script>

(() => {

  // timers and animation frames included, so a slow PC still gives a perfect 30 frames per second video.
  let scale = 1;

// ---------- purchases ----------
// Real purchases go through Apple (StoreKit 2) via the iOS shell's `store` message handler (ios/Shared/NativeStore.swift);
// on the web there is no handler and a test box stands in (nothing is charged).

  async init() {

  // restoring gives back what lasts (no ads, façades), not the starter coins and decorations a second time
  own(pids) { for (const pid of pids || []) { const it = ECO.store.find(x => PID(x.id) === pid); if (it && it.once && !S.owned[it.id]) { S.owned[it.id] = true; if (it.pass) S.owned.pass = true; if (it.noAds) S.owned.noads = true; if (it.skin) S.skin = it.skin; save(); } } },

    try { const r = await iap('buy', { id: PID(item.id) }); if (r.ok) { grant(item); return true; }
      if (r.err === 'pending') toast(t('buyPending')); else if (r.err !== 'cancel') toast(t('buyFail')); } catch (e) { toast(t('buyFail')); }
    return false;

};

  if (item.skin) S.skin = item.skin; if (item.pass) S.owned.pass = true; if (item.noAds) S.owned.noads = true;

// ---------- walkers ----------
function makeWalker(opts = {}) {

  if (opts.want) wants = [opts.want, ...wants.filter(w => w !== opts.want)].slice(0, 2);
  return {
    sp, tint: opts.color || null, hat: !opts.person && !opts.vip && Math.random() < 0.22 ? pickR(['#f8c51c', '#2f9ea3', '#3f8a5e', '#f2a7a8']) : null, person: opts.person || null, vip: !!opts.vip,
    x: streetX(STREET_TOP) + rnd(-14, 14), y: STREET_TOP - 10, off: rnd(-16, 16), speed: rnd(Wk.speedMin, Wk.speedMax),

    wants, got: [], state: 'walk', checked: new Set(), passedSlots: new Set(), charm: 0, priceFeel: 0, wait: 0, waitPen: 0, extra: 0,
    shop: null, serveT: 0, bubble: null, bubbleT: 0, phase: Math.random() * 10, alpha: 0, mood: null, story: 0

}
function lotDoor(lot) { const L = LOTS[lot]; return { x: L.x - L.side * 34, y: L.y + 30 }; }
function updateWalker(w, dt) {

    w.y += w.speed * dt * (G.dayT > dayLen() + 10 ? 3 : 1); w.x = lerp(w.x, streetX(w.y) + w.off, 0.15);
    for (const s of SLOTS) if (!w.passedSlots.has(s.i) && w.y >= s.y) { w.passedSlots.add(s.i); const d = S.slots[s.i]; if (d) w.charm += DECO[d].charm * 0.5 * w.taste; }
    for (const L of LOTS) {
      if (w.checked.has(L.i) || w.y < L.y - 24) continue; w.checked.add(L.i);
      const lot = S.lots[L.i]; if (!lot || !w.wants.includes(lot.type) || w.got.includes(lot.type)) continue;
      const p = shopPrice(lot);

      const q = G.queues[L.i] || (G.queues[L.i] = []);

    w.x = lerp(w.x, tx, Math.min(1, dt * 4)); w.y = lerp(w.y, ty, Math.min(1, dt * 4));

function leaveShop(w) { const q = G.queues[w.shop]; if (q) q.splice(q.indexOf(w), 1); w.shop = null; w.serveT = 0; w.wait = 0; w.state = 'back'; }
function buy(w, lot) {
  const M = ECO.mood, p = shopPrice(lot), pay = p * (w.vip ? ECO.ads.vipSpend : 1);

  if (w.person && lot.type === PEOPLE[w.person].want && !S.met[w.person]) { S.met[w.person] = true; w.story = 1; w.storyT = 0; toast('📖 ' + t('newFriend') + ' — ' + I.person(w.person)); SFX.bell(); track('inhabitant_met', { id: w.person }); }

// ---------- day bonuses: now and then a sale leaves a coin or a heart above the shop; tap it before it fades ----------
// coin: a small extra (about a third of the shop's price); heart: cheers up the customers queuing there (or a coin if nobody waits).

  const L = LOTS[i]; G.bonusGap = BONUS.gap;

// ---------- day flow ----------
function startDay() {

  if (!S.lots.some(Boolean)) { toast(t('tut2b')); return; }
  G.phase = 'day'; G.dayT = 0; G.walkers = []; G.queues = {}; G.speed = 1; G.bonuses = []; G.daySales = 0; G.bonusGap = 0; G.combo = 0; G.openBonus = false;
  G.stats = { income: 0, tips: 0, served: 0, happy: 0, moods: [], vip: 0, moodAvg: 0 };
  S.lots.forEach(l => { if (l) l.sales = 0; });
  const D = ECO.day, rep = Math.min(D.repMax, (S.lastHappy || 0) * D.repPerHappy);
  const n = Math.round(Math.min(D.maxVisitors, D.baseVisitors + S.day * D.visitorsPerDay + rep));
  G.spawnAt = []; for (let i = 0; i < n; i++) G.spawnAt.push({ t: (i + Math.random() * 0.8) / n * dayLen() * D.spawnShare });
  for (let i = 0; i < Math.min(3, n); i++) G.spawnAt[i].t = Math.min(G.spawnAt[i].t, i * 1.2);   // opening: a few visitors were already waiting at the top of the street
  // one inhabitant per day (if any is due), plus the VIP bought with an ad
  const due = ECO.inhabitants.filter(p => p.day <= S.day && !S.met[p.id] && (!p.event || (p.event === 'xmas' && isXmas())));
  const metList = Object.keys(S.met);
  let person = due.length ? due[0].id : (metList.length && Math.random() < 0.5 ? pickR(metList) : null);
  if (person) G.spawnAt[Math.floor(G.spawnAt.length * rnd(0.2, 0.6))].person = person;
  if (S.vipNext) { G.spawnAt[Math.floor(G.spawnAt.length / 2)].vip = true; S.vipNext = false; }
  if (S.tut < 6) { S.tut = 6; G.tutReplay = false; save(); track('tuto_done'); }
  closeSheet(); refreshHud(); track('day_start', { day: S.day, visitors: n });
}
function updateDay(dt) {
  G.dayT += dt; G.bonusGap -= dt;
  // opening coin: a few seconds after the street opens, one coin pops above a shop (the day starts with something to tap)
  if (!G.openBonus && G.dayT >= BONUS.opening) { G.openBonus = true; const own = LOTS.filter(L => S.lots[L.i]); if (own.length) { const L = pickR(own); dropBonus(L.i, S.lots[L.i], true); } }
  while (G.spawnAt.length && G.spawnAt[0].t <= G.dayT) {
    const s = G.spawnAt.shift(); const p = s.person && PEOPLE[s.person];
    G.walkers.push(makeWalker(p ? { species: p.species, color: p.color, person: p.id, want: p.want } : { vip: s.vip }));
  }
  for (const w of G.walkers) updateWalker(w, dt);
  G.walkers = G.walkers.filter(w => !w.dead);

}

  st.moodAvg = st.moods.length ? Math.round(st.moods.reduce((a, b) => a + b, 0) / st.moods.length) : 0;
  const objs = objectivesFor(S.day), res = objs.map(o => ({ o, v: objValue(o, st), ok: objValue(o, st) >= o.n }));

  S.coins += chest.coins; S.shells += chest.shells; if (chest.deco) S.inv[chest.deco] = (S.inv[chest.deco] || 0) + 1;

// ---------- first-run tutorial: tap a free spot, pick the bakery, open the street (3 real taps, nothing to lose) ----------
// S.tut: 0-2 = build the first shop, 3 = open the street, 6 = done (also after "Skip"). A hand shows each tap; "Skip" stays top right.
const tutEl = div('tuto', `<div class="tuveil"></div><div class="tuhand"><i>☝️</i></div><div class="tubub"></div><button class="tuskip"></button>`);
document.body.appendChild(tutEl);
tutEl.querySelector('.tuskip').addEventListener('click', e => { e.stopPropagation(); audioInit(); SFX.tap(); tutSkip(); });
function tutSkip() { S.tut = 6; G.tutReplay = false; G.tutLot = null; G.tutPick = null; save(); track('tuto_skip'); refreshHud(); if (sheet.classList.contains('on')) buildSheetRefresh(); }
function buildSheetRefresh() { sheet.querySelectorAll('.item.pulse').forEach(b => b.classList.remove('pulse')); }
let tutKey = '';
function tutFrame() {
  let step = '', tx = 0, ty = 0, r = 0, msg = '';
  const busy = modal.classList.contains('on') || document.querySelector('.confirm, .adov') || $('#title').classList.contains('on');
  if (S.tut < 6 && G.phase === 'morning' && !busy) {
    if (sheet.classList.contains('on')) {
      const b = G.tutPick && sheet.querySelector(`[data-build="${G.tutPick}"]`);
      if (b) { const rc = b.getBoundingClientRect(); if (rc.bottom > innerHeight - 8 || rc.top < 0) b.scrollIntoView({ block: 'center' }); step = 'pick'; tx = rc.left + rc.width * 0.72; ty = rc.top + rc.height / 2; r = Math.max(rc.width, rc.height) * 0.62; msg = G.tutPick === 'bakery' && !G.tutReplay ? 'tut2' : 'tut2b'; }
    } else if (S.tut <= 2 && G.tutLot != null) {
      const L = LOTS[G.tutLot]; step = 'lot'; tx = (L.x - (G.camX || 0)) * scale; ty = (L.y - 2 - G.camY) * scale; r = 62 * scale; msg = 'tut1';
    } else if (S.tut >= 3) {
      const b = hud.querySelector('[data-a="open"]'); if (b) { const rc = b.getBoundingClientRect(); step = 'open'; tx = rc.left + rc.width / 2; ty = rc.top + rc.height / 2; r = rc.width * 0.3; msg = 'tut3'; }
    }
  }
  tutEl.classList.toggle('on', !!step);
  if (!step) { tutKey = ''; return; }
  const key = step + msg + I.lang;
  if (key !== tutKey) { tutKey = key; const bb = tutEl.querySelector('.tubub'); bb.textContent = t(msg); bb.style.animation = 'none'; void bb.offsetWidth; bb.style.animation = ''; tutEl.querySelector('.tuskip').textContent = t('tutSkip') + ' ⏭'; }
  const hand = tutEl.querySelector('.tuhand'); hand.style.left = (tx - 22) + 'px'; hand.style.top = (ty - 4) + 'px';
  const bb = tutEl.querySelector('.tubub'), bh = bb.offsetHeight || 40;
  bb.style.top = clamp(step === 'lot' ? ty - r - bh - 14 : ty - r - bh - 22, innerHeight * 0.2, innerHeight - bh - 10) + 'px';
  if (step === 'lot' && ty - r - bh - 14 < innerHeight * 0.2) bb.style.top = (ty + r + 50) + 'px';
  tutEl.querySelector('.tuveil').style.background = `radial-gradient(circle at ${tx}px ${ty}px, transparent ${r * 0.92}px, rgba(60,30,20,.5) ${r * 1.3}px)`;
}
function tutReplay() {

}

hud.addEventListener('click', e => {

  if (a === 'open') startDay();
  if (a === 'speed') { G.speed = G.speed === 1 ? 2 : 1; refreshHud(); }
  if (a === 'quests') questsModal(); if (a === 'album') albumModal(); if (a === 'store') storeModal(); if (a === 'settings') settingsModal();
  if (a === 'goals') { G.goalsHidden = !G.goalsHidden; refreshHud(); }
  if (a === 'tland') landModal();

    if (a === 'tshops') { const i = LOTS.findIndex(L => !S.lots[L.i] && districtOpen(L.district)); if (i < 0) return toast(t('noSpot')); G.camY = clamp(LOTS[i].y - viewH * 0.35, CAMY0, Math.max(CAMY0, WORLD_H - viewH)); G.camX = clamp(LOTS[i].x - viewW / 2, 0, Math.max(0, W - viewW)); onLot(i); }
    else { const i = SLOTS.findIndex(s => !S.slots[s.i] && districtOpen(s.district)); if (i < 0) return toast(t('noSpot')); G.camY = clamp(SLOTS[i].y - viewH * 0.35, CAMY0, Math.max(CAMY0, WORLD_H - viewH)); G.camX = clamp(SLOTS[i].x - viewW / 2, 0, Math.max(0, W - viewW)); onSlot(i); }
  }
});

  openModal(`<h2>${t('tabLand')}</h2>${rows}${S.owned.facades ? `<label class="sw"><span>${t('sFacades')}</span><input type="checkbox" data-skin ${S.skin === 'marine' ? 'checked' : ''}></label>` : ''}<button class="b2 big" data-close>${t('close')}</button>`);

// shop picker order: the shops unlocked today first (what the player wants to try), then the others available, then the locked ones
const shopOrder = () => ECO.shops.map((s, k) => [s, k]).sort((a, b) => { const r = s => s.unlockDay === S.day ? 0 : s.unlockDay <= S.day ? 1 : 2; return r(a[0]) - r(b[0]) || a[1] - b[1]; }).map(x => x[0]);
function buildSheet(i) {
  const list = shopOrder().map(s => {
    const lockedDay = s.unlockDay > S.day, cant = S.coins < s.cost;
    return `<button class="item ${lockedDay ? 'off' : ''} ${G.tutPick === s.id ? 'pulse' : ''}" data-build="${s.id}" ${lockedDay ? 'disabled' : ''}>
      <span class="ic" style="background:${s.color}">${s.icon}</span><span class="nm">${I.shop(s.id)}<small>${lockedDay ? t('fromDay', { n: s.unlockDay }) : s.price + ' 🪙 / ' + t('shop').toLowerCase()}</small></span>
      <span class="cost ${cant && !lockedDay ? 'red' : ''}">${s.cost} 🪙</span></button>`;
  }).join('');
  openSheet(`<h3>${t('shopPick')}</h3><div class="list">${list}</div>`);
  sheet.querySelectorAll('[data-build]').forEach(b => b.onclick = () => {
    // replaying the tutorial (Settings) never costs anything: that first shop is a free demo
    const s = SHOP[b.dataset.build], cost = G.tutReplay && S.tut < 6 ? 0 : s.cost; if (S.coins < cost) return toast(t('noMoney'));
    S.coins -= cost; S.lots[i] = { type: s.id, lvl: 1, price: 'normal', sales: 0 }; G.builtAt[i] = G.t; save(); SFX.build(); buzz(15);
    track('shop_built', { type: s.id, lot: i, day: S.day });

}

function infoSheet(lot) { const s = SHOP[lot.type]; openSheet(`<h3><span class="ic" style="background:${s.color}">${s.icon}</span> ${I.shop(s.id)} <small>${t('level')} ${lot.lvl}</small></h3><div class="lbl">${t('sales')} : <b>${lot.sales || 0}</b> · ${t('price')} ${shopPrice(lot)} 🪙</div>`); }
function decoSheet(i) {
  const cur = S.slots[i];

    sheet.querySelector('[data-rm]').onclick = () => { S.inv[cur] = (S.inv[cur] || 0) + 1; S.slots[i] = null; save(); closeSheet(); };

  }
  const avail = ECO.decos.filter(d => (!d.event || (d.event === 'xmas' && isXmas())) && (!d.pass || S.owned.pass));

function questsModal() {

  const qs = S.quests.list.map((q, i) => {
    const def = ECO.quests.find(x => x.id === q.id), done = q.p >= def.target;
    return `<div class="quest"><span>${t('q' + q.id, { n: def.target })}<small>${Math.min(q.p, def.target)}/${def.target}</small></span>
      ${q.claimed ? `<b>${t('done')}</b>` : `<button class="b1" data-q="${i}" ${done ? '' : 'disabled'}>${def.coins ? def.coins + '🪙' : def.shells + '🐚'}</button>`}</div>`;
  }).join('');
  openModal(`<h2>${t('login')}</h2><div class="login">${loginRow}</div>
    ${S.login.pending ? `<button class="b1" data-login>${t('claim')}</button>` : ''}

  const lb = modal.querySelector('[data-login]'); if (lb) lb.onclick = () => {
    const r = L[k - 1]; if (r.coins) S.coins += r.coins; if (r.shells) S.shells += r.shells; if (r.deco) S.inv[r.deco] = (S.inv[r.deco] || 0) + 1;

    const q = S.quests.list[+b.dataset.q], def = ECO.quests.find(x => x.id === q.id); q.claimed = true; S.coins += def.coins; S.shells += def.shells; save(); SFX.coin(); refreshHud(); questsModal();

}

    if (G.phase === 'day' && A.opts.vitesse > 1) G.speed = Math.round(2 * A.opts.vitesse);
    if (G.phase === 'day') await dayPlay(A);
    if (G.phase === 'evening' || modalOn()) await afterSummary(A);
  }
  // title -> consent (refused for clean takes) -> the street
  async function start(A) {
    if (A.opts.ui === 'propre' && S().consent == null) S().consent = false;   // clean takes: no consent window on camera (refused = no personalised ads)
    if (A.opts.ui === 'propre') S().owned.noads = true;
    if (G.phase !== 'title') return;
    await A.wait(900); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(700);
    if (vis('#modal [data-c]')) { await A.think(); await A.tapEl(A.opts.ui === 'propre' ? '#modal [data-c="0"]' : '#modal [data-c="1"]', 'consentement'); await A.wait(700); }
    await clearModal(A);
  }

  // ---- moments worth cutting on, read from the game state ----
  function watch(A) {
    const seen = new WeakSet(G.walkers.filter(w => w.state === 'done')); let lastHappy = -1e9, met = Object.keys(S().met).length, phase = G.phase, dis = Object.keys(S().districts).length, day = S().day;
    const iv = setInterval(() => { if (!A.running()) return clearInterval(iv);
      for (const w of G.walkers) if (w.state === 'done' && w.mood != null && !seen.has(w)) { seen.add(w);
        if (w.mood >= ECO.mood.happyAt) { A.ev('client', { humeur: w.mood }); if (performance.now() - lastHappy > 6000) { lastHappy = performance.now(); A.mark('client content'); } } }
      const m = Object.keys(S().met).length; if (m > met) { met = m; A.mark('nouvel ami'); }
      const d = Object.keys(S().districts).length; if (d > dis) { dis = d; A.mark('déblocage : nouveau quartier'); }
      if (G.phase !== phase) { phase = G.phase;
        if (phase === 'evening') { const n = (S().stars[S().day] != null ? document.querySelectorAll('#modal .stars .on').length : 0); A.mark('fin de journée ' + (n ? '★'.repeat(n) : '')); A.ev('fin_journee', { jour: S().day, etoiles: n, gains: G.stats && G.stats.income + G.stats.tips }); } }
      if (S().day !== day) { day = S().day; const nw = ECO.shops.filter(s => s.unlockDay === day); if (nw.length) A.mark('déblocage : ' + nw.map(s => s.id).join(', ')); A.ev('jour', { jour: day }); }
    }, 100);
  }

  // ---- starting saves (off camera): a real fast-forward of the economy, day after day, with a simple buying plan ----
  function autoBuy(s, keep = 0, leaveFree = 0) {
    const stars = GS.totalStars();
    for (const D of ECO.districts) if (!s.districts[D.id] && stars >= D.stars && s.coins >= D.cost + 80 && GS.LOTS.some(L => L.district === D.id)) { s.coins -= D.cost; s.districts[D.id] = true; }
    for (let k = 0; k < 8; k++) {
      const L = freeLots().length > leaveFree ? freeLots()[0] : null; if (!L) break; const have = ownedTypes();
      const sh = ECO.shops.filter(x => x.unlockDay <= s.day && !have.has(x.id) && x.cost <= s.coins - keep).sort((a, b) => b.cost - a.cost)[0]; if (!sh) break;
      s.coins -= sh.cost; s.lots[L.i] = { type: sh.id, lvl: 1, price: 'normal', sales: 0 };
    }
    for (let k = 0; k < 6; k++) {
      const b = s.lots.map((l, i) => [l, i]).filter(([l, i]) => l && i < GS.LOTS.length && upCost(l) <= (s.coins - keep) * 0.6).sort((a, b) => upCost(a[0]) - upCost(b[0]))[0]; if (!b) break;
      s.coins -= upCost(b[0]); b[0].lvl++;
    }
    for (const sl of freeSlots()) {
      const inv = Object.keys(s.inv).find(k => s.inv[k] > 0 && GS.DECO[k]);
      if (inv) { s.inv[inv]--; s.slots[sl.i] = inv; continue; }
      const d = ECO.decos.filter(d => !d.event && !d.pass && !d.shells && d.unlockDay <= s.day && d.cost <= (s.coins - keep) * 0.25).sort((a, b) => b.charm - a.charm)[0];
      if (!d) break; s.coins -= d.cost; s.slots[sl.i] = d.id;
    }
    if (s.tut < 6) s.tut = 6;
  }
  const slice = () => new Promise(r => setTimeout(r, 40));   // let the page breathe
  async function simDay(stopAt) {
    GS.startDay(); G.speed = 1; let n = 0;
    while (G.phase === 'day' && !(stopAt && G.dayT >= stopAt)) { GS.tick(0.1); if (++n % 250 === 0) await slice(); if (n > 30000) break; }
    G.floats.length = 0;
  }
  // the very end of a day: every customer left is already walking out at the bottom of the street (the stars come within ~2 s)
  async function simDayEnd() {
    GS.startDay(); G.speed = 1; let n = 0; const exitY = Math.max(...GS.LOTS.map(L => L.y)) + 40;
    // the last customers have shopped and walk out; the empty minutes that follow on the day's clock are skipped (off camera)
    const nearlyOver = () => !G.spawnAt.length && G.walkers.every(w => w.state === 'done' || (w.state === 'walk' && w.y > exitY)) && G.walkers.some(w => w.state === 'walk');
    while (G.phase === 'day' && !nearlyOver()) { GS.tick(0.05); if (++n % 400 === 0) await slice(); if (n > 60000) break; }
    if (G.phase === 'day') G.dayT = Math.max(G.dayT, ECO.day.seconds - 0.5);
    G.floats.length = 0;
  }
  async function fastForward(days, leaveFree = 0) {
    const s = S();
    while (s.day < days) {
      autoBuy(s, 0, leaveFree); await simDay();
      s.lastAdAt = Date.now(); await GS.nextDay(); await slice();   // the morning after (no interstitial: an ad was "just seen")
    }
    G.tutLot = null; G.tutPick = null; GS.save();   // the tutorial is long over in these saves
  }
  function tidy() {
    G.floats.length = 0; document.querySelectorAll('.toast').forEach(e => e.remove());
    if (sheetOn()) $('#sheet').classList.remove('on');
  }

  BETA.game({
    sfx: GS.SFX,
    logo: () => (window.GS_SPR && GS_SPR.logo) || '',
    endText: () => lang() === 'fr' ? 'Joue gratuitement' : 'Play free',
    progress: () => [S().day, G.phase, Math.floor((G.dayT || 0) / 5), S().lots.filter(Boolean).length, S().slots.filter(Boolean).length],
    async prepare(save, A) {
      if (A.opts.ui === 'propre') S().owned.noads = true;
      const sc = A.opts.scene;
      if (sc === 'onboarding') return;                 // onboarding always starts on the title screen of a new game (and plays the 3-tap tutorial)
      if (S().tut < 6) { S().tut = 6; GS.save(); }     // the other scenes skip the first-run tutorial
      await start(A);
      // boucle builds two shops on camera and moment builds the shop unlocked by the next day: their saves keep lots free
      const leave = sc === 'boucle' ? 2 : sc === 'moment' ? 1 : 0;
      if (sc !== 'progression') {                      // progression always shows the empty street filling up
        // moment films day 7 (its third goal is decorations, which a grown street meets) so the next morning unlocks a shop
        if (save === 'milieu') await fastForward(sc === 'moment' ? 7 : 8, leave); else if (save === 'avance') await fastForward(20, leave);
      }
      if (sc === 'moment') {                           // a busy day at its very end: the last customers walk out, then the stars
        autoBuy(S(), 0, leave); S().lastAdAt = Date.now(); await simDayEnd(); G.speed = 0;   // frozen until the camera rolls
      }
      if (A.opts.ui === 'propre') S().owned.noads = true;
      await A.wait(2600); tidy(); GS.save();           // toasts of the fast-forward fade off camera
      A.ev('sauvegarde', { jour: S().day, pieces: S().coins, coquillages: S().shells, boutiques: S().lots.filter(Boolean).map(l => l.type + l.lvl).join(','), decos: S().slots.filter(Boolean).length, etoiles: GS.totalStars() });
    },
    scenes: {
      // title -> consent -> the tutorial's two shops by real taps -> open the street -> first customers
      async onboarding(A) {
        watch(A); await start(A); await A.wait(800);
        for (let k = 0; k < 2 && A.running() && S().tut <= 2; k++) {
          const i = G.tutLot != null ? G.tutLot : (freeLots()[0] || {}).i; if (i == null) break;
          await A.think(); await tapLot(A, i, 'emplacement libre');
          const sel = `#sheet [data-build="${G.tutPick || 'bakery'}"]`; await waitFor(A, () => !!vis(sel), 1500); const pick = vis(sel); if (!pick) { await closeSheet(A); continue; }
          await A.wait(A.jitter(500, 900)); await A.tapEl(pick, 'construire ' + pick.dataset.build); await A.wait(300);
          if (S().lots[i]) { A.mark('nouvelle boutique : ' + S().lots[i].type); await A.wait(900); }
        }
        await openStreet(A);
        while (A.running()) await playDay(A);
      },
      // the satisfying core: a morning of building, then the street opens and customers shop and tip
      // two new shops spring up, the street opens in ×2, the camera moves closer and the robot taps the coins, hearts and customers
      async boucle(A) {
        watch(A); await waitAds(A); await clearModal(A);
        for (let k = 0; k < 2 && A.running() && G.phase === 'morning'; k++) {
          const have = ownedTypes(), coins = S().coins, L = freeLots()[0];
          const can = ECO.shops.filter(x => x.unlockDay <= S().day && !have.has(x.id) && x.cost <= coins).sort((a, b) => a.cost - b.cost);
          if (!L || !can.length) break;
          await build(A, L, can[0].id, true);   // the cheapest new kind: it leaves coins for a second one and sits at the top of the list
        }
        await openStreet(A, true, true);
        if (G.phase !== 'day') return;
        A.mark('la rue ouvre');
        const lots = GS.LOTS.filter(L => S().lots[L.i]), xs = lots.map(L => L.x), fy = lots.reduce((a, L) => a + L.y, 0) / lots.length;
        GS.zoom(1.3, (Math.min(...xs) + Math.max(...xs)) / 2, fy + 10);                   // closer to the shops, so the inhabitants read well on a phone
        await dayPlay(A, 0, 7000);
      },
      // before/after: the empty street fills up, day after day (days run as a time-lapse)
      async progression(A) {
        watch(A); A.speed(Math.max(2, A.opts.vitesse));
        for (let d = 0; d < 12 && A.running(); d++) {
          await waitAds(A); await clearModal(A);
          if (G.phase === 'morning') { await morning(A, 5); await openStreet(A, false); }
          if (G.phase === 'day') G.speed = 24;           // time-lapse of the day (camera effect, the simulation itself is unchanged)
          await watchDay(A); if (G.phase === 'evening') await afterSummary(A);
        }
      },
      // the wow: the last customers of a busy day, the stars pop, the chest, a new morning
      // (the player had set ×2 earlier that day), then the shop unlocked by the new morning, built at once
      async moment(A) {
        watch(A); if (G.phase === 'day') { G.speed = 2; GS.setDay(S().day); }   // setDay redraws the HUD (×2, not the ×0 of the freeze)
        await dayPlay(A, 6000);
        if (!(await waitFor(A, () => !!vis('#modal [data-next]'), 4000))) return;
        await A.wait(A.jitter(1700, 1900)); await A.tapEl('#modal [data-next]', 'jour suivant'); await A.wait(600); await waitAds(A);
        const L = freeLots()[0], nw = ECO.shops.filter(x => x.unlockDay === S().day && x.cost <= S().coins)[0];
        if (L && nw) await build(A, L, nw.id, true);
        await A.wait(1500);
      },
      // plays on until stopped (long tests, balance, memory)
      async idle(A) { watch(A); while (A.running()) await playDay(A); },
    },
  });
})();
</script>
</body>
