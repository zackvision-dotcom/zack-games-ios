<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Braise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen painted world; HUD panels sit in the corners exactly like the mockup */
:root{
  --panel:rgba(28,18,10,.74);--panel-b:rgba(255,226,170,.16);--gold:#f6c45a;--gold-d:#c8902a;--cream:#fff4dc;--muted:#e2cfae;--heart:#e8372e;--food:#f2a83a;--water:#3ab0e6;--mana:#ff7a2a;--ink:#2a170c;
  --common:#c8c8c8;--rare:#4aa8ff;--epic:#b45aff;--legend:#ffb02a;
  --f-display:'Baloo 2','Trebuchet MS',sans-serif;--f-body:'Nunito','Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#1a120a;color:var(--cream);font-family:var(--f-body);overflow:hidden}
#game{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{background:var(--panel);border:1.5px solid var(--panel-b);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
button{font-family:var(--f-body)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top-left: portrait, hearts, needs */
#stats{position:absolute;left:18px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;padding:8px 18px 8px 8px}
#portrait{position:relative;width:96px;height:96px;flex:0 0 auto}
#portrait canvas{width:96px;height:96px;border-radius:50%;border:4px solid #c8902a;box-shadow:0 0 0 3px #4a2a12,inset 0 0 0 2px #ffd88a;background:#e9c47c;display:block}
#lvl{position:absolute;left:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:#2a170c;border:3px solid #c8902a;font:800 17px/26px var(--f-display);text-align:center;color:var(--gold)}
#bars{display:grid;gap:6px;min-width:170px}
#bars .name{font:800 22px/1 var(--f-display);letter-spacing:.04em}
#hearts{display:flex;gap:4px}
#hearts canvas{width:28px;height:26px}
.bar{display:flex;gap:8px;align-items:center}
.bar canvas{width:20px;height:20px}
.bar .track{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bar .fill{height:100%;border-radius:6px;transition:width .2s}
#fFood{background:linear-gradient(#ffd27a,var(--food))}#fWater{background:linear-gradient(#8ad8ff,var(--water))}#fMana{background:linear-gradient(#ffc06a,var(--mana))}

/* quest panel */
#quests{position:absolute;left:18px;top:calc(136px + env(safe-area-inset-top,0px));width:min(330px,calc(100vw - 36px));padding:12px 16px 14px;display:grid;gap:7px}
#quests h3{margin:0 0 2px;font:800 21px/1.1 var(--f-display);color:var(--gold);display:flex;gap:8px;align-items:center}
#quests h3::before{content:'';width:14px;height:14px;transform:rotate(45deg);background:var(--gold);border:2px solid #7a4a12;flex:0 0 auto}
#quests ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#quests li{display:flex;gap:10px;align-items:center;font:700 16px/1.25 var(--f-body)}
#quests li::before{content:'';width:15px;height:15px;border:2px solid var(--muted);border-radius:4px;flex:0 0 auto}
#quests li.done{opacity:.6}#quests li.done::before{background:#7ccf5a;border-color:#7ccf5a}
#quests li .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
#quests li.new{animation:flashq 1.2s 2}
@keyframes flashq{50%{color:var(--gold)}}

/* top-right: clock + minimap */
#clock{position:absolute;right:270px;top:calc(22px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;padding:8px 16px 8px 10px;border-radius:30px}
#clock canvas{width:44px;height:44px}
#clock b{display:block;font:800 18px/1.05 var(--f-display)}#clock span{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
#mini{position:absolute;right:20px;top:calc(14px + env(safe-area-inset-top,0px));width:230px;height:230px}
#mini canvas{width:230px;height:230px;border-radius:50%;border:5px solid #c8902a;box-shadow:0 0 0 3px #4a2a12,0 8px 20px rgba(0,0,0,.4);display:block}
.key{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;box-sizing:border-box;border-radius:8px;background:#f4ead6;color:var(--ink);font:900 16px/1 var(--f-display);border:2px solid #2a170c;box-shadow:0 3px 0 #2a170c}
#mini .key{position:absolute;right:-2px;bottom:16px}

/* bottom: hotbar, map button, hints */
#hotbar{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:14px}
.slot{--s:clamp(40px,4.4vw,74px);width:var(--s);height:var(--s);position:relative;border-radius:10px;background:radial-gradient(circle at 50% 35%,#5a4430,#2e2016 75%);border:2px solid #6a4a2a;cursor:pointer;box-sizing:border-box}
.slot.sel{border:3px solid var(--gold);box-shadow:0 0 0 2px #7a4a12,0 0 18px rgba(246,196,90,.55)}
.slot img{position:absolute;inset:8%;width:84%;height:84%;pointer-events:none}
.slot .k{position:absolute;left:5px;bottom:3px;font:800 14px/1 var(--f-display);color:#fff;text-shadow:0 1px 2px #000}
.slot .n{position:absolute;right:6px;bottom:3px;font:800 16px/1 var(--f-display);color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.slot .dur{position:absolute;left:8%;right:8%;bottom:16%;height:3px;border-radius:2px;background:rgba(0,0,0,.5)}
.slot .dur i{display:block;height:100%;background:#7ccf5a;border-radius:2px}
.slot[data-r="rare"]{background:radial-gradient(circle at 50% 35%,#3a6a9a,#16283a 75%)}.slot[data-r="epic"]{background:radial-gradient(circle at 50% 35%,#6a3a9a,#24163a 75%)}.slot[data-r="legend"]{background:radial-gradient(circle at 50% 35%,#9a6a2a,#3a2410 75%)}
#mapBtn{position:absolute;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;font:800 19px var(--f-display);color:var(--cream);background:none;border:0;cursor:pointer;text-shadow:0 2px 4px #000}
#mapBtn .icon{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--panel-b);position:relative}
#mapBtn .icon canvas{width:42px;height:38px}
#mapBtn .icon small{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font:900 11px var(--f-display);background:#f4ead6;color:var(--ink);padding:1px 6px;border-radius:5px;border:1.5px solid #2a170c}
#hints{position:absolute;right:24px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:9px;font:800 17px var(--f-body);text-shadow:0 2px 4px #000}
#hints div{display:flex;gap:12px;align-items:center}

/* prompts, toasts, boss */
#prompt{position:absolute;transform:translate(-50%,-100%);display:flex;gap:8px;align-items:center;padding:6px 12px 6px 6px;border-radius:12px;font:800 16px var(--f-body);pointer-events:none;white-space:nowrap}
#toasts{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none}
.toast{padding:8px 18px;border-radius:12px;font:800 18px var(--f-display);animation:toast 2.6s forwards;text-shadow:0 2px 3px #000}
.toast.legend{color:var(--legend)}.toast.epic{color:var(--epic)}.toast.rare{color:var(--rare)}.toast.good{color:#9ff07a}
@keyframes toast{0%{opacity:0;transform:translateY(12px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#banner{position:absolute;left:50%;top:13%;transform:translateX(-50%);font:800 clamp(34px,5vw,64px)/1 var(--f-display);color:var(--gold);text-shadow:0 4px 0 #5a2a08,0 0 30px rgba(0,0,0,.6);pointer-events:none;text-align:center;white-space:nowrap}
#boss{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(520px,60vw);padding:8px 14px 12px;display:grid;gap:6px}
#boss b{font:800 18px var(--f-display);text-align:center;color:#ffb0a0}
#boss .track{height:14px;border-radius:7px;background:rgba(0,0,0,.5);overflow:hidden}#boss .track i{display:block;height:100%;background:linear-gradient(#ff8a6a,#c82a1a)}

/* dialog */
#dialog{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,calc(100vw - 32px));display:grid;grid-template-columns:110px 1fr;gap:14px;padding:16px 20px 16px 16px;z-index:8}
#dialog canvas{width:110px;height:110px;border-radius:14px;background:#e9c47c;border:3px solid #c8902a}
#dialog b{font:800 22px var(--f-display);color:var(--gold)}
#dialog p{margin:4px 0 10px;font:700 18px/1.4 var(--f-body)}
#dialog .choices{display:flex;flex-wrap:wrap;gap:8px}
#dialog .choices button{font:800 15px var(--f-body);padding:8px 14px;border-radius:10px;border:2px solid #2a170c;background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #7a4a12}
#dialog .choices button.alt{background:#f4ead6}

/* inventory, construction, map, title */
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 32px));max-height:80vh;overflow:auto;padding:18px 20px;z-index:9;display:grid;gap:14px}
.sheet h2{margin:0;font:800 30px var(--f-display);color:var(--gold)}
.sheet h4{margin:0;font:800 18px var(--f-display);color:var(--muted)}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.bag .slot{--s:64px;width:auto;aspect-ratio:1;height:auto}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rec{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1.5px solid var(--panel-b);cursor:pointer;color:var(--cream);text-align:left}
.rec:hover{background:rgba(255,255,255,.12)}.rec.no{opacity:.55;cursor:default}
.rec img{width:52px;height:52px;grid-row:span 2}
.rec b{font:800 17px var(--f-display)}
.rec .ing{display:flex;gap:8px;flex-wrap:wrap;font:700 14px var(--f-body);color:var(--muted)}
.rec .ing span.miss{color:#ff8a7a}
.close{justify-self:end;font:800 15px var(--f-body);padding:6px 12px;border-radius:10px;border:2px solid #2a170c;background:#f4ead6;color:var(--ink);cursor:pointer}
#mapSheet canvas{width:100%;height:auto;border-radius:14px;border:4px solid #c8902a;display:block}
#title{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(26,18,10,0) 30%,rgba(26,18,10,.65) 75%,rgba(26,18,10,.92));padding:16px}
#title .box{display:grid;gap:16px;justify-items:center;text-align:center}
#title h1{margin:0;font:800 clamp(72px,13vw,170px)/.85 var(--f-display);color:var(--gold);text-shadow:0 6px 0 #6a2e08,0 0 40px rgba(0,0,0,.6)}
#title p{margin:0;font:800 clamp(17px,2.2vw,24px)/1.35 var(--f-body);max-width:34ch;text-shadow:0 2px 6px #000}
.big{font:800 24px var(--f-display);padding:12px 38px;border-radius:16px;border:3px solid #2a170c;background:linear-gradient(#ffd77a,#f2a83a);color:var(--ink);cursor:pointer;box-shadow:0 6px 0 #7a4a12,0 12px 30px rgba(0,0,0,.5)}
.big.alt{font-size:18px;padding:9px 26px;background:linear-gradient(#fff4dc,#e6d2ac)}
#loading{font:800 22px var(--f-display)}
#keys{display:grid;grid-template-columns:auto auto;gap:6px 14px;font:700 15px var(--f-body);text-align:left;background:var(--panel);padding:12px 16px;border-radius:14px}
#keys span:nth-child(odd){text-align:right}
@media (max-width:900px){#clock{right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:110px}#mini{width:150px;height:150px}#mini canvas{width:150px;height:150px}#hints{display:none}#quests{top:auto;bottom:110px;width:240px}}
@media (prefers-reduced-motion:reduce){.toast,#quests li.new{animation:none}}
</style>

<script>
/* Braise · Folie — vector "paint" kit.
   Gives any vector shape painted volume: soft core shadow, lit side, highlight, rim light,
   height gradient, brush texture and a warm dark outline. Path builders take the context: p(g).
   Sprites are rendered once at high resolution and cached, so the cost is paid at load time. */
window.PAINT = (() => {
  const TAU = Math.PI * 2, L = [-.62, -.78], OL = '#4a2a16';   // light from the top-left
  const canFilter = (() => { try { const c = document.createElement('canvas').getContext('2d'); c.filter = 'blur(2px)'; return c.filter === 'blur(2px)'; } catch (e) { return false; } })();
  const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const blur = (g, px) => { if (canFilter) g.filter = px > .3 ? `blur(${px}px)` : 'none'; };
  const scaleOf = g => { const m = g.getTransform(); return Math.hypot(m.a, m.b) || 1; };

  /* soft elliptical gradient spot: cheap stand-in for a blurred shape */
  function spot(g, x, y, rx, ry, rot, col, a, hard) {
    g.save(); g.translate(x, y); g.rotate(rot || 0); g.scale(1, ry / rx);
    const q = g.createRadialGradient(0, 0, 0, 0, 0, rx); q.addColorStop(0, col); q.addColorStop(hard || .45, col); q.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = a == null ? 1 : a; g.fillStyle = q; g.fillRect(-rx, -rx, rx * 2, rx * 2); g.restore();
  }
  /* o: base, shade, light, hi, rim (colours) · box [cx,cy,rx,ry] · depth (0..1) · tex · seed · ao · ol/olw */
  function form(g, p, o) {
    const [cx, cy, rx, ry] = o.box, s = Math.max(rx, ry), d = o.depth == null ? .28 : o.depth;
    p(g); g.fillStyle = o.shade || o.base; g.fill();
    g.save(); p(g); g.clip();
    // lit body: the base colour spreads from the light side and fades into the core shadow
    spot(g, cx + L[0] * s * d, cy + L[1] * s * d, rx * 1.18, ry * 1.12, 0, o.base, 1, .62);
    if (o.light) spot(g, cx + L[0] * rx * .42, cy + L[1] * ry * .44, rx * .66, ry * .56, -.5, o.light, o.lightA || .85, .35);
    if (o.hi) spot(g, cx + L[0] * rx * .52, cy + L[1] * ry * .58, rx * .22, ry * .15, -.6, o.hi, .9, .4);
    if (o.ao !== 0) { const q = g.createLinearGradient(0, cy - ry, 0, cy + ry); q.addColorStop(0, 'rgba(60,25,10,0)'); q.addColorStop(.62, 'rgba(60,25,10,0)'); q.addColorStop(1, `rgba(60,25,10,${o.ao == null ? .3 : o.ao})`); g.fillStyle = q; g.fillRect(cx - rx - 6, cy - ry - 6, rx * 2 + 12, ry * 2 + 12); }
    if (o.tex) brush(g, o.box, o.tex, o.seed || 1, o.texCol);
    // rim light: inner edge stroke fading from the lit side to nothing
    if (o.rim) { const q = g.createLinearGradient(cx + L[0] * rx, cy + L[1] * ry, cx, cy); q.addColorStop(0, o.rim); q.addColorStop(1, 'rgba(255,255,255,0)'); p(g); g.lineWidth = o.rimW || Math.max(2.4, s * .09); g.strokeStyle = q; g.globalAlpha = .9; g.stroke(); g.globalAlpha = 1; }
    g.restore();
    if (o.ol !== false) { p(g); g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = o.olw || 2.6; g.strokeStyle = o.ol || OL; g.stroke(); }
  }
  function rim() {}
  function brush(g, box, amount, seed, col) {
    const [cx, cy, rx, ry] = box, r = rng(seed), n = Math.min(900, Math.round(rx * ry / 16 * amount));
    g.save(); g.lineCap = 'round';
    for (let i = 0; i < n; i++) { const x = cx + (r() - .5) * rx * 2, y = cy + (r() - .5) * ry * 2, a = -.65 + (r() - .5) * .9, l = 3 + r() * 10; g.globalAlpha = .05 + r() * .07; g.strokeStyle = col || (r() < .5 ? '#fff4d0' : '#3a1606'); g.lineWidth = 1.2 + r() * 2.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
    g.restore();
  }
  function contact(g, x, y, rx, ry, a) { spot(g, x, y, rx * 1.25, ry * 1.25, 0, `rgba(55,32,10,${a == null ? .34 : a})`, 1, .5); }
  function glow(g, x, y, r, col, a) { g.save(); g.globalCompositeOperation = 'lighter'; const q = g.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, col); q.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a == null ? 1 : a; g.fillStyle = q; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }
  /* organic closed curve through jittered points; returns a path builder */
  function blob(x, y, rx, ry, n, jit, seed, flatBottom) {
    const r = rng(seed || 1), pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * TAU, j = 1 + (r() - .5) * jit; let py = y + Math.sin(a) * ry * j; if (flatBottom != null) py = Math.min(py, flatBottom); pts.push([x + Math.cos(a) * rx * j, py]); }
    return g => { g.beginPath(); g.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2); for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; g.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); } g.closePath(); };

  const steer = (dx, dy) => { const l = Math.hypot(dx, dy), dead = 14;
    if (l < dead) { for (const c in held) press(c, false); return; } const nx = dx / l, ny = dy / l; dir = [nx, ny];
    press('ArrowRight', nx > .38); press('ArrowLeft', nx < -.38); press('ArrowDown', ny > .38); press('ArrowUp', ny < -.38); };
  tj.addEventListener('pointerdown', e => { e.preventDefault(); jid = e.pointerId; tj.setPointerCapture(jid); ox = e.clientX; oy = e.clientY; tj.classList.add('on'); base.style.left = nub.style.left = ox + 'px'; base.style.top = nub.style.top = oy + 'px'; });
  tj.addEventListener('pointermove', e => { if (e.pointerId !== jid) return; let dx = e.clientX - ox, dy = e.clientY - oy; const l = Math.hypot(dx, dy), m = 50; if (l > m) { dx *= m / l; dy *= m / l; } nub.style.left = ox + dx + 'px'; nub.style.top = oy + dy + 'px'; steer(dx, dy); });
  const release = e => { if (e.pointerId !== jid) return; jid = null; tj.classList.remove('on'); steer(0, 0); };
  tj.addEventListener('pointerup', release); tj.addEventListener('pointercancel', release);

  // ---- action buttons ----
  const tb = el('div', { id: 'tb' }), btn = (cls, label, aria, down, up) => { const b = el('button', { className: cls, type: 'button', innerHTML: label }, tb); b.setAttribute('aria-label', aria);
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); b.classList.add('dn'); down(); }); const end = e => { b.classList.remove('dn'); if (up) up(); }; b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end); b.addEventListener('pointerleave', end); return b; };
  btn('atk', '⚔', 'Attaquer', () => tapKey('Space', ' '));
  btn('use', 'Agir', 'Parler, ramasser, entrer', () => tapKey('KeyE', 'e'));
  btn('dash', '💨', 'Sprint', () => tapKey('ShiftLeft', 'Shift'));
  btn('shield', '🛡', 'Bouclier', () => tapKey('KeyF', 'f'));
  // fire: a right click where the stick points (the game aims the fireball at the cursor)
  btn('fire', '🔥', 'Boule de feu', () => { const cv = document.getElementById('view'); if (!cv) return; const x = innerWidth / 2 + dir[0] * 220, y = innerHeight / 2 - 50 + dir[1] * 220;
    cv.dispatchEvent(new PointerEvent('pointerdown', { clientX: x, clientY: y, button: 2, buttons: 2, pointerType: 'touch', bubbles: true })); });
  const tm = el('div', { id: 'tm' }); for (const [lab, code, k, aria] of [['🎒', 'KeyI', 'i', 'Sac'], ['🔨', 'KeyB', 'b', 'Construire']]) { const b = el('button', { type: 'button', textContent: lab }, tm); b.setAttribute('aria-label', aria); b.addEventListener('click', e => { e.stopPropagation(); tapKey(code, k); }); }

  // controls only while playing (not on the title screen, not behind a sheet)
  setInterval(() => { const title = document.getElementById('title'), hud = document.getElementById('hud'), sheet = document.querySelector('.sheet:not([hidden])');
    document.documentElement.classList.toggle('noplay', !!((title && !title.hidden) || (hud && hud.hidden) || sheet)); if (document.documentElement.classList.contains('noplay')) steer(0, 0); }, 250);
})();
</script>
</body></html>
