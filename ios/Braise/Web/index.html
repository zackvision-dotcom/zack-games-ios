<style>
/* Layout: full-bleed ink-and-paper world; HUD hugs the edges like a castaway's field kit */
:root{
  --void:#0d0b0e;
  --ink:#1b1612;
  --bone:#efe4cc;
  --parch:#d8c7a0;
  --parch-dk:#a8946b;
  --ember:#e08a34;
  --blood:#b0323a;
  --wood:#2a211b;
  --wood-lt:#3d3128;
  --f-display:'Grenze Gotisch', 'UnifrakturMaguntia', Georgia, serif;
  --f-body:'IM Fell English', Georgia, 'Times New Roman', serif;
  --f-label:'IM Fell English SC', Georgia, serif;
  color-scheme: dark;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;background:var(--void);color:var(--bone);overflow:hidden;font-family:var(--f-body);}
#game{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--void);}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:default;}
button{font-family:var(--f-body);}
button:focus-visible,.slot:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}

/* top-left buttons */
#topbar{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:5;}
.ib{width:38px;height:38px;border-radius:9px 12px 8px 11px;border:2px solid var(--ink);background:linear-gradient(var(--wood-lt),var(--wood));color:var(--bone);font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.45);display:grid;place-items:center;padding:0;}
.ib:hover{background:linear-gradient(#4a3b30,#2f251e);}
.ib.off{opacity:.5;}

/* journal of goals */
#goals{position:absolute;left:16px;top:calc(62px + env(safe-area-inset-top,0px));width:230px;padding:10px 14px 12px;background:
  radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.18),transparent 60%),
  linear-gradient(170deg,var(--parch),var(--parch-dk));color:var(--ink);border:2px solid var(--ink);border-radius:4px 10px 6px 12px;box-shadow:0 5px 0 rgba(0,0,0,.35);transform:rotate(-1deg);z-index:4;}
#goals h3{margin:0 0 6px;font:700 22px/1 var(--f-display);letter-spacing:.02em;}
#goals ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:15px;line-height:1.2;}
#goals li{display:flex;gap:7px;align-items:baseline;}
#goals li::before{content:'';flex:0 0 10px;height:10px;border:1.5px solid var(--ink);border-radius:2px 3px 2px 3px;transform:translateY(1px);}
#goals li.done{opacity:.55;text-decoration:line-through;}
#goals li.done::before{background:var(--ink);}
#goals li.cur{font-weight:700;}
#goals .hide{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--ink);font-size:18px;cursor:pointer;}
#goals.min ul{display:none;}

/* crafting */
#craft{position:absolute;left:16px;top:50%;transform:translateY(-30%);display:flex;flex-direction:column;gap:8px;z-index:5;}
.tab{width:54px;height:54px;padding:4px;border:2px solid var(--ink);border-radius:10px 6px 11px 7px;background:radial-gradient(circle at 40% 35%,#5a4a3a,#30261f 75%);cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.45);}
.tab img{width:100%;height:100%;display:block;pointer-events:none;}
.tab.on{background:radial-gradient(circle at 40% 35%,#8a6f4a,#4a3a2c 75%);}
.tab.can::after{content:'';position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--ember);border:2px solid var(--ink);animation:pulse 1.4s infinite;}
@keyframes pulse{50%{transform:scale(1.25);}}
#recipes{position:absolute;left:84px;top:50%;transform:translateY(-30%);width:min(310px,calc(100vw - 110px));max-height:70vh;overflow:auto;padding:12px 14px;background:
  radial-gradient(110% 80% at 15% 0%,rgba(255,255,255,.2),transparent 60%),
  linear-gradient(175deg,var(--parch),var(--parch-dk));color:var(--ink);border:2px solid var(--ink);border-radius:6px 12px 8px 10px;box-shadow:0 6px 0 rgba(0,0,0,.4);z-index:6;}
#recipes h2{margin:0 0 8px;font:700 26px/1 var(--f-display);}
.rec{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:8px;border:1.5px solid rgba(27,22,18,.35);border-radius:5px 8px 4px 7px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.12);}
.rec:hover{background:rgba(255,255,255,.28);}
.rec.no{cursor:default;opacity:.8;}
.rec.no:hover{background:rgba(255,255,255,.12);}
.rec>img{width:44px;height:44px;grid-row:span 2;}
.rec b{font:400 18px/1.1 var(--f-label);}
.rec p{margin:0;font-style:italic;font-size:14px;opacity:.8;}
.ings{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.ing{display:flex;align-items:center;gap:2px;font:15px/1 var(--f-body);font-variant-numeric:tabular-nums;}
.ing img{width:26px;height:26px;}
.ing.miss{color:var(--blood);font-weight:700;}
.mk{margin-left:auto;font:400 15px/1 var(--f-label);padding:5px 10px;border:2px solid var(--ink);border-radius:4px 7px 5px 6px;background:var(--ink);color:var(--parch);}
.rec.no .mk{background:transparent;color:var(--ink);opacity:.5;}

/* inventory */
#inv{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:3px;padding:7px 9px;background:linear-gradient(#33291f,#1d1712);border:2px solid var(--ink);border-radius:10px 14px 9px 12px;box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 1px rgba(239,228,204,.07);z-index:5;align-items:center;}
.slot{box-sizing:border-box;--s:clamp(18px,calc((100vw - 110px) / 17),50px);width:var(--s);height:var(--s);position:relative;background:radial-gradient(circle at 40% 35%,#5a4a3a,#352a22 72%);border:2px solid var(--ink);border-radius:6px 8px 5px 7px;cursor:pointer;flex:0 0 auto;}
.slot:hover{background:radial-gradient(circle at 40% 35%,#76604a,#43352a 72%);}
.slot img{position:absolute;left:4%;top:4%;width:92%;height:92%;pointer-events:none;}
.slot .n{position:absolute;right:2px;bottom:1px;font:700 calc(var(--s)*.34)/1 var(--f-body);color:var(--bone);text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink);pointer-events:none;}
.slot .d{position:absolute;left:2px;top:1px;font:calc(var(--s)*.26)/1 var(--f-body);color:var(--bone);text-shadow:-1px -1px 0 var(--ink),1px 1px 0 var(--ink);pointer-events:none;}
.slot .k{position:absolute;left:3px;bottom:1px;font:calc(var(--s)*.22)/1 var(--f-body);color:rgba(239,228,204,.35);pointer-events:none;}
.slot.eq{background:radial-gradient(circle at 40% 35%,#4c4038,#251e19 72%);}
.slot.eq .ph{position:absolute;inset:18%;opacity:.25;pointer-events:none;}
.sep{width:2px;align-self:stretch;margin:2px 5px;background:var(--ink);border-radius:2px;}

#hover{position:absolute;pointer-events:none;font:20px/1 var(--f-body);color:var(--bone);text-shadow:0 0 3px var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink),0 2px 6px rgba(0,0,0,.8);white-space:nowrap;z-index:7;transform:translate(14px,-28px);}
#hover i{font-style:italic;color:#f2c374;}
#tip{position:absolute;pointer-events:none;z-index:8;padding:7px 10px;background:linear-gradient(var(--parch),var(--parch-dk));color:var(--ink);border:2px solid var(--ink);border-radius:4px 8px 5px 7px;font-size:15px;line-height:1.25;max-width:240px;}
#tip b{font:400 17px/1.1 var(--f-label);display:block;}
#tip small{display:block;opacity:.75;font-style:italic;}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center;box-sizing:border-box;}
#title{background:radial-gradient(ellipse at 50% 45%,rgba(13,11,14,0) 20%,rgba(13,11,14,.55) 60%,rgba(13,11,14,.92) 100%);}
#title h1{margin:0;font:900 clamp(64px,14vw,168px)/.85 var(--f-display);color:var(--bone);letter-spacing:.01em;text-shadow:0 3px 0 var(--ink),0 0 30px rgba(0,0,0,.9),4px 6px 0 rgba(27,22,18,.8);text-wrap:balance;}
#title .tag{margin:0;font:italic clamp(18px,2.6vw,26px)/1.3 var(--f-body);color:#e6d3ad;text-shadow:0 2px 8px #000;max-width:34ch;}
.big{font:400 24px/1 var(--f-label);padding:14px 34px 12px;border:3px solid var(--ink);border-radius:6px 12px 7px 11px;background:linear-gradient(var(--parch),var(--parch-dk));color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink),0 10px 30px rgba(0,0,0,.6);transition:transform .12s;}
.big:hover{transform:translateY(-2px) rotate(-1deg);}
.big:active{transform:translateY(2px);}
.keys{background:rgba(13,11,14,.62);padding:12px 18px;border-radius:8px 12px 7px 10px;display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:15px;color:#d9c8a6;text-shadow:0 1px 4px #000;text-align:left;max-width:520px;}
.keys kbd{font:13px/1 var(--f-label);padding:3px 6px;border:1.5px solid #d9c8a6;border-radius:4px;color:var(--bone);background:rgba(0,0,0,.35);white-space:nowrap;}
.keys span:nth-child(odd){text-align:right;}
.best{font-size:15px;color:#bfae8c;font-style:italic;margin:0;}
#loading{font:italic 22px var(--f-body);color:var(--bone);}
#dead{background:radial-gradient(ellipse at center,rgba(40,6,10,.55),rgba(5,3,4,.95));}
#dead h2,#pause h2,#eraEnding h2{margin:0;font:900 clamp(48px,9vw,110px)/.9 var(--f-display);color:var(--bone);text-shadow:0 3px 0 var(--ink),0 0 30px #000;}
#dead p{margin:0;font-size:22px;color:#e1cfa8;font-style:italic;}
#pause{background:rgba(8,6,8,.78);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

@media (max-width:700px){
  #goals{width:170px;font-size:13px;padding:8px 10px;}
  #goals ul{font-size:13px;}
  #goals h3{font-size:18px;}
  .tab{width:42px;height:42px;}
  #recipes{left:66px;}
  #hover{font-size:16px;}
}
@media (max-height:520px){ #goals{display:none;} }
</style>

<script>
(()=>{
'use strict';
/* =========================================================
   HOLLOWMERE — a hand-inked survival demo. Everything you see
   is drawn procedurally: no image files, no external assets.
   ========================================================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const smooth=t=>t*t*(3-2*t);
const easeOut=t=>1-(1-t)*(1-t);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y);const xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s,o){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2.03;}return t/n;}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- ink drawing helpers ---------------- */
const INK='#1b1612';
function ell(g,x,y,rx,ry,r){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),r||0,0,TAU);}
function ink(g,w){g.lineWidth=w||2.2;g.strokeStyle=INK;g.lineJoin='round';g.lineCap='round';g.stroke();}
function fillInk(g,f,w){g.fillStyle=f;g.fill();ink(g,w);}
function poly(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();}
function smoothPath(g,p){const n=p.length;g.beginPath();g.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}g.closePath();}
function blobPts(cx,cy,rx,ry,n,jit,rng){const p=[];const o=rng()*TAU;for(let i=0;i<n;i++){const a=o+i/n*TAU;const j=1+(rng()-.5)*jit;p.push([cx+Math.cos(a)*rx*j,cy+Math.sin(a)*ry*j]);}return p;}
function line(g,p,lw,col){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.lineWidth=lw;g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';g.stroke();}
function inkLine(g,p,lw,col,ol){line(g,p,lw+(ol||2)*2,INK);line(g,p,lw,col);}
function hatch(g,x0,y0,x1,y1,sp,ang,col,lw,rng){g.save();g.beginPath();g.rect(x0,y0,x1-x0,y1-y0);g.clip();g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.beginPath();const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0)/2+4,ca=Math.cos(ang),sa=Math.sin(ang);for(let d=-R;d<=R;d+=sp){const l=R*(.7+rng()*.3),px=cx-sa*d,py=cy+ca*d,j=(rng()-.5)*2;g.moveTo(px-ca*l+j,py-sa*l);g.lineTo(px+ca*l,py+sa*l+j);}g.stroke();g.restore();}

const SPR=Math.min(2,Math.max(1.25,(window.devicePixelRatio||1)*1.1));
function makeSprite(w,h,ax,ay,fn){const c=document.createElement('canvas');c.width=Math.ceil(w*SPR);c.height=Math.ceil(h*SPR);const g=c.getContext('2d');g.scale(SPR,SPR);fn(g,w,h);return{c,w,h,ax,ay};}

/* ---------------- sprite art: flora ---------------- */
const PINE_C=['#2c4535','#466a4d','#182820'];
function drawPine(g,w,h,k,rng){
  const cx=w/2,base=h-10;
  const trunkH=36*k,tw=8.5*k;
  // roots + trunk
  g.fillStyle='#4b3727';
  poly(g,[[cx-tw*1.35,base+3],[cx-tw*.6,base-6],[cx-tw*.5,base-trunkH],[cx+tw*.5,base-trunkH],[cx+tw*.62,base-6],[cx+tw*1.4,base+3],[cx,base+1]]);g.fill();ink(g,2.2);
  line(g,[[cx+tw*.2,base-2],[cx+tw*.15,base-trunkH*.9]],1.1,'rgba(20,14,10,.6)');
  const top=8,fb=base-trunkH*.5,tiers=4,step=(fb-top)/(tiers+.9),tierH=step*1.95,maxHW=w*.47;
  for(let i=0;i<tiers;i++){
    const yb=fb-i*step,yt=Math.max(top,yb-tierH),hw=maxHW*(1-i*.21)*(.93+rng()*.1);
    const pts=[[cx+(rng()-.5)*4,yt]];const sideN=3;
    for(let s=1;s<=sideN;s++){const f=s/(sideN+1);pts.push([cx-hw*f-3-rng()*5,yt+(yb-yt)*f+1]);pts.push([cx-hw*f*.9+2,yt+(yb-yt)*f+5]);}
    pts.push([cx-hw-2,yb+3+rng()*4]);
    const ns=6+((rng()*3)|0);
    for(let s=1;s<ns;s++){const x=cx-hw+2*hw*s/ns;pts.push([x-hw/ns*.45,yb-3-rng()*4]);pts.push([x,yb+5+rng()*7]);}
    pts.push([cx+hw+2,yb+3+rng()*4]);
    for(let s=sideN;s>=1;s--){const f=s/(sideN+1);pts.push([cx+hw*f*.9-2,yt+(yb-yt)*f+5]);pts.push([cx+hw*f+3+rng()*5,yt+(yb-yt)*f+1]);}
    poly(g,pts);g.fillStyle=PINE_C[0];g.fill();
    g.save();poly(g,pts);g.clip();
    g.fillStyle=PINE_C[1];g.beginPath();g.moveTo(cx-hw-12,yb+14);g.lineTo(cx-3+(rng()-.5)*6,yt-6);g.lineTo(cx-hw*.12,yb+14);g.closePath();g.fill();
    const gr=g.createLinearGradient(0,yt,0,yb+8);gr.addColorStop(0,'rgba(8,18,12,.55)');gr.addColorStop(.45,'rgba(8,18,12,0)');g.fillStyle=gr;g.fillRect(cx-hw-12,yt,2*hw+24,yb-yt+16);
    hatch(g,cx+hw*.08,yt,cx+hw+12,yb+14,3.6,-1.0,'rgba(10,20,14,.6)',1.1,rng);
    g.strokeStyle='rgba(150,180,135,.55)';g.lineWidth=1.1;g.beginPath();
    for(let s=0;s<6;s++){const x=cx-hw*.85+rng()*hw*.9,y=yb-2-rng()*((yb-yt)*.5);g.moveTo(x,y);g.lineTo(x-3,y+5);}
    g.stroke();g.restore();
    poly(g,pts);ink(g,2.3);
  }
}
const OAK_PAL=[['#a5552c','#c97f3b','#e3ac5d'],['#ab7a2e','#cf9e45','#ebc871'],['#8b3e2e','#b15937','#d88752']];
function drawOak(g,w,h,rng,pal){
  const cx=w/2,base=h-8;
  const segs=[];
  const limb=(x0,y0,x1,y1,wd)=>segs.push([x0,y0,x1,y1,wd,(rng()-.5)*14]);
  const fy=base-66;
  limb(cx,base,cx+(rng()-.5)*6,fy,13);
  limb(cx,fy+8,cx-30,fy-38,7);limb(cx,fy+4,cx+28,fy-44,7);limb(cx,fy,cx+3,fy-60,6);
  limb(cx-18,fy-20,cx-46,fy-30,4);limb(cx+16,fy-24,cx+44,fy-22,4);
  for(const pass of [0,1])for(const s of segs){g.beginPath();g.moveTo(s[0],s[1]);g.quadraticCurveTo((s[0]+s[2])/2+s[5],(s[1]+s[3])/2,s[2],s[3]);g.lineCap='round';g.lineWidth=pass?s[4]:s[4]+4.4;g.strokeStyle=pass?'#5c4636':INK;g.stroke();}
  // roots
  inkLine(g,[[cx-6,base-2],[cx-16,base+2]],3,'#5c4636',1.6);inkLine(g,[[cx+6,base-2],[cx+17,base+3]],3,'#5c4636',1.6);
  const blobs=[];const ccx=cx,ccy=base-118;
  for(let i=0;i<8;i++){const a=rng()*TAU,r=rng()*.85;blobs.push([ccx+Math.cos(a)*r*50,ccy+Math.sin(a)*r*34-(i<3?14:0),26+rng()*14]);}
  blobs.push([ccx,ccy-30,30]);
  blobs.sort((a,b)=>a[1]-b[1]);

const DAY_LEN=300,DUSK=.55,NIGHT=.75,R_ISLAND=2700;
const B_WATER=0,B_GRASS=1,B_FOREST=2,B_ROCK=3,B_MARSH=4;
let seed=1;
function coastVal(x,y){return Math.hypot(x,y)/R_ISLAND+(fbm(x*.0009,y*.0009,seed+5,3)-.5)*.8;}
function isLand(x,y){return coastVal(x,y)<.968;}
function biomeAt(x,y){
  const c=coastVal(x,y);if(c>=1)return B_WATER;
  const d=Math.hypot(x,y),sp=clamp(1-d/850,0,1);
  const m=fbm(x*.00055,y*.00055,seed+11,4)-sp*.2,r=fbm(x*.0007+50,y*.0007,seed+23,4)-sp*.3;
  if(r>.6)return B_ROCK;if(m>.6)return B_MARSH;if(m>.5)return B_FOREST;return B_GRASS;
}
const DEF={
  pine:{name:'Sapin',solid:14,hp:6,sh:34},oak:{name:'Arbre roux',solid:14,hp:5,sh:40},dead:{name:'Arbre mort',solid:12,hp:3,sh:26},

const S={};
let statics=[],mobs=[],fires=[],traps=[],dens=[],holes=[],regrow=[],bouncing=[],fx=[],timers=[];
const GS=256,grid=new Map();
const gkey=(cx,cy)=>(cx+512)*4096+(cy+512);
function gAdd(e){const k=gkey(Math.floor(e.x/GS),Math.floor(e.y/GS));let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(e);}
function gRemove(e){const a=grid.get(gkey(Math.floor(e.x/GS),Math.floor(e.y/GS)));if(a){const i=a.indexOf(e);if(i>=0)a.splice(i,1);}}
const QBUF=[];
function gQuery(x0,y0,x1,y1,out){out=out||QBUF;out.length=0;const cx0=Math.floor(x0/GS),cx1=Math.floor(x1/GS),cy0=Math.floor(y0/GS),cy1=Math.floor(y1/GS);for(let cx=cx0;cx<=cx1;cx++)for(let cy=cy0;cy<=cy1;cy++){const a=grid.get(gkey(cx,cy));if(a)for(let i=0;i<a.length;i++)out.push(a[i]);}return out;}

function setSpr(e){
  switch(e.type){
    case 'cave':e.spr=S.cave;break;case 'waterhole':e.spr=S.waterhole;break;
    case 'carcass':e.spr=S.carcass;break;
    case 'pine':e.spr=S.pine[e.size][e.v];break;case 'oak':e.spr=S.oak[e.v];break;case 'dead':e.spr=S.dead[e.v];break;
    case 'stump':e.spr=S.stump[e.v];break;case 'sapling':e.spr=S.sap[e.picked?1:0];break;case 'tuft':e.spr=S.tuft[e.picked?1:0];break;
    case 'berry':e.spr=S.berry[e.v][e.picked?1:0];break;case 'boulder':e.spr=S.boulder[e.v][e.stage];break;
    case 'flower':e.spr=S.flower[e.v];break;case 'mushroom':e.spr=S.mush;break;case 'carrot':e.spr=S.carrot;break;
    case 'reeds':e.spr=S.reeds[e.v];break;case 'hole':e.spr=S.hole;break;case 'den':e.spr=S.den;break;
    case 'trap':e.spr=S.trap[e.caught?1:0];break;case 'campfire':e.spr=S.campfire;break;case 'firepit':e.spr=S.firepit;break;case 'ash':e.spr=S.ash;break;
    case 'item':e.spr=null;break;
  }
}
function mk(type,x,y,o){const e=Object.assign({type,x,y,sway:Math.random()*TAU,shake:0,v:0,size:1,stage:0,picked:false,dead:false},o||{});e.hp=e.hp||DEF[type].hp||1;setSpr(e);gAdd(e);statics.push(e);
  if(type==='cave')caves.push(e);if(type==='waterhole')waterholes.push(e);if(type==='campfire'||type==='firepit'||e.sourceFire)fires.push(e);if(type==='trap')traps.push(e);if(type==='den')dens.push(e);if(type==='hole')holes.push(e);return e;}
function kill(e){e.dead=true;gRemove(e);const rm=(arr)=>{const i=arr.indexOf(e);if(i>=0)arr.splice(i,1);};rm(statics);if(e.type==='campfire'||e.type==='firepit')rm(fires);if(e.type==='trap')rm(traps);}
function free(x,y,type,gap){
  const base=(DEF[type].solid||7)+(gap!=null&&gap<40?gap:12),far=gap!=null&&gap>=40?gap:0;
  const R=Math.max(base,far)+40;
  const near=gQuery(x-R,y-R,x+R,y+R,[]);
  for(const e of near){if(e.type==='cave'||e.type==='waterhole')continue;const er=DEF[e.type].solid||7,d=Math.hypot(e.x-x,e.y-y);if(d<base+er)return false;if(far&&e.type===type&&d<far)return false;}
  if(DEF[type].solid&&Math.hypot(x,y)<110)return false;
  return true;
}

/* Claude's first-era scenery, with a walkable shelter and a quiet water stop. */
let caves=[],waterholes=[];
function shelterAt(p){return caves.find(c=>!c.dead&&Math.abs(p.x-c.x)<46&&p.y>=c.y-18&&p.y<c.y+44)||null;}
function caveWallAt(x,y,r=0){return caves.some(c=>!c.dead&&((Math.hypot(x-(c.x-98),(y-c.y+8)*1.4)<32+r)||(Math.hypot(x-(c.x+98),(y-c.y+8)*1.4)<32+r)||(Math.abs(x-c.x)<115+r&&y<c.y-25&&y>c.y-180-r)));}
function waterBlockedAt(x,y,r=0){return waterholes.some(w=>!w.dead&&((x-w.x)/(102+r))**2+((y-w.y)/(34+r))**2<1);}
function pushCaveWalls(m,r){
 for(const c of caves){if(c.dead||Math.abs(m.x-c.x)>170||Math.abs(m.y-c.y)>230)continue;
  if(Math.abs(m.x-c.x)<115+r&&m.y<c.y-25&&m.y>c.y-180-r){const edges=[{d:Math.abs(m.x-c.x+115+r),x:c.x-115-r},{d:Math.abs(m.x-c.x-115-r),x:c.x+115+r},{d:Math.abs(m.y-c.y+25),y:c.y-25},{d:Math.abs(m.y-c.y+180+r),y:c.y-180-r}].sort((a,b)=>a.d-b.d);if(edges[0].x!==undefined)m.x=edges[0].x;else m.y=edges[0].y;}
  for(const sign of [-1,1]){const cx=c.x+sign*98,cy=c.y-8,dx=m.x-cx,dy=(m.y-cy)*1.4,d=Math.hypot(dx,dy),min=32+r;if(d<min){m.x=cx+(d?dx/d:sign)*min;m.y=cy+(d?dy/d:0)*min/1.4;}}
  // Wildlife waits outside the shelter's narrow entrance.
  if(m!==P&&Math.abs(m.x-c.x)<60&&m.y<c.y+62&&m.y>c.y-26)m.y=c.y+62;
 }
 for(const w of waterholes){if(w.dead)continue;const rx=102+r,ry=34+r,dx=(m.x-w.x)/rx,dy=(m.y-w.y)/ry,d=Math.hypot(dx,dy);if(d<1){m.x=w.x+(d?dx/d:1)*rx;m.y=w.y+(d?dy/d:0)*ry;}}
}
function addEraLandmarks(){
 const available=(x,y)=>isLand(x,y)&&Math.hypot(x-P.x,y-P.y)>180&&!statics.some(e=>!e.dead&&((['campfire','firepit','trap','cave','waterhole'].includes(e.type)||e.type==='item'&&!['flint','rocks'].includes(e.id))&&Math.hypot(x-e.x,y-e.y)<350));
 function spot(wantedX,wantedY){if(available(wantedX,wantedY))return{x:wantedX,y:wantedY};for(let i=0;i<24;i++){const a=i/24*TAU,x=Math.cos(a)*520,y=Math.sin(a)*520;if(available(x,y))return{x,y};}return null;}
 const natural=['pine','oak','dead','boulder','sapling','tuft','berry','carrot','flower','mushroom','reeds'];
 if(!caves.some(e=>!e.dead)){const p=spot(-460,-140);if(p){for(const e of statics)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<205&&natural.includes(e.type)&&!e.sourceFire)kill(e);mk('cave',p.x,p.y);}}
 if(!waterholes.some(e=>!e.dead)){const p=spot(480,200);if(p){for(const e of statics)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<125&&natural.includes(e.type)&&!e.sourceFire)kill(e);mk('waterhole',p.x,p.y,{drinkAt:0});if(isLand(p.x-130,p.y+65))mk('hole',p.x-130,p.y+65);}}
}
function drawWaterhole(e){
 const s=e.spr;ctx.save();ctx.translate(e.x,e.y);ctx.drawImage(s.c,-s.ax,-s.ay,s.w,s.h);
 ctx.save();ctx.beginPath();ctx.ellipse(0,3,90,24,0,0,TAU);ctx.clip();ctx.strokeStyle='rgba(206,224,209,.38)';ctx.lineWidth=1;
 for(let i=0;i<3;i++){const t=(realTime*.22+i/3)%1;ctx.globalAlpha=(1-t)*.6;ctx.beginPath();ctx.ellipse(15,1,10+t*65,2+t*14,0,0,TAU);ctx.stroke();}ctx.restore();
 if(hoverEnt===e){ctx.strokeStyle='#dacb9a';ctx.globalAlpha=.65;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,104,32,0,0,TAU);ctx.stroke();}ctx.restore();
}

/* Era I progression added to Claude's engine. */
let eraState={captured:false,ember:0,nights:0,eligible:false,won:false};
let victoryPending=false;
function resetEra(){eraState={captured:false,ember:0,nights:0,eligible:false,won:false};victoryPending=false;try{localStorage.removeItem(SAVE_KEY+'_completion');}catch(e){}}
function recordEraCompletion(){try{localStorage.setItem(SAVE_KEY+'_completion',JSON.stringify({seed,time:gameTime,nights:3}));}catch(e){}}
function victorySaveStatus(saved){const el=document.getElementById('eraSaveResult');if(el)el.textContent=saved?'Progression sauvegardée.':'Chapitre terminé. La sauvegarde est indisponible dans ce navigateur.';}
function settleEraVictory(dt){
 advancePlayerAnimation(dt);
 if(P.anim||timers.some(t=>t.at<realTime+60))return;
 victoryPending=false;victorySaveStatus(saveGame());
}
function captureEmber(e){
 if(eraState.captured){say('La Braise est déjà avec moi.');P.target=null;return;}
 if(!count('emberHorn')){say('Il me faut une corne : deux os et trois fibres.');P.target=null;return;}
 startAnim('pick',.5,.6,()=>{eraState.captured=true;eraState.ember=180;e.fuel=0;P.stats.captured=1;say('Le feu est vivant. Je dois bâtir un foyer.',5);sfx.ignite();invDirty=true;renderRecipes();});P.target=null;
}
function eraUpdate(dt,previousTime){
 if(mode!=='play'||P.dead||eraState.won)return;
 const now=phase(),previousPhase=(previousTime%DAY_LEN)/DAY_LEN;
 const hearth=fires.find(f=>!f.dead&&!f.sourceFire&&f.fuel>0&&Math.hypot(f.x-P.x,f.y-P.y)<260);
 if(eraState.captured){
   if(hearth)eraState.ember=Math.min(180,eraState.ember+dt*8);else eraState.ember=Math.max(0,eraState.ember-dt);

function updParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt/p.ml;if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=p.g*dt;p.rot+=p.vr*dt;
    if(p.g&&p.z<0){p.z=0;p.vz*=-.3;p.vx*=.5;p.vy*=.5;p.vr*=.5;}

 // Small hares keep the original trapping loop; large herbivores are distinct.

 for(const h of pasture.slice(0,12)){h.antelopeHome=true;h.faunaSpawn=0;for(let i=0;i<2;i++){const m=newAntelope(h);if(m)mobs.push(m);}}
 for(const h of pasture.slice(0,8)){h.hareHome=true;const m=newRabbit(h),p=faunaSpot(h,60);if(p){Object.assign(m,p);mobs.push(m);}}
 const lairs=dens.filter(d=>!d.dead&&Math.hypot(d.x,d.y)>950).sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y));
 for(const h of lairs.slice(0,5)){h.hyenaHome=true;h.faunaSpawn=0;for(let i=0;i<2;i++){const m=newHyena(h);if(m)mobs.push(m);}}

function updAntelope(m,dt,ph){

 for(const h of mobs)if(h.kind==='hyena'&&h.dying==null&&Math.hypot(m.x-h.x,m.y-h.y)<210){danger=h;break;}

 if(m.alarm>0){m.state='flee';let dx=m.x-m.fleeX,dy=m.y-m.fleeY;if(Math.hypot(dx,dy)<1)dx=m.face;
  // Spread a herd's trajectories instead of stacking bodies on the same point.

 }

function moveMob(m,dx,dy,sp,dt){
  const l=Math.hypot(dx,dy);if(l<.001)return false;dx/=l;dy/=l;

}

function isNightish(){const t=dayFrac();return t>NIGHT-.04||t<.02;}
function updMobs(dt){

    if(m.dying!=null){m.dying+=dt;if(m.dying>.7)mobs.splice(i,1);continue;}
    m.flash=Math.max(0,(m.flash||0)-dt);
    if(m.kx){m.x+=m.kx*dt;m.y+=m.ky*dt;m.kx*=.85;m.ky*=.85;if(Math.abs(m.kx)<1)m.kx=m.ky=0;}

    else if(m.kind==='machairodont'){if(!far)updFinalPredator(m,dt);}
    else if(m.kind==='hyena'){if(!far)updHyena(m,dt,ph);}
    else if(m.kind==='rabbit'){if(!far)updRabbit(m,dt,ph);}
    else if(m.kind==='spider'){if(!far||m.state!=='in')updSpider(m,dt,ph);}
    else if(m.kind==='shadow'){if(updShadow(m,dt))mobs.splice(i,1);}
    else if(m.kind==='crow'){if(updCrow(m,dt,ph))mobs.splice(i,1);}

function updRabbit(m,dt,ph){

}
function updSpider(m,dt,ph){
  const d=m.home,pd=P.dead?1e9:Math.hypot(P.x-m.x,P.y-m.y),night=isNightish()||ph==='night';

    if(pd<(night?400:250))m.state='chase';if(!night&&Math.random()<dt*.25)m.state='return';}
  else if(m.state==='chase'){if(pd>700||Math.hypot(m.x-d.x,m.y-d.y)>1100){m.state=night?'wander':'return';}dx=P.x-m.x;dy=P.y-m.y;sp=pd>55?182:0;
    if(pd<62&&m.cd<=0){m.atk=.001;sfx.hiss();}}

function updShadow(m,dt){
  const sanF=P.san/P.maxSan;m.t+=dt;m.cd=Math.max(0,m.cd-dt);
  if(sanF>.38||P.dead)m.fade=true;

  if(m.atk>0){m.atk+=dt;if(m.atk>.5&&!m.struck){m.struck=true;if(pd<90)hurtPlayer(20,m,'une ombre');}if(m.atk>.9){m.atk=0;m.struck=false;m.cd=2;}return false;}

function getAction(e){
  if(!e||e.dead)return null;
  if(e.sourceFire)return {verb:'Capturer le feu',act:'capture',name:'Acacia foudroyé'};
  if(e.type==='cave')return{verb:'Rejoindre l’abri',act:'shelter',name:'Grotte'};
  if(e.type==='waterhole')return{verb:'Boire',act:'drink',name:'Point d’eau'};
  if(e.type==='carcass')return {verb:'Récupérer les os',act:'bones',name:'Carcasse'};
  if(e.kind){if(e.kind==='crow'||e.kind==='bfly'||e.hidden||e.dying!=null)return null;return{verb:'Attaquer',act:'attack',name:{machairodont:'Grand prédateur',antelope:'Antilope',hyena:'Hyène',rabbit:'Lièvre',spider:'Araignée',shadow:'Ombre rampante'}[e.kind]};}
  const nm=DEF[e.type].name;
  switch(e.type){
    case 'pine':case 'oak':case 'dead':return{verb:'Abattre',act:'chop',name:nm,need:'chop'};
    case 'boulder':return{verb:'Miner',act:'mine',name:nm,need:'mine'};
    case 'sapling':case 'tuft':case 'berry':return e.picked?null:{verb:e.type==='berry'?'Cueillir':'Ramasser',act:'pick',name:nm};
    case 'carrot':case 'mushroom':return{verb:'Cueillir',act:'pick',name:nm};
    case 'flower':return{verb:'Cueillir',act:'pick',name:nm};
    case 'item':return{verb:'Ramasser',act:'pickup',name:ITEMS[e.id].n+(e.n>1?' ×'+e.n:'')};
    case 'campfire':case 'firepit':{const f=bestFuel();return f?{verb:'Alimenter',act:'fuel',name:nm}:null;}
    case 'trap':return{verb:e.caught?'Récupérer':'Reprendre',act:'trap',name:nm};
    case 'den':return null;
  }
  return null;
}

function entAt(wx,wy){

    else if(e.type==='waterhole'){x0=e.x-105;x1=e.x+105;y0=e.y-35;y1=e.y+35;}
    else if(e.sourceFire){x0=e.x-54;x1=e.x+54;y0=e.y-123;y1=e.y+8;}
    else if(e.type==='item'){x0=e.x-18;x1=e.x+18;y0=e.y-34;y1=e.y+6;}else{const s=e.spr;const wf=(e.type==='pine'||e.type==='oak'||e.type==='dead')?.22:.36;x0=e.x-s.w*wf;x1=e.x+s.w*wf;y0=e.y-s.ay*.9;y1=e.y+8;}
    if(wx>=x0&&wx<=x1&&wy>=y0&&wy<=y1){const tree=['pine','oak','dead'].includes(e.type),faded=tree&&e.y>P.y&&e.y-P.y<e.spr.ay&&Math.abs(e.x-P.x)<e.spr.w*.3;

        if(e.hp<=0){for(let i=0;i<4;i++)spawnDrop('silk',1,e.x,e.y);spawnDrop('mmeat',1,e.x,e.y);kill(e);const i=dens.indexOf(e);if(i>=0)dens.splice(i,1);P.target=null;say('Plus de nid. Bon débarras.');}}});

/* ---------------- slots, crafting, using ---------------- */
let invDirty=true;
function nearFire(r){for(const f of fires)if(f.fuel>0&&Math.hypot(f.x-P.x,f.y-P.y)<(r||150))return f;return null;}
function slotAction(s,shift){
  if(!s)return'';const d=ITEMS[s.id];
  if(d.place)return'Placer';if(d.eq)return'Équiper';
  if(d.food){if(d.cook&&!shift&&nearFire())return'Cuire';return'Manger';}
  if(d.fuel&&nearFire())return'Alimenter le feu';return'';
}
function useSlot(i,shift){
  const s=P.items[i];if(!s||P.dead||mode!=='play')return;const d=ITEMS[s.id];
  if(d.place){placing={id:s.id};P.target=null;return;}
  if(d.eq){const cur=P[d.eq];P[d.eq]=s;P.items[i]=cur;invDirty=true;sfx.place();if(s.id==='torch')sfx.ignite();return;}
  if(d.food){
    if(d.cook&&!shift&&nearFire()){startAnim('build',.6,.7,()=>{if(P.items[i]!==s)return;s.n--;if(!s.n)P.items[i]=null;addItem(d.cook,1);sfx.ignite();const f=nearFire();if(f)burst('ember',f.x,f.y-10,12,8,{g:-60,ml:1,s:1.5});});return;}
    startAnim('eat',.55,.6,()=>{if(P.items[i]!==s)return;s.n--;if(!s.n)P.items[i]=null;invDirty=true;const[h,hp,sn]=d.food;P.hunger=clamp(P.hunger+h,0,P.maxHunger);P.hp=clamp(P.hp+hp,0,P.maxHp);P.san=clamp(P.san+sn,0,P.maxSan);sfx.eat();
      if(hp<0)say('Beurk… ça ne passe pas.');else if(h>=14)say('Délicieux.');if(P.hp<=0)die('la mauvaise nourriture');});P.anim.food=s.id;return;
  }
  if(d.fuel){const f=nearFire();if(f){P.target={e:f,act:'fuel'};return;}}
  say({rocks:'Des pierres. Bien lourdes.',flint:'Tranchant comme un mauvais souvenir.',silk:'Encore collante.',rope:'Ça pourrait servir.',log:'Du bon bois.',grass:'Ça brûle bien.',twigs:'Des petits bouts de bois.'}[s.id]||'Hmm.');
}
function dropSlot(i){const s=P.items[i];if(!s)return;P.items[i]=null;const e=spawnDrop(s.id,s.n,P.x,P.y);e.dur=s.dur;invDirty=true;sfx.place();}
function unequip(slot){const s=P[slot];if(!s)return;const i=P.items.indexOf(null);if(i<0){say("Je n'ai plus de place.");return;}P.items[i]=s;P[slot]=null;invDirty=true;}
function canCraft(r){if(['torch','campfire','firepit'].includes(r.id)&&!eraState.captured)return false;for(const k in r.need)if(count(k)<r.need[k])return false;return true;}
function craft(r){
  if(!canCraft(r)||P.dead)return;for(const k in r.need)removeItem(k,r.need[k]);
  const d=ITEMS[r.id];P.stats.crafted[r.id]=1;sfx.craft();
  if(d.eq&&!P[d.eq]){P[d.eq]={id:r.id,n:1,dur:d.dur};invDirty=true;}else addItem(r.id,1);
  burst('spark',P.x,P.y-60,30,10,{g:-40,ml:.7,vz:rnd(20,80)});
  if(CRAFT_LINES[r.id]&&!P.stats['said_'+r.id]){P.stats['said_'+r.id]=1;say(CRAFT_LINES[r.id]);}
  if(!P.anim)startAnim('build',.4,.5,null);
  if(d.place){const i=P.items.findIndex(s=>s&&s.id===r.id);if(i>=0)placing={id:r.id};}
  renderRecipes();
}
function placeValid(x,y,id){if(!isLand(x,y)||caveWallAt(x,y,20)||waterBlockedAt(x,y,20))return false;const t=ITEMS[id].place;return free(x,y,t,t==='trap'?4:16);}
function doPlace(x,y,id){
  const i=P.items.findIndex(s=>s&&s.id===id);if(i<0){placing=null;return;}
  const s=P.items[i];s.n--;if(!s.n)P.items[i]=null;invDirty=true;
  const t=ITEMS[id].place;
  if(t==='campfire'){mk('campfire',x,y,{fuel:60,max:90});P.stats.placedFire=1;sfx.ignite();say('Ahh, de la chaleur.');}
  else if(t==='firepit'){mk('firepit',x,y,{fuel:70,max:120});P.stats.placedFire=1;sfx.ignite();}
  else if(t==='trap'){mk('trap',x,y,{caught:false});P.stats.placedTrap=1;}
  burst('dust',x,y,4,10,{g:0,vz:0,ml:.8,s:8});sfx.place();
  if(!P.items.some(s=>s&&s.id===id))placing=null;
}

/* ---------------- update ---------------- */
function update(dt){
  const eraPreviousTime=gameTime;realTime+=dt;chunkFrame++;
  for(let i=timers.length-1;i>=0;i--)if(realTime>=timers[i].at){const t=timers[i];timers.splice(i,1);t.fn();}
  if(eraState.won&&mode==='play'){if(victoryPending)settleEraVictory(dt);return;}
  if(mode==='title'){gameTime+=dt*.6;if(dayFrac()>.72)gameTime-=DAY_LEN*.2;cam.x=Math.sin(realTime*.05)*160+60;cam.y=Math.cos(realTime*.04)*90-20;updWorld(dt);return;}
  if(mode!=='play'&&mode!=='dead')return;
  gameTime+=dt;
  const d=dayNum();
  if(d!==lastDay){lastDay=d;P.stats.days=d;dayBanner={text:'Jour '+d,t:0};sfx.fanfare();weatherRoll();if(d===2)setTimeout(()=>say('Je… je suis encore en vie.'),1500);}
  updPlayer(dt);updWorld(dt);updStats(dt);eraUpdate(dt,eraPreviousTime);
  const tx=P.x+(P.vx||0)*.18,ty=P.y-30+(P.vy||0)*.12;const k=1-Math.exp(-dt*5);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  cam.shake=Math.max(0,cam.shake-dt*30);hurtFlash=Math.max(0,hurtFlash-dt*1.6);clawT=Math.max(0,clawT-dt*.8);
  if(dayBanner){dayBanner.t+=dt;if(dayBanner.t>4)dayBanner=null;}
}
function updWorld(dt){
  // fires
  for(let i=fires.length-1;i>=0;i--){const f=fires[i];if(f.fuel>0){f.fuel-=dt*(1+(shelterAt(f)?0:weather.rain)*1.2);
      if(Math.random()<dt*14*fireFrac(f))part({k:'ember',x:f.x+rnd(-8,8),y:f.y-(f.sourceFire?30:2),z:rnd(10,30),vx:rnd(-10,10)+wind()*14,vy:rnd(-4,4),vz:rnd(40,110),g:-10,ml:rnd(.8,1.8),s:rnd(1,2)});
      if(Math.random()<dt*3*fireFrac(f))part({k:'smoke',x:f.x+rnd(-6,6),y:f.y-(f.sourceFire?40:4),z:rnd(50,70),vx:rnd(-5,5),vy:0,vz:rnd(30,50),ml:rnd(2,3.5),s:rnd(6,10)});
      if(f.fuel<=0){f.fuel=0;if(f.type==='campfire'){kill(f);mk('ash',f.x,f.y);burst('smoke',f.x,f.y,30,5,{g:0,vz:30,ml:2.5,s:8});if(Math.hypot(f.x-P.x,f.y-P.y)<500)say('Le feu s\'est éteint…');}}}}
  for(let i=regrow.length-1;i>=0;i--)if(gameTime>=regrow[i].at){const e=regrow[i].e;if(!e.dead){e.picked=false;setSpr(e);}regrow.splice(i,1);}
  for(let i=bouncing.length-1;i>=0;i--){const e=bouncing[i];e.bt+=dt/.45;if(e.bt>=1){e.bt=1;bouncing.splice(i,1);}}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt/1.05;if(f.t>=1)fx.splice(i,1);}
  for(const e of statics)if(e.shake>0)e.shake=Math.max(0,e.shake-dt*3);
  updMobs(dt);updParticles(dt);updWeather(dt);ambientSpawns(dt);updAudio(dt);
  // lights
  lights=[];
  if(eraState.captured&&eraState.ember>0)lights.push({x:P.x,y:P.y-60,r:170,warm:.8});
  for(const f of fires)if(f.fuel>0){const fr=fireFrac(f);const fl=1+Math.sin(realTime*11+f.x)*.035+Math.sin(realTime*23.7)*.025+(vnoise(realTime*4,f.x,3)-.5)*.08;lights.push({x:f.x,y:f.y-(f.sourceFire?45:14),r:(f.sourceFire?270:150+330*Math.sqrt(fr))*fl,warm:1});}
  if(mode!=='title'&&P.hand&&P.hand.id==='torch'&&!P.dead){const fl=1+Math.sin(realTime*13)*.04+(vnoise(realTime*5,1,9)-.5)*.08;const tp=P.torchTip||{x:P.x,y:P.y-70};lights.push({x:tp.x,y:tp.y,r:300*fl,warm:.8});}
  if(flash>0)flash=Math.max(0,flash-dt*2.5);
}
function fireFrac(f){return clamp(f.fuel/f.max,0,1);}
function updPlayer(dt){
  const p=P;p.inv=Math.max(0,p.inv-dt);p.blink-=dt;if(p.blink<-.12)p.blink=rnd(2,5);
  if(p.speech){p.speech.t-=dt;if(p.speech.t<=0)p.speech=null;}
  if(p.dead){p.deadT+=dt;return;}
  if(p.kx){p.x+=p.kx*dt;p.y+=p.ky*dt;p.kx*=.82;p.ky*=.82;if(Math.abs(p.kx)<2)p.kx=p.ky=0;}
  let ix=0,iy=0;if(keys.KeyA||keys.ArrowLeft)ix--;if(keys.KeyD||keys.ArrowRight)ix++;if(keys.KeyW||keys.ArrowUp)iy--;if(keys.KeyS||keys.ArrowDown)iy++;
  if(ix||iy){p.target=null;p.moveTo=null;if(p.anim&&!p.anim.fired)p.anim=null;}
  let mx=0,my=0;
  if(p.anim){advancePlayerAnimation(dt);}
  else if(ix||iy){mx=ix;my=iy;}
  else if(p.target){const t=p.target,e=t.e;
    if(t.place){const d=Math.hypot(t.x-p.x,t.y-p.y);if(d>60){mx=t.x-p.x;my=t.y-p.y;}else{faceTo(t.x,t.y);if(placeValid(t.x,t.y,t.id))startAnim('build',.4,.6,()=>doPlace(t.x,t.y,t.id));p.target=null;}}
    else if(e.dead||(e.kind&&(e.dying!=null||e.hidden))||!getAction(e)){p.target=null;}
    else{const d=Math.hypot(e.x-p.x,e.y-p.y),r=reachOf(e);if(d>r){mx=e.x-p.x;my=e.y-p.y;}else{faceTo(e.x,e.y);perform(e,t.act);}}}
  else if(p.moveTo){const d=Math.hypot(p.moveTo.x-p.x,p.moveTo.y-p.y);if(d>8){mx=p.moveTo.x-p.x;my=p.moveTo.y-p.y;}else p.moveTo=null;}
  const l=Math.hypot(mx,my);p.moving=l>0;
  if(l>0){const sp=230*(p.san<p.maxSan*.15?.92:1);const vx=mx/l*sp,vy=my/l*sp;p.vx=vx;p.vy=vy;const nx=p.x+vx*dt,ny=p.y+vy*dt;
    if(isLand(nx,ny)){p.x=nx;p.y=ny;}else if(isLand(nx,p.y))p.x=nx;else if(isLand(p.x,ny))p.y=ny;
    pushOut(p,13);
    if(Math.abs(mx)>Math.abs(my)*.8){p.face='side';p.flip=mx<0;}else p.face=my<0?'up':'down';
    p.walkT+=dt*11;p.stepT-=dt;if(p.stepT<=0){p.stepT=.3;sfx.step(biomeAt(p.x,p.y));if(Math.random()<.5)part({k:'dust',x:p.x+rnd(-5,5),y:p.y,z:0,ml:.6,s:4});}
  }else{p.vx=p.vy=0;}
}
function advancePlayerAnimation(dt){const p=P;if(!p.anim)return;p.anim.t+=dt/p.anim.dur;if(!p.anim.fired&&p.anim.t>=p.anim.hitAt){p.anim.fired=true;if(p.anim.cb)p.anim.cb();}if(p.anim&&p.anim.t>=1)p.anim=null;}
function faceTo(x,y){const dx=x-P.x,dy=y-P.y;if(Math.abs(dx)>Math.abs(dy)*.8){P.face='side';P.flip=dx<0;}else P.face=dy<0?'up':'down';}
function updStats(dt){
  const p=P;if(p.dead)return;
  const h0=p.hunger,s0=p.san,hp0=p.hp;
  p.hunger=Math.max(0,p.hunger-dt*.25);if(p.hunger<=0)p.hp-=dt*1.2;
  const ph=phase(),lit=lightAt(p.x,p.y);
  let ds=0;if(ph==='dusk')ds-=.12;if(ph==='night')ds-=lit<.2?.6:.25;if(ph==='day')ds+=.04;
  ds-=(shelterAt(p)?0:weather.rain)*.12;for(const m of mobs)if((m.kind==='hyena'&&['stalk','attack'].includes(m.state))||(m.kind==='spider'&&!m.hidden&&m.state==='chase')||m.kind==='shadow'){if(Math.hypot(m.x-p.x,m.y-p.y)<350){ds-=.35;break;}}
  if(nearFire(260))ds+=.12;
  p.san=clamp(p.san+ds*dt,0,p.maxSan);
  if(p.hand&&ITEMS[p.hand.id].timed){p.hand.dur-=dt;if(Math.random()<dt*10&&p.torchTip)part({k:'ember',x:p.torchTip.x+rnd(-3,3),y:p.y,z:p.y-p.torchTip.y+14,vx:rnd(-8,8),vz:rnd(30,70),g:-10,ml:rnd(.5,1),s:1.2});if(p.hand.dur<=0){p.hand=null;say('Ma torche s\'est éteinte.');}if(Math.floor(p.hand?p.hand.dur:0)!==Math.floor((p.hand?p.hand.dur:0)+dt))invDirty=true;}
  // the dark
  if(lit<.13&&!shelterAt(p)){p.darkT+=dt;if(p.darkT>1.2&&!p.warned){p.warned=true;say('Il y a quelque chose dans le noir !');sfx.whisper();}
    if(p.darkT>4.2){p.darkT=1.4;clawT=1;hurtFlash=1;sfx.claw();shake(14);p.hp-=32;p.san=Math.max(0,p.san-10);if(p.hp<=0)die('les Murmures, dans le noir');}}
  else{p.darkT=Math.max(0,p.darkT-dt*2);if(p.darkT<=0)p.warned=false;}
  if(p.hp<=0&&!p.dead)die('la faim');
  // shadow creatures when sanity is low
  const sf=p.san/p.maxSan;const nSh=mobs.filter(m=>m.kind==='shadow'&&!m.fade).length;
  if(sf<.35&&nSh<(sf<.16?3:2)&&Math.random()<dt*.25){mobs.push(newShadow());if(!p.stats.saidShadow){p.stats.saidShadow=1;say('Les ombres… elles bougent.');}}
  if(p.hunger<25&&Math.random()<dt*.03)say('Mon ventre gargouille.');
  const k=1/dt;p.hungerRate=(p.hunger-h0)*k;p.sanRate=(p.san-s0)*k;p.hpRate=(p.hp-hp0)*k;
}
function weatherRoll(){if(Math.random()<.45){weather.next=gameTime+rnd(20,DAY_LEN*.6);weather.len=rnd(60,120);}else weather.next=0;}
function updWeather(dt){
  if(weather.next&&gameTime>=weather.next){weather.target=1;weather.until=gameTime+weather.len;weather.next=0;if(mode==='play')setTimeout(()=>say('Voilà la pluie…'),800);}
  if(weather.target&&gameTime>weather.until)weather.target=0;
  weather.rain+=(weather.target-weather.rain)*Math.min(1,dt*.25);
  if(weather.rain>.5&&Math.random()<dt/22){flash=1;setTimeout(()=>sfx.thunder(),rnd(300,1400));}
  if(weather.rain>.05){const n=weather.rain*dt*90;for(let i=0;i<n;i++){const x=cam.x+rnd(-W,W)/Z*.6,y=cam.y+rnd(-H,H)/Z*.6;if(isLand(x,y)&&!shelterAt({x,y}))part({k:'splash',x,y,ml:.35,life:1});}}
}
function ambientSpawns(dt){

function saveGame(manual=false){
  if(mode!=='play'||P.dead)return false;
  // Pending animation callbacks carry harvest/craft results: preserve the last
  // valid snapshot until they have completed rather than losing those results.
  if(P.anim||timers.some(t=>t.at<realTime+60)){if(manual)saveStatus('Action en cours : termine-la puis sauvegarde.');return false;}
  try{
    const index=new Map(statics.map((e,i)=>[e,i]));
    const clean=e=>Object.fromEntries(Object.entries(e).filter(([k,v])=>k!=='spr'&&typeof v!=='function'));
    const p={...P,anim:null,target:null,moveTo:null,speech:null,moving:false,torchTip:null};
    const s={v:1,faunaVersion:1,saved:Date.now(),seed,era:{...eraState},time:gameTime,real:realTime,zoom:userZoom,p,
      world:statics.map(clean),mobs:mobs.filter(m=>!m.home||index.has(m.home)).map(m=>{const {home,...data}=m;return {...data,homeIndex:home?index.get(home):null};}),
      regrow:regrow.filter(r=>index.has(r.e)).map(r=>({index:index.get(r.e),at:r.at})),weather:{...weather}};
    localStorage.setItem(SAVE_KEY,JSON.stringify(s));saveElapsed=0;
    saveStatus('Sauvegardé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
    if(manual)say('Notre histoire est gardée.');return true;

}

  caves=[];waterholes=[];regrow=[];bouncing=[];fx=[];timers=[];particles.length=0;chunkCache.clear();lights=[];
  for(const e of statics){if(e.type==='cave')caves.push(e);if(e.type==='waterhole')waterholes.push(e);setSpr(e);if(!e.dead)gAdd(e);if(['campfire','firepit'].includes(e.type)||e.sourceFire)fires.push(e);if(e.type==='trap')traps.push(e);if(e.type==='den')dens.push(e);if(e.type==='hole')holes.push(e);if(e.type==='item'&&e.bt<1)bouncing.push(e);}

  regrow=(s.regrow||[]).filter(r=>statics[r.index]&&Number.isFinite(r.at)).map(r=>({e:statics[r.index],at:r.at}));
  resetPlayer();Object.assign(P,s.p,{anim:null,target:null,moveTo:null,speech:null,moving:false,torchTip:null});

  gameTime=s.time;realTime=s.real||0;lastDay=dayNum();duskSaid=-1;userZoom=s.zoom||1;
  Object.assign(weather,s.weather);cam.x=P.x;cam.y=P.y-30;cam.shake=0;mode='play';paused=false;placing=null;openTab=null;
  for(const k in keys)keys[k]=false;

function resetPlayer(){Object.assign(P,{x:0,y:0,hp:150,hunger:150,san:200,face:'down',flip:false,moving:false,anim:null,target:null,moveTo:null,inv:0,hand:null,body:null,dead:false,deadT:0,speech:null,darkT:0,warned:false,kx:0,ky:0,vx:0,vy:0,stats:{crafted:{},logs:0,days:1,kills:0},items:new Array(INV_N).fill(null)});}
function newGame(){
  const ending=document.getElementById('eraEnding');if(ending)ending.hidden=true;
  genWorld();resetPlayer();resetEra();saveElapsed=0;
  gameTime=DAY_LEN*.03;lastDay=1;weather.rain=0;weather.target=0;weather.next=gameTime+DAY_LEN*.35;weather.len=50;
  cam.x=0;cam.y=-30;mode='play';paused=false;placing=null;openTab=null;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)chunk(i,j,true);
  hideHud(false);invDirty=true;renderRecipes();
  dayBanner={text:'Jour 1',t:0};
  setTimeout(()=>say('La foudre a laissé du feu. Il faut le capturer avant la nuit.',4.5),900);
  setTimeout(()=>{if(!P.stats.gotTwig)say('Des brindilles et un silex… de quoi faire une hache.',4.5);},7000);
  timers.push({at:realTime+1e9,fn:()=>{}});
  saveGame();
}
let duskSaid=-1;
function narrative(){if(mode!=='play'||P.dead)return;const t=dayFrac(),d=dayNum();if(t>DUSK+.02&&duskSaid!==d){duskSaid=d;say(fires.some(f=>f.fuel>0&&Math.hypot(f.x-P.x,f.y-P.y)<900)?'La nuit tombe. Je reste près du feu.':'La nuit tombe. Il me faut de la lumière, vite.',4);}}

function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(hitStop>0){hitStop-=dt;dt*=.15;}
  if(!paused||eraState.won&&victoryPending){update(dt);if(!eraState.won)narrative();}
  if(mouse.inside&&mode==='play'&&!paused){mouseWorld();hoverEnt=placing?null:entAt(mouse.wx,mouse.wy);
    if(placing){hoverEl.hidden=false;hoverEl.innerHTML=`<i>Placer</i> ${ITEMS[placing.id].n}`;hoverEl.style.left=mouse.x+'px';hoverEl.style.top=mouse.y+'px';}
    else if(hoverEnt){const a=getAction(hoverEnt);hoverEl.hidden=false;let verb=a.verb;if(a.need&&toolOf()!==a.need)verb='Examiner';hoverEl.innerHTML=`<i>${verb}</i> ${a.name}`;hoverEl.style.left=mouse.x+'px';hoverEl.style.top=mouse.y+'px';}
    else hoverEl.hidden=true;}
  else{hoverEnt=null;hoverEl.hidden=true;}
  cv.style.cursor=hoverEnt||placing?'pointer':'default';
  if(invDirty&&mode==='play'){invDirty=false;renderInv();}
  else if(mode==='play'&&(Math.floor(realTime*2)!==Math.floor((realTime-dt)*2)))renderInv();
  if(mode==='play'&&!paused&&!P.dead){saveElapsed+=dt;if(saveElapsed>=30)saveGame();}
  render();
  requestAnimationFrame(frame);
}

  const used=new Set((E.layout||[]).map(l=>l[0]));for(const t in LMT)if(used.has(t))S['lm_'+t]=[0,1,2,3,4,5].map(v=>makeSprite(LMT[t].w,LMT[t].h,LMT[t].w/2,LMT[t].h-14,g=>{g.translate(LMT[t].w/2,LMT[t].h-14);LMT[t].draw(g,v);}));
 }
 chunkCache.clear();
}

/* ---------- engine hooks ---------- */
const _setSpr=setSpr;
setSpr=function(e){if(LMT[e.type]){e.spr=(S['lm_'+e.type]||[])[e.v||0]||null;return;}_setSpr(e);};

const _pushCaveWalls=pushCaveWalls;
pushCaveWalls=function(m,r){_pushCaveWalls(m,r);
 for(const e of statics){if(e.dead||!LMT[e.type]||Math.abs(e.x-m.x)>520||Math.abs(e.y-m.y)>120)continue;if(!inFoot(e,m.x,m.y,r))continue;
  const f=LMT[e.type].foot,x0=e.x+f[0]-r,x1=e.x+f[2]+r,y0=e.y+f[1]-r,y1=e.y+f[3]+r,d=[m.x-x0,x1-m.x,m.y-y0,y1-m.y],k=d.indexOf(Math.min(...d));
  if(k===0)m.x=x0;else if(k===1)m.x=x1;else if(k===2)m.y=y0;else m.y=y1;}
};
const _placeValid=placeValid;
placeValid=function(x,y,id){return _placeValid(x,y,id)&&!lmList().some(e=>inFoot(e,x,y,24));};

const _genWorld=genWorld;
genWorld=function(){
 _genWorld();
 const E=era();if(!E.layout||!ART())return;
 if(E.thin){const r=mulberry(seed+77);for(const e of statics.slice())if(!e.dead&&E.thin[e.type]&&r()<E.thin[e.type])kill(e);}
 const natural=['pine','oak','dead','boulder','sapling','tuft','berry','carrot','flower','mushroom','reeds','hole','den','item'];
 for(const [type,[wx,wy],v] of E.layout){const L=LMT[type],f=L.foot;let spot=null;
  for(let t=0;t<48&&!spot;t++){const a=t*2.4,rr=t*30,x=wx+Math.cos(a)*rr,y=wy+Math.sin(a)*rr;
   if(!isLand(x+f[0],y)||!isLand(x+f[2],y)||!isLand(x,y-L.h*.5)||!isLand(x,y+60)||Math.hypot(x,y)<260)continue;
   const busy=statics.some(e=>!e.dead&&(LMT[e.type]?Math.abs(e.x-x)<(LMT[e.type].w+L.w)/2+40&&Math.abs(e.y-y)<(LMT[e.type].h+L.h)/2:(['cave','waterhole','campfire','firepit','carcass'].includes(e.type)||e.sourceFire)&&Math.abs(e.x-x)<L.w/2+180&&e.y>y-L.h-120&&e.y<y+220));
   if(!busy)spot={x,y};}
  if(!spot)continue;
  for(const e of statics.slice())if(!e.dead&&natural.includes(e.type)&&e.x>spot.x+f[0]-70&&e.x<spot.x+f[2]+70&&e.y>spot.y-L.h*.7&&e.y<spot.y+Math.max(120,L.h))kill(e);
  mk(type,spot.x,spot.y,{v:v||0});}
 for(const d of dens)if(!d.dead&&lmList().some(e=>inFoot(e,d.x,d.y,60)))kill(d);
};

const _genChunk=genChunk;
genChunk=function(cx,cy){
 const cv=_genChunk(cx,cy),A=ART();if(!A||!A.ground)return cv;
 const g=cv.getContext('2d'),x0=cx*CH,y0=cy*CH;
 const land=(px,py)=>{const x=x0+px,y=y0+py;return coastVal(x,y)<.95?biomeAt(x,y):0;};
 g.save();A.ground(g,{x0,y0,CH,land,fbm,seed,rng:mulberry(chunkSeed(cx,cy)+911)});g.restore();return cv;
};

/* the era's own source of fire */
const _drawEnt=drawEnt;
drawEnt=function(e){
 const A=ART();if(!e.sourceFire||!A){_drawEnt(e);return;}
 const lit=e.fuel>0;ctx.save();ctx.translate(e.x,e.y);if(hoverEnt===e){ctx.shadowColor='#f4bb63';ctx.shadowBlur=8;}
 A.places.source(ctx,lit);ctx.restore();if(lit)drawFlames(e.x,e.y-10,.46,e.x);
};
/* the era's own animals, in the same roles (grazing herd, night pack, last-night predator) */
const _drawSavannaMob=drawSavannaMob;
drawSavannaMob=function(m,dy){
 const A=ART();if(!A){_drawSavannaMob(m,dy);return;}
 ctx.save();ctx.translate(m.x,m.y);ctx.scale(m.face||1,1);
 if(dy){ctx.rotate(dy*1.8);ctx.scale(1,1-dy*.65);}
 const opts={moving:m.moving,speed:m.speed||0,state:m.state,attack:m.atk||0,time:realTime};
 if(m.kind==='machairodont'){ctx.scale(1.45,1.45);A.mobs.machairodont(ctx,m.walk||0,opts);}else if(m.kind==='antelope')A.mobs.antelope(ctx,m.walk||0,opts);else A.mobs.hyena(ctx,m.walk||0,m.state==='stalk'||m.atk>0,opts);
 ctx.restore();
};

const _getAction0=getAction;
getAction=function(e){const a=_getAction0(e);if(!a||!e)return a;const E=era();
 if(e.sourceFire)a.name=E.sourceName;
 else if(e.kind&&E.mobs&&E.mobs[e.kind])a.name=E.mobs[e.kind];
 return a;};

const _say=say;
say=function(text,dur){
 if(eraIdx&&typeof text==='string'){const E=era();
  if(text===ERAS[0].intro)text=E.intro;
  const h=E.beasts;if(h)text=text.replace(/([Hh])yènes/g,(m,c)=>(c==='H'?h[1][0].toUpperCase():h[1][0])+h[1].slice(1)).replace(/([Hh])yène/g,(m,c)=>(c==='H'?h[0][0].toUpperCase():h[0][0])+h[0].slice(1));
  text=text.replace(/\bKa\b/g,E.heir);}
 _say(text,dur);};
const _updWorld=updWorld;
updWorld=function(dt){_updWorld(dt);if(!ART()||phase()==='day')return;
 for(const e of statics){const L=LMT[e.type];if(e.dead||!L||!L.light||Math.abs(e.x-cam.x)>1500||Math.abs(e.y-cam.y)>1100)continue;lights.push({x:e.x,y:e.y+L.light[0],r:L.light[1]*(1+Math.sin(realTime*9+e.x)*.03),warm:.7});}};
const _hurtPlayer=hurtPlayer;
hurtPlayer=function(d,src,cause){if(deus)return;_hurtPlayer(d,src,cause);};

const _eraUpdate=eraUpdate;
eraUpdate=function(dt,prev){
 if(deus&&mode==='play'&&!P.dead){P.hp=P.maxHp;P.hunger=P.maxHunger;P.san=P.maxSan;P.darkT=0;if(eraState.captured)eraState.ember=180;}
 _eraUpdate(dt,prev);
 const badge=document.getElementById('emberStatus');
 if(badge&&!eraState.won)badge.textContent=(deus?'✦ Deus · ':'')+'Ère '+era().n+' · '+(shelterAt(P)?'À l’abri · ':'')+(eraState.captured?'Braise : '+Math.ceil(eraState.ember)+' s · Nuits '+eraState.nights+'/3':'Capturer le feu : '+era().source);
};

function setEraGoals(){const E=era();
 goals.splice(0,goals.length,
  {t:'Trouver deux os sur une carcasse',ok:()=>count('bone')>=2||P.stats.crafted.emberHorn},
  {t:'Fabriquer la corne à braise',ok:()=>P.stats.crafted.emberHorn},
  {t:'Capturer le feu : '+E.source,ok:()=>P.stats.captured},

  {t:'Garder la Braise pendant trois nuits',ok:()=>eraState.nights>=3});
 renderGoals();
}

function deusKit(){for(const [id,n] of [['spear',1],['torch',1],['axe',1],['pickaxe',1],['emberHorn',1],['log',20],['grass',20],['twigs',20],['flint',10],['rocks',20],['bone',6],['cmorsel',10]])if(ITEMS[id]&&!count(id))addItem(id,n,P.x,P.y);invDirty=true;}

const _newGame=newGame;
newGame=function(){
 _newGame();setEraGoals();lsSet(ERA_KEY,String(eraIdx));lsSet(DEUS_KEY,deus?'1':'0');
 dayBanner={text:'Ère '+era().n+' · '+era().name,t:0};
 if(deus){deusKit();showDeusButton(true);setTimeout(()=>say('Mode Deus : je traverse les âges. Touche ✦ pour te téléporter.',5),6500);}
 else showDeusButton(false);
 saveGame();
};

function startEra(i){
 if(!ready(i))return;
 flash=1;sfx.ignite();
 applyEraVisuals(i);
 const t=document.getElementById('title');if(t)t.hidden=true;
 const end=document.getElementById('eraEnding');if(end)end.hidden=true;
 audioInit();if(AU.c&&AU.c.state==='suspended')AU.c.resume();
 newGame();
}

const _loadGame=loadGame;

 const i=+lsGet(ERA_KEY)||0;if(i!==eraIdx)applyEraVisuals(i);
 deus=lsGet(DEUS_KEY)==='1';

 if(ok){setEraGoals();showDeusButton(deus);}

showEraEnding=function(){
 const E=era(),nextI=eraIdx+1,next=ERAS[nextI],open=next&&ready(nextI);if(next)unlock(nextI+1);
 let el=document.getElementById('eraEnding');

  +(open?'<button class="big" id="eraNext">Transmettre la Braise · Ère '+next.n+'</button>':'')+'<button class="big" id="eraRestart">'+(open?'Rejouer cette ère':'Rejouer cette ère')+'</button>';
 const nb=document.getElementById('eraNext');if(nb)nb.onclick=()=>{el.hidden=true;startEra(nextI);};
 document.getElementById('eraRestart').onclick=()=>{el.hidden=true;startEra(eraIdx);};

/* ---------- Mode Deus: the teleportation power ---------- */
const deusCss=document.createElement('style');deusCss.textContent=`
#deusBtn{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:30;width:48px;height:48px;border-radius:50%;border:2px solid rgba(250,226,150,.85);background:radial-gradient(circle at 40% 35%,rgba(255,214,120,.95),rgba(150,70,20,.95));color:#2a1406;font:700 26px/1 Georgia,serif;box-shadow:0 0 18px rgba(255,190,90,.7);touch-action:manipulation;-webkit-tap-highlight-color:transparent}

#deusPanel{position:absolute;inset:0;z-index:35;background:rgba(10,8,14,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box;color:#f4e2bc;font-family:Georgia,serif;overflow:auto}

#deusPanel button.on{background:rgba(190,110,40,.95);color:#1d0f05}

document.head.appendChild(deusCss);
let deusBtn=null,deusPanel=null;
function showDeusButton(on){
 if(!deusBtn){deusBtn=document.createElement('button');deusBtn.id='deusBtn';deusBtn.type='button';deusBtn.textContent='✦';deusBtn.title='Pouvoir de téléportation';deusBtn.setAttribute('aria-label','Pouvoir de téléportation');
  deusBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();openDeusPanel();});gameEl.appendChild(deusBtn);}
 deusBtn.hidden=!on;
}
function placesOfEra(){
 const out=[['Le campement',0,-30]];
 const src=statics.find(e=>e.sourceFire&&!e.dead);if(src)out.push([era().sourceName,src.x+90,src.y+40]);
 const cv=caves.find(c=>!c.dead);if(cv)out.push([DEF.cave.name,cv.x,cv.y+80]);
 const wh=waterholes.find(w=>!w.dead);if(wh)out.push([DEF.waterhole.name,wh.x,wh.y+110]);
 const seen={};for(const e of lmList()){if(['tent','gasLamp','morris'].includes(e.type))continue;seen[e.type]=(seen[e.type]||0)+1;if(seen[e.type]>2)continue;out.push([DEF[e.type].name+(seen[e.type]>1?' ('+seen[e.type]+')':''),e.x,e.y+LMT[e.type].foot[3]+70,LMT[e.type].h>200]);}
 const den=dens.find(d=>!d.dead&&d.hyenaHome);if(den)out.push([DEF.den.name,den.x+160,den.y+60]);
 return out;
}
function teleport(x,y){
 burst('spark',P.x,P.y,40,26,{});flash=1;sfx.ignite();
 P.x=x;P.y=y;P.target=null;P.moveTo=null;P.moving=false;P.vx=P.vy=0;cam.x=x;cam.y=y-30;
 for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)chunk(Math.floor(x/CH)+i,Math.floor(y/CH)+j,true);
 burst('spark',x,y,40,26,{});
}
function openDeusPanel(){
 if(!deusPanel){deusPanel=document.createElement('div');deusPanel.id='deusPanel';gameEl.appendChild(deusPanel);}
 if(!paused&&mode==='play')togglePause();const pz=document.getElementById('pause');if(pz)pz.hidden=true;
 const places=placesOfEra();
 deusPanel.innerHTML='<h2>✦ Pouvoir de téléportation</h2><small>Voyager entre les ères</small><div class="row" id="dpEras">'+ERAS.map((E,i)=>'<button data-era="'+i+'" class="'+(i===eraIdx?'on':'')+'"'+(ready(i)?'':' disabled')+'>'+E.n+' · '+E.name+(ready(i)?'':' · bientôt')+'</button>').join('')+'</div>'
  +'<small id="deusTitle">Se téléporter · Ère '+era().n+' · '+era().place+'</small><div class="row" id="dpPlaces">'+places.map((p,i)=>'<button data-p="'+i+'">'+p[0]+'</button>').join('')+'</div><div class="row"><button id="dpClose">Fermer</button></div>';
 deusPanel.hidden=false;
 const close=()=>{deusPanel.hidden=true;if(paused)togglePause();const pz=document.getElementById('pause');if(pz)pz.hidden=true;};
 deusPanel.querySelector('#dpClose').onclick=close;
 deusPanel.querySelectorAll('[data-era]').forEach(b=>b.onclick=()=>{if(b.disabled)return;deusPanel.hidden=true;paused=false;const pz=document.getElementById('pause');if(pz)pz.hidden=true;startEra(+b.dataset.era);});
 deusPanel.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=places[+b.dataset.p];close();userZoom=p[3]?.7:1;teleport(p[1],p[2]);});
}

/* ---------- title: hidden Deus switch (5 quick taps on the logo) and the unlocked eras ---------- */
function decorateTitle(){
 const T=document.getElementById('title');if(!T||T.dataset.eras)return;T.dataset.eras='1';
 let n=0,t=0;
 T.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('#title h1');if(!h)return;const now=Date.now();n=now-t<1500?n+1:1;t=now;if(n>=5){n=0;revealDeus();}},true);
 const open=ERAS.map((E,i)=>i).filter(i=>i<unlocked()&&ready(i));
 if(open.length>1){const row=document.createElement('div');row.className='eraRow';row.style.cssText='display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:720px;margin-top:-6px';
  row.innerHTML=open.map(i=>'<button style="font:12px Georgia,serif;padding:4px 9px;border-radius:8px;border:1px solid rgba(240,214,160,.55);background:'+(i===eraIdx?'rgba(190,110,40,.9)':'rgba(40,24,14,.8)')+';color:#f6e6c4" data-start-era="'+i+'">'+ERAS[i].n+' · '+ERAS[i].name+'</button>').join('');
  row.querySelectorAll('[data-start-era]').forEach(b=>b.onclick=()=>{deus=false;startEra(+b.dataset.startEra);});
  T.appendChild(row);}
}
function revealDeus(){
 const T=document.getElementById('title');if(!T||document.getElementById('btnDeus'))return;
 const b=document.createElement('button');b.className='big';b.id='btnDeus';b.textContent='✦ Mode Deus · voyager entre les ères';b.style.cssText='background:linear-gradient(#f6c45e,#b8661e);color:#1d0f05';
 b.onclick=()=>{deus=true;unlock(ERAS.length);startEra(eraIdx);};
 const st=document.getElementById('btnStart');if(st)st.insertAdjacentElement('afterend',b);else T.appendChild(b);sfx.ignite();
}

 window.BRAISE_ERAS={era:()=>eraIdx,start:startEra,deus:on=>{deus=!!on;showDeusButton(deus);if(deus)deusKit();},places:placesOfEra,teleport};

setTimeout(boot,30);
})();
