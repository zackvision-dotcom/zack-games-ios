# XcodeGen spec: `xcodegen generate` (run by the CI on a Mac) creates Games.xcodeproj with one app per game.
name: Games
options:
  bundleIdPrefix: com.zvisionclub
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: NO
    # AdMob, ONE switch: 1 = Google's public TEST ad units (development, TestFlight, CI checks). 0 = the game's REAL
    # units (GADInterstitialUnit / GADRewardedUnit below, from games-kit/admob-ids.json) = the App Store release build.
    # The CI sets it per build: workflow input ads_test, or "Game ADS_TEST=0" in ios/build-queue.txt. Leave 1 here.
    # A Debug build always uses the test units (ios/Ads/NativeAds.swift). Never tap real ads yourself (account ban).
    ADS_TEST: "1"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    majorVersion: 13.13.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    majorVersion: 3.1.0

targets:
  KunaiGaiden:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Ads          # NativeAds.swift + InfoPlist.strings (ATT prompt, FR/EN)
      - path: KunaiGaiden/Assets.xcassets
      - path: KunaiGaiden/Web
        type: folder
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: KunaiGaiden/Info.plist
      properties:
        CFBundleDisplayName: Kunai Gaiden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationCategoryType: public.app-category.action-games
        GADApplicationIdentifier: ca-app-pub-3447270747554208~5725346142
        GADUseTestAds: $(ADS_TEST)
        GADInterstitialUnit: ca-app-pub-3447270747554208/3043342481
        GADRewardedUnit: ca-app-pub-3447270747554208/1173399606
        NSUserTrackingUsageDescription: Your permission lets us show more relevant ads. The game stays fully playable without it.
        SKAdNetworkItems: &skadnetworks   # Google's list for AdMob (developers.google.com/admob/ios/3p-skadnetworks)
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
