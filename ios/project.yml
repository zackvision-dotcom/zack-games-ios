        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationCategoryType: public.app-category.adventure-games
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zvisionclub.braise
        PRODUCT_NAME: Braise
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (XcodeGen's iOS app preset would otherwise add iPad: "1,2")

  GullStreet:
