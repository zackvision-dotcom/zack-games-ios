<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1F2A4A">
<title>Lantern Hold</title>
<style>
:root{--night:#1F2A4A;--orange:#FFB347;--yellow:#FFE66D;--moss:#6A9C5A;--wood:#8B5A3C;--violet:#5B3F8C;--cream:#FFF6DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--night);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
img.ui{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 16px;font-weight:900;border:3px solid var(--night);transition:transform .08s;display:block;width:100%;margin-top:9px;font-size:17px}
.b1{background:var(--orange);color:var(--night);box-shadow:0 4px 0 var(--night)}
.b2{background:var(--cream);box-shadow:0 4px 0 var(--night)}.b3{background:#fff;color:var(--violet);box-shadow:0 4px 0 var(--night)}
.bad{background:var(--yellow)}.bgreen{background:var(--moss);color:#fff;text-shadow:0 2px 0 rgba(31,42,74,.4)}
.b1:active,.b2:active,.b3:active,.rb:active,.card-b:active,.bon:active{transform:translateY(3px)}.b1:disabled,.b2:disabled{opacity:.45}
.big{font-size:21px;padding:14px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
i.ff,i.ac,i.br{display:inline-block;width:1.15em;height:1.15em;background:center/contain no-repeat;vertical-align:-.2em}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;pointer-events:none;align-items:center;gap:6px}
#hud.on{display:flex}#hud button{pointer-events:auto}
.rb{width:42px;height:42px;flex:none;border-radius:50%;background:var(--cream);border:3px solid var(--night);box-shadow:0 3px 0 rgba(0,0,0,.35);font-size:18px;font-weight:900;position:relative;display:grid;place-items:center}
.rb img.ui{width:32px;height:32px}
.rb.dot::after{content:'';position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--orange);border:2px solid var(--night)}
.chip{display:flex;align-items:center;gap:4px;background:var(--cream);border:3px solid var(--night);border-radius:999px;padding:3px 9px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:16px;white-space:nowrap}
#phase{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#phase b{color:var(--cream);font-size:14px;text-shadow:0 2px 0 var(--night);white-space:nowrap}
#hpbar{height:13px;background:var(--night);border:3px solid var(--cream);border-radius:8px;overflow:hidden}#hpbar i{display:block;height:100%;background:var(--yellow);transition:width .2s}
#hpbar.low i{background:var(--orange);animation:blink .5s infinite alternate}@keyframes blink{to{opacity:.4}}
/* tray: build cards by day, spells by night */
#tray{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;padding:6px 6px calc(env(safe-area-inset-bottom) + 8px);background:rgba(31,42,74,.92);border-top:3px solid var(--cream)}
#tray.on{display:block}
#cards{display:flex;gap:4px;justify-content:space-between}
.card-b{flex:1;min-width:0;background:var(--cream);border:3px solid var(--night);border-radius:12px;padding:2px 0 1px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.4);touch-action:none}
.card-b img{width:40px;height:38px;object-fit:contain;pointer-events:none}.card-b small{font-size:12px;font-weight:900;display:flex;align-items:center;gap:1px}
.card-b.off{opacity:.45}.card-b.hint{animation:hint .7s infinite alternate}@keyframes hint{to{transform:translateY(-6px);box-shadow:0 0 0 4px var(--yellow)}}
#trow{display:flex;gap:8px;align-items:center;margin-top:6px}
#tinfo{flex:1;color:var(--cream);font-weight:800;font-size:13px;line-height:1.2;min-height:34px;display:flex;align-items:center}
#gonight{width:auto;margin:0;padding:9px 16px;font-size:18px;background:var(--violet);color:var(--cream)}#gonight.hint{animation:hint .7s infinite alternate}
#spells{display:flex;gap:10px;justify-content:center}
.sp{position:relative;width:86px;height:78px;border-radius:18px;background:var(--cream);border:3px solid var(--night);box-shadow:0 4px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.sp img{width:46px;height:46px;object-fit:contain;pointer-events:none}.sp small{font-weight:900;font-size:12px;pointer-events:none}
.sp .cdv{position:absolute;left:0;right:0;bottom:0;background:rgba(31,42,74,.6);pointer-events:none}
.sp.arm{background:var(--yellow);box-shadow:0 0 0 4px var(--orange)}
/* selected building */
#sel{position:fixed;z-index:7;display:none;width:220px;background:var(--cream);border:3px solid var(--night);border-radius:16px;padding:8px 10px;box-shadow:5px 5px 0 rgba(0,0,0,.35);animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
#sel.on{display:block}#sel b{font-size:15px}#sel p{margin:2px 0 4px;font-size:12px;font-weight:700;line-height:1.25}
#sel .b1{margin-top:4px;padding:7px 10px;font-size:15px}
.hrow{display:flex;gap:4px;flex-wrap:wrap}.hb{flex:1 0 30%;background:#fff;border:3px solid var(--night);border-radius:10px;padding:2px;font-size:10px;font-weight:900;display:flex;flex-direction:column;align-items:center}
.hb img{width:38px;height:38px;object-fit:contain}.hb.lock{opacity:.4}
/* Gardienne Pomme */
#pomme{position:fixed;left:8px;right:8px;z-index:8;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(24px) scale(.92);transition:.25s;bottom:calc(env(safe-area-inset-bottom) + 150px)}
#pomme.on{opacity:1;transform:none}
#pomme .pf{width:80px;height:80px;flex:none;object-fit:contain;animation:pbob 1.6s ease-in-out infinite}@keyframes pbob{50%{transform:translateY(-4px) rotate(-2deg)}}
#pomme .pt{background:var(--cream);border:3px solid var(--night);border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:4px 4px 0 rgba(0,0,0,.35);max-width:290px;margin-bottom:22px}
#tskip{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 60px);z-index:9;display:none;min-width:96px;min-height:48px;padding:8px 16px;border-radius:999px;background:var(--cream);color:var(--night);border:3px solid var(--night);box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:17px}#tskip.on{display:block}#tskip:active{transform:translateY(3px)}
#thand{position:fixed;left:0;top:0;z-index:9;pointer-events:none;display:none;filter:drop-shadow(0 5px 4px rgba(0,0,0,.45))}#thand.on{display:block}#thand svg{display:block;transform-origin:24px 6px}#thand.tap svg{animation:thtap .9s ease-in-out infinite}@keyframes thtap{0%,100%{transform:translateY(16px) scale(1)}45%,60%{transform:translateY(0) scale(.9)}}#thand.down svg{animation-name:thtapd}@keyframes thtapd{0%,100%{transform:rotate(180deg) translateY(16px) scale(1)}45%,60%{transform:rotate(180deg) translateY(0) scale(.9)}}
#pomme.home{bottom:calc(env(safe-area-inset-bottom) + 96px)}
/* home (the village between runs) */
#home{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;background:var(--night) center/cover no-repeat}
#home.on{display:flex}
#hhead{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;flex-direction:column;gap:6px;background:rgba(31,42,74,.85);border-bottom:3px solid var(--cream)}
.mrow{display:flex;align-items:center;gap:8px}
#plv{background:var(--yellow);font-weight:900;border-radius:10px;padding:3px 9px;font-size:13px;white-space:nowrap;border:3px solid var(--night)}
#xpbar{flex:1;height:14px;background:var(--night);border:3px solid var(--cream);border-radius:8px;overflow:hidden}#xpbar i{display:block;height:100%;background:var(--moss);transition:width .4s}
#hmid{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 14px;gap:8px}
#hmid .logo{width:min(62vw,300px);margin-top:2px}
#hmid .lan{width:min(44vw,190px);height:min(44vw,190px);object-fit:contain;animation:pbob 2.2s ease-in-out infinite}
#hmid .b1{max-width:340px}
.hcard{display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--night);border-radius:16px;padding:7px 9px;width:100%;max-width:360px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hcard img{width:46px;height:46px;object-fit:contain}.hcard .tx{flex:1;min-width:0;font-weight:800;font-size:13px;line-height:1.25}.hcard .tx b{font-size:15px;display:block}
.hcard .buy{min-width:84px}
#hfoot{display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 10px);background:rgba(31,42,74,.9);border-top:3px solid var(--cream)}
#hfoot .rb{width:52px;height:52px;border-radius:16px}#hfoot .rb img.ui{width:40px;height:40px}
#hfoot small{display:block;text-align:center;font-weight:900;font-size:10.5px;margin-top:4px;color:var(--cream)}
/* overlays */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(20,24,48,.6);padding:14px}#modal.on{display:flex}
.card{background:var(--cream);border:4px solid var(--night);border-radius:22px;padding:14px;max-width:390px;width:100%;max-height:90vh;overflow:auto;box-shadow:7px 7px 0 rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
.card.wide{max-width:520px;text-align:left}@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:2px 0 8px;font-size:23px;text-align:center}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico img{width:120px;height:120px;object-fit:contain}.big-ico.s img{width:86px;height:86px}
.gain{font-size:28px;font-weight:900;color:var(--wood);margin:4px 0}.sub{font-size:13px;color:var(--wood);font-weight:800}
.tip{font-weight:800;font-size:15px;background:#fff;border:3px dashed var(--orange);border-radius:12px;padding:7px 9px;margin:6px 0}
.rec{min-height:22px;font-weight:800;font-size:14px;color:var(--wood);margin-top:4px}.newrec{display:inline-block;font-size:20px;color:var(--orange);-webkit-text-stroke:1px var(--night);animation:pbob .8s ease-in-out infinite}
.endxp{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;margin-top:4px}#endxp{flex:1;height:12px;background:var(--night);border:3px solid var(--night);border-radius:8px;overflow:hidden}#endxp i{display:block;height:100%;background:var(--moss);transition:width 1.2s cubic-bezier(.3,.9,.4,1)}
.almost{font-size:13px;font-weight:800;color:var(--violet);margin:4px 0 2px;line-height:1.35}
.b1.again{font-size:26px;padding:16px;margin-top:12px}
.stat{display:flex;justify-content:space-between;font-weight:800;padding:3px 4px;border-bottom:2px dashed rgba(31,42,74,.15)}
.bons{display:flex;flex-direction:column;gap:8px}
.bon{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--night);border-radius:16px;padding:8px 10px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.3,1.6,.5,1) backwards}
.bon img{width:48px;height:48px;object-fit:contain}.bon b{display:block;font-size:16px}.bon small{font-size:13px;font-weight:700}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:3px solid var(--night);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lg small{font-size:9px;font-weight:800}.lg b{font-size:11px}.lg i{width:20px;height:20px}.lg.got{opacity:.4}.lg.now{background:var(--orange)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:2px solid rgba(31,42,74,.15)}.sw input{width:24px;height:24px;accent-color:var(--orange)}.sw select{font:inherit;font-weight:800;border:3px solid var(--night);border-radius:10px;background:#fff;padding:3px 6px}
.ver{font-size:11px;opacity:.6;margin-top:8px;text-align:center}.legal{font-size:13px}
.it{display:flex;align-items:center;gap:9px;background:#fff;border:3px solid var(--night);border-radius:16px;padding:7px 9px;margin-bottom:8px;text-align:left}
.it .ico{width:50px;height:50px;flex:none;display:grid;place-items:center}.it .ico img{width:50px;height:50px;object-fit:contain}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;font-size:12px;line-height:1.25;opacity:.85}
.dots{display:flex;gap:3px;margin-top:3px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--night);background:#fff}.dots i.on{background:var(--yellow)}.dots i.ws{background:var(--orange);animation:blink .6s infinite alternate}
.buy{min-width:80px;background:var(--moss);color:#fff;border:3px solid var(--night);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--night);font-weight:900;font-size:15px;white-space:nowrap;text-shadow:0 1px 0 rgba(31,42,74,.4)}
.buy.ad{background:var(--yellow);color:var(--night);text-shadow:none}.buy.ac{background:var(--orange);color:var(--night);text-shadow:none}.buy.off{opacity:.45}.buy:active{transform:translateY(3px)}
.own{font-weight:900;color:var(--moss);min-width:70px;text-align:center}
.note{font-size:12px;text-align:center;margin:2px 0 10px;font-weight:700;opacity:.8}
.pbar{height:12px;background:#fff;border:2px solid var(--night);border-radius:7px;overflow:hidden;margin:5px 0}.pbar i{display:block;height:100%;background:var(--orange)}
.lans{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ln{background:#fff;border:3px solid var(--night);border-radius:12px;padding:3px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;min-height:104px}
.ln>img{width:62px;height:62px;object-fit:contain}.ln.lock .skin{opacity:.3;filter:grayscale(1)}.ln.on{background:var(--yellow)}.ln small{font-size:10px;line-height:1.1;text-align:center;font-weight:800}
h3{margin:10px 0 6px;font-size:16px;text-align:left}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(20,24,48,.6);padding:20px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--cream);border:3px solid var(--night);border-radius:14px;padding:7px 14px;font-weight:900;box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:pop .3s;transition:opacity .4s;max-width:90vw;text-align:center}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:30%;z-index:25;text-align:center;font-size:42px;font-weight:900;color:var(--yellow);-webkit-text-stroke:2.5px var(--night);text-shadow:4px 4px 0 var(--night);pointer-events:none;animation:ban 1.8s cubic-bezier(.2,1.4,.4,1) forwards}
.banner.o{color:var(--orange)}.banner.surge{font-size:50px;top:26%}.banner.mini{font-size:30px;top:20%;animation-duration:1.1s}
#hff{position:relative}#lanxp{position:absolute;left:10px;right:10px;bottom:-7px;height:6px;background:var(--night);border-radius:4px;overflow:hidden}#lanxp i{display:block;height:100%;width:0;background:var(--yellow);transition:width .3s}#lanxp.near i{background:var(--orange);animation:blink .45s infinite alternate}.banner.v{color:var(--cream)}@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:var(--night);display:flex;align-items:center;justify-content:center}.adbox{color:var(--cream);text-align:center}.adtag{opacity:.7;font-weight:800}.adart img{width:120px;margin:20px}.adcount{font-size:44px;font-weight:900}
/* title */
#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 30px) 24px calc(env(safe-area-inset-bottom) + 40px);background:var(--night) center/cover no-repeat}
#title.on{display:flex}#title .logo img{width:min(88vw,430px)}#title .tbg{width:min(76vw,44vh);border-radius:32px;border:4px solid var(--cream);box-shadow:6px 6px 0 rgba(0,0,0,.4);animation:pbob 2.4s ease-in-out infinite}
#title p{font-weight:900;margin:4px 0;font-size:17px;color:var(--cream);text-align:center}#title .b1{max-width:320px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div><div id="tray"></div><div id="sel"></div>
<div id="pomme"><img class="pf" alt=""><div class="pt"></div></div>
<div id="home"><div id="hhead"></div><div id="hmid"></div><div id="hfoot"></div></div>
<div id="modal"></div><div id="toasts"></div><div id="title"></div>
<script>window.LH_VERSION="1.0";window.LH_SPR={"acorn": "assets/acorn.png", "b_berry": "assets/b_berry.png", "b_burrow": "assets/b_burrow.png", "b_forge": "assets/b_forge.png", "b_mill": "assets/b_mill.png", "b_tower": "assets/b_tower.png", "b_trap": "assets/b_trap.png", "b_wall": "assets/b_wall.png", "banner": "assets/banner.png", "bg_forest": "assets/bg_forest.png", "dawn_star": "assets/dawn_star.png", "e_big": "assets/e_big.png", "e_boss": "assets/e_boss.png", "e_fast": "assets/e_fast.png", "e_fly": "assets/e_fly.png", "e_pop": "assets/e_pop.png", "e_shade": "assets/e_shade.png", "fireflies": "assets/fireflies.png", "firefly": "assets/firefly.png", "h_apprentice": "assets/h_apprentice.png", "h_archer": "assets/h_archer.png", "h_healer": "assets/h_healer.png", "h_miller": "assets/h_miller.png", "h_scout": "assets/h_scout.png", "h_smith": "assets/h_smith.png", "lantern_1": "assets/lantern_1.png", "lantern_2": "assets/lantern_2.png", "lantern_3": "assets/lantern_3.png", "lantern_deco": "assets/lantern_deco.png", "logo": "assets/logo.png", "merchant_chest": "assets/merchant_chest.png", "pomme_0": "assets/pomme_0.png", "pomme_1": "assets/pomme_1.png", "pomme_2": "assets/pomme_2.png", "pomme_3": "assets/pomme_3.png", "rune": "assets/rune.png", "s_bolt": "assets/s_bolt.png", "s_puddle": "assets/s_puddle.png", "s_shield": "assets/s_shield.png", "sunrise": "assets/sunrise.png", "title_bg": "assets/title_bg.png", "ui_build": "assets/ui_build.png", "ui_gift": "assets/ui_gift.png", "ui_settings": "assets/ui_settings.png", "ui_shop": "assets/ui_shop.png"};window.LH_PRIVACY="<h4>Politique de confidentialité — Lantern Hold</h4>\n<p>Lantern Hold fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. Aucun achat ne donne d’objet tiré au hasard, et il n’y a aucun abonnement.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) peuvent être envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Lantern Hold convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Lantern Hold</h4>\n<p>Lantern Hold works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Ad choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. No purchase gives a random item, and there is no subscription.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) may be sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Lantern Hold suits all ages but is not directed .jz-conf{width:8px;height:12px;border-radius:2px;animation:jzfall var(--d) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes jzfall{0%{transform:translate(var(--x0),var(--y0)) rotate(0)}100%{transform:translate(var(--x1),var(--y1)) rotate(var(--r));opacity:0}}
.jz-dust{width:10px;height:10px;border-radius:50%;background:rgba(255,246,220,.95);animation:jzdust .6s ease-out forwards}
@keyframes jzdust{0%{transform:translate(var(--x0),var(--y0)) scale(.6);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1.8);opacity:0}}
.jz-heart{font-size:20px;animation:jzheart 1.1s ease-out forwards}
@keyframes jzheart{0%{transform:translate(var(--x0),var(--y0)) scale(.4);opacity:0}25%{opacity:1;transform:translate(var(--x0),calc(var(--y0) - 14px)) scale(1.2)}100%{transform:translate(var(--x0),calc(var(--y0) - 54px)) scale(1);opacity:0}}
.jz-pop{animation:jzpop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes jzpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.jz-bump{animation:jzbump .35s ease-out}@keyframes jzbump{40%{transform:scale(1.25)}}
.jz-flash{position:fixed;inset:0;z-index:58;pointer-events:none;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,246,220,.8),rgba(255,246,220,0) 45%);animation:jzflash .7s ease-out forwards}@keyframes jzflash{to{opacity:0}}

      if (r.stats.built > built) { A.mark('construction'); built = r.stats.built; }
      const b = r.e.some(e => e.boss); if (b && !boss) A.mark('le Grand Brouillard'); if (!b && boss) A.mark('Grand Brouillard vaincu'); boss = b;
      if (S().plv !== plv) { plv = S().plv; A.mark('niveau joueur ' + plv); } }, 100);
  }
  // ---- off camera: a village that has played (saves) and a run fast-forwarded with the same simple player ----
  function makeSave(kind) {
    const s = S(); s.tut = 1; s.consent = s.consent == null ? false : s.consent; s.login = { last: new Date().getFullYear() + '-' + (new Date().getMonth() + 1) + '-' + new Date().getDate(), streak: 3, pending: false };
    const lv = kind === 'avance' ? 3 : 1; for (const k in s.up) s.up[k] = lv; s.ff = kind === 'avance' ? 2400 : 520; s.acorns = kind === 'avance' ? 40 : 0; s.plv = kind === 'avance' ? 9 : 4; s.xp = 80;
    if (kind === 'avance') { s.lanterns = { classic: 1, moss: 1, star: 1, glow: 1 }; s.lantern = 'star'; }
    s.run = null; H.save();
  }
  function simTo(stop) {   // plays the current run off camera until stop(r) is true
    const r = R(); let castT = 0, n = 0;
    while (!stop(r) && n++ < 200000) {
      if (r.phase === 'day') { for (const h of r.hops.slice()) C.collectHop(r, h.id); let o, k = 0; while ((o = C.suggest(r)) && k++ < 40) C.doSuggest(r, o); C.startNight(r); }
      else if (r.phase === 'night') { C.step(r, C.DT); castT -= C.DT; if (castT <= 0) { const p = C.spellPlan(r); if (p && C.cast(r, p.sp, p.x, p.y)) castT = 0.45; } for (const d of r.drops.slice()) if (d.t > 1) C.collectDrop(r, d.id); }
      else if (r.phase === 'dawn') C.pickBonus(r, r.choices.slice().sort((a, b) => PREF.indexOf(a) - PREF.indexOf(b))[0]);
      else break;
    }
    r.ev.length = 0; G.parts.length = 0; G.shots.length = 0; G.bolts.length = 0;
  }

  BETA.game({
    sfx: H.SFX,
    logo: () => H.src('logo'),
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => { const r = R(); return r ? [r.night, r.phase, r.stats.kills, r.b.length, r.hops.length] : [G.mode]; },
    async prepare(save, A) {
      if (A.opts.scene === 'onboarding') return;            // onboarding starts from the title screen of a new game
      makeSave(save === 'neuf' ? 'milieu' : save);
      await start(A); await A.wait(500); await clean(A);
      H.startRun(false); await A.wait(300); await clean(A);
      const sc = A.opts.scene;
      if (sc === 'boucle' || sc === 'idle') { simTo(r => r.night >= 3 && r.phase === 'day'); R().berries += 60; R().dayT = C.DAY; }
      if (sc === 'vague') {   // night 5, 3 s before its closing "Grande vague !" (10-15 shadows in a tight pack)
        simTo(r => r.phase === 'won' || r.phase === 'lost' || (r.night === 5 && r.phase === 'night' && r.spawn[r.si] && r.spawn[r.si].big && r.spawn[r.si].t - r.t < 3));
        if (R().phase === 'lost') { R().phase = 'night'; } R().lan.hp = R().lan.max;
      }
      if (sc === 'moment') {   // the last shadows of the 7th night (the Great Fog weakened, or gone): a few taps, then the victorious sunrise
        // the boss is gone and a last pack of 3 to 8 weakened shadows is coming: defences and a few taps clear it on camera, every take
        simTo(r => r.phase === 'won' || r.phase === 'lost' || (r.night === 7 && r.phase === 'night' && r.si >= r.spawn.length && !r.e.some(e => e.boss) && r.e.length <= 8));
        if (R().phase === 'lost') { R().phase = 'night'; R().lan.hp = R().lan.max; }
        for (const e of R().e || []) { if (e.boss) e.hp = Math.min(e.hp, e.max * 0.1); else e.hp = Math.min(e.hp, e.max * 0.35); }
      }
      H.events(); R().ev.length = 0; G.dark = R().phase === 'night' ? 1 : 0; G.sun = 0;
      document.getElementById('pomme').classList.remove('on'); await A.wait(400);
    },
    scenes: {
      // title -> consent -> Pomme's tutorial: drag a tower, a palisade, (pick the harvest), night, tap the shadows, swipe the fireflies, dawn
      async onboarding(A) { watch(A); await start(A); await A.wait(1400);
        for (let i = 0; i < 2 && A.running(); i++) { const r = R(); if (!r) break; const k = G.tut === 1 ? 'tower' : 'wall', c = k === 'tower' ? C.bestCell(r, 'tower') : [2, 2]; await A.think(); await build(A, { k, c: c[0], r: c[1] }); await A.wait(900); }
        await A.wait(600); await pickHops(A); await A.wait(800); await A.think(); await A.tapEl('#gonight', 'nuit');
        const res = await night(A, 60); if (res === 'dawn') await dawnPick(A); await A.wait(1500); },
      // the core: a stretch of day (drags onto the grid, a harvest), then the night with taps on the shadows
      async boucle(A) { watch(A); await day(A, 4); const res = await night(A, 200); if (res === 'dawn') await dawnPick(A); },
      // time-lapse: night after night at triple speed, the village filling the grid (each dawn marked)
      async progression(A) { watch(A); A.speed(3);
        for (let n = 0; n < 7 && A.running(); n++) { await day(A, 10); const res = await night(A, 400); if (res === 'dawn') await dawnPick(A); else break; } },
      // the wow moment: the last shadows of the 7th night (the Great Fog), then the sun rising with its fanfare
      async moment(A) { watch(A); const res = await night(A, 30); if (res === 'won') await A.wait(3500); },
      // the closing big wave of a night: the banner, 10-15 shadows rushing in, a storm of taps, then the dawn
      async vague(A) { watch(A); const res = await night(A, 60); if (res === 'dawn') { await A.wait(1200); await dawnPick(A); } },
      // plays on until stopped (long tests): whole runs one after the other
      async idle(A) { watch(A);
        while (A.running()) { const r = R(); if (!r) { H.startRun(false); await A.wait(500); continue; }
          if (r.phase === 'day') await day(A, 10); else if (r.phase === 'night') { const res = await night(A, 400); if (res === 'dawn') await dawnPick(A); }
          else if (r.phase === 'dawn') await dawnPick(A); else { await A.wait(3000); await clean(A); const b = visible('#modal [data-again]') || visible('#modal [data-give]'); if (b) await A.tapEl(b, 'rejouer'); else H.startRun(false); await A.wait(1000); } } },
    },
  });
})();
