<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2F5DA8">
<title>Pulse Post</title>
<style>
:root{--blue:#2F5DA8;--yellow:#FFC93C;--red:#E0453A;--cream:#FBF3E0;--green:#7CC36A;--ink:#22223B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--blue);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
img.ui{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 16px;font-weight:900;border:3px solid var(--ink);transition:transform .08s;display:block;width:100%;margin-top:9px;font-size:17px}
.b1{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.b2{background:var(--cream);box-shadow:0 4px 0 var(--ink)}.b3{background:#fff;color:var(--red);box-shadow:0 4px 0 var(--ink)}
.bad{background:var(--green);color:var(--ink)}.bred{background:var(--red);color:var(--cream)}
.b1:active,.b2:active,.b3:active,.rb:active,.sc:active{transform:translateY(3px)}.b1:disabled,.b2:disabled{opacity:.45}
.big{font-size:21px;padding:14px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
i.ti,i.pl{display:inline-block;width:1.15em;height:1.15em;background:center/contain no-repeat;vertical-align:-.2em}
/* HUD (in a song) */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;pointer-events:none;align-items:center;gap:6px}
#hud.on{display:flex}#hud button{pointer-events:auto}
.rb{width:42px;height:42px;flex:none;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);font-size:16px;font-weight:900;position:relative;display:grid;place-items:center}
.rb img.ui{width:32px;height:32px}
.rb.dot::after{content:'';position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.chip{display:flex;align-items:center;gap:4px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:3px 9px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:15px;white-space:nowrap}
#sinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#sinfo b{color:var(--cream);font-size:14px;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bag{height:12px;background:var(--ink);border:2px solid var(--cream);border-radius:7px;overflow:hidden;max-width:180px}#bag i{display:block;height:100%;background:var(--yellow);transition:width .15s}#bag.low i{background:var(--red)}
#hcombo.hot{background:var(--yellow)}
/* Madame Tampon */
#mt{position:fixed;left:8px;right:8px;z-index:8;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(24px) scale(.92);transition:.25s;bottom:calc(env(safe-area-inset-bottom) + 12px)}
#mt.on{opacity:1;transform:none}
#mt .pf{width:78px;height:84px;flex:none;object-fit:contain;animation:pbob 1.6s ease-in-out infinite}@keyframes pbob{50%{transform:translateY(-4px) rotate(-2deg)}}
#mt .pt{background:var(--cream);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:4px 4px 0 rgba(0,0,0,.35);max-width:300px;margin-bottom:22px}
#mt .pt b.cnt{font-size:22px;color:var(--red)}
#mt.top{bottom:auto;top:calc(env(safe-area-inset-top) + 58px);align-items:flex-start}#mt.top .pf{width:58px;height:62px}#mt.top .pt{margin:8px 0 0;border-radius:4px 16px 16px 16px;font-size:14px;padding:7px 10px}
/* home: the district */
#home{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;background:var(--blue) center/cover no-repeat}
#home.on{display:flex}
#hhead{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;flex-direction:column;gap:6px;background:rgba(34,34,59,.88);border-bottom:3px solid var(--yellow)}
.mrow{display:flex;align-items:center;gap:8px}
#plv{background:var(--yellow);font-weight:900;border-radius:10px;padding:3px 9px;font-size:13px;white-space:nowrap;border:3px solid var(--ink)}
#xpbar{flex:1;height:14px;background:var(--ink);border:3px solid var(--cream);border-radius:8px;overflow:hidden}#xpbar i{display:block;height:100%;background:var(--green);transition:width .4s}
#hmid{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 12px;gap:8px}
#hmid .logo{width:min(56vw,250px);margin-top:2px}
.hood{width:100%;max-width:400px;background:rgba(251,243,224,.96);border:3px solid var(--ink);border-radius:16px;padding:7px 8px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.hood h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}.hood h4 small{font-size:12px;display:flex;align-items:center;gap:3px}.hood h4 img{width:16px;height:16px}
.hood.night{background:rgba(34,34,59,.95);color:var(--cream)}
.sc{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 8px;margin-bottom:6px;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.sc img.r{width:44px;height:44px;object-fit:contain;flex:none;pointer-events:none}
.sc .tx{flex:1;min-width:0;pointer-events:none}.sc .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc .tx small{display:block;font-size:11.5px;font-weight:800;opacity:.75}
.sc .st{display:flex;gap:1px;pointer-events:none}.sc .st img{width:17px;height:17px}.sc .st img.off{opacity:.2;filter:grayscale(1)}
.sc .gr{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none;background:var(--cream);pointer-events:none}.sc .gr.S{background:var(--yellow)}
.sc.lock{opacity:.45;filter:grayscale(.6)}.sc.cur{background:var(--yellow);animation:hint .8s infinite alternate}.sc.boss{background:var(--red);color:var(--cream)}.sc.boss.cur{background:var(--yellow);color:var(--ink)}
.night .sc{background:#2c3a6b;color:var(--cream)}
@keyframes hint{to{transform:translateY(-3px);box-shadow:0 0 0 4px var(--yellow)}}
.trainrow{width:100%;max-width:400px;display:flex;align-items:center;gap:8px;background:rgba(251,243,224,.96);border:3px solid var(--ink);border-radius:14px;padding:5px 10px;font-weight:900;font-size:14px}
.trainrow img{width:30px;height:30px}.trainrow small{display:block;font-size:11px;opacity:.7}.trainrow input{margin-left:auto;width:26px;height:26px;accent-color:var(--green)}
.hcard{display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:7px 9px;width:100%;max-width:400px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hcard img{width:44px;height:44px;object-fit:contain}.hcard .tx{flex:1;min-width:0;font-weight:800;font-size:13px;line-height:1.25}.hcard .tx b{font-size:15px;display:block}
#hfoot{display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 10px);background:rgba(34,34,59,.92);border-top:3px solid var(--yellow)}
#hfoot .rb{width:50px;height:50px;border-radius:16px}#hfoot .rb img.ui{width:38px;height:38px}
#hfoot small{display:block;text-align:center;font-weight:900;font-size:10.5px;margin-top:4px;color:var(--cream)}
/* overlays */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(20,20,40,.62);padding:14px}#modal.on{display:flex}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:14px;max-width:390px;width:100%;max-height:90vh;overflow:auto;box-shadow:7px 7px 0 rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
.card.wide{max-width:520px;text-align:left}@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:2px 0 8px;font-size:23px;text-align:center}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico img{width:100px;height:100px;object-fit:contain}.big-ico.s img{width:76px;height:76px}
.gain{font-size:24px;font-weight:900;color:var(--blue);margin:4px 0}.sub{font-size:13px;color:var(--blue);font-weight:800}
.stat{display:flex;justify-content:space-between;font-weight:800;padding:3px 4px;border-bottom:2px dashed rgba(34,34,59,.15)}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.stars img{width:64px;height:64px;opacity:.2;filter:grayscale(1)}.stars img.on{opacity:1;filter:none;animation:clack .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes clack{0%{transform:scale(2.4) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.grade{font-size:64px;font-weight:900;line-height:1;color:var(--blue);-webkit-text-stroke:2px var(--ink);margin:2px 0;display:inline-block;animation:clack .6s cubic-bezier(.3,1.8,.5,1) both}
.grade.S{color:var(--yellow);animation:gold 1.6s cubic-bezier(.2,1,.3,1) both;text-shadow:0 0 0 var(--yellow)}
@keyframes gold{0%{transform:scale(3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.goldwash{position:fixed;inset:0;z-index:29;pointer-events:none;background:rgba(255,201,60,.45);animation:gw 1.6s ease-out forwards}@keyframes gw{to{opacity:0}}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lg small{font-size:9px;font-weight:800}.lg b{font-size:11px}.lg i{width:20px;height:20px}.lg.got{opacity:.4}.lg.now{background:var(--yellow)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:2px solid rgba(34,34,59,.15);gap:8px}.sw input{width:24px;height:24px;accent-color:var(--yellow)}.sw select{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:3px 6px}
.sw .mini{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:10px;background:var(--yellow);padding:4px 10px;font-size:14px}
.ver{font-size:11px;opacity:.6;margin-top:8px;text-align:center}.legal{font-size:13px}
.it{display:flex;align-items:center;gap:9px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 9px;margin-bottom:8px;text-align:left}
.it .ico{width:50px;height:50px;flex:none;display:grid;place-items:center}.it .ico img{width:50px;height:50px;object-fit:contain}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;font-size:12px;line-height:1.25;opacity:.85}
.buy{min-width:80px;background:var(--green);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:15px;white-space:nowrap}
.buy.ad{background:var(--blue);color:var(--cream)}.buy.pl{background:var(--yellow)}.buy.off{opacity:.45}.buy:active{transform:translateY(3px)}
.own{font-weight:900;color:var(--green);min-width:70px;text-align:center;-webkit-text-stroke:.5px var(--ink)}
.note{font-size:12px;text-align:center;margin:2px 0 10px;font-weight:700;opacity:.8}
.pbar{height:12px;background:#fff;border:2px solid var(--ink);border-radius:7px;overflow:hidden;margin:5px 0}.pbar i{display:block;height:100%;background:var(--yellow)}
.cos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.co{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;min-height:110px;text-align:center;line-height:1.1}
.co .wear{position:relative;width:64px;height:68px}.co .wear img{position:absolute;object-fit:contain}.co .wear .pb{inset:0;width:100%;height:100%}
.co.lock .wear{opacity:.4;filter:grayscale(1)}.co.on{background:var(--yellow)}.co small{font-size:10px;font-weight:800;margin-top:2px}
/* album */
.alb{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:var(--blue);border:3px solid var(--ink);border-radius:14px;padding:9px}
.stp{aspect-ratio:4/5;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;line-height:1.05;text-align:center;padding:14% 12%;background:center/100% 100% no-repeat}
.stp i.bgc{position:absolute;inset:13% 12%;border-radius:3px;opacity:.55}.stp>*{position:relative}.stp i.bgc{position:absolute}
.stp img{width:84%;height:60%;object-fit:contain}.stp.c0 i.bgc{background:var(--yellow)}.stp.c1 i.bgc{background:var(--red)}.stp.c2 i.bgc{background:var(--green)}.stp.c3 i.bgc{background:var(--cream)}
.stp.off{opacity:.35;filter:grayscale(1)}.stp.off span{visibility:hidden}.stp.off img{opacity:.25}
.stp.new{animation:glue .7s cubic-bezier(.3,1.7,.5,1) both}@keyframes glue{0%{transform:scale(2.2) rotate(-25deg);opacity:0}70%{transform:scale(.92) rotate(3deg);opacity:1}100%{transform:none}}
h3{margin:10px 0 6px;font-size:16px;text-align:left}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(20,20,40,.6);padding:20px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:7px 14px;font-weight:900;box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:pop .3s;transition:opacity .4s;max-width:90vw;text-align:center}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:30%;z-index:25;text-align:center;font-size:38px;font-weight:900;color:var(--yellow);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:ban 1.8s cubic-bezier(.2,1.4,.4,1) forwards;padding:0 10px}
.banner.r{color:var(--red)}.banner.c{color:var(--cream)}.banner small{display:block;font-size:20px;-webkit-text-stroke:1.5px var(--ink)}@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;align-items:center;justify-content:center}.adbox{color:var(--cream);text-align:center}.adtag{opacity:.7;font-weight:800}.adart img{width:120px;margin:20px}.adcount{font-size:44px;font-weight:900}
/* calibration */
#calib{position:fixed;inset:0;z-index:32;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--blue);color:var(--cream);text-align:center;padding:20px;touch-action:none}
#calib.on{display:flex}#calib .ring{width:180px;height:180px;border-radius:50%;border:8px solid var(--ink);background:var(--cream);display:grid;place-items:center;font-size:56px;font-weight:900;color:var(--ink);transition:transform .06s}
#calib .ring.flash{background:var(--yellow);transform:scale(1.12)}#calib .dots{display:flex;gap:6px}#calib .dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--cream)}#calib .dots i.on{background:var(--green)}
#calib p{font-weight:900;font-size:18px;margin:0;max-width:340px}#calib .b1,#calib .b2{max-width:300px;color:var(--ink)}
/* title */
#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 30px) 24px calc(env(safe-area-inset-bottom) + 40px);background:var(--blue) center/cover no-repeat}
#title.on{display:flex}#title .logo img{width:min(84vw,400px)}#title .tbg{width:min(78vw,44vh);animation:pbob 2.4s ease-in-out infinite}
#title p{font-weight:900;margin:4px 0;font-size:16px;color:var(--cream);text-align:center;text-shadow:0 2px 0 var(--ink)}#title .b1{max-width:320px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="mt"><img class="pf" alt=""><div class="pt"></div></div>
<div id="home"><div id="hhead"></div><div id="hmid"></div><div id="hfoot"></div></div>
<div id="calib"></div>
<div id="modal"></div><div id="toasts"></div><div id="title"></div>
<script>window.PP_VERSION="1.0";window.PP_SPR={"bg_street": "assets/bg_street.png", "costume_0": "assets/costume_0.png", "costume_1": "assets/costume_1.png", "costume_2": "assets/costume_2.png", "costume_3": "assets/costume_3.png", "costume_4": "assets/costume_4.png", "costume_5": "assets/costume_5.png", "facade": "assets/facade.png", "firework": "assets/firework.png", "letter": "assets/letter.png", "letter_wings": "assets/letter_wings.png", "logo": "assets/logo.png", "mailbox": "assets/mailbox.png", "note": "assets/note.png", "parcel": "assets/parcel.png", "pip_0": "assets/pip_0.png", "pip_1": "assets/pip_1.png", "pip_2": "assets/pip_2.png", "pip_3": "assets/pip_3.png", "res_0": "assets/res_0.png", "res_1": "assets/res_1.png", "res_2": "assets/res_2.png", "res_3": "assets/res_3.png", "res_4": "assets/res_4.png", "res_5": "assets/res_5.png", "stamp_blank": "assets/stamp_blank.png", "stamp_oops": "assets/stamp_oops.png", "stamp_perfect": "assets/stamp_perfect.png", "stamp_star": "assets/stamp_star.png", "tampon_0": "assets/tampon_0.png", "tampon_1": "assets/tampon_1.png", "tampon_2": "assets/tampon_2.png", "tampon_3": "assets/tampon_3.png", "title_bg": "assets/title_bg.png", "ui_album": "assets/ui_album.png", "ui_gift": "assets/ui_gift.png", "ui_settings": "assets/ui_settings.png", "ui_shop": "assets/ui_shop.png", "window_dark": "assets/window_dark.png", "window_lit": "assets/window_lit.png"};window.PP_PRIVACY="<h4>Politique de confidentialité — Pulse Post</h4>\n<p>Pulse Post fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. Aucun achat ne donne d’objet tiré au hasard, et il n’y a aucun abonnement.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) peuvent être envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Pulse Post convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Pulse Post</h4>\n<p>Pulse Post works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Ad choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. No purchase gives a random item, and there is no subscription.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) may be sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Pulse Post suits all ages but is not directed at children. We do not knowingly collect personal data from children.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>
<script>// BETA IA — a simulated player inside the game, for tests and in-game video capture (spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Shared by every game: copy this file into <game>/src/beta.js, load it BEFORE the game scripts, and register the game's
// scenes after them with BETA.game({...}) (see <game>/src/beta-game.js).
// Turned on only by the address (?beta=ia) and never inside the iOS app (the native store handler is present there).

@keyframes jzfall{0%{transform:translate(var(--x0),var(--y0)) rotate(0)}100%{transform:translate(var(--x1),var(--y1)) rotate(var(--r));opacity:0}}
.jz-dust{width:10px;height:10px;border-radius:50%;background:rgba(251,243,224,.95);animation:jzdust .6s ease-out forwards}
@keyframes jzdust{0%{transform:translate(var(--x0),var(--y0)) scale(.6);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1.8);opacity:0}}
.jz-heart{font-size:20px;animation:jzheart 1.1s ease-out forwards}
@keyframes jzheart{0%{transform:translate(var(--x0),var(--y0)) scale(.4);opacity:0}25%{opacity:1;transform:translate(var(--x0),calc(var(--y0) - 14px)) scale(1.2)}100%{transform:translate(var(--x0),calc(var(--y0) - 54px)) scale(1);opacity:0}}
.jz-pop{animation:jzpop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes jzpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.jz-bump{animation:jzbump .35s ease-out}@keyframes jzbump{40%{transform:scale(1.25)}}

  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  // coins (or any icon) flying from an element to a counter, which bumps on arrival
  function fly(fromEl, toEl, src, n = 6, done) {
    const [x0, y0] = center(fromEl), [x1, y1] = center(toEl);
    for (let i = 0; i < n; i++) {
      const c = mk('jz-coin', 'img'); c.src = src; const ox = (Math.random() - 0.5) * 50, oy = (Math.random() - 0.5) * 40;

      setTimeout(() => { c.style.transform = `translate(${x1 - 13}px,${y1 - 13}px) scale(.9)`; c.style.opacity = '.4'; }, 30 + i * 55);
      setTimeout(() => { c.remove(); if (i === n - 1) { bump(toEl); done && done(); } }, 780 + i * 55);

    for (let i = 0; i < n; i++) {
      const c = mk('jz-conf'); const x0 = innerWidth / 2 + (Math.random() - 0.5) * 80, y0 = innerHeight * 0.35;
      c.style.background = cols[i % cols.length];
      c.style.setProperty('--x0', x0 + 'px'); c.style.setProperty('--y0', y0 + 'px');

      c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg'); c.style.setProperty('--d', (1.2 + Math.random() * 1.1) + 's');
      setTimeout(() => c.remove(), 2600);
    }
  }
  function dust(el, n = 10) {
    const [x, y] = center(el);
    for (let i = 0; i < n; i++) { const d = mk('jz-dust'), a = Math.random() * Math.PI * 2, r = 26 + Math.random() * 30;
      d.style.setProperty('--x0', x - 5 + 'px'); d.style.setProperty('--y0', y + 10 + 'px'); d.style.setProperty('--x1', x - 5 + Math.cos(a) * r + 'px'); d.style.setProperty('--y1', y + 10 + Math.sin(a) * r * 0.5 + 'px'); setTimeout(() => d.remove(), 650); }
  }
  function heart(x, y, ch = '❤️') { const h = mk('jz-heart', ch); h.style.setProperty('--x0', x - 10 + 'px'); h.style.setProperty('--y0', y + 'px'); setTimeout(() => h.remove(), 1150); }

  return { fly, bump, confetti, dust, heart, pop, flash };

<script>// Pulse Post — stand-in art, drawn at startup: flat shapes, a thick even ink outline, one hard shadow down-right, the 6 colours
// of the art direction only (post blue, mail yellow, stamp red, paper cream, lime green, ink). No text in the pictures.
// Each one is replaced by the painted PNG of the same name in src/sprites/ (window.PP_SPR). ART.get(name) -> canvas, ART.url(name) -> data URL.
window.PPART = (() => {
  const P = { blue: '#2F5DA8', yellow: '#FFC93C', red: '#E0453A', cream: '#FBF3E0', green: '#7CC36A', ink: '#22223B' };
  const TAU = Math.PI * 2, cache = {}, urls = {};
  // draws on its own layer at 2 px per unit, then lays one hard shadow under the whole silhouette
  function make(w, h, fn, shadow = 0.05, k = 2) {
    const f = document.createElement('canvas'); f.width = w * k; f.height = h * k; const c = f.getContext('2d'); c.scale(k, k); c.lineJoin = 'round'; c.lineCap = 'round'; fn(c, w, h);
    if (!shadow) return f;
    const out = document.createElement('canvas'); out.width = f.width; out.height = f.height; const o = out.getContext('2d'), d = Math.round(Math.min(f.width, f.height) * shadow);
    const sh = document.createElement('canvas'); sh.width = f.width; sh.height = f.height; const s = sh.getContext('2d'); s.drawImage(f, 0, 0); s.globalCompositeOperation = 'source-in'; s.fillStyle = 'rgba(34,34,59,.32)'; s.fillRect(0, 0, sh.width, sh.height);
    o.drawImage(sh, d, d); o.drawImage(f, 0, 0); return out;
  }
  const fs = (c, fill, lw = 5) => { if (fill) { c.fillStyle = fill; c.fill(); } if (lw) { c.lineWidth = lw; c.strokeStyle = P.ink; c.stroke(); } };
  const circle = (c, x, y, r, fill, lw) => { c.beginPath(); c.arc(x, y, r, 0, TAU); fs(c, fill, lw); };
  const ell = (c, x, y, rx, ry, fill, lw, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); fs(c, fill, lw); };
  const rect = (c, x, y, w, h, fill, lw, r = 6) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); fs(c, fill, lw); };
  const poly = (c, pts, fill, lw) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); fs(c, fill, lw); };
  const line = (c, pts, lw = 5, col = P.ink) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.lineWidth = lw; c.strokeStyle = col; c.stroke(); };
  const eyes = (c, x, y, gap, s = 1, mood) => { for (const d of [-1, 1]) { if (mood === 'shut') line(c, [x + d * gap - 4 * s, y, x + d * gap + 4 * s, y - 2], 3.5); else if (mood === 'dizzy') { line(c, [x + d * gap - 4, y - 4, x + d * gap + 4, y + 4], 3); line(c, [x + d * gap + 4, y - 4, x + d * gap - 4, y + 4], 3); } else ell(c, x + d * gap, y, 3.6 * s, 5 * s, P.ink, 0); } };
  const star = (c, x, y, r, fill, lw = 4, n = 5) => { const pts = []; for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * 0.45 : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } poly(c, pts, fill, lw); };
  // a postage stamp: a rectangle with a perforated (scalloped) edge

    for (let i = y; i < y + h; i += 2 * r) c.arc(x + w, i + r, r, -Math.PI / 2, Math.PI / 2, true);
    for (let i = x + w; i > x; i -= 2 * r) c.arc(i - r, y + h, r, 0, Math.PI, true);
    for (let i = y + h; i > y; i -= 2 * r) c.arc(x, i - r, r, Math.PI / 2, -Math.PI / 2, true);

  // ---------- Pip, the pigeon postman: cream body, post-blue jacket and cap, mail-yellow beak and feet, a red bag ----------
  function pip(pose) {

      c.beginPath(); c.moveTo(38, 26); c.quadraticCurveTo(64, 2, 90, 26); c.closePath(); fs(c, P.blue); rect(c, 34, 24, 60, 8, P.ink, 0, 3); rect(c, 58, 10, 12, 8, P.yellow, 3, 2);   // post cap
    });
  }
  // ---------- Madame Tampon, the old goose, head of the post office, with a giant red stamp ----------
  function tampon(mood) {
    return make(140, 150, c => {
      ell(c, 70, 118, 40, 30, P.blue);                                  // uniform
      rect(c, 54, 92, 32, 10, P.yellow, 3, 4);                          // collar ribbon
      c.beginPath(); c.moveTo(62, 96); c.quadraticCurveTo(50, 60, 70, 40); c.lineTo(84, 44); c.quadraticCurveTo(74, 66, 80, 96); c.closePath(); fs(c, P.cream);   // neck
      ell(c, 76, 34, 24, 20, P.cream);                                  // head
      poly(c, [94, 30, 120, 36, 94, 44], P.yellow, 4);                  // beak
      if (mood === 1) eyes(c, 76, 28, 8, 1, 'shut'); else ell(c, 82, 28, 3.6, mood === 2 ? 6 : 5, P.ink, 0), ell(c, 68, 28, 3.6, mood === 2 ? 6 : 5, P.ink, 0);
      circle(c, 75, 30, 8, null, 3); circle(c, 85, 30, 8, null, 3); line(c, [83, 30, 77, 30], 3);   // spectacles
      c.beginPath(); c.moveTo(56, 22); c.quadraticCurveTo(76, 0, 98, 20); c.closePath(); fs(c, P.blue); rect(c, 52, 18, 50, 7, P.ink, 0, 3);   // cap
      // the giant stamp: raised when stamping, held otherwise
      c.save(); if (mood === 3) { c.translate(20, -30); c.rotate(-0.35); }
      rect(c, 12, 70, 14, 34, P.yellow, 4, 4); ell(c, 19, 66, 12, 8, P.yellow, 4); rect(c, 0, 102, 38, 16, P.red, 5, 4);
      c.restore(); ell(c, 34, mood === 3 ? 74 : 96, 12, 10, P.cream, 5);   // wing holding it
    });
  }
  // ---------- the 6 habitants of the market, as busts in their window, each with its noisy object ----------
  const HABS = [
    // (stand-ins; the painted set has: Lola the rabbit, Mimi the cat, Bruno the bear, Glouglou the frog, Hector the owl, Souricette the mouse)
    c => { ell(c, 64, 112, 40, 26, P.cream); ell(c, 64, 62, 30, 30, P.cream); poly(c, [50, 36, 56, 22, 64, 34, 70, 20, 78, 34], P.red, 4); poly(c, [62, 64, 76, 70, 62, 76], P.yellow, 4); ell(c, 66, 82, 5, 7, P.red, 3);
      eyes(c, 64, 56, 10); rect(c, 84, 88, 34, 20, P.blue, 5, 6); line(c, [84, 96, 66, 104], 6); ell(c, 101, 88, 17, 5, P.blue, 4); },
    // Bruno, the bear, and his accordion
    c => { circle(c, 38, 36, 12, P.yellow); circle(c, 90, 36, 12, P.yellow); ell(c, 64, 112, 44, 26, P.yellow); ell(c, 64, 60, 32, 28, P.yellow); ell(c, 64, 72, 13, 9, P.cream, 4); circle(c, 64, 67, 4, P.ink, 0); eyes(c, 64, 54, 12);
      rect(c, 30, 92, 18, 28, P.red, 4, 3); for (let i = 0; i < 4; i++) rect(c, 48 + i * 8, 90 + (i % 2) * 2, 8, 30, P.cream, 3, 1); rect(c, 80, 92, 18, 28, P.red, 4, 3); },

      poly(c, [60, 64, 68, 64, 64, 68], P.red, 3); line(c, [40, 64, 26, 60], 3); line(c, [88, 64, 102, 60], 3); circle(c, 98, 100, 14, P.yellow); circle(c, 98, 100, 4, P.ink, 0); rect(c, 94, 82, 8, 6, P.yellow, 3, 2); },

      line(c, [44, 72, 64, 78, 84, 72], 4); c.beginPath(); c.arc(64, 50, 38, Math.PI * 1.05, Math.PI * 1.95); c.lineWidth = 7; c.strokeStyle = P.ink; c.stroke(); rect(c, 18, 46, 12, 22, P.blue, 4, 4); rect(c, 98, 46, 12, 22, P.blue, 4, 4);

  function street() {

      c.fillStyle = 'rgba(251,243,224,.12)'; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(40 + i * 70, 60 + (i % 2) * 30, 18 + (i % 3) * 6, 0, TAU); c.fill(); }   // flat clouds
      for (let i = 0; i < 9; i++) { const x = -10 + i * 46, h = 60 + (i * 37) % 50; rect(c, x, 200 - h, 44, h + 600, 'rgba(34,34,59,.35)', 0, 0); }

  // ---------- interface icons ----------

<script>// Pulse Post scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// The robot reads the song's beat table and taps with real gestures (A.tap) on the street, timed on the game clock:
// a tap takes a little while to come down (the finger moves, then presses), so it starts each one ahead of its letter and
// learns that delay from its own touches (the times the game stamped on them). Style `pro` aims at ±20 ms; `debutant`
// is late or early by up to ~70 ms and sometimes misses on purpose. In BETA the clock is performance.now (virtual in capture).
(() => {
  if (!window.BETA || !BETA.on) return;
  const H = window.PP, G = H.G, S = () => H.S(), R = H.R;
  if (BETA.opts.ui === 'propre') { const st = document.createElement('style'); st.textContent = '.adov{display:none!important}.adbtn{display:none!important}#h_shop{visibility:hidden!important}.price{visibility:hidden!important}'; document.head.appendChild(st); }
  const visible = sel => { const e = typeof sel === 'string' ? document.querySelector(sel) : sel; return e && e.offsetParent ? e : null; };
  const until = async (A, f, ms = 15000) => { const t0 = performance.now(); while (A.running() && !f() && performance.now() - t0 < ms) await A.wait(100); return f(); };
  function propre(A) {
    if (A.opts.ui === 'propre' && S().consent == null) S().consent = false;   // clean takes: no consent window on camera (refused = no personalised ads)
    if (A.opts.ui === 'propre') S().owned.noads = true;                       // clean takes: no interstitials, no price on screen
  }
  async function clean(A) {   // close what a player would close: gift, pop-ups
    for (let i = 0; i < 4; i++) { const b = visible('#modal [data-claim]') || visible('#modal [data-close]'); if (!b) return; await A.wait(A.jitter(400, 700)); await A.tapEl(b, 'fermer'); await A.wait(400); }
  }
  // ---- the rhythm hand ----
  let D = 0.24;   // seconds between the call of A.tap and the finger touching the glass (learned)
  async function playSong(A, o = {}) {
    const [x, y] = H.tapPoint(), planned = new Set(), calls = []; let seen = G.downs.length;
    await A.tap(x, y, 'doigt prêt');   // the finger settles on the street during the count-in (a tap in the void)
    seen = G.downs.length;
    const deb = A.opts.style === 'debutant', stopAt = o.stopAfter ? performance.now() + o.stopAfter : 0;
    while (A.running() && G.mode === 'song' && !G.ended && !G.failed) {
      if (stopAt && performance.now() > stopAt) break;
      const now = H.CLK.now(), notes = G.tab.notes;
      for (let i = G.from; i < notes.length; i++) {
        const n = notes[i]; if (planned.has(i) || G.res[i]) continue; const tc = H.noteClock(n); if (tc - now > 0.8) break;
        planned.add(i); if (deb && A.rnd() < 0.07) continue;                     // a beginner lets one go now and then
        const aim = tc + (deb ? (A.rnd() - 0.5) * 0.14 : 0), ms = (aim - D - H.CLK.now()) * 1000; if (ms < -20) continue;
        A.wait(Math.max(0, ms)).then(() => { if (!A.running() || G.mode !== 'song' || G.ended) return; calls.push(H.CLK.now()); A.tap(x, y, 'lettre ' + (i + 1)); });
      }

  }

    const cnt = r => G.res ? G.res.filter(x => r ? x === r : x && x !== 'M').length : 0;   // start from what is already on screen (a scene may open mid-song)
    let hits = cnt(), P = cnt('P'), combo = G.combo, lights = G.lights, fw = false, grade = '', miss = cnt('M'), glued = 0;
    const iv = setInterval(() => { if (!A.running()) return clearInterval(iv);
      if (G.mode === 'song' && G.res) { const h = G.res.filter(r => r && r !== 'M').length, p = G.res.filter(r => r === 'P').length, m = G.res.filter(r => r === 'M').length;
        if (h > 0 && !hits) A.mark('première lettre attrapée'); if (p > 0 && !P) A.mark('tampon PARFAIT'); hits = h; P = p;
        if (m > miss && A.opts.style === 'debutant') A.mark('OUPS'); miss = m;
        if (G.combo - combo <= 4) for (const c of [10, 20, 30, 50]) if (G.combo >= c && combo < c) A.mark('combo ×' + c); combo = G.combo;   // (a cut song starts with its combo: no mark)
        if (G.lights >= 8 && lights < 8) A.mark('le quartier est illuminé'); lights = G.lights;
        if (G.fw > 0 && !fw) { fw = true; A.mark('feu d’artifice final'); } }
      const gr = document.querySelector('#modal .grade'); if (gr && gr.textContent !== grade) { grade = gr.textContent; A.mark('note ' + grade); } if (!gr) grade = '';
      const g = document.querySelectorAll('#modal .stp.new').length; if (g > glued) A.mark('nouveau timbre collé dans l’album'); glued = g;
    }, 100);
  }
  // ---- off camera: a district that has been played ----
  function makeSave(kind) {
    const s = S(), d = new Date(); s.tut = 1; s.lat = 0; s.train = false; s.consent = s.consent == null ? false : s.consent; s.login = { last: d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), streak: 3, pending: false };
    const upto = kind === 'avance' ? 7 : kind === 'milieu' ? 4 : 1, ids = ['m1', 'm2', 'm3', 'm4', 'm5', 'm6', 'boss']; s.best = {}; s.album = {};
    for (let i = 0; i < upto; i++) { s.best[ids[i]] = { stars: i % 3 ? 3 : 2, letter: i % 3 ? 'S' : 'A', score: 20000, acc: 0.95 }; s.album['st_' + ids[i]] = 1; }
    if (kind !== 'neuf') { s.album.tr_0 = 1; s.album.ms_calib = 1; }

    if (kind === 'avance') { s.costumes = { 1: 1, 3: 1, 5: 1 }; s.costume = 3; }

    sfx: H.SFX,
    logo: () => H.src('logo'),
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => G.mode === 'song' ? [G.song && G.song.id, G.from, G.combo, G.ended] : [G.mode, document.querySelector('#modal') && document.querySelector('#modal').className],
    async prepare(save, A) {

      if (A.opts.scene === 'onboarding') { S().lat = 0; return; }   // onboarding starts from the title screen of a new game
      makeSave(A.opts.scene === 'progression' ? 'neuf' : save === 'neuf' ? 'milieu' : save); propre(A);
      if (A.opts.scene === 'boucle') { const T = R.table(R.song('m4')); H.startSong('m4', { from: T.checkpoints[1], skip: 1 }); }
      else if (A.opts.scene === 'moment') { const T = R.table(R.song('boss')); H.startSong('boss', { from: T.beats - 12 }); }
      else { H.showHome(); await A.wait(400); await clean(A); }
      await A.wait(150); document.getElementById('mt').classList.remove('on');
    },
    scenes: {
      // title -> Play -> Madame Tampon's tutorial: she counts "1, 2, 3", the first letter is caught, the PARFAIT stamp claps
      async onboarding(A) { watch(A); await A.wait(800); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(500);
        if (visible('#modal [data-c]')) { await A.think(); await A.tapEl('#modal [data-c="0"]', 'consentement'); }
        await until(A, () => G.mode === 'song', 5000); await playSong(A); },
      // the core: Glouglou's double strokes on her glasses with the whole street dancing, the district lighting up house by house with the combo
      async boucle(A) { watch(A); await playSong(A); await A.wait(1500); },
      // time-lapse: a new player clears song after song (their last bars), the stamps clack, the album fills up
      async progression(A) { watch(A);   // (no speed-up: a tap needs real time to be on the beat; the cut is in the songs)
        for (let k = 0; k < 4 && A.running(); k++) {
          const cur = document.querySelector('#hmid .sc.cur') || document.querySelector('#hmid [data-play]'); if (!cur) break;
          const id = cur.dataset.song || 'm2', T = R.table(R.song(id));
          await clean(A); const sel = cur.dataset.song ? `#hmid [data-song="${id}"]` : '#hmid [data-play]'; document.querySelector(sel).scrollIntoView({ block: 'center', behavior: 'smooth' }); await A.wait(700); await A.tapEl(sel, 'morceau ' + id);   // the list scrolls the card above the bottom bar await until(A, () => G.mode === 'song', 4000); if (G.mode !== 'song' || !G.song) { A.ev('note', { msg: 'le morceau ne démarre pas', mode: G.mode }); await A.wait(800); continue; }

          await playSong(A); await afterSong(A, 'home'); await until(A, () => visible('#modal .alb'), 4000);
          await A.wait(2600); await clean(A); await A.wait(500);
        } },
      // the wow: the boss song's last bars, every habitant at its window, the last letter, the fireworks
      async moment(A) { watch(A); await playSong(A); await A.wait(4000); },
      // plays on until stopped (long tests): song after song
      async idle(A) { watch(A);
        while (A.running()) { if (G.mode !== 'song') { const s = R.SONGS.find(s => H.unlocked(s) && !(S().best[s.id] && S().best[s.id].stars === 3)) || R.SONGS[0]; H.startSong(s.id); await A.wait(500); continue; }
          await playSong(A); if (G.failed) { await A.wait(1500); H.startSong(G.song.id); continue; } await afterSong(A, 'next'); } },
    },
  });
})();
