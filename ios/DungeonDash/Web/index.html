<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3B2E5A">
<title>Pocket Dungeon Dash</title>
<style>
:root{--violet:#3B2E5A;--stone:#8C8FA6;--orange:#FFB347;--green:#7ED957;--red:#E84A5F;--cream:#FFF5E1;--deep:#2a2042}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--violet);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
img.ui{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 16px;font-weight:900;border:3px solid var(--violet);transition:transform .08s;display:block;width:100%;margin-top:9px;font-size:17px}
.b1{background:var(--orange);color:var(--violet);box-shadow:0 4px 0 var(--violet)}
.b2{background:var(--cream);box-shadow:0 4px 0 var(--violet)}.b3{background:#fff;color:var(--red);box-shadow:0 4px 0 var(--violet)}
.bad{background:var(--green)}.bred{background:var(--red);color:var(--cream)}
.b1:active,.b2:active,.b3:active,.rb:active,.opt:active{transform:translateY(3px)}.b1:disabled,.b2:disabled{opacity:.45}
.big{font-size:21px;padding:14px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
i.gd,i.gm{display:inline-block;width:1.15em;height:1.15em;background:center/contain no-repeat;vertical-align:-.2em}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;pointer-events:none;align-items:center;gap:6px}
#hud.on{display:flex}#hud button{pointer-events:auto}
.rb{width:42px;height:42px;flex:none;border-radius:50%;background:var(--cream);border:3px solid var(--violet);box-shadow:0 3px 0 rgba(0,0,0,.35);font-size:16px;font-weight:900;position:relative;display:grid;place-items:center}
.rb img.ui{width:32px;height:32px}
.rb.dot::after{content:'';position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid var(--violet)}
.chip{display:flex;align-items:center;gap:4px;background:var(--cream);border:3px solid var(--violet);border-radius:999px;padding:3px 9px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:16px;white-space:nowrap}
#hpw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#hpw b{color:var(--cream);font-size:13px;text-shadow:0 2px 0 var(--violet);white-space:nowrap;overflow:hidden}
#hpbar{position:relative;height:16px;background:var(--violet);border:3px solid var(--cream);border-radius:9px;overflow:hidden}#hpbar i{display:block;height:100%;background:var(--red);transition:width .15s}
#hpbar span{position:absolute;inset:0;text-align:center;font-size:10px;font-weight:900;color:var(--cream);line-height:10px}
#hpbar.low i{animation:blink .4s infinite alternate}@keyframes blink{to{opacity:.45}}
#bossbar{position:fixed;left:14px;right:14px;z-index:5;display:none;pointer-events:none}#bossbar.on{display:block}
#bossbar b{display:block;text-align:center;color:var(--cream);font-weight:900;font-size:14px;text-shadow:0 2px 0 var(--violet)}
#bossbar div{height:12px;background:var(--violet);border:3px solid var(--cream);border-radius:8px;overflow:hidden}#bossbar i{display:block;height:100%;background:var(--orange);transition:width .2s}
/* Gus */
#gus{position:fixed;left:8px;right:8px;z-index:8;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(24px) scale(.92);transition:.25s;bottom:calc(env(safe-area-inset-bottom) + 18px)}
#gus.on{opacity:1;transform:none}
#gus .gf{width:84px;height:84px;flex:none;object-fit:contain;animation:gbob 1.6s ease-in-out infinite}@keyframes gbob{50%{transform:translateY(-4px) rotate(-2deg)}}
#gus .gt{background:var(--cream);border:3px solid var(--violet);border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:4px 4px 0 rgba(0,0,0,.35);max-width:290px;margin-bottom:22px}
#gus.top{bottom:auto;top:calc(env(safe-area-inset-top) + 64px)}
#gus.home{bottom:calc(env(safe-area-inset-bottom) + 96px)}
/* the 3 cards that flip */
#cards{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(42,32,66,.72);padding:12px;gap:12px}
#cards.on{display:flex}
#cards h2{margin:0;color:var(--cream);font-size:26px;text-shadow:0 3px 0 var(--violet);text-align:center}
#cards .sub{color:var(--cream);font-weight:800;font-size:14px;margin-top:-6px;text-align:center}
.crow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;max-width:480px}
.cd{width:calc((100% - 16px) / 3);max-width:150px;aspect-ratio:5/7.4;perspective:700px;position:relative}
.crow.four .cd{width:calc((100% - 24px) / 4)}
.cd .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;transform:rotateY(180deg)}
.cd.up .in{transform:rotateY(0)}
.cd .fr,.cd .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:4px solid var(--violet);box-shadow:0 5px 0 rgba(0,0,0,.45)}
.cd .bk{transform:rotateY(180deg);background:var(--violet) center/cover no-repeat}
.cd .fr{background:var(--cream);display:flex;flex-direction:column;align-items:center;padding:6px 5px;text-align:center;overflow:hidden}
.cd .fr img{width:54%;aspect-ratio:1;object-fit:contain;margin-top:2px}
.cd .fr b{font-size:14px;line-height:1.1;margin-top:3px}.cd .fr small{font-size:10.5px;font-weight:800;line-height:1.15;margin-top:2px;opacity:.85}
.cd .lv{display:flex;gap:2px;margin-top:auto}.cd .lv i{width:8px;height:8px;border-radius:50%;border:2px solid var(--violet);background:#fff}.cd .lv i.on{background:var(--orange)}
.cd .cb{position:absolute;top:-2px;left:-2px;right:-2px;background:var(--red);color:var(--cream);font-size:10px;font-weight:900;padding:2px;border-radius:12px 12px 0 0;animation:blink .5s infinite alternate}
.cd.cat-elem .fr{background:#ffe3c2}.cd.cat-shot .fr{background:#fff5e1}.cd.cat-body .fr{background:#e4f7d8}.cd.cat-gold .fr{background:#fff0c8}
.cd.pick{animation:cpick .5s forwards}.cd.drop{animation:cdrop .45s forwards}
/* card rarity: the back already glows its colour before the flip, epic cards shake, flip last and shine */
.cd{animation:cdeal .38s cubic-bezier(.3,1.4,.5,1) backwards}@keyframes cdeal{from{transform:translateY(120px) rotate(-6deg) scale(.7);opacity:0}}
.cd.r1 .bk{box-shadow:0 0 0 3px var(--green),0 0 20px 6px rgba(126,217,87,.75)}
.cd.r2 .bk,.cd.cmb .bk{box-shadow:0 0 0 3px var(--orange),0 0 26px 10px rgba(255,179,71,.9);animation:cglow .5s infinite alternate}@keyframes cglow{to{box-shadow:0 0 0 3px var(--orange),0 0 12px 4px rgba(255,179,71,.6)}}
.cd.r1 .fr{box-shadow:inset 0 0 0 3px var(--green),0 5px 0 rgba(0,0,0,.45)}
.cd.r2 .fr{box-shadow:inset 0 0 0 3px var(--orange),0 0 18px 5px rgba(255,179,71,.85)}
.cd.r2.up .fr::after{content:'';position:absolute;inset:-30% -60%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.8) 50%,transparent 58%);animation:cshine 1.8s .6s infinite;pointer-events:none}@keyframes cshine{from{transform:translateX(-55%)}60%,to{transform:translateX(55%)}}
.cd .rt{position:absolute;top:5px;right:5px;font-size:9px;font-weight:900;padding:1px 6px;border-radius:8px;border:2px solid var(--violet);letter-spacing:.3px;z-index:2}.cd .cb~.rt{top:22px}
.cd .rt.r1{background:var(--green);color:var(--violet)}.cd .rt.r2{background:var(--orange);color:var(--violet)}
.cd.tease{animation:ctease .4s ease-in-out}@keyframes ctease{20%{transform:rotate(-4deg) scale(1.04)}40%{transform:rotate(4deg) scale(1.08)}60%{transform:rotate(-3deg) scale(1.08)}80%{transform:rotate(2deg) scale(1.1)}}
.cd.land{animation:cland .35s cubic-bezier(.3,1.6,.5,1)}@keyframes cland{40%{transform:scale(1.16)}}
/* end of a run: what is almost reached, the record, and a huge Replay button */
.near{background:#fff;border:3px solid var(--violet);border-radius:14px;padding:6px 9px;margin:6px 0;text-align:left;font-weight:800;font-size:13.5px;animation:pop .4s cubic-bezier(.3,1.6,.5,1) backwards}
.near .pbar{height:10px;margin-top:4px}.near small{float:right;opacity:.75}
.rec{display:inline-block;background:var(--orange);border:3px solid var(--violet);border-radius:12px;padding:3px 12px;font-weight:900;font-size:19px;margin:2px 0 6px;animation:recp .6s cubic-bezier(.3,1.6,.5,1) infinite alternate}@keyframes recp{to{transform:scale(1.08) rotate(-2deg)}}
.recl{font-weight:800;font-size:13px;opacity:.8;margin:0 0 4px}
.b1.huge{font-size:30px;padding:20px 14px;margin-top:12px;border-radius:20px;animation:hugep 1.1s ease-in-out infinite}@keyframes hugep{50%{transform:scale(1.04)}}
.b1.huge:active{animation:none}
@keyframes cpick{40%{transform:scale(1.15) translateY(-14px)}100%{transform:scale(1.08) translateY(-40px);opacity:0}}@keyframes cdrop{to{transform:translateY(80px) rotate(8deg);opacity:0}}
/* home: Gus's tavern */
#home{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;background:var(--violet) center top/cover no-repeat}
#home.on{display:flex}
#hhead{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;flex-direction:column;gap:6px;background:rgba(42,32,66,.88);border-bottom:3px solid var(--cream)}
.mrow{display:flex;align-items:center;gap:8px}
#plv{background:var(--orange);font-weight:900;border-radius:10px;padding:3px 9px;font-size:13px;white-space:nowrap;border:3px solid var(--violet)}
#xpbar{flex:1;height:14px;background:var(--violet);border:3px solid var(--cream);border-radius:8px;overflow:hidden}#xpbar i{display:block;height:100%;background:var(--green);transition:width .4s}
#hmid{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 12px 14px;gap:8px}
#hmid .logo{width:min(56vw,250px)}
.wall{position:relative;width:100%;max-width:380px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px;background:rgba(42,32,66,.75);border:3px solid var(--cream);border-radius:16px}
.tr{aspect-ratio:1;position:relative;display:grid;place-items:center;background:rgba(255,245,225,.12);border-radius:10px}
.tr img{width:92%;height:92%;object-fit:contain}.tr img.bo{position:absolute;width:48%;height:48%;top:14%}.tr.no img{opacity:.22;filter:grayscale(1) brightness(.6)}
.bar{position:relative;width:100%;max-width:380px;display:flex;align-items:flex-end;justify-content:center}
.bar .counter{width:100%;display:block}.bar .gusi{position:absolute;bottom:52%;left:50%;width:34%;transform:translateX(-50%);animation:gbob 2s ease-in-out infinite}
.hpick{display:flex;gap:6px;width:100%;max-width:380px}
.hsel{flex:1;display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--violet);border-radius:14px;padding:4px 8px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:14px;text-align:left}
.hsel img{width:40px;height:40px;object-fit:contain}.hsel small{display:block;font-size:11px;opacity:.75}
#hmid .b1{max-width:380px}
.hcard{display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--violet);border-radius:16px;padding:7px 9px;width:100%;max-width:380px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hcard>img{width:46px;height:46px;object-fit:contain}.hcard .tx{flex:1;min-width:0;font-weight:800;font-size:13px;line-height:1.25}.hcard .tx b{font-size:15px;display:block}
.q{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px}.q .pbar{flex:1;margin:0}.q .buy{min-width:64px;padding:3px 6px;font-size:13px}
#hfoot{display:flex;justify-content:space-around;padding:8px 4px calc(env(safe-area-inset-bottom) + 10px);background:rgba(42,32,66,.92);border-top:3px solid var(--cream)}
#hfoot .rb{width:46px;height:46px;border-radius:14px}#hfoot .rb img.ui{width:36px;height:36px}
#hfoot small{display:block;text-align:center;font-weight:900;font-size:10px;margin-top:4px;color:var(--cream)}
/* overlays */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(30,22,50,.62);padding:14px}#modal.on{display:flex}
.card{background:var(--cream);border:4px solid var(--violet);border-radius:22px;padding:14px;max-width:390px;width:100%;max-height:90vh;overflow:auto;box-shadow:7px 7px 0 rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
.card.wide{max-width:520px;text-align:left}@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:2px 0 8px;font-size:23px;text-align:center}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico img{width:120px;height:120px;object-fit:contain}.big-ico.s img{width:90px;height:90px}
.gain{font-size:30px;font-weight:900;color:var(--violet);margin:4px 0}.sub{font-size:13px;opacity:.8;font-weight:800}
.stat{display:flex;justify-content:space-between;font-weight:800;padding:3px 4px;border-bottom:2px dashed rgba(59,46,90,.15)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--violet);border-radius:16px;padding:8px 10px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.3,1.6,.5,1) backwards}
.opt img{width:52px;height:52px;object-fit:contain}.opt b{display:block;font-size:16px}.opt small{font-size:13px;font-weight:700}.opt.off{opacity:.4}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:3px solid var(--violet);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lg small{font-size:9px;font-weight:800}.lg b{font-size:11px}.lg i{width:20px;height:20px}.lg.got{opacity:.4}.lg.now{background:var(--orange)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:2px solid rgba(59,46,90,.15)}.sw input{width:24px;height:24px;accent-color:var(--orange)}.sw select{font:inherit;font-weight:800;border:3px solid var(--violet);border-radius:10px;background:#fff;padding:3px 6px}
.ver{font-size:11px;opacity:.6;margin-top:8px;text-align:center}.legal{font-size:13px}
.it{display:flex;align-items:center;gap:9px;background:#fff;border:3px solid var(--violet);border-radius:16px;padding:7px 9px;margin-bottom:8px;text-align:left}
.it .ico{width:50px;height:50px;flex:none;display:grid;place-items:center;position:relative}.it .ico img{width:50px;height:50px;object-fit:contain}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;font-size:12px;line-height:1.25;opacity:.85}
.it.lock .ico img{filter:grayscale(1);opacity:.45}
.dots{display:flex;gap:3px;margin-top:3px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--violet);background:#fff}.dots i.on{background:var(--orange)}.dots i.fg{background:var(--red);animation:blink .6s infinite alternate}
.buy{min-width:80px;background:var(--green);color:var(--violet);border:3px solid var(--violet);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--violet);font-weight:900;font-size:15px;white-space:nowrap}
.buy.ad{background:var(--orange)}.buy.gm{background:var(--cream)}.buy.off{opacity:.45}.buy:active{transform:translateY(3px)}
.own{font-weight:900;color:#3d8a26;min-width:70px;text-align:center}
.note{font-size:12px;text-align:center;margin:2px 0 10px;font-weight:700;opacity:.8}
.pbar{height:12px;background:#fff;border:2px solid var(--violet);border-radius:7px;overflow:hidden;margin:5px 0}.pbar i{display:block;height:100%;background:var(--orange)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gi{background:#fff;border:3px solid var(--violet);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;min-height:96px;text-align:center}
.gi img{width:56px;height:56px;object-fit:contain}.gi.lock img{opacity:.35;filter:grayscale(1)}.gi.on{background:var(--orange)}.gi small{font-size:10px;line-height:1.1;font-weight:800}
h3{margin:10px 0 6px;font-size:16px;text-align:left}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(30,22,50,.6);padding:20px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--cream);border:3px solid var(--violet);border-radius:14px;padding:7px 14px;font-weight:900;box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:pop .3s;transition:opacity .4s;max-width:90vw;text-align:center}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:28%;z-index:25;text-align:center;font-size:40px;font-weight:900;color:var(--orange);-webkit-text-stroke:2.5px var(--violet);text-shadow:4px 4px 0 var(--violet);pointer-events:none;animation:ban 1.8s cubic-bezier(.2,1.4,.4,1) forwards;padding:0 10px}
.banner.g{color:var(--green)}.banner.c{color:var(--cream)}.banner.r{color:var(--red)}.banner.s{font-size:28px;top:20%}@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:var(--violet);display:flex;align-items:center;justify-content:center}.adbox{color:var(--cream);text-align:center}.adtag{opacity:.7;font-weight:800}.adart img{width:120px;margin:20px}.adcount{font-size:44px;font-weight:900}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 80px 30px rgba(232,74,95,.0);transition:box-shadow .25s}
#flash.on{box-shadow:inset 0 0 80px 30px rgba(232,74,95,.65);transition:none}
/* title */
/* first-run tutorial: the hand (drawn in CSS), the skip button (top right, in place of the gold chip, hidden meanwhile) */
#tuto{position:fixed;inset:0;z-index:7;pointer-events:none;display:none}#tuto.on{display:block}
.thand{position:absolute;left:0;top:0;width:44px;height:62px;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.4));transform-origin:22px 0}
.thand::before{content:'';position:absolute;left:13px;top:0;width:18px;height:38px;border-radius:9px 9px 4px 4px;background:var(--cream);border:3px solid var(--violet);box-sizing:border-box}
.thand::after{content:'';position:absolute;left:3px;top:24px;width:38px;height:36px;border-radius:12px 14px 18px 18px;background:var(--cream);border:3px solid var(--violet);box-sizing:border-box;box-shadow:inset 0 -5px 0 rgba(59,46,90,.15)}
.tring{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;border:4px solid var(--orange);box-sizing:border-box;transition:opacity .15s}
.tring.hold{animation:tpulse 1s ease-out infinite}@keyframes tpulse{0%{box-shadow:0 0 0 0 rgba(255,179,71,.7)}100%{box-shadow:0 0 0 22px rgba(255,179,71,0)}}
#tskip{position:fixed;z-index:9;top:calc(env(safe-area-inset-top) + 8px);right:8px;min-width:88px;height:44px;padding:0 14px;border-radius:999px;background:var(--cream);color:var(--violet);border:3px solid var(--violet);box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:16px;display:none}
body.tuto #tskip{display:block}body.tuto #hgold{visibility:hidden}
#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 30px) 24px calc(env(safe-area-inset-bottom) + 40px);background:var(--violet) center/cover no-repeat}
#title.on{display:flex}#title .logo img{width:min(88vw,430px)}#title .tbg{width:min(76vw,44vh);border-radius:32px;border:4px solid var(--cream);box-shadow:6px 6px 0 rgba(0,0,0,.4);animation:gbob 2.4s ease-in-out infinite}
#title p{font-weight:900;margin:4px 0;font-size:17px;color:var(--cream);text-align:center}#title .b1{max-width:320px}
</style>
</head>
<body>
<canvas id="cv"></canvas><div id="flash"></div>
<div id="hud"></div><div id="bossbar"><b></b><div><i></i></div></div>

ldren.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>

<script>// Shared "juice": flying coins, confetti, pops, dust and hearts (DOM + CSS only, cheap on phones). From Crumble Crew, in the Pocket Dungeon Dash palette.
window.JUICE = (() => {
  const css = `
.jz{position:fixed;z-index:60;pointer-events:none;left:0;top:0;will-change:transform,opacity}
.jz-coin{width:26px;height:26px;object-fit:contain;transition:transform .7s cubic-bezier(.55,-0.25,.4,1),opacity .7s}
.jz-conf{width:8px;height:12px;border-radius:2px;animation:jzfall var(--d) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes jzfall{0%{transform:translate(var(--x0),var(--y0)) rotate(0)}100%{transform:translate(var(--x1),var(--y1)) rotate(var(--r));opacity:0}}
.jz-dust{width:10px;height:10px;border-radius:50%;background:rgba(255,245,225,.95);animation:jzdust .6s ease-out forwards}
@keyframes jzdust{0%{transform:translate(var(--x0),var(--y0)) scale(.6);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1.8);opacity:0}}
.jz-heart{font-size:20px;animation:jzheart 1.1s ease-out forwards}
@keyframes jzheart{0%{transform:translate(var(--x0),var(--y0)) scale(.4);opacity:0}25%{opacity:1;transform:translate(var(--x0),calc(var(--y0) - 14px)) scale(1.2)}100%{transform:translate(var(--x0),calc(var(--y0) - 54px)) scale(1);opacity:0}}
.jz-pop{animation:jzpop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes jzpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.jz-bump{animation:jzbump .35s ease-out}@keyframes jzbump{40%{transform:scale(1.25)}}
.jz-flash{position:fixed;inset:0;z-index:58;pointer-events:none;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,245,225,.8),rgba(255,245,225,0) 45%);animation:jzflash .7s ease-out forwards}@keyframes jzflash{to{opacity:0}}
`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const center = el => { if (!el) return [innerWidth / 2, innerHeight / 2]; const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const mk = (cls, html = '') => { const d = document.createElement(html === 'img' ? 'img' : 'div'); d.className = 'jz ' + cls; if (html && html !== 'img') d.innerHTML = html; document.body.appendChild(d); return d; };
  // coins (or any icon) flying from an element to a counter, which bumps on arrival
  function fly(fromEl, toEl, src, n = 6, done) {
    const [x0, y0] = center(fromEl), [x1, y1] = center(toEl);
    for (let i = 0; i < n; i++) {
      const c = mk('jz-coin', 'img'); c.src = src; const ox = (Math.random() - 0.5) * 50, oy = (Math.random() - 0.5) * 40;
      c.style.transform = `translate(${x0 - 13 + ox}px,${y0 - 13 + oy}px) scale(.6)`;
      setTimeout(() => { c.style.transform = `translate(${x1 - 13}px,${y1 - 13}px) scale(.9)`; c.style.opacity = '.4'; }, 30 + i * 55);
      setTimeout(() => { c.remove(); if (i === n - 1) { bump(toEl); done && done(); } }, 780 + i * 55);
    }
  }
  function bump(el) { if (!el) return; el.classList.remove('jz-bump'); void el.offsetWidth; el.classList.add('jz-bump'); }
  function confetti(n = 70) {
    const cols = ['#FFB347', '#7ED957', '#FFF5E1', '#E84A5F', '#FFB347', '#8C8FA6'];   // confetti in the dungeon palette
    for (let i = 0; i < n; i++) {
      const c = mk('jz-conf'); const x0 = innerWidth / 2 + (Math.random() - 0.5) * 80, y0 = innerHeight * 0.35;
      c.style.background = cols[i % cols.length];
      c.style.setProperty('--x0', x0 + 'px'); c.style.setProperty('--y0', y0 + 'px');
      c.style.setProperty('--x1', x0 + (Math.random() - 0.5) * innerWidth * 1.1 + 'px'); c.style.setProperty('--y1', y0 + innerHeight * (0.4 + Math.random() * 0.5) + 'px');
      c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg'); c.style.setProperty('--d', (1.2 + Math.random() * 1.1) + 's');
      setTimeout(() => c.remove(), 2600);
    }
  }
  function dust(el, n = 10) {
    const [x, y] = center(el);
    for (let i = 0; i < n; i++) { const d = mk('jz-dust'), a = Math.random() * Math.PI * 2, r = 26 + Math.random() * 30;
      d.style.setProperty('--x0', x - 5 + 'px'); d.style.setProperty('--y0', y + 10 + 'px'); d.style.setProperty('--x1', x - 5 + Math.cos(a) * r + 'px'); d.style.setProperty('--y1', y + 10 + Math.sin(a) * r * 0.5 + 'px'); setTimeout(() => d.remove(), 650); }
  }
  function heart(x, y, ch = '❤️') { const h = mk('jz-heart', ch); h.style.setProperty('--x0', x - 10 + 'px'); h.style.setProperty('--y0', y + 'px'); setTimeout(() => h.remove(), 1150); }
  function pop(el) { if (!el) return; el.classList.remove('jz-pop'); void el.offsetWidth; el.classList.add('jz-pop'); }
  function flash(el) { const [x, y] = center(el); const f = mk('jz-flash'); f.style.setProperty('--fx', x + 'px'); f.style.setProperty('--fy', y + 'px'); setTimeout(() => f.remove(), 750); }
  return { fly, bump, confetti, dust, heart, pop, flash };
})();

<script>// Pocket Dungeon Dash — stand-in art, drawn at startup: flat shapes, thick even outline, the 6 colours of the art direction.
// Each one is replaced by the painted PNG of the same name in src/sprites/ (window.DD_SPR). DDART.get(name) -> canvas, DDART.url(name) -> data URL.

  const P = { violet: '#3B2E5A', stone: '#8C8FA6', orange: '#FFB347', green: '#7ED957', red: '#E84A5F', cream: '#FFF5E1' };

  const circle = (c, x, y, r, fill, lw) => { c.beginPath(); c.arc(x, y, r, 0, TAU); fs(c, fill, lw); };
  const ell = (c, x, y, rx, ry, fill, lw, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); fs(c, fill, lw); };
  const rect = (c, x, y, w, h, fill, lw, r = 8) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); fs(c, fill, lw); };

  const line = (c, pts, col, lw) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.lineWidth = lw; c.strokeStyle = col; c.stroke(); };

  const eyes = (c, x, y, s = 1, mood) => { for (const d of [-1, 1]) { ell(c, x + d * 11 * s, y, 6 * s, 8 * s, '#fff', 2.5); circle(c, x + d * 11 * s + 1.5 * s, y + 1.5 * s, 3.6 * s, O, 0); }

  // a chunky hero, 2 heads tall: body colour, head, accessory
  function hero(c, body, acc) {

    rect(c, 50, 98, 11, 20, O, 0, 4); rect(c, 67, 98, 11, 20, O, 0, 4);                // legs

}
function ensureQuests() {

  const r = () => (seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296, pool = E.quests.slice(), out = [];
  while (out.length < 3) { const q = pool.splice(Math.floor(r() * pool.length), 1)[0]; if (out.some(o => o.id === q.id)) continue; out.push({ id: q.id, n: q.n, gold: q.gold, p: 0, claimed: false }); }

}

}

      if (S().plv !== plv) { plv = S().plv; A.mark('niveau joueur ' + plv); } }, 100);
  }
  // ---- off camera: a tavern that has played (saves) and a run fast-forwarded with the same simple player ----
  function makeSave(kind) {
    const s = S(); s.tut = 1; s.consent = s.consent == null ? false : s.consent; s.login = { last: new Date().getFullYear() + '-' + (new Date().getMonth() + 1) + '-' + new Date().getDate(), streak: 3, pending: false };
    const lv = kind === 'avance' ? 3 : 1; for (const k in s.perm) s.perm[k] = lv; s.gold = kind === 'avance' ? 2400 : 520; s.gems = kind === 'avance' ? 40 : 0; s.plv = kind === 'avance' ? 9 : 4; s.xp = 60;
    s.said = { coins: 1, cards: 1, event: 1, choco: 1 }; if (kind === 'avance') { s.heroes = { knight: 1, archer: 1, mage: 1 }; s.outfits.outfit_0 = 1; s.outfit = 'outfit_0'; s.trophies = { king: 1, win: 1 }; s.totals.bosses = { king: 2 }; }
    s.run = null; D.save();
  }
  function simTo(stop, prefer) {   // plays the current run off camera until stop(r) is true
    const r = R(); let n = 0, next = 0, holding = false;
    while (!stop(r) && n++ < 400000) {
      if (r.phase === 'room' || r.phase === 'clear') { if (r.time >= next || r.phase === 'clear') { next = r.time + 0.12; const o = C.think(r); if (o.roll) { C.setInput(r, o); C.release(r); holding = false; } else if (o.m > 0) { C.setInput(r, o); holding = true; } else if (holding) { C.release(r); holding = false; } else C.setInput(r, { m: 0 }); }
        C.step(r, C.DT); r.ev.length = 0; }
      else if (r.phase === 'cards') { const p = prefer && r.choices.find(c => prefer.includes(c)); C.pickCard(r, p || C.botPick(r)); }
      else if (r.phase === 'event') C.chooseEvent(r, C.botEvent(r));
      else if (r.phase === 'dead') { r.phase = 'room'; r.h.hp = r.h.max; }
      else break;
    }
    r.ev.length = 0; C.setInput(r, { m: 0 }); G.parts.length = 0; G.floats.length = 0; G.bolts.length = 0;
  }

  BETA.game({
    sfx: D.SFX,
    logo: () => D.src('logo'),
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => { const r = R(); return r ? [r.floor, r.room, r.phase, r.stats.kills, Math.round(r.h.x / 20), Math.round(r.h.y / 20), r.stats.rolls] : [G.mode]; },
    async prepare(save, A) {
      if (A.opts.scene === 'onboarding') return;            // onboarding starts from the title screen of a new game
      makeSave(save === 'neuf' ? 'milieu' : save);
      await start(A); await A.wait(500); await clean(A);
      const sc = A.opts.scene;
      D.startRun(false, { hero: 'knight' }); await A.wait(300); await clean(A);
      if (sc === 'boucle' || sc === 'idle') { simTo(r => r.room >= 2 && r.phase === 'room', ['multi', 'fire', 'bounce']); }
      if (sc === 'moment') {   // the Mushroom King, weakened, with a hero who has fire + bounce: the fatal blow comes on camera every take
        simTo(r => r.floor === 1 && r.room === 8 && r.phase === 'room', ['fire', 'bounce', 'multi', 'power', 'rapid']);
        const r = R(); for (let i = 0; i < 160 && !r.e.some(e => e.boss); i++) { C.step(r, C.DT); r.ev.length = 0; }
        const b = r.e.find(e => e.boss); if (b) { const st = r.st, dps = st.dmg * (1 + st.multi) / st.per; b.hp = Math.min(b.max, Math.round(dps * 3.2)); b.t = 0.5; b.pat = 0; b.patT = 1.2; }
        r.h.hp = r.h.max; r.ep = [];
      }
      D.events(); const r = R(); if (r) r.ev.length = 0; G.fade = 0; G.shake = 0;
      document.getElementById('gus').classList.remove('on'); await A.wait(400);
    },
    scenes: {
      // title -> Gus's tutorial: slide to walk, stand still and the hero shoots the first slime, lift the finger to roll, the coins, the 3 cards
      async onboarding(A) { watch(A); await start(A); await A.wait(2200); if (await room(A)) await A.wait(1500); },
      // the core: a room cleared with drags, rolls and magnet coins, then the 3 cards that flip
      async boucle(A) { watch(A); await room(A); await A.wait(800); },
      // time-lapse: room after room at triple speed, the hero changing look with his upgrades
      async progression(A) { watch(A); A.speed(3); for (let i = 0; i < 12 && A.running(); i++) if (!await room(A)) break; },
      // the wow moment: the Mushroom King's fatal blow (slow motion, big shake, confetti)
      async moment(A) { watch(A); await fight(A, 25); await A.wait(2500); },
      // plays on until stopped (long tests): whole runs one after the other
      async idle(A) { watch(A);
        while (A.running()) { const r = R(); if (!r) { D.startRun(false); await A.wait(500); continue; }
          if (r.phase === 'room' || r.phase === 'clear') { await room(A); } else if (r.phase === 'cards') await cards(A); else if (r.phase === 'event') await event(A);
          else { await A.wait(2500); const b = visible('#modal [data-give]') || visible('#modal [data-again]'); if (b) await A.tapEl(b, 'fin de partie'); await A.wait(1500); const a = visible('#modal [data-again]'); if (a) await A.tapEl(a, 'redescendre'); else if (!G.R || G.mode !== 'run') D.startRun(false); await A.wait(1000); } } },
    },
  });
})();
