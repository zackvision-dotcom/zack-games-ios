<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B2238">
<title>Silk Hop</title>
<style>
:root{--ink:#2B2238;--cream:#FFF4D6;--coral:#FF7A6B;--leaf:#5BB85C;--dew:#6EC8F0;--branch:#7A4E2D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
img.ui{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 16px;font-weight:900;border:3px solid var(--ink);transition:transform .08s;display:block;width:100%;margin-top:9px;font-size:17px}
.b1{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(43,34,56,.35)}
.b2{background:var(--cream);box-shadow:0 4px 0 var(--ink)}.b3{background:#fff;color:#b8402f;box-shadow:0 4px 0 var(--ink)}
.bad{background:var(--dew);color:var(--ink)}.bgreen{background:var(--leaf);color:#fff;text-shadow:0 2px 0 rgba(43,34,56,.35)}
.b1:active,.b2:active,.b3:active,.rb:active,.node:active{transform:translateY(3px)}.b1:disabled,.b2:disabled{opacity:.5}
.big{font-size:21px;padding:14px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
i.gn,i.pl,i.dw{display:inline-block;width:1.1em;height:1.1em;background:center/contain no-repeat;vertical-align:-.18em}
/* in-game HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
#hud.on{display:flex;align-items:center;gap:8px}
#hud button{pointer-events:auto}
.rb{width:44px;height:44px;flex:none;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:20px;font-weight:900;position:relative;display:grid;place-items:center}
.rb img.ui{width:34px;height:34px}
.rb.dot::after{content:'';position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.chip{display:flex;align-items:center;gap:5px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 11px;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:17px;white-space:nowrap}
#lname{flex:1;min-width:0;font-weight:900;font-size:14px;text-shadow:0 0 4px var(--cream),0 0 4px var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dews{display:flex;gap:2px}#dews i{width:24px;height:28px;opacity:.28;transition:transform .2s}#dews i.on{opacity:1;animation:dwp .5s}@keyframes dwp{40%{transform:scale(1.6)}}
#timer{display:none}#timer.on{display:flex}
/* Papi Scarab */
#papi{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:8;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(24px) scale(.92);transition:.25s}
#papi.on{opacity:1;transform:none}
#papi .pf{width:78px;height:78px;flex:none;object-fit:contain;animation:pbob 1.6s ease-in-out infinite}@keyframes pbob{50%{transform:translateY(-4px) rotate(-2deg)}}
#papi .pt{background:var(--cream);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:4px 4px 0 rgba(43,34,56,.35);max-width:300px;margin-bottom:20px}
#tskip{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 62px);z-index:9;display:none;min-width:96px;min-height:48px;padding:8px 16px;border-radius:999px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:17px}#tskip.on{display:block}#tskip:active{transform:translateY(3px)}
#papi.top{bottom:auto;top:calc(env(safe-area-inset-top) + 64px)}
/* map */
#map{position:fixed;inset:0;z-index:6;display:none;flex-direction:column}
#map.on{display:flex}
#mhead{padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;display:flex;flex-direction:column;gap:6px;background:rgba(255,244,214,.92);border-bottom:3px solid var(--ink)}
.mrow{display:flex;align-items:center;gap:8px}
#plv{background:var(--ink);color:var(--cream);font-weight:900;border-radius:10px;padding:3px 9px;font-size:13px;white-space:nowrap}
#xpbar{flex:1;height:13px;background:#fff;border:3px solid var(--ink);border-radius:8px;overflow:hidden}#xpbar i{display:block;height:100%;background:var(--leaf);transition:width .4s}
#path{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 0 40px;position:relative}
#nodes{display:flex;flex-direction:column-reverse;align-items:center;gap:14px}
.gname{text-align:center;font-weight:900;font-size:15px;margin:4px 0 0;color:var(--branch)}
.node{position:relative;width:74px;height:74px;border-radius:50%;background:var(--cream);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:28px;font-weight:900;display:grid;place-items:center}
.node.done{background:var(--leaf);color:#fff;text-shadow:0 2px 0 rgba(43,34,56,.4)}.node.cur{background:var(--coral);color:#fff;animation:pulse 1s infinite alternate}
.node.lock{background:#e6dcc3;color:rgba(43,34,56,.35);box-shadow:0 5px 0 rgba(43,34,56,.4);border-color:rgba(43,34,56,.4)}
.node.ch{width:90px;height:90px;border-radius:24px;font-size:15px;line-height:1.1}
@keyframes pulse{to{box-shadow:0 5px 0 var(--ink),0 0 0 9px rgba(255,122,107,.3)}}
.node .st{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);display:flex;gap:1px}.node .st i{width:15px;height:18px;opacity:.25}.node .st i.on{opacity:1}
.node .mina{position:absolute;left:-58px;top:4px;width:56px;height:56px;animation:pbob 1.4s ease-in-out infinite}
#mfoot{display:flex;justify-content:space-around;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:rgba(255,244,214,.92);border-top:3px solid var(--ink)}
#mfoot .rb{width:62px;height:62px;border-radius:18px}#mfoot .rb img.ui{width:46px;height:46px}
#mfoot small{display:block;text-align:center;font-weight:900;font-size:11px;margin-top:5px}
/* overlays */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(43,34,56,.55);padding:16px}#modal.on{display:flex}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:16px;max-width:390px;width:100%;max-height:90vh;overflow:auto;box-shadow:7px 7px 0 rgba(43,34,56,.45);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
.card.wide{max-width:520px;text-align:left}@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:2px 0 8px;font-size:24px}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico img{width:130px;height:130px;object-fit:contain}.big-ico.s img{width:90px;height:90px}
.stars{display:flex;justify-content:center;gap:8px;margin:4px 0}.stars i{width:46px;height:56px;opacity:.2;transform:scale(.4);transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}.stars i.on{opacity:1;transform:scale(1)}
.gain{font-size:30px;font-weight:900;color:var(--branch);margin:4px 0}.sub{font-size:13px;color:var(--branch);font-weight:800}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lg small{font-size:9px;font-weight:800}.lg b{font-size:11px}.lg i{width:20px;height:20px}.lg.got{opacity:.4}.lg.now{background:var(--coral);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:2px solid rgba(43,34,56,.15)}.sw input{width:24px;height:24px;accent-color:var(--coral)}.sw select{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:3px 6px}
.ver{font-size:11px;opacity:.6;margin-top:8px;text-align:center}.legal{font-size:13px}
.it{display:flex;align-items:center;gap:9px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 9px;margin-bottom:8px;text-align:left}
.it .ico{width:50px;height:50px;flex:none;display:grid;place-items:center}.it .ico img{width:50px;height:50px;object-fit:contain}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;font-size:12px;line-height:1.25;opacity:.8}
.buy{min-width:84px;background:var(--leaf);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:15px;white-space:nowrap;text-shadow:0 1px 0 rgba(43,34,56,.4)}
.buy.ad{background:var(--dew);color:var(--ink);text-shadow:none}.buy.pl{background:var(--dew);color:var(--ink);text-shadow:none}.buy.off{opacity:.45}.buy:active{transform:translateY(3px)}
.own{font-weight:900;color:var(--leaf);min-width:70px;text-align:center}
.note{font-size:12px;text-align:center;margin:2px 0 10px;font-weight:700;opacity:.8}
/* nest */
.nestv{position:relative;height:190px;margin:-4px -4px 6px;background:center/contain no-repeat}
.nestv .mn{position:absolute;left:50%;top:58px;width:92px;margin-left:-46px;animation:wave 1.2s ease-in-out infinite;transform-origin:50% 100%}
.nestv .mn img{width:92px;height:92px;display:block;object-fit:contain}.nestv .mn .ht{position:absolute;left:23px;top:-30px;width:46px}
@keyframes wave{50%{transform:rotate(-6deg)}}
.nestv .dc{position:absolute;width:46px;height:46px}
.hats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.hat{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:900;min-height:72px}
.hat img{width:44px;height:38px;object-fit:contain}.hat.lock img{opacity:.25;filter:grayscale(1)}.hat.on{background:var(--leaf);color:#fff}.hat small{font-size:9.5px;line-height:1.05;text-align:center}
.coc{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;margin-bottom:8px;text-align:left}
.coc img{width:56px;height:72px;object-fit:contain}.pbar{height:12px;background:var(--cream);border:2px solid var(--ink);border-radius:7px;overflow:hidden;margin:5px 0}.pbar i{display:block;height:100%;background:var(--dew)}
.decos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.deco{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.deco img{width:40px;height:40px}.deco.has{background:#eaf6e0}.deco b{font-size:11px}
h3{margin:10px 0 6px;font-size:16px;text-align:left}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(43,34,56,.55);padding:20px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:0;right:0;z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:7px 14px;font-weight:900;box-shadow:4px 4px 0 rgba(43,34,56,.35);animation:pop .3s;transition:opacity .4s}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:36%;z-index:25;text-align:center;font-size:40px;font-weight:900;color:var(--cream);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:ban 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
.banner.c{color:var(--coral)}.banner.g{color:var(--leaf)}@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;align-items:center;justify-content:center}.adbox{color:var(--cream);text-align:center}.adtag{opacity:.7;font-weight:800}.adart img{width:120px;margin:20px}.adcount{font-size:44px;font-weight:900}
/* title */
#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 34px) 24px calc(env(safe-area-inset-bottom) + 40px);background:var(--cream) center top/100% auto repeat-y}
#title.on{display:flex}#title .tbg{width:min(78vw,46vh);border-radius:32px;border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(43,34,56,.35);animation:pbob 2.4s ease-in-out infinite}#title .logo{text-align:center}#title .logo img{width:min(86vw,420px)}
#title p{font-weight:900;margin:4px 0;font-size:17px;text-shadow:0 0 6px var(--cream),0 0 6px var(--cream)}
#title .hero{position:relative;width:180px;height:300px}#title .hero .th{position:absolute;left:89px;top:-40vh;width:3px;height:calc(40vh + 150px);background:var(--ink);transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite}
#title .hero .th img{position:absolute;left:-74px;bottom:-130px;width:150px;height:150px;object-fit:contain}@keyframes sway{50%{transform:rotate(7deg)}0%,100%{transform:rotate(-7deg)}}
#title .b1{max-width:320px}
.go{font-size:25px;padding:16px;margin-top:12px;animation:gob 1.1s ease-in-out infinite alternate}@keyframes gob{to{transform:scale(1.04)}}
.rec{display:inline-block;margin:2px 0 4px;padding:4px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:900;font-size:17px;text-shadow:0 2px 0 rgba(43,34,56,.35);transform:scale(0);transition:transform .45s cubic-bezier(.3,1.8,.5,1)}.rec.on{transform:scale(1);animation:recw 1.4s .5s ease-in-out infinite}@keyframes recw{50%{transform:scale(1.07) rotate(-2deg)}}
.goal{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;margin-top:10px;text-align:left}.goal img{width:48px;height:44px;object-fit:contain;filter:grayscale(1);opacity:.55}.goal>div{flex:1;min-width:0}.goal small{display:block;font-size:12px;font-weight:800;color:var(--branch)}.goal b{font-size:15px}.goal .pbar i{background:var(--leaf)}
.why{font-weight:900;font-size:17px;color:var(--coral)}
.far small{font-size:13px;font-weight:800;color:var(--branch)}.trk{position:relative;margin:6px 26px 14px 8px}.trk .pbar{height:14px}.trk .pbar i{background:var(--coral)}.trk img{position:absolute;top:-12px;width:34px;height:34px;object-fit:contain;transform:translateX(-50%)}.trk img.fl{left:auto;right:-26px;transform:none;top:-14px;width:30px;height:38px}
.daily{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 10px;box-shadow:0 3px 0 var(--ink);font:inherit;animation:pulse 1s infinite alternate}.daily b{font-size:14px;text-shadow:0 1px 0 rgba(43,34,56,.4)}.daily small{grid-column:1;font-size:12px;font-weight:800}.daily small i{width:16px;height:16px;vertical-align:-3px}.daily .fire{grid-column:2;grid-row:1/3;font-weight:900;font-size:18px;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 9px}.daily.done{background:var(--leaf);animation:none}
.dchip{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 60px);text-align:center;font-weight:900;font-size:13px;background:rgba(255,244,214,.92);border:2px solid var(--ink);border-radius:999px;padding:3px 8px}#timer.late{background:var(--coral);color:#fff}
.dres{margin:6px 0;padding:6px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:800;font-size:14px}.dres.ok{background:var(--leaf);color:#fff;text-shadow:0 1px 0 rgba(43,34,56,.4)}.dres.ok span{display:block;font-size:17px}.dres i.gn{width:18px;height:18px;vertical-align:-3px}.dres .b1{font-size:15px;padding:8px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div><div id="papi"><img class="pf" alt=""><div class="pt"></div></div>
<div id="map"><div id="mhead"></div><div id="path"><div id="nodes"></div></div><div id="mfoot"></div></div>
<div id="modal"></div><div id="toasts"></div><div id="title"></div>
<script>window.SH_VERSION="1.0";window.SH_SPR={"anchor_leaf": "assets/anchor_leaf.png", "anchor_peg": "assets/anchor_peg.png", "anchor_twig": "assets/anchor_twig.png", "bg_garden": "assets/bg_garden.png", "bg_garden_base": "assets/bg_garden_base.png", "cat_awake": "assets/cat_awake.png", "cat_sleep": "assets/cat_sleep.png", "cocoon": "assets/cocoon.png", "dew": "assets/dew.png", "flower_closed": "assets/flower_closed.png", "flower_open": "assets/flower_open.png", "gnat": "assets/gnat.png", "hat_0": "assets/hat_0.png", "hat_1": "assets/hat_1.png", "hat_2": "assets/hat_2.png", "hat_3": "assets/hat_3.png", "hat_4": "assets/hat_4.png", "hat_5": "assets/hat_5.png", "hat_6": "assets/hat_6.png", "hat_7": "assets/hat_7.png", "hat_8": "assets/hat_8.png", "hat_9": "assets/hat_9.png", "logo": "assets/logo.png", "mina": "assets/mina.png", "mina_fly": "assets/mina_fly.png", "mina_happy": "assets/mina_happy.png", "mina_scared": "assets/mina_scared.png", "mina_spin": "assets/mina_spin.png", "mina_wave": "assets/mina_wave.png", "nest": "assets/nest.png", "papi_0": "assets/papi_0.png", "papi_1": "assets/papi_1.png", "papi_2": "assets/papi_2.png", "papi_3": "assets/papi_3.png", "raindrop": "assets/raindrop.png", "title_bg": "assets/title_bg.png", "ui_gift": "assets/ui_gift.png", "ui_nest": "assets/ui_nest.png", "ui_settings": "assets/ui_settings.png", "ui_shop": "assets/ui_shop.png"};window.SH_PRIVACY="<h4>Politique de confidentialité — Silk Hop</h4>\n<p><b>En bref :</b> aucun compte, aucune inscription. Ta progression reste sur ton appareil, les achats passent par Apple, et le jeu affiche des publicités Google AdMob que tu peux refuser.</p>\n<h4>Ta sauvegarde reste sur ton appareil</h4>\n<p>Niveaux, objets et réglages sont enregistrés uniquement sur ton appareil. Nous ne les recevons jamais. Supprimer le jeu efface la sauvegarde.</p>\n<h4>Achats intégrés</h4>\n<p>Les paiements sont gérés par Apple (App Store, StoreKit). Nous ne recevons ni coordonnées bancaires ni identité, seulement la liste des produits que tu possèdes. « Restaurer les achats » te permet de les récupérer sur un autre appareil. Aucun achat ne donne d’objet tiré au hasard, et il n’y a aucun abonnement.</p>\n<h4>Publicité (Google AdMob)</h4>\n<p>Des publicités plein écran apparaissent entre deux parties, et des vidéos bonus sont proposées si tu le veux. L’achat « Sans pub » retire les publicités plein écran. Le SDK Google Mobile Ads peut collecter l’identifiant publicitaire de l’appareil (IDFA), seulement si tu l’autorises dans la demande d’Apple (« Autoriser le suivi »), ainsi que des données techniques et d’interaction avec les annonces. Dans l’EEE, au Royaume-Uni et en Suisse, un écran de consentement de Google (UMP) te permet d’accepter, de refuser ou de gérer tes choix. Si tu refuses, seules des publicités non personnalisées s’affichent. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires. Comment Google utilise ces données : <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<h4>Mesure d’audience et plantages (Google Firebase)</h4>\n<p>Le jeu utilise Google Firebase Analytics et Firebase Crashlytics pour savoir comment il est joué (niveaux, durée des parties, écrans ouverts) et corriger les plantages. Ils collectent un identifiant d’installation aléatoire (pas l’identifiant publicitaire), le modèle d’appareil, la version du système, la langue, le pays déduit de l’adresse IP, des événements de jeu et, en cas de plantage, un rapport technique. Ces données ne servent pas à la publicité et ne sont pas reliées à ton identité : <a href=\"https://firebase.google.com/support/privacy\" target=\"_blank\" rel=\"noopener\">https://firebase.google.com/support/privacy</a></p>\n<h4>Ce que nous ne faisons pas</h4>\n<p>Aucun autre outil tiers que Google AdMob et Google Firebase, aucun profil, aucune vente de données, aucun accès aux contacts, photos, micro, caméra ou position GPS.</p>\n<h4>Enfants</h4>\n<p>Silk Hop s’adresse à un public général. Nous ne collectons sciemment aucune donnée d’enfant, et les publicités excluent les contenus sensibles.</p>\n<h4>Tes droits et contact</h4>\n<p>Nous ne détenons aucune donnée qui t’identifie : il n’y a donc rien à consulter ni à supprimer chez nous. Tu peux effacer ta partie dans les Réglages. Les données publicitaires se gèrent avec Réglages → Choix publicitaires ou les outils de Google. Pour toute question : <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Politique complète : <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n<hr>\n<h4>Privacy policy — Silk Hop</h4>\n<p><b>In short:</b> no account, no sign-up. Your progress stays on your device, purchases go through Apple, and the game shows Google AdMob ads that you can decline.</p>\n<p><b>Your save stays on your device:</b> levels, items and settings are kept only on your device. We never receive them. Deleting the game erases the save.</p>\n<p><b>In-app purchases:</b> payments are handled by Apple (App Store, StoreKit). We receive no payment or identity details, only which products you own. Restore purchases lets you get them back on another device. No purchase gives a random item, and there is no subscription.</p>\n<p><b>Advertising (Google AdMob):</b> full-screen ads appear between games, and bonus videos are offered if you want them. The “No ads” purchase removes full-screen ads. The Google Mobile Ads SDK may collect your device’s advertising identifier (IDFA), only if you allow it in Apple’s prompt (“Allow tracking”), as well as technical data and ad interaction data. In the EEA, the UK and Switzerland, Google’s consent screen (UMP) lets you accept, decline or manage your choices. If you decline, only non-personalised ads are shown. Change your mind any time in Settings → Ad choices. How Google uses this data: <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<p><b>Analytics and crash reports (Google Firebase):</b> the game uses Google Firebase Analytics and Firebase Crashlytics to understand how it is played (levels, session length, screens opened) and to fix crashes. They collect a random installation identifier (not the advertising identifier), device model, system version, language, the country inferred from the IP address, game events and, if the game crashes, a technical report. This data is not used for advertising and is not linked to your identity: <a href=\"https://firebase.google.com/support/privacy\" target=\"_blank\" rel=\"noopener\">https://firebase.google.com/support/privacy</a></p>\n<p><b>What we don’t do:</b> no third-party tools other than Google AdMob and Google Firebase, no profiles, no data sales, no access to contacts, photos, microphone, camera or GPS location.</p>\n<p><b>Children:</b> Silk Hop is meant for a general audience. We do not knowingly collect children’s data, and ads exclude sensitive content.</p>\n<p><b>Your rights and contact:</b> we hold no data that identifies you, so there is nothing to access or delete on our side. You can erase your progress in Settings. Ad data is managed with Settings → Ad choices or Google’s tools. Questions: <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Full policy: <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n";</script>
<script>// BETA IA — a simulated player inside the game, for tests and in-game video capture (spec: ZVisionAI/partage/spec-mode-beta-ia.md).

// scenes after them with BETA.game({...}) (see <game>/src/beta-game.js).

(() => {

  let scale = 1;

  const realSetTimeout = setTimeout.bind(window), realSetInterval = setInterval.bind(window), realClearTimeout = clearTimeout.bind(window), realClearInterval = clearInterval.bind(window);
  let pBase = realPerf(), pV = pBase, dV = realDate();

  function setSpeed(s) { if (CAPTURE) { scale = Math.max(0.1, s); return; } const now = realPerf(); pV = pV + (now - pBase) * scale; dV = dV + (now - pBase) * scale; pBase = now; scale = Math.max(0.1, s); }

    window.setInterval = (f, ms, ...a) => { const id = ++tid; const every = Math.max(1, ms || 0); timers.set(id, { at: pV + every, f, a, every }); return id; };

    ev(type, data) { const e = { t: +t0().toFixed(2), type, ...(data || {}) }; B.log.push(e); if (opts.log) console.log('[BETA]', JSON.stringify(e)); return e; },
    mark(label) { const m = { t: +t0().toFixed(2), label }; B.marqueurs.push(m); B.ev('moment', { label }); return m; },
    state() { return { on: ON, running: B.running, ready: !!B.ready, scene: B.scene, t: +t0().toFixed(2), fps: B.fps, actions: B.log.filter(e => e.type === 'action').length, errors: B.errors.length, marqueurs: B.marqueurs, stuck: B.stuck || false }; },
  };

  for (const m of ['setPointerCapture', 'releasePointerCapture']) { const f = Element.prototype[m]; Element.prototype[m] = function (id) { try { return f.call(this, id); } catch (e) {} }; }

  installClock(); setSpeed(opts.vitesse);
  // ---- sound in capture mode (?capture=1&audio=N seconds): every AudioContext the game creates is one OfflineAudioContext whose clock
  // is the video clock, so each note and sound lands at its exact video time; BETA.renderAudio() then gives the soundtrack as a WAV ----

  // a master gain, so the render is short (rendering 150 s of unused preparation made 30 s clips time out).

    if (!offCtx) return '';
    const buf = await offCtx.startRendering(), r = buf.sampleRate, a = Math.floor(LEAD * r), n = Math.min(buf.length - a, Math.floor(dur * r));
    const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L, out = new DataView(new ArrayBuffer(44 + n * 4));

    w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
    out.setUint32(24, r, true); out.setUint32(28, r * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 4, true);

    #beta-end{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(10,10,20,.82);color:#fff;font:900 28px system-ui;text-align:center;animation:betaFade .5s}

  let finger = null, fx = innerWidth / 2, fy = innerHeight * 0.75;
  function ensureUI() {

  const frame = () => new Promise(r => requestAnimationFrame(r));
  const jitter = (a, b) => a + (b - a) * rnd();
  const pace = () => opts.style === 'rapide' ? [250, 550] : opts.style === 'debutant' ? [900, 2200] : [600, 1400];

  async function moveTo(x, y) {

    const sx = fx, sy = fy, d = Math.hypot(x - sx, y - sy), dur = Math.min(350, 150 + d * 0.5) * scale, t = performance.now();

    while (true) { const k = Math.min(1, (performance.now() - t) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const px = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * x, py = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * y; place(px, py);
      if (k >= 1) break; await frame(); }
  }
  function fire(type, x, y, target) {
    const el = target || document.elementFromPoint(x, y) || document.body;
    const common = { bubbles: true, cancelable: true, composed: true, clientX: x, clientY: y, screenX: x, screenY: y, button: 0, buttons: type.endsWith('down') || type.endsWith('move') ? 1 : 0, view: window };

  // A tap where a finger would land: pointer + mouse events, then a click on the element under it.
  async function tap(x, y, label) {
    if (!B.running) return; await moveTo(x, y); await realWait(jitter(40, 110));
    if (finger) finger.classList.add('down'); ring(x, y);
    const el = fire('pointerdown', x, y); fire('mousedown', x, y, el); await realWait(jitter(50, 90));
    fire('pointerup', x, y, el); fire('mouseup', x, y, el); el.click && el.click();
    if (finger) finger.classList.remove('down');

  // starting saves: a new game, about an hour in (6 levels, a few hats), late game (the whole garden, the nest decorated)
  function makeSave(kind) {
    const s = S(); s.tut = 1; s.tuto = 1; s.consent = s.consent == null ? false : s.consent; s.login = { last: new Date().getFullYear() + '-' + (new Date().getMonth() + 1) + '-' + new Date().getDate(), streak: 2, pending: false };
    const upto = kind === 'avance' ? 12 : 6; for (let i = 1; i <= upto; i++) s.lvl[i] = { done: 1, stars: i % 3 === 0 ? 2 : 3, best: 20 + i * 2 };
    s.gnats = kind === 'avance' ? 1840 : 420; s.pearls = kind === 'avance' ? 60 : 0; s.plv = kind === 'avance' ? 9 : 4; s.xp = 60;
    s.hats = { 0: 1, 1: 1, 2: 1, 3: 1 }; s.hat = 2; s.totals.combo5 = 1; s.elastic = true; s.said = Object.assign(s.said || {}, { web: 1 });   // hints already seen
    if (kind === 'avance') { Object.assign(s.hats, { 4: 1, 5: 1, 6: 1, 9: 1 }); s.hat = 6; s.decos = { lamp: 1, rug: 1, cup: 1, mobile: 1 }; s.cocoon = { id: 'hammock', end: Date.now() + 47 * 60000 }; }
    H.save();
  }

  BETA.game({
    sfx: H.SFX,
    logo: () => H.src('logo'),
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => { const s = H.s(); return [Object.keys(S().lvl).length, s ? Math.round(s.y / 50) : -1, s ? s.n : 0, G.phase]; },
    async prepare(save, A) {
      if (A.opts.scene === 'onboarding') return;            // onboarding starts from the title screen of a new game
      if (A.opts.scene === 'defi') makeSave('avance'); else if (save !== 'neuf') makeSave(save);   // the challenge needs level 12 finished
      await start(A); await A.wait(600); await clean(A);
      if (G.phase === 'play' && H.L() && H.L().tut) { G.over = true; H.showMap(); await A.wait(500); await clean(A); }
      if (A.opts.scene === 'boucle') {   // the loop starts inside the level, not on the map
        const id = Math.min(12, (Object.keys(S().lvl).filter(k => S().lvl[k].done).length || 0) + 1 - (A.rnd() < 0.5 ? 2 : 1)); await openLevel(A, Math.max(2, id));
        document.getElementById('papi').classList.remove('on'); await A.wait(300); }
      if (A.opts.scene === 'defi') { const ch = H.LV.find(l => l.challenge); if (ch) await openLevel(A, ch.id); document.getElementById('papi').classList.remove('on'); await A.wait(300); }
      // the wow moment starts off camera: level 5, high up, a 8-catch chain running (the next catches give ×5), the flower in sight
      if (A.opts.scene === 'moment') { await openLevel(A, 5); const s = H.s(), L = H.L();
        if (s) { const ai = L.anchors.reduce((b, a, i) => a[1] < L.flower[1] - 520 && a[1] > (b < 0 ? -1 : L.anchors[b][1]) ? i : b, -1); const a = L.anchors[Math.max(0, ai)];
          C.revive(L, s); s.x = a[0] + (a[0] < 200 ? 60 : -60); s.y = a[1] - 50; s.camB = s.y - K.camUp; s.n = 8; s.ev.length = 0;
          for (let i = 0; i < L.gnats.length; i++) if (L.gnats[i][1] < a[1]) s.gn[i] = 1; s.dw.fill(1); G.trail.length = 0; G.parts.length = 0; }
        document.getElementById('papi').classList.remove('on'); await A.wait(300); }
    },
    scenes: {
      // title -> tutorial with Papi -> first flower (< 15 s) -> next level
      async onboarding(A) { watch(A); await start(A); for (let i = 0; i < 4 && A.running(); i++) { const r = await playLevel(A, 40); if (r === 'win') await afterWin(A); else if (r === 'dead') await afterDead(A); else break; } },
      // the satisfying core: a whole level of swings, combos, dew and the flower
      async boucle(A) { watch(A); if (G.phase !== 'play') { const id = Math.min(12, (Object.keys(S().lvl).filter(k => S().lvl[k].done).length || 0) + 1); await openLevel(A, Math.max(2, id)); }
        for (let i = 0; i < 4 && A.running(); i++) { const r = await playLevel(A, 60); if (r === 'win') { await afterWin(A); } else if (r === 'dead') await afterDead(A); else break; } },
      // time-lapse: levels one after another at double speed, the garden map filling up between them (each jump marked)
      async progression(A) { watch(A); await start(A); A.speed(2);
        for (let i = 0; i < 12 && A.running(); i++) { const r = await playLevel(A, 45); if (r === 'win') { A.mark('niveau ' + (H.L() ? H.L().id : '') + ' fini'); await afterWin(A, false); const nxt = H.LV.find(l => H.unlocked(l.id) && !S().lvl[l.id]); await A.wait(900); if (nxt) await openLevel(A, nxt.id); } else if (r === 'dead') await afterDead(A); else if (r === 'map') { const nxt = H.LV.find(l => H.unlocked(l.id) && !S().lvl[l.id]); if (nxt) await openLevel(A, nxt.id); } } },
      // the wow moment: a long chain near the top of a level: big slow-motion swing at ×5, then the flower opening
      async moment(A) { watch(A); const r = await playLevel(A, 14); if (r === 'win') await A.wait(1500); },
      // the timed challenge level (L.challenge), played to the flower with the stopwatch on screen, then the result card with the time
      async defi(A) { watch(A); A.mark('défi chronométré : top départ');
        let sec = 0; const tick = setInterval(() => { const s = H.s(); if (!A.running() || !s) return clearInterval(tick); const k = Math.floor(s.t / 5) * 5; if (k > sec && !s.win) { sec = k; A.mark('chrono ' + k + ' s'); } }, 100);
        for (let i = 0; i < 3 && A.running(); i++) { const r = await playLevel(A, 90); if (r === 'win') { clearInterval(tick); const s = H.s(); A.mark('défi fini en ' + (s ? s.t.toFixed(1) : '?') + ' s'); await A.wait(3500); break; } if (r === 'dead') { A.mark('chute, on recommence'); await afterDead(A); } else break; } },
      // plays on until stopped (long tests)
      async idle(A) { watch(A); while (A.running()) { const nxt = H.LV.find(l => H.unlocked(l.id) && !S().lvl[l.id]) || H.LV[Math.floor(A.rnd() * 12)]; await openLevel(A, nxt.id); const r = await playLevel(A, 90); if (r === 'win') await afterWin(A, false); else if (r === 'dead') await afterDead(A); await clean(A); } },
    },
  });
})();
</script>
