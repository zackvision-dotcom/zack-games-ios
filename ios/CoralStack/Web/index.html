<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d6f86">
<title>Coral Stack</title>
<style>
:root{--ink:#16424f;--paper:#fff7e6;--deep:#0f4a5c;--teal:#2b9db0;--coral:#f0705a;--sand:#f3d9a0;--gold:#f4c94a;--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd6d6;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.b1,.b2,.b3{border-radius:16px;padding:10px 16px;font-weight:900;border:3px solid var(--deep);transition:transform .08s}
.b1{background:linear-gradient(#ff9a7e,#f0705a);color:#fff;text-shadow:0 2px 0 rgba(15,74,92,.45);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 var(--deep)}
.b2{background:var(--paper);box-shadow:0 3px 0 var(--deep)}
.b3{background:#ffd9d0;color:#a8403a;box-shadow:0 3px 0 var(--deep)}
.b1:active,.b2:active,.b3:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
button:disabled{opacity:.45;filter:grayscale(.5)}
.big{display:block;width:100%;font-size:19px;padding:12px;margin-top:10px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}#hud>*{pointer-events:auto}
.pill,.goalbox,.card,#sheet,.toast,.tabs button,.quest,.sitem,.lg,.tut,.pack{background:var(--paper);border:3px solid var(--deep);box-shadow:inset 0 0 0 2px #fff,0 3px 0 rgba(15,74,92,.6)}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;gap:8px;align-items:center}
.pill{border-radius:999px;padding:4px 5px 4px 10px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
.pill.tide{background:linear-gradient(#5fc4d4,#2b9db0);color:#fff;padding-right:12px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.plus{width:24px;height:24px;border-radius:50%;background:linear-gradient(#8fe3a0,#3fae6a);color:#fff;font-weight:900;font-size:18px;line-height:20px;border:2px solid #22744a;padding:0}
.gear{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--paper);border:3px solid var(--deep);font-size:22px}
.goalbox{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 56px);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700}
.goalbox b{color:#c24f3c}.goalbox small{opacity:.7}
.tidebar{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 92px);height:8px;border-radius:9px;background:rgba(255,247,230,.7);overflow:hidden;border:2px solid var(--deep)}
.tidebar i{display:block;height:100%;background:linear-gradient(90deg,#7ef0c0,#2b9db0)}
.tabs{position:absolute;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 6px);display:flex;gap:5px}
.tabs button{flex:1;border-radius:14px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:21px;position:relative}
.tabs button span{font-size:10px;font-weight:900}
#drawerbar.hot{background:#c9f2ff;transform:scale(1.08)}
.badge{position:absolute;top:-6px;right:-3px;background:var(--coral);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:15px;font-weight:900;border:2px solid #fff}
.tut{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);border-color:var(--coral);border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{translate:0 -6px}}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62%;overflow:auto;border-radius:20px 20px 0 0;border-bottom:0;padding:6px 14px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(105%);transition:transform .22s;z-index:5}
#sheet.on{transform:none}
.grip{width:44px;height:5px;border-radius:9px;background:rgba(15,74,92,.35);margin:4px auto 8px}
h2,h3{margin:4px 0 10px;color:var(--deep)}
h2{background:var(--teal);color:#fff;border-radius:10px;padding:5px 12px;font-size:18px;display:inline-block}
.ci{width:46px;height:46px;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 2px 1px rgba(15,74,92,.3))}.ce{display:inline-grid;place-items:center;font-size:28px}
.info{display:flex;gap:12px;align-items:flex-start}.info .ci{width:96px;height:96px}.info p{margin:4px 0 8px;font-weight:800}
.mini .rrow,.book .rrow{margin-bottom:6px}
.rrow{display:flex;align-items:center;flex-wrap:wrap;gap:2px;background:#fff;border-radius:12px;padding:3px 6px;border:2px solid rgba(15,74,92,.25)}
.rrow .ci{width:34px;height:34px}.rrow i{font-style:normal;font-weight:900;color:var(--teal);margin:0 2px}.rrow .w{font-size:22px}
.book{max-height:52vh;overflow:auto}
.hintbox{background:#fff3c4;border-radius:12px;padding:6px 8px;margin-bottom:10px;border:2px dashed var(--coral)}.hintbox b{display:block;font-size:12px;color:#c24f3c}
.pack{display:flex;gap:8px;align-items:center;border-radius:14px;padding:6px 8px;margin-bottom:8px}.pack.off{opacity:.55}.pack .pi{flex:1;font-size:13px}.pack small{display:block;font-size:10.5px;opacity:.8;line-height:1.3}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
#modal{position:fixed;inset:0;background:rgba(10,40,55,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
#modal.on{display:flex}
.card{border-radius:20px;padding:12px 14px;width:100%;max-width:400px;max-height:92%;overflow:auto}.card.wide{max-width:520px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.stats div{background:#fff;border-radius:12px;padding:6px 8px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;border:2px solid rgba(15,74,92,.2)}
.msg{font-weight:800}
.ads{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}.ads button{font-size:13px;text-align:left}
.packrow{display:flex;gap:6px}.packrow button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px}.packrow .ci{width:46px;height:46px}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.lg{border-radius:10px;text-align:center;font-size:12px;padding:4px 0;font-weight:900;border-width:2px}.lg small{display:block;font-size:9px;font-weight:700}.lg.got{background:#d8f2e4}.lg.now{background:var(--gold)}
.quest,.sitem{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:14px;padding:7px 10px;margin-bottom:8px;font-weight:900}
.quest small,.sitem small{display:block;font-weight:700;opacity:.75;font-size:12px}
.sitem .b1{white-space:nowrap;flex:none}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800}.sw input{width:22px;height:22px;accent-color:var(--coral)}.sw select{font:inherit;padding:4px;border-radius:10px;border:2px solid var(--deep);background:#fff}
.card>.b2,.card>.b3{display:block;width:100%;margin-top:8px}
.row{display:flex;gap:8px}.row>button{flex:1}
.note{font-size:12px;background:#fff0b8;border-radius:10px;padding:5px 9px;margin-bottom:8px;font-weight:800}
.ver{text-align:center;font-size:11px;opacity:.6;margin-top:8px}.legal{font-size:13px;line-height:1.45}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 110px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px;transition:opacity .4s,transform .4s;max-width:92%;text-align:center}.toast.out{opacity:0;transform:translateY(-10px)}
.confirm{position:fixed;inset:0;background:rgba(10,40,55,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.adov{position:fixed;inset:0;background:#0f4a5c;z-index:30;display:flex;align-items:center;justify-content:center}.adbox{text-align:center;color:#fff}.adtag{background:var(--gold);color:var(--deep);font-weight:900;border-radius:8px;padding:4px 10px;display:inline-block}.adart{font-size:60px;margin:20px}.adcount{font-size:28px;font-weight:900}
#title{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;padding:24px 24px calc(env(safe-area-inset-bottom) + 40px);background:radial-gradient(circle at 50% 20%,#bff3ee,#4fbccc 45%,#1d6f86);z-index:10}
#title.on{display:flex}
#title .logo{position:absolute;top:calc(env(safe-area-inset-top) + 10%);left:16px;right:16px;text-align:center}
#title .logo img{width:100%;max-width:420px}
#title h1{font-size:64px;line-height:.9;margin:0;color:#fff;text-shadow:0 4px 0 #0f4a5c}
#title p{display:inline-block;margin:14px 0 0;font-weight:900;font-size:16px;background:var(--paper);border-radius:999px;padding:4px 14px;border:3px solid var(--deep)}
#title .hero{position:absolute;top:calc(env(safe-area-inset-top) + 40%);left:50%;transform:translateX(-50%);width:min(72vw,340px);border-radius:50%;border:6px solid #fff7e6;box-shadow:0 8px 0 rgba(15,74,92,.5),0 0 0 10px rgba(255,255,255,.25);animation:bob 3s ease-in-out infinite}
#title .big{max-width:280px}.evt{background:var(--paper);border-radius:999px;padding:4px 14px;font-weight:900;border:3px solid var(--deep)}

/* ===== table layout after Zack's mock-up ===== */
:root{--cw:66px;--ch:90px;--gold:#d9a84a;--gold2:#a8762a;--parch:#fbf0d6}
#game{position:fixed;inset:0;pointer-events:none;display:none}#game.on{display:block}#game>*{pointer-events:auto}
.topbar{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:8px;right:8px;display:flex;align-items:center;gap:5px}
.avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;flex:none;border:3px solid var(--gold);box-shadow:0 0 0 2px var(--gold2),0 3px 6px rgba(0,0,0,.3);background:#bfe9e6;display:grid;place-items:center;font-size:30px}.avatar img{width:100%;height:100%;object-fit:cover}
.cnt{flex:1;min-width:0;display:flex;align-items:center;gap:3px;background:linear-gradient(#fff6df,#f1dfb5);border:2px solid var(--gold2);border-radius:999px;padding:2px 6px 2px 2px;box-shadow:0 2px 0 rgba(90,60,20,.35);font-size:13px}
.cnt .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:13px;flex:none}
.cnt b{font-size:13px;color:#4a3420;white-space:nowrap}.cnt.low b{color:#c2402c}.cnt.shells{flex:1.4}
.plus{width:22px;height:22px;border-radius:50%;background:linear-gradient(#8fe3a0,#3fae6a);color:#fff;font-weight:900;font-size:16px;line-height:18px;border:2px solid #22744a;padding:0;margin-left:auto;flex:none}
.level{position:absolute;top:calc(env(safe-area-inset-top) + 66px);left:50%;transform:translateX(-50%);width:min(86%,380px);display:flex;align-items:center;gap:6px}
.level .lv{background:linear-gradient(#7a4a26,#5a3418);color:#fff4dc;font-weight:900;font-size:13px;border-radius:999px;padding:3px 10px;border:2px solid var(--gold);white-space:nowrap}
.level .bar{flex:1;height:16px;border-radius:999px;background:#3b2a1c;border:2px solid var(--gold);position:relative;overflow:visible}
.level .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(#7fe0e8,#2ba3c0)}
.level .bar em{position:absolute;top:-6px;font-style:normal;font-size:20px;color:#6b5030;text-shadow:0 1px 0 #000}.level .bar em.on{color:#ffd34d;text-shadow:0 0 6px #ffe9a0}
.goaltip{position:absolute;top:calc(env(safe-area-inset-top) + 92px);left:50%;transform:translateX(-50%);background:rgba(251,240,214,.92);border:2px solid var(--gold2);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:800;color:#4a3420;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.goaltip small{opacity:.7}
#combo{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 118px);background:linear-gradient(#fff3d6,#ecd29a);border:3px solid var(--gold2);border-radius:12px;padding:4px 12px;text-align:center;transform:rotate(-6deg) scale(0);opacity:0;color:#5a3418;font-family:Georgia,serif}
#combo b{display:block;font-size:30px;line-height:1}#combo span{font-size:15px;font-weight:700}
#combo.on{animation:combo 2.2s ease-out forwards}@keyframes combo{10%{transform:rotate(-6deg) scale(1.2);opacity:1}20%{transform:rotate(-6deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-6deg) scale(.9)}}
#table{position:absolute;left:6px;right:6px;top:calc(env(safe-area-inset-top) + 126px);bottom:calc(env(safe-area-inset-bottom) + 196px);display:flex;flex-direction:column;justify-content:center;gap:10px}
.row{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px;border-radius:18px;background:rgba(240,250,248,.18);border:2px solid rgba(255,255,255,.35);position:relative}
.row.ready{background:rgba(255,240,190,.25);border-color:rgba(255,226,140,.8)}
.row.locked{min-height:calc(var(--ch) + 12px);background:rgba(10,40,55,.25)}
.lockmsg{color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000;text-align:center;padding:0 20px}
.slot{width:calc(var(--cw) + 14px);height:calc(var(--ch) + 6px);position:relative;border-radius:14px;flex:none}
.slot .empty,.res .empty{position:absolute;inset:3px;border-radius:14px;background:rgba(255,248,230,.45) radial-gradient(circle at 50% 45%,rgba(255,255,255,.6) 0 14px,transparent 15px);border:2px dashed rgba(120,90,50,.45)}
.slot.hot{outline:3px solid #ffd34d;outline-offset:2px}
.slot .pl{position:absolute;top:0;left:calc(var(--k) * 7px);transform:rotate(calc((var(--k) - 1) * 4deg))}
.slot .more{position:absolute;right:-4px;bottom:-4px;background:#2b7f86;color:#fff;font-style:normal;font-weight:900;font-size:11px;border-radius:999px;padding:1px 6px;border:2px solid #fff;z-index:3}
.op{font-size:26px;font-weight:900;color:#ffd34d;text-shadow:0 2px 0 #8a5a1a,0 0 6px rgba(255,220,120,.8);flex:none}.op.ar{font-size:30px;letter-spacing:-6px}
.res{width:calc(var(--cw) + 6px);height:calc(var(--ch) + 6px);position:relative;border-radius:14px;flex:none}
.res.glow{filter:drop-shadow(0 0 8px #ffe28a) drop-shadow(0 0 14px #ffd34d)}
.res .ring{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:conic-gradient(#7ef0c0 calc(var(--p) * 360deg),rgba(15,74,92,.6) 0);box-shadow:0 0 0 2px #fff;display:none}.res.glow .ring{display:block}
.res .unk{position:absolute;inset:3px;border-radius:14px;background:linear-gradient(#fff3d0,#e9c97a);border:3px solid var(--gold);display:grid;place-items:center;font-size:38px;font-weight:900;color:#8a5a1a}.res .unk.small{font-size:11px;padding:6px;text-align:center}
.res .sell{position:absolute;inset:3px;border-radius:14px;background:#fff3d0;display:grid;place-items:center;font-size:36px;border:3px solid var(--gold)}
.cc{width:var(--cw);height:var(--ch);position:relative;border-radius:12px;background:var(--parch) center/100% 100% no-repeat;touch-action:none;user-select:none;-webkit-user-select:none}
.cc.f-creature,.cc.f-node,.cc.f-res,.cc.f-building,.cc.f-rare,.cc.f-item,.cc.f-pack{background-color:transparent}
.cc .art{position:absolute;left:18%;right:18%;top:20%;height:44%;display:grid;place-items:center}.cc .art img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(60,40,20,.35))}.cc .art span{font-size:28px}
.cc .nm{position:absolute;left:14%;right:14%;bottom:11%;text-align:center;font-size:8px;font-weight:900;color:#4a3420;line-height:1.05;max-height:2.2em;overflow:hidden}
.cc i{position:absolute;font-style:normal;font-weight:900;font-size:10px;color:#fff;border-radius:999px;min-width:17px;height:17px;line-height:13px;text-align:center;border:2px solid #fff;padding:0 3px;z-index:2}
.cc .bf{left:-4px;top:40%;background:#e0884a}.cc .bo{right:-4px;top:40%;background:#3aa0d6}.cc .bu{right:-4px;top:12%;background:#4c8a4a}.cc .bn{right:-5px;bottom:-5px;background:#c2402c;font-size:11px}
.cc.zz{filter:saturate(.4) brightness(.8)}.cc .z{left:50%;top:6%;transform:translateX(-50%);background:#2b4a7a}
.cc .bu.last{background:#d0402c;animation:jzbump .8s ease-in-out infinite}
.cc .wear{position:absolute;left:12%;right:12%;bottom:4px;height:5px;border-radius:3px;background:rgba(15,74,92,.35);overflow:hidden}.cc .wear::after{content:'';position:absolute;inset:0;width:calc(var(--w) * 100%);background:linear-gradient(90deg,#f0705a,#ffd34d 40%,#7ef0c0)}
.row.nope{animation:nope .4s}@keyframes nope{20%,60%{translate:-7px 0}40%,80%{translate:7px 0}}
.reveal{position:fixed;inset:0;z-index:55;display:grid;place-items:center;align-content:center;gap:8px;pointer-events:none;background:radial-gradient(circle,rgba(15,74,92,.35),rgba(15,74,92,.6));animation:rvin .25s ease-out}
.reveal.out{opacity:0;transition:opacity .35s}@keyframes rvin{from{opacity:0}}
.rv-rays{position:absolute;width:520px;height:520px;left:50%;top:50%;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,240,180,.35) 0 10deg,transparent 10deg 20deg);border-radius:50%;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 6s linear infinite}@keyframes spin{to{rotate:360deg}}
.rv-card{--cw:120px;--ch:160px;position:relative;animation:flip .6s cubic-bezier(.3,1.5,.5,1)}@keyframes flip{0%{transform:perspective(600px) rotateY(180deg) scale(.4)}100%{transform:perspective(600px) rotateY(0) scale(1)}}
.rv-card .cc{position:relative;width:var(--cw);height:var(--ch)}
.rv-new{position:relative;font-weight:900;font-size:30px;color:#ffd34d;-webkit-text-stroke:2px var(--deep);text-shadow:0 3px 0 var(--deep);animation:stamp .5s .35s both cubic-bezier(.3,1.8,.5,1)}@keyframes stamp{from{transform:scale(2.6) rotate(-12deg);opacity:0}}
.rv-name{position:relative;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 var(--deep)}
.tidebtn.wait b{opacity:.5}
.cc.lifting{opacity:.35}.cc.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) scale(1.12) rotate(-4deg);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
#hand{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 76px);height:calc(var(--ch) + 22px);display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:12px 12px 8px;scrollbar-width:none;touch-action:pan-x;background:linear-gradient(transparent,rgba(10,50,60,.3))}
#hand::-webkit-scrollbar{display:none}#hand.hot{background:rgba(255,226,140,.25)}#hand .hc{flex:none}
.botbar{position:absolute;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 6px);display:flex;align-items:flex-end;gap:6px}
.rb{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 35%,#fff6df,#e9cf98);border:3px solid var(--gold2);box-shadow:0 3px 0 rgba(90,60,20,.45);font-size:24px;position:relative}
.rb.teal{background:radial-gradient(circle at 40% 35%,#8fe0e6,#2b9db0);border-color:#1d6f86}.rb .badge{position:absolute;top:-4px;right:-4px}
.deck{flex:none;width:66px;height:62px;position:relative;margin:0 2px}
.deck span{position:absolute;left:8px;width:50px;height:46px;border-radius:9px;background:linear-gradient(135deg,#2b9db0,#1d6f86);border:2px solid var(--gold);box-shadow:0 2px 3px rgba(0,0,0,.25)}
.deck span:nth-child(1){top:12px;transform:rotate(-8deg)}.deck span:nth-child(2){top:8px;transform:rotate(4deg)}.deck span:nth-child(3){top:4px}
.deck span:nth-child(3)::after{content:'🪸';position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.deck b{position:absolute;left:0;right:0;bottom:-2px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;font-weight:900}
.tidebtn{flex:1;height:54px;display:flex;align-items:center;gap:6px;justify-content:center;background:linear-gradient(#fff6df,#ecd29a);border:3px solid var(--gold2);border-radius:16px;box-shadow:0 3px 0 rgba(90,60,20,.45);color:#4a3420;font-family:Georgia,serif}
.tidebtn .hg{font-size:26px}.tidebtn small{display:block;font-size:11px;font-weight:700;font-family:ui-rounded,system-ui}.tidebtn b{font-size:19px}

<script>// Coral Stack — painted assets cut from the ChatGPT sheets (window.CS_SPR = { name: url }).
// art_<sheet>_<index>, frame_<family>, board, logo. Everything falls back to drawn cards when missing.
window.CSART = (() => {
  const IMG = {}; let ready = false;
  function load(done) {
    const map = window.CS_SPR || {}, names = Object.keys(map); let left = names.length;
    if (!left) { done && done(); return; }
    names.forEach(n => { const im = new Image(); im.onload = () => { IMG[n] = im; fin(); }; im.onerror = fin; im.src = map[n]; });
    function fin() { if (--left === 0) { ready = true; done && done(); } }
  }
  const art = id => { const c = window.CARDS.cards[id]; return c && c.art && IMG[`art_${c.art[0]}_${String(c.art[1]).padStart(2, '0')}`] || null; };
  const frame = fam => IMG['frame_' + fam] || null;
  const board = () => IMG.board || null;
  let LOGO = null;
  const logoURL = () => (window.CS_SPR || {}).logo || null;
  const heroURL = () => (window.CS_SPR || {}).hero || null;
  const frameURL = fam => (window.CS_SPR || {})['frame_' + fam] || null;
  const anim = k => IMG['anim_' + k] || null;
  return { load, art, frame, board, logoURL, heroURL, frameURL, anim, get ready() { return ready; } };
})();
</script>
<script>// Shared "juice": flying coins, confetti, pops, dust and hearts (DOM + CSS only, cheap on phones).
window.JUICE = (() => {
  const css = `
.jz{position:fixed;z-index:60;pointer-events:none;left:0;top:0;will-change:transform,opacity}

.jz-dust{width:10px;height:10px;border-radius:50%;background:rgba(255,248,230,.95);animation:jzdust .6s ease-out forwards}

@keyframes jzheart{0%{transform:translate(var(--x0),var(--y0)) scale(.4);opacity:0}25%{opacity:1;transform:translate(var(--x0),calc(var(--y0) - 14px)) scale(1.2)}100%{transform:translate(var(--x0),calc(var(--y0) - 54px)) scale(1);opacity:0}}

.jz-bump{animation:jzbump .35s ease-out}@keyframes jzbump{40%{transform:scale(1.25)}}
.jz-flash{position:fixed;inset:0;z-index:58;pointer-events:none;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,240,180,.75),rgba(255,240,180,0) 45%);animation:jzflash .7s ease-out forwards}@keyframes jzflash{to{opacity:0}}

  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const center = el => { if (!el) return [innerWidth / 2, innerHeight / 2]; const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

    for (let i = 0; i < n; i++) {
      const c = mk('jz-coin', 'img'); c.src = src; const ox = (Math.random() - 0.5) * 50, oy = (Math.random() - 0.5) * 40;

<script>// Coral Stack scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Every action is a real gesture on screen: drag a card from the hand onto a row slot, tap a row card to take it back,
// tap a pack / chest / coin in the hand, the deck button, the tide window buttons. The game's own rules then craft.
(() => {
  if (!window.BETA || !BETA.on) return;
  const CS = window.CS, G = CS.G, D = CS.D, C = D.cards, S = () => CS.S();
  const isC = id => C[id].fam === 'creature';
  const nm = id => (window.I18N && I18N.name(C[id])) || id;
  const vis = sel => { const e = document.querySelector(sel); return e && e.offsetParent !== null ? e : null; };
  // ui=propre: no ad overlay, no real-money "+" next to the shells, no rewarded-ad buttons in the tide window
  if (BETA.opts.ui === 'propre') { const st = document.createElement('style'); st.textContent = '.adov{display:none!important}#hud .plus{display:none!important}#modal .ads{display:none!important}'; document.head.appendChild(st); }

  // ---------- reading the board ----------
  const ONE = { r_hut: 2, r_workshop: 1, r_kitchen: 1, r_glassworks: 1, r_airpump: 1, r_kelpfarm: 1, r_market: 1, r_school: 1, r_dock: 1, r_pearlfarm: 1, r_lanternhouse: 1, r_airbell: 1 };
  const GEN = /^r_(stone|seaweed|coral|sand|wreck|mussel|oxygen|fish)$/;
  const outOf = r => typeof r.out[0] === 'string' ? r.out[0] : r.out[0][0];
  function needs() {
    const all = CS.allCards(), pop = all.filter(c => isC(c.id)).length;

    return { all, pop, foodLow: food < pop + 1, oxyLow: oxy < pop + 1, cnt: id => all.filter(c => c.id === id).length };
  }
  // how much a player would like to start this recipe now (0 = never)
  function score(r, n, running) {
    if (r.id === 'r_baby' || r.id === 'r_sub' && n.pop < 4) return 0;
    if (ONE[r.id] && n.cnt(outOf(r)) >= ONE[r.id]) return 0;
    let s = GEN.test(r.id) ? 20 : ONE[r.id] ? 50 : 30;

    if (S().tut === 1 && r.id === 'r_cake') s = 100;
    if (n.foodLow && /^r_(cake|wrap|soup|urchin|fish)$/.test(r.id)) s = Math.max(s, 60);
    if (n.foodLow && r.id === 'r_seaweed') s = Math.max(s, 45);
    if (n.oxyLow && r.id === 'r_oxygen') s = Math.max(s, 55);
    if (!S().discovered[r.id]) s += 40;                       // discoveries are the best thing to watch
    if (GEN.test(r.id) && running.includes(r.id)) s -= 15;    // one of each harvester is enough

  }

    let best = null;

      const cs = rowCards(i), m = rowRecipe(i);

      if (cs.length) { const cur = m.market ? 40 : score(m.r, n, []); if (cur >= 30 || (G.rowNeed[i] && G.rowT[i] / G.rowNeed[i] > 0.45)) continue; }
      const pool = S().hand.concat(cs);
      for (const r of D.recipes) {
        const s = score(r, n, running); if (s <= 0 || (cs.length && s < 45)) continue;
        const p = picks(r, pool); if (!p) continue;
        const v = s - (cs.length ? 10 : 0) + BETA.rnd() * 6;

  const center = (el, A, k = 0.12) => { const q = el.getBoundingClientRect(); return [q.left + q.width * A.jitter(0.5 - k, 0.5 + k), q.top + q.height * A.jitter(0.5 - k, 0.5 + k)]; };

  // bring a card of the hand into view (the hand scrolls sideways when it is long)

    if (r.left >= h.left + 6 && r.right <= h.right - 6) return;
    const from = hand.scrollLeft, to = Math.max(0, from + (r.left + r.width / 2) - (h.left + h.width / 2));
    for (let k = 1; k <= 8; k++) { hand.scrollLeft = from + (to - from) * (1 - Math.pow(1 - k / 8, 3)); await A.wait(30); }
  }
  // drag one card of the hand onto a row slot
  async function dragTo(A, id, row) {
    let el = handEl(id); if (!el) return false;
    await showInHand(A, el); el = handEl(id); if (!el) return false;
    const slot = S().rows[row].a.length ? 'b' : 'a', sl = vis(`.slot[data-row="${row}"][data-slot="${slot}"]`); if (!sl) return false;
    const before = rowCards(row).length, [x1, y1] = center(el, A), [x2, y2] = center(sl, A, 0.1);
    await A.drag(x1, y1, x2, y2, `${nm(id)} → rangée ${row + 1}`, A.jitter(420, 620)); await A.wait(220);
    return rowCards(row).length > before;
  }
  // tap the top card of a row pile: it goes back to the hand
  async function takeBack(A, row) {
    for (const s of ['b', 'a']) {
      const pile = [...document.querySelectorAll(`.slot[data-row="${row}"][data-slot="${s}"] .pl .cc`)]; if (!pile.length) continue;
      const [x, y] = center(pile[pile.length - 1], A, 0.08); await A.tap(x, y, `reprendre (rangée ${row + 1})`); await A.wait(260); return true;
    }
    return false;
  }
  async function clearRow(A, row) { for (let k = 0; k < 12 && rowCards(row).length && A.running(); k++) { if (!(await takeBack(A, row))) break; await A.realWait(A.jitter(120, 260)); } }

  // ---------- popups (the tide window, consent, a stray sheet or confirm) ----------
  async function popups(A) {
    const conf = vis('.confirm [data-v="0"]'); if (conf) { await A.think(); await A.tapEl(conf, 'annuler'); return true; }
    if (vis('.adov')) { await A.wait(800); return true; }
    const c = vis('#modal [data-c]'); if (c) { await A.think(); await A.tapEl(A.opts.ui === 'propre' ? '#modal [data-c="0"]' : '#modal [data-c="1"]', 'consentement'); await A.wait(600); return true; }
    const next = vis('#modal [data-next]');
    if (next) {
      await A.wait(A.jitter(1400, 2000));    // let the tide numbers be read
      const packs = [...document.querySelectorAll('#modal [data-buy]')].map(b => [b, D.packs.find(p => p.id === b.dataset.buy)]).filter(([, p]) => p && p.price <= S().shells - 2);
      if (packs.length && needs().all.length < 70) { await A.tapEl(packs[packs.length - 1][0], 'paquet (coquillages)'); await A.wait(700); }
      await A.think(); await A.tapEl(vis('#modal [data-next]'), 'marée suivante'); await A.wait(900); return true;
    }
    const lg = vis('#modal [data-login]'); if (lg) { await A.think(); await A.tapEl(lg, 'cadeau du jour'); await A.wait(800); return true; }
    const close = vis('#modal [data-close]'); if (close) { await A.think(); await A.tapEl(close, 'fermer'); await A.wait(400); return true; }
    if (vis('#sheet.on')) {
      const b = vis('#sheet [data-sell]') || vis('#sheet [data-put]') || [...document.querySelectorAll('#sheet [data-buy]:not([disabled])')][0];
      if (b) { await A.think(); await A.tapEl(b, 'fiche'); await A.wait(400); return true; }
    }
    return false;
  }
  // never act during a reward animation: the new-recipe card, flying cards and shells
  async function settle(A) { for (let k = 0; k < 60 && A.running() && document.querySelector('.reveal'); k++) await A.wait(150); }

  // ---------- one decision, like a player looking at the board ----------
  async function turn(A, opt = {}) {
    if (await popups(A)) return true;
    await settle(A);
    // treasures in the hand: coins, chests, packs (one tap each)
    const tre = [...document.querySelectorAll('#hand .cc[data-hand]')].find(e => C[e.dataset.id] && (C[e.dataset.id].pack || e.dataset.id === 'chest' || C[e.dataset.id].coin));
    if (tre) { await showInHand(A, tre); await A.think(); const id = tre.dataset.id, el = handEl(id); if (el) { const [x, y] = center(el, A); await A.tap(x, y, nm(id)); if (C[id].pack || id === 'chest') A.mark(C[id].pack ? 'paquet ouvert' : 'coffre ouvert'); await A.wait(C[id].coin ? 800 : 1300); } return true; }
    // a row that makes nothing any more (a worn-out node, a lone worker): take its cards back
    for (let i = 0; i < CS.rowsOpen(); i++) if (rowCards(i).length && !rowRecipe(i)) { await A.think(); await clearRow(A, i); return true; }
    // too many loose cards: sell one with a long press, so the board never fills up
    if (needs().all.length > 80) {
      const ids = S().hand.filter(c => !isC(c.id) && C[c.id].sell && C[c.id].fam === 'res').map(c => c.id), id = ids.sort((a, b) => ids.filter(x => x === b).length - ids.filter(x => x === a).length)[0], el = id && handEl(id);
      if (el) { await showInHand(A, el); const [x, y] = center(handEl(id) || el, A); await A.think(); await A.drag(x, y, x, y, 'appui long ' + nm(id), 650); await A.wait(300); const sb = vis('#sheet [data-sell]'); if (sb) await A.tapEl(sb, 'vendre'); await A.wait(500); return true; }
    }
    // the next recipe
    const p = plan();
    if (p) {
      await A.think(); if (p.clear) await clearRow(A, p.i);
      A.ev('recette_lancee', { id: p.r.id, rangee: p.i + 1 });
      for (const c of p.cards) { if (!A.running()) break; if (!(await dragTo(A, c.id, p.i))) { A.ev('echec', { id: p.r.id, carte: c.id }); break; } await A.realWait(A.jitter(150, 400)); }
      return true;
    }
    // nothing to build: open a pack from the deck with shells (never real money)
    const pk = D.packs.filter(x => S().zones[x.zone] && x.price <= S().shells).pop();
    if (pk && opt.packs !== false && needs().all.length < 60) {
      await A.think(); if (await A.tapEl('#hud [data-a="packs"]', 'paquets')) { await A.wait(500); const b = vis(`#sheet [data-buy="${pk.id}"]`); if (b) { await A.think(); await A.tapEl(b, 'acheter ' + pk.id); await A.wait(900); } }
      return true;
    }
    return false;
  }

  // ---------- moments worth cutting on ----------
  function watch(A) {
    let disc = Object.keys(S().discovered).length, goal = S().goal, tide = S().tide, combo = G.combo, zones = Object.keys(S().zones).length, made = S().totals.made, phase = G.phase;
    const iv = setInterval(() => {
      if (!A.running()) return clearInterval(iv);
      const d = Object.keys(S().discovered); if (d.length > disc) { const r = D.recipes.find(x => x.id === d[d.length - 1]); disc = d.length; A.mark('recette découverte : ' + (r ? nm(outOf(r)) : '?')); A.ev('decouverte', { id: r && r.id }); }
      if (G.combo !== combo) { combo = G.combo; if (combo >= 2 && G.comboT > 3.5) A.mark('combo x' + combo); }
      if (S().goal > goal) { goal = S().goal; A.mark('niveau ' + (goal + 1)); A.ev('niveau', { niveau: goal + 1 }); }
      if (G.phase !== phase) { if (G.phase === 'tide') A.mark('fin de marée ' + S().tide); phase = G.phase; }
      if (S().tide !== tide) { tide = S().tide; A.ev('maree', { maree: tide }); }
      const z = Object.keys(S().zones).length; if (z > zones) { zones = z; A.mark('zone débloquée'); A.ev('deblocage', { zones: z }); }
      if (S().totals.made > made) { A.ev('recolte', { n: S().totals.made - made }); made = S().totals.made; }
    }, 100);
  }

  // ---------- title -> play ----------
  async function start(A) {
    if (A.opts.ui === 'propre' && S().consent == null) S().consent = false;   // clean takes: no consent window on camera (refused = no personalised ads)
    if (A.opts.ui === 'propre') S().owned.noads = true;      // clean takes: no interstitials
    if (G.phase !== 'title') return;
    await A.wait(900); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(700);
    await popups(A); await A.wait(400);
  }

  // ---------- starting saves, built off camera by fast-forwarding the real rules (like tools/play-test.mjs) ----------
  function botStep() {
    const rows = S().rows, open = CS.rowsOpen();
    rows.forEach((r, i) => { if ((r.a.length || r.b.length) && !CS.match(r.a.concat(r.b))) r.a.concat(r.b).forEach(c => CS.place(c.uid, 0, 'hand')); });
    const n = needs();
    for (let i = 0; i < open; i++) {
      if (rows[i].a.length || rows[i].b.length) continue;
      let best = null; for (const r of D.recipes) { const s = score(r, n, []); if (s <= 0) continue; const p = picks(r, S().hand); if (p && (!best || s > best.s)) best = { s, p }; }
      if (best) best.p.forEach((c, k) => CS.place(c.uid, i, k === 0 ? 'a' : 'b'));
    }
    for (const c of S().hand.slice()) if (C[c.id].pack || c.id === 'chest' || C[c.id].coin) CS.tapCard(c, document.querySelector('#hand'));
    if (n.all.length > 80) for (const c of S().hand.filter(c => C[c.id].fam === 'res' && C[c.id].sell).slice(0, n.all.length - 70)) { S().hand.splice(S().hand.indexOf(c), 1); S().shells += C[c.id].sell; }
  }
  async function fastForward(tides) {
    const S0 = S(), noads = S0.owned.noads, end = S0.tide + tides; S0.owned.noads = true;
    for (let k = 0; S0.tide < end && k < tides * 40; k++) {
      await new Promise(r => setTimeout(r, 40));              // card rewards arrive on timers: let them land, and let the page breathe
      if (G.phase === 'tide') {
        const b = [...document.querySelectorAll('#modal [data-buy]')].reverse().find(b => (D.packs.find(p => p.id === b.dataset.buy) || {}).price <= S0.shells - 2); if (b) b.click();
        const nx = document.querySelector('#modal [data-next]'); if (nx) nx.click(); continue;
      }
      botStep(); for (let i = 0; i < 20; i++) CS.step(0.5);
    }
    S0.owned.noads = noads; S0.tut = Math.max(S0.tut, 3); CS.save();
  }
  function tidy() {
    document.querySelectorAll('.reveal, .toast, .jz, .fly, .float, .ghost').forEach(e => e.remove());
    const cb = document.querySelector('#combo'); if (cb) cb.classList.remove('on');
    const hand = document.querySelector('#hand'); if (hand) hand.scrollLeft = 0;
  }
  // the moment: a row one card short of a recipe never made before (props set off camera)
  let staged = null;
  function stageMoment() {
    const S0 = S(); let r = D.recipes.filter(r => !S0.discovered[r.id] && r.in.length <= 3 && !/^r_(baby|sub)$/.test(r.id) && r.time <= 6).sort((a, b) => a.time - b.time)[0];
    if (!r) { r = D.recipes.find(x => x.id === 'r_ink') || D.recipes[0]; delete S0.discovered[r.id]; }
    const row = 0; rowCards(row).forEach(c => CS.place(c.uid, 0, 'hand'));
    const want = r.in.map(t => t === 'W' ? 'diver' : t), have = S0.hand.slice();
    for (const id of want) { const k = have.findIndex(c => c.id === id && !c.asleep); if (k >= 0) have.splice(k, 1); else S0.hand.push(CS.mkCard(id)); }
    const p = picks(r, S0.hand); if (!p) return;
    p.slice(0, -1).forEach((c, k) => CS.place(c.uid, row, k === 0 ? 'a' : 'b'));
    staged = { r, row, last: p[p.length - 1].id }; CS.renderAll();
  }

  // progression runs the game faster: its frame step is capped at 50 ms, so the rule speed follows the clock speed
  function syncSpeed(A) { let last = performance.now(); const f = now => { if (!A.running()) { G.speed = 1; return; } const d = now - last; last = now; G.speed = Math.max(1, d / 50); requestAnimationFrame(f); }; requestAnimationFrame(f); }

  BETA.dbg = { plan, needs, picks, score };   // for tools/beta probes
  BETA.game({
    sfx: CS.SFX,
    logo: () => (window.CSART && CSART.logoURL && CSART.logoURL()) || '',
    endText: () => S().lang === 'fr' ? 'Joue gratuitement' : 'Play free',
    progress: () => [S().tide, Object.keys(S().discovered).length, S().totals.made, S().goal, G.phase],
    async prepare(save, A) {
      if (A.opts.scene === 'onboarding') return;            // onboarding always starts from the title screen
      await start(A);
      if (save === 'milieu') await fastForward(6); else if (save === 'avance') await fastForward(16);
      if (A.opts.ui === 'propre') S().owned.noads = true;
      if (save !== 'neuf') S().hand.forEach(c => { c.asleep = 0; });   // a fresh tide: the divers worn out by the fast-forward are rested
      if (save !== 'neuf') {   // the fast-forward wears out the resource spots: give back a fresh seabed so there is something to harvest on camera
        for (const id of ['rock', 'seabed', 'vent', 'wreck', 'coralpatch', 'sandbank', 'octopus', 'seaweed', 'seaweed', 'seaweed', 'seaweed'])
          if (C[id] && S().hand.filter(c => c.id === id).length < (id === 'seaweed' ? 4 : 1)) S().hand.push(CS.mkCard(id));
      }
      if (A.opts.scene === 'moment') stageMoment();
      await A.wait(save === 'neuf' ? 600 : 2500); tidy(); CS.renderAll();   // let the fast-forward leftovers settle off camera
    },
    scenes: {
      // title -> consent -> the tutorial rows -> first recipes discovered, first goals
      async onboarding(A) { watch(A); await start(A); for (let i = 0; i < 40 && A.running(); i++) if (!(await turn(A))) await A.wait(500); },
      // the satisfying core: drag cards into rows, harvests land in the hand, new recipes and combos
      async boucle(A) { watch(A); let packs = 0; for (let i = 0; i < 30 && A.running(); i++) { const before = S().shells; const ok = await turn(A, { packs: packs < 1 }); if (S().shells < before) packs++; if (!ok) await A.wait(400); } },
      // before/after: the colony grows, sped up
      async progression(A) { watch(A); A.speed(Math.max(4, A.opts.vitesse)); syncSpeed(A); for (let i = 0; i < 200 && A.running(); i++) if (!(await turn(A))) await A.wait(400); },
      // the wow: the last card goes on the row, the new recipe flips in the middle of the screen
      async moment(A) {
        watch(A); await A.wait(400);
        if (staged) { await A.think(); await dragTo(A, staged.last, staged.row); }
        for (let k = 0; k < 120 && A.running() && !document.querySelector('.reveal'); k++) await A.wait(100);
        await settle(A); await A.wait(800);
        for (let i = 0; i < 3 && A.running(); i++) if (!(await turn(A, { packs: false }))) await A.wait(400);
      },
      // plays on until stopped (long tests, balance, memory)
      async idle(A) { watch(A); while (A.running()) if (!(await turn(A))) await A.wait(600); },
    },
  });
})();
</script>
