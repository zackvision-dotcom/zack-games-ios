<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1d2e">
<title>Crumble Crew</title>
<style>
:root{--ink:#3a2414;--paper:#fff3dc;--clay:#c8743c;--deep:#3a2414;--gold:#ffcf33;--teal:#4fd0d0;--panel:#4a3226}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1d2e;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 16px;font-weight:900;border:3px solid var(--deep);transition:transform .08s;display:block;width:100%;margin-top:8px}
.b1{background:linear-gradient(#ffb15c,#e0702c);color:#fff;text-shadow:0 2px 0 rgba(58,36,20,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 var(--deep)}
.b2{background:var(--paper);box-shadow:0 4px 0 var(--deep)}.b3{background:#f4d0c8;color:#8a2a1a;box-shadow:0 4px 0 var(--deep)}
.b1:active,.b2:active,.buy:active{transform:translateY(3px)}.b1:disabled{filter:grayscale(.8);opacity:.6}
.big{font-size:20px;padding:14px}
#game{display:none}#game.on{display:block}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;z-index:5;background:linear-gradient(rgba(30,18,24,.85),rgba(30,18,24,0))}
.bar1{display:flex;align-items:center;gap:8px}
.coin{flex:1;display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--deep);border-radius:999px;padding:3px 12px 3px 4px;box-shadow:0 3px 0 var(--deep);min-width:0}
i.cn{display:inline-block;width:1.05em;height:1.05em;background:url(assets/coin.png) center/contain no-repeat;vertical-align:-.12em;margin-right:3px}
img.ui{width:100%;height:100%;object-fit:contain;display:block}
.rb{padding:0;overflow:hidden}.rb img.ui{width:100%;height:100%}
#tabs button img.ui{width:34px;height:34px}
#fz img.ui{position:absolute;left:-2px;top:-9px;width:28px;height:28px;z-index:2}#fz{overflow:visible!important}
.pill{display:flex;align-items:center;gap:4px}.pill img.ui{width:30px;height:30px;margin:-6px 0 -6px -6px}
.lk img.ui{width:34px;height:34px;margin:auto}
#coinIco{width:30px;height:30px;display:grid;place-items:center;font-size:24px}#coinIco img{width:30px;height:30px;object-fit:contain}
#coins{font-size:22px;font-weight:900;white-space:nowrap}#rate{color:#8a5a2a;font-weight:800;white-space:nowrap}
.pill{background:linear-gradient(#7ef0c0,#2fb08a);border:3px solid var(--deep);border-radius:999px;padding:6px 10px;font-weight:900;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 3px 0 var(--deep);white-space:nowrap}
.pill.on{background:linear-gradient(#ffe27a,#f0a020)}
.rb{width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--deep);box-shadow:0 3px 0 var(--deep);font-size:19px;position:relative}
.rb.dot::after{content:'';position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:#e8483a;border:2px solid #fff}
.bar2{display:flex;align-items:center;gap:8px;margin-top:7px}
#lv{background:var(--deep);color:#fff;font-weight:900;border-radius:10px;padding:2px 9px;font-size:13px}
#lvbar{flex:1;height:10px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.3)}#lvbar i{display:block;height:100%;background:linear-gradient(90deg,#7ef0c0,#4fd0d0);transition:width .3s}
#layer{margin-top:5px;color:#ffe9c0;font-weight:800;font-size:12px;text-shadow:0 1px 2px #000;text-align:center}
#goal{margin:5px auto 0;max-width:340px;background:rgba(255,243,220,.92);border:2px solid var(--deep);border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px;text-align:center}#goal small{color:#8a5a2a}
#fz{position:relative;margin:6px auto 0;max-width:260px;height:16px;background:rgba(0,0,0,.5);border-radius:9px;overflow:hidden;border:2px solid #ffb15c}
#fz i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff7a2a,#ffd34d);transition:width .15s}
#fz span{position:relative;z-index:1;display:block;text-align:center;font-size:10px;font-weight:900;color:#fff;line-height:12px;text-shadow:0 1px 0 #000}
#fz.on{animation:fzp .3s infinite alternate}@keyframes fzp{to{box-shadow:0 0 14px #ff7a2a}}
/* bottom panel */
#panel{position:fixed;left:0;right:0;bottom:0;height:min(35vh,300px);z-index:5;background:var(--panel);border-top:4px solid var(--deep);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(0,0,0,.4)}
#tabs{display:flex;gap:4px;padding:6px 6px 0}
#tabs button{flex:1;background:#6b4a36;color:#ffe9c0;border-radius:12px 12px 0 0;padding:6px 2px 5px;font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:18px}
#tabs button span{font-size:11px}#tabs button.on{background:var(--paper);color:var(--ink)}
#modes{display:flex;gap:6px;justify-content:flex-end;padding:6px 10px 0;background:var(--paper)}
#modes button{background:#e8d4b0;border-radius:10px;padding:2px 10px;font-weight:900;font-size:12px;border:2px solid transparent}#modes button.on{border-color:var(--deep);background:#ffe27a}
#list{flex:1;overflow-y:auto;background:var(--paper);padding:6px 8px 10px;-webkit-overflow-scrolling:touch}
.it{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e2c89a;border-radius:14px;padding:6px 8px;margin-bottom:6px}
.it.lock{opacity:.55}.it.hl{border-color:#ff8a3a;box-shadow:0 0 0 3px rgba(255,138,58,.35);animation:hl 1s infinite alternate}@keyframes hl{to{box-shadow:0 0 0 6px rgba(255,138,58,.15)}}
.ico{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:28px;background:#f6e3c2;border-radius:12px}.ico img{width:44px;height:44px;object-fit:contain}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:15px}.tx em{font-style:normal;color:#c8743c;font-size:13px}.tx small{display:block;color:#7a5a3a;font-size:11.5px;line-height:1.25}
.buy{min-width:86px;background:linear-gradient(#8ee88a,#3fa84a);color:#fff;border:3px solid var(--deep);border-radius:12px;padding:3px 6px;box-shadow:0 3px 0 var(--deep);text-shadow:0 1px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.buy span{font-size:11px;font-weight:800}.buy b{font-size:14px;white-space:nowrap}.buy.off{background:#b9a892;filter:saturate(.3)}.buy.ad{background:linear-gradient(#7ad0ff,#2a8ad0)}
.lk{font-weight:900;color:#8a5a2a;min-width:50px;text-align:center}
.pbar{height:7px;background:#eadbc0;border-radius:4px;margin-top:3px;overflow:hidden}.pbar i{display:block;height:100%;background:#4fd0d0}
.note{font-size:12px;color:#7a5a3a;text-align:center;margin:2px 0 8px}.row2{display:flex;gap:8px}.row2>*{flex:1}
/* chief */
#chef{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 178px);z-index:6;display:flex;align-items:flex-start;gap:6px;pointer-events:none;opacity:0;transform:translateY(20px) scale(.9);transition:.25s}
#chef.on{opacity:1;transform:none}
#chef .cf{width:62px;height:62px;flex:none;border-radius:50%;background:radial-gradient(circle,#ffe9c0,#e8b77a) no-repeat;background-size:118%,cover;background-position:30% 18%,center;border:3px solid var(--deep);display:grid;place-items:center;font-size:34px;box-shadow:0 3px 0 var(--deep)}
#chef .ct{background:var(--paper);border:3px solid var(--deep);border-radius:4px 16px 16px 16px;padding:7px 11px;font-weight:800;font-size:13.5px;box-shadow:0 3px 0 var(--deep);max-width:300px}
/* overlays */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(20,10,10,.6);padding:18px}#modal.on{display:flex}
.card{background:var(--paper);border:4px solid var(--deep);border-radius:22px;padding:16px;max-width:380px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
.card.wide{max-width:520px;text-align:left}@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:4px 0 8px}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico{font-size:60px}.big-ico img{width:110px;height:110px;object-fit:contain}
.gain{font-size:30px;font-weight:900;color:#c8743c;margin:6px 0}.stars{font-size:38px;color:#ffb400;text-shadow:0 2px 0 var(--deep)}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:2px solid #e2c89a;border-radius:10px;padding:4px 1px;font-size:15px;display:flex;flex-direction:column;align-items:center}
.lg small{font-size:9px}.lg b{font-size:9px}.lg.got{opacity:.45}.lg.now{border-color:#ff8a3a;background:#ffe9c0}
.quest{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid #e2c89a;border-radius:12px;padding:6px 8px;margin-bottom:6px}.quest span{flex:1;font-weight:800;font-size:13px}.quest small{display:block;color:#8a5a2a}.quest .b1{width:auto;margin:0;padding:6px 10px;font-size:13px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:1px solid #e2c89a}.sw input{width:22px;height:22px}
.ver{font-size:11px;color:#8a6a4a;margin-top:8px}.legal{font-size:13px}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(20,10,10,.55);padding:20px}
#toasts{position:fixed;bottom:calc(min(35vh,300px) + 12px);left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--deep);border-radius:14px;padding:7px 14px;font-weight:800;box-shadow:0 3px 0 var(--deep);animation:pop .3s;transition:opacity .4s}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:38%;z-index:25;text-align:center;font-size:38px;font-weight:900;color:#ffe27a;-webkit-text-stroke:2px var(--deep);text-shadow:0 4px 0 var(--deep);pointer-events:none;animation:ban 1.8s cubic-bezier(.2,1.4,.4,1) forwards}
.banner.fz{color:#ff8a3a}.banner.lv{color:#7ef0c0}@keyframes ban{0%{transform:scale(2.5);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:#111;display:flex;align-items:center;justify-content:center}.adbox{color:#fff;text-align:center}.adtag{opacity:.7}.adart{font-size:60px;margin:20px}.adcount{font-size:40px;font-weight:900}
/* title */
#title{position:fixed;inset:0;z-index:10;display:none;background:linear-gradient(rgba(20,26,51,.55),rgba(20,26,51,0) 35%,rgba(20,26,51,0) 70%,rgba(20,26,51,.7));flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 40px);background:radial-gradient(circle at 50% 40%,rgba(255,200,120,.25),rgba(0,0,0,0) 60%)}
#title.on{display:flex}#title .logo{text-align:center}#title .logo img{width:min(90vw,440px)}#title h1{font-size:56px;margin:0;color:#ffcf6a;-webkit-text-stroke:3px var(--deep);line-height:.95}
#title p{color:#ffe9c0;font-weight:800;text-shadow:0 2px 3px #000;margin:6px 0}
#title .hero{font-size:90px;animation:bob 2.4s ease-in-out infinite}#title .hero img{width:min(66vw,300px)}@keyframes bob{50%{transform:translateY(-10px)}}
#title .b1{max-width:320px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="game"><div id="top"></div><div id="chef"><div class="cf"></div><div class="ct"></div></div><div id="panel"><div id="tabs"></div><div id="modes"></div><div id="list"></div></div></div>
<div id="modal"></div><div id="toasts"></div><div id="title"></div>
<script>window.CC_VERSION="1.0";window.CC_SPR={"bg_0": "assets/bg_0.png", "bg_1": "assets/bg_1.png", "bg_2": "assets/bg_2.png", "chef_0": "assets/chef_0.png", "chef_1": "assets/chef_1.png", "chef_2": "assets/chef_2.png", "chef_3": "assets/chef_3.png", "chest": "assets/chest.png", "chunk": "assets/chunk.png", "coin": "assets/coin.png", "logo": "assets/logo.png", "m_conveyor": "assets/m_conveyor.png", "m_crusher": "assets/m_crusher.png", "m_foundry": "assets/m_foundry.png", "m_polisher": "assets/m_polisher.png", "nugget": "assets/nugget.png", "rock_0": "assets/rock_0.png", "rock_1": "assets/rock_1.png", "rock_2": "assets/rock_2.png", "ui_crew": "assets/ui_crew.png", "ui_fire": "assets/ui_fire.png", "ui_gear": "assets/ui_gear.png", "ui_gift": "assets/ui_gift.png", "ui_lock": "assets/ui_lock.png", "ui_mach": "assets/ui_mach.png", "ui_res": "assets/ui_res.png", "ui_shop": "assets/ui_shop.png", "ui_star": "assets/ui_star.png", "ui_x2": "assets/ui_x2.png", "w_blaster_0": "assets/w_blaster_0.png", "w_blaster_1": "assets/w_blaster_1.png", "w_blaster_2": "assets/w_blaster_2.png", "w_cart_0": "assets/w_cart_0.png", "w_cart_1": "assets/w_cart_1.png", "w_cart_2": "assets/w_cart_2.png", "w_geo_0": "assets/w_geo_0.png", "w_geo_1": "assets/w_geo_1.png", "w_geo_2": "assets/w_geo_2.png", "w_miner_0": "assets/w_miner_0.png", "w_miner_1": "assets/w_miner_1.png", "w_miner_2": "assets/w_miner_2.png", "w_porter_0": "assets/w_porter_0.png", "w_porter_1": "assets/w_porter_1.png", "w_porter_2": "assets/w_porter_2.png"};window.CC_PRIVACY="<h4>Politique de confidentialité — Crumble Crew</h4>\n<p>Crumble Crew fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. RevenueCat vérifie les reçus d’achat avec un identifiant anonyme.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) sont envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Crumble Crew convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Crumble Crew</h4>\n<p>Crumble Crew works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Ad choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. RevenueCat checks receipts with an anonymous identifier.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) are sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Crumble Crew suits all ages but is not directed at children. We do not knowingly collect personal data from children.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>
<script>// Crumble Crew — the numbers of the game (shared by the game and tools/sim.mjs).
(function (root) {
  const E = {
    world: { w: 400, trip: 200 },               // logical units: the pile is ~200 units from the crusher
    rocks: [
      { id: 'stone', name: ['Rocher de pierre', 'Stone boulder'], hp: 1, tint: '#b9a27e' },
      { id: 'crystal', name: ['Rocher de cristal', 'Crystal boulder'], hp: 60, tint: '#9a7fe0' },
      { id: 'lava', name: ['Rocher de lave', 'Lava boulder'], hp: 2500, tint: '#e2683a' },
    ],
    layers: [300, 4000, 40000, 2.2e5, 7e5],   // hit points of the 5 layers of the first rock (×rock.hp)
    workers: {
      miner:   { cost: 10,   g: 1.2, every: 1.5, dmg: 1,  unlock: 0 },
      porter:  { cost: 25,   g: 1.2, cap: 5,  speed: 70, unlock: 0 },
      blaster: { cost: 900,  g: 1.24, every: 7,  dmg: 40, unlock: 1 },   // unlock = layers broken on this rock (or any prestige)
      cart:    { cost: 4000, g: 1.24, cap: 40, speed: 42, unlock: 2 },
      geo:     { cost: 15000, g: 1.3, bonus: 0.03, unlock: 3 },
    },
    order: ['miner', 'porter', 'blaster', 'cart', 'geo'],
    machines: {
      crusher:  { cost: 60,    g: 3, mult: 1.3, max: 10 },       // level upgrades: value ×1.3 each
      conveyor: { cost: 600,   g: 6,   speed: 1.5, max: 3 },     // haulers walk faster
      foundry:  { cost: 7000,  g: 10,  mult: 1.6, max: 2 },
      polisher: { cost: 60000, g: 10,  mult: 2, max: 1 },
    },
    morder: ['crusher', 'conveyor', 'foundry', 'polisher'],
    pick: { cost: 25, g: 2.8, max: 12 },          // the player's own pick: tap ×1.45 per level
    tapShare: 0.05,                               // a tap also deals 5 % of the crew's damage per second
    crit: { every: 10, mult: 10 },
    frenzy: { perTap: 0.07, decay: 0.12, time: 10, mult: 3 },
    nugget: { min: 7, max: 14, life: 3.2, secs: 12 },   // a nugget is worth ~12 s of income
    chest: { secs: 45 },
    prestige: { perStar: 0.5 },                   // each star: +50 % to everything, forever
    offline: { capH: 8, rate: 0.5, rateResearch: 1 },
    research: [
      { id: 'picks',  min: 10,  cost: 400 },      // miners and blasters ×2
      { id: 'boots',  min: 30,  cost: 3000 },     // haulers ×1.5 speed and capacity
      { id: 'lamp',   min: 60,  cost: 20000 },    // nuggets twice as often and twice as rich
      { id: 'night',  min: 240, cost: 90000 },    // offline gains at 100 %
    ],
    goals: [
      ['tap', 5, 5], ['miner', 1, 10], ['porter', 1, 15], ['miner', 3, 20], ['porter', 2, 30], ['crusher', 1, 40], ['layer', 1, 120],
      ['miner', 10, 150], ['conveyor', 1, 200], ['blaster', 1, 400], ['layer', 2, 900], ['porter', 8, 900], ['foundry', 1, 2500],
      ['cart', 1, 3000], ['layer', 3, 6000], ['miner', 25, 8000], ['geo', 1, 15000], ['layer', 4, 30000], ['polisher', 1, 60000], ['layer', 5, 100000],
    ],
    quests: [['tap', 300, 2], ['hire', 10, 3], ['nugget', 5, 2], ['chest', 2, 3], ['layer', 1, 4], ['frenzy', 3, 2]],   // [id, target, minutes of income]
    login: [2, 3, 5, 6, 8, 10, 20],   // minutes of income for each day of the week
    store: [
      { id: 'noads', price: '3,99 €', once: true },
      { id: 'starter', price: '1,99 €', once: true },
      { id: 'theme', price: '2,99 €', once: true },
    ],
    ads: { interFromSession: 3, gapSec: 180, boostMin: 5 },
  };
  E.workerCost = (k, n) => Math.ceil(E.workers[k].cost * Math.pow(E.workers[k].g, n));
  E.machineCost = (k, lvl) => Math.ceil(E.machines[k].cost * Math.pow(E.machines[k].g, lvl));
  E.pickCost = lvl => Math.ceil(E.pick.cost * Math.pow(E.pick.g, lvl));
  E.layerHp = (rock, k) => E.layers[k] * E.rocks[rock % E.rocks.length].hp * Math.pow(8, Math.floor(rock / E.rocks.length));
  // multipliers from a state {w:{}, m:{}, pick, stars, res:{}, boostT}
  E.value = s => (1 + E.prestige.perStar * (s.stars || 0)) * Math.pow(E.machines.crusher.mult, s.m.crusher || 0) * Math.pow(E.machines.foundry.mult, s.m.foundry || 0)

let buyMode = 1;   // 1, 10 or 0 (= max)
function bulk(costAt, start, max = Infinity) {
  let n = 0, c = 0;
  if (buyMode) { while (n < buyMode && start + n < max) { c += costAt(start + n); n++; } return { n, c }; }
  while (start + n < max && n < 1000) { const k = costAt(start + n); if (c + k > S.coins) break; c += k; n++; }
  if (!n) { n = 1; c = costAt(start); } return { n, c };
}
function hire(k) {
  const have = S.w[k] || 0, b = bulk(n => E.workerCost(k, n), have); if (b.c > S.coins || !b.n) return no();
  S.coins -= b.c; S.w[k] = have + b.n; S.totals.hired += b.n; questProg('hire', b.n);
  for (let i = 0; i < Math.min(b.n, 30); i++) spawnWorker(k, true);
  SFX.pop(); buzz(10); JUICE.pop(document.querySelector(`[data-hire="${k}"]`));
  if (S.tut === 1 && k === 'miner') { S.tut = 2; setTimeout(() => chef('c_hirePorter', 2), 3500); }

}

  checkGoal(); save(); renderPanel();
}

// ---------- update ----------
function machinePos(k) { return k === 'crusher' ? [L.crushX, L.ground - 6] : k === 'foundry' ? [372, L.ground - 70] : k === 'polisher' ? [300, L.ground - 74] : [ (L.pileX + L.crushX) / 2, L.ground + 4]; }
function update(dt) {
  G.t += dt;

  if (G.frenzyT > 0) G.frenzyT -= dt; else G.frenzy = Math.max(0, G.frenzy - E.frenzy.decay * dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 2.5); if (G.flash > 0) G.flash -= dt * 2; if (G.squash > 0) G.squash = Math.max(0, G.squash - dt * 7);
  const sp = E.haulSpeed(s), md = E.minerDmg(s), bd = E.blastDmg(s), v = E.value(s);
  const nPer = k => (S.w[k] || 0) / Math.max(1, G.crew.filter(c => c.k === k).length);   // each drawn worker stands for this many
  const per = { miner: nPer('miner'), porter: nPer('porter'), blaster: nPer('blaster'), cart: nPer('cart') };
  for (const w of G.crew) {
    w.ph += dt * 8; if (w.act > 0) w.act -= dt * 3;
    if (w.k === 'miner' || w.k === 'geo' || (w.k === 'blaster' && w.st === 'go')) {
      const dx = w.hx - w.x; if (Math.abs(dx) > 2) { w.x += Math.sign(dx) * Math.min(Math.abs(dx), 110 * dt); w.face = Math.sign(dx); w.moving = true; continue; }
      w.moving = false; w.face = w.x < L.rockX ? 1 : -1; if (w.k === 'blaster') w.st = 'idle';
    }
    if (w.k === 'miner') { w.t -= dt * fr; if (w.t <= 0 && S.hp > 0) { w.t += E.workers.miner.every; w.act = 1; hitRock(md * per.miner, true); if (Math.random() < 0.35) { SFX.tink(); } G.parts.push({ x: w.x + w.face * 14, y: w.y - 22, vx: w.face * rnd(-40, 20) - (w.x - L.pileX) * 0.6, vy: rnd(-140, -60), r: rnd(2, 4), life: 0.9, t: 0, col: rockCol(Math.random()), chunk: 1 }); } }
    else if (w.k === 'blaster') { w.t -= dt * fr; if (w.t <= 0 && S.hp > 0) { w.t += E.workers.blaster.every; w.act = 1; const bx = L.rockX + rnd(-60, 60), by = L.rockY + rnd(-20, 80); G.parts.push({ x: w.x, y: w.y - 20, tx: bx, ty: by, t: 0, life: 0.6, dyn: 1, dmg: bd * per.blaster }); } }
    else if (w.k === 'geo') { w.t -= dt; if (w.t <= 0) { w.t = rnd(6, 10); w.act = 1; if (Math.random() < 0.25) spawnNugget(); w.hx = 30 + Math.random() * 340; } }
    else {   // haulers
      const speed = E.workers[w.k].speed * sp * fr, cap = E.haulCap(w.k, s) * per[w.k];
      if (w.st === 'toPile') { if (w.x > L.pileX + 2) { w.x -= speed * dt; w.face = -1; w.moving = true; } else { w.moving = false; if (S.pile >= 0.5) { const n = Math.min(cap, S.pile); S.pile -= n; w.carry = n; w.st = 'toMach'; } } }
      else { if (w.x < L.crushX - 26) { w.x += speed * dt; w.face = 1; w.moving = true; } else { const c = w.carry * v; w.carry = 0; w.st = 'toPile'; addCoins(c, L.crushX, L.ground - 40); G.coinCombo++; G.coinComboT = 1.2; SFX.coin(G.coinCombo); G.machBump = 0.3; floatText(L.crushX + rnd(-10, 10), L.ground - 60, '+' + fmt(c), 'small'); } }
    }
  }
  if (G.coinComboT > 0) G.coinComboT -= dt; else G.coinCombo = 0;
  if (G.machBump > 0) G.machBump -= dt;
  // particles: chunks fall onto the pile, dynamite flies and explodes
  for (const p of G.parts) {

  document.querySelectorAll('#list [data-mach]').forEach(b => b.classList.toggle('off', E.machineCost(b.dataset.mach, S.m[b.dataset.mach] || 0) > S.coins));
  const p = document.querySelector('#list [data-pick]'); if (p) p.classList.toggle('off', E.pickCost(S.pick) > S.coins);
  document.querySelectorAll('#list [data-res]').forEach(b => b.classList.toggle('off', !!S.job || E.research.find(r => r.id === b.dataset.res).cost > S.coins));
  if (tab === 'res' && S.job) { const r = E.research.find(x => x.id === S.job.id), left = Math.max(0, S.job.end - Date.now()), bar = document.querySelector('#list .pbar i'), sp = document.querySelector('#list [data-finish] span'); if (bar) bar.style.width = (1 - left / (r.min * 60000)) * 100 + '%'; if (sp) sp.textContent = fmtTime(left / 1000); }
}
window.CC = { S: () => S, G, st, income, hire, upgrade, upPick, tapRock, startResearch, E, save, step: dt => update(dt) };
resize(); titleScreen(); requestAnimationFrame(frame);
})();
</script>
