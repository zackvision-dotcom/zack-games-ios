<title>Crumble Crew</title>
<style>

.big{font-size:20px;padding:14px}
#game{display:none}#game.on{display:block}

.bar1{display:flex;align-items:center;gap:8px}
.coin{flex:1;display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--deep);border-radius:999px;padding:3px 12px 3px 4px;box-shadow:0 3px 0 var(--deep);min-width:0}

.rb{padding:0;overflow:hidden}.rb img.ui{width:100%;height:100%}

.pill{display:flex;align-items:center;gap:4px}.pill img.ui{width:30px;height:30px;margin:-6px 0 -6px -6px}

#coins{font-size:22px;font-weight:900;white-space:nowrap}#rate{color:#8a5a2a;font-weight:800;white-space:nowrap}
.pill{background:linear-gradient(#7ef0c0,#2fb08a);border:3px solid var(--deep);border-radius:999px;padding:6px 10px;font-weight:900;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 3px 0 var(--deep);white-space:nowrap}
.pill.on{background:linear-gradient(#ffe27a,#f0a020)}
.rb{width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--deep);box-shadow:0 3px 0 var(--deep);font-size:19px;position:relative}
.rb.dot::after{content:'';position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:#e8483a;border:2px solid #fff}
.bar2{display:flex;align-items:center;gap:8px;margin-top:7px}
#lv{background:var(--deep);color:#fff;font-weight:900;border-radius:10px;padding:2px 9px;font-size:13px}
#lvbar{flex:1;height:10px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.3)}#lvbar i{display:block;height:100%;background:linear-gradient(90deg,#7ef0c0,#4fd0d0);transition:width .3s}
#layer{margin-top:5px;color:#ffe9c0;font-weight:800;font-size:12px;text-shadow:0 1px 2px #000;text-align:center}
#goal{margin:5px auto 0;max-width:340px;background:rgba(255,243,220,.92);border:2px solid var(--deep);border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px;text-align:center}#goal small{color:#8a5a2a}
#fz{position:relative;margin:6px auto 0;max-width:260px;height:16px;background:rgba(0,0,0,.5);border-radius:9px;overflow:hidden;border:2px solid #ffb15c}

#fz span{position:relative;z-index:1;display:block;text-align:center;font-size:10px;font-weight:900;color:#fff;line-height:12px;text-shadow:0 1px 0 #000}
#fz.on{animation:fzp .3s infinite alternate}@keyframes fzp{to{box-shadow:0 0 14px #ff7a2a}}

#modes{display:flex;gap:6px;justify-content:flex-end;padding:6px 10px 0;background:var(--paper)}

#list{flex:1;overflow-y:auto;background:var(--paper);padding:6px 8px 10px;-webkit-overflow-scrolling:touch}

.it.lock{opacity:.55}.it.hl{border-color:#ff8a3a;box-shadow:0 0 0 3px rgba(255,138,58,.35);animation:hl 1s infinite alternate}@keyframes hl{to{box-shadow:0 0 0 6px rgba(255,138,58,.15)}}

.card h2{margin:4px 0 8px}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico{font-size:60px}.big-ico img{width:110px;height:110px;object-fit:contain}
.gain{font-size:30px;font-weight:900;color:#c8743c;margin:6px 0}.stars{font-size:38px;color:#ffb400;text-shadow:0 2px 0 var(--deep)}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:2px solid #e2c89a;border-radius:10px;padding:4px 1px;font-size:15px;display:flex;flex-direction:column;align-items:center}
.lg small{font-size:9px}.lg b{font-size:9px}.lg.got{opacity:.45}.lg.now{border-color:#ff8a3a;background:#ffe9c0}
.quest{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid #e2c89a;border-radius:12px;padding:6px 8px;margin-bottom:6px}.quest span{flex:1;font-weight:800;font-size:13px}.quest small{display:block;color:#8a5a2a}.quest .b1{width:auto;margin:0;padding:6px 10px;font-size:13px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:1px solid #e2c89a}.sw input{width:22px;height:22px}
.ver{font-size:11px;color:#8a6a4a;margin-top:8px}.legal{font-size:13px}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(20,10,10,.55);padding:20px}
#toasts{position:fixed;bottom:calc(min(35vh,300px) + 12px);left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--deep);border-radius:14px;padding:7px 14px;font-weight:800;box-shadow:0 3px 0 var(--deep);animation:pop .3s;transition:opacity .4s}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:38%;z-index:25;text-align:center;font-size:38px;font-weight:900;color:#ffe27a;-webkit-text-stroke:2px var(--deep);text-shadow:0 4px 0 var(--deep);pointer-events:none;animation:ban 1.8s cubic-bezier(.2,1.4,.4,1) forwards}
.banner.fz{color:#ff8a3a}.banner.lv{color:#7ef0c0}@keyframes ban{0%{transform:scale(2.5);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:#111;display:flex;align-items:center;justify-content:center}.adbox{color:#fff;text-align:center}.adtag{opacity:.7}.adart{font-size:60px;margin:20px}.adcount{font-size:40px;font-weight:900}
/* title */
#title{position:fixed;inset:0;z-index:10;display:none;background:linear-gradient(rgba(20,26,51,.55),rgba(20,26,51,0) 35%,rgba(20,26,51,0) 70%,rgba(20,26,51,.7));flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 40px);background:radial-gradient(circle at 50% 40%,rgba(255,200,120,.25),rgba(0,0,0,0) 60%)}
#title.on{display:flex}#title .logo{text-align:center}#title .logo img{width:min(90vw,440px)}#title h1{font-size:56px;margin:0;color:#ffcf6a;-webkit-text-stroke:3px var(--deep);line-height:.95}
#title p{color:#ffe9c0;font-weight:800;text-shadow:0 2px 3px #000;margin:6px 0}
#title .hero{font-size:90px;animation:bob 2.4s ease-in-out infinite}#title .hero img{width:min(66vw,300px)}@keyframes bob{50%{transform:translateY(-10px)}}
#title .b1{max-width:320px}
</style>
</head>

<div id="game"><div id="top"></div><div id="chef"><div class="cf"></div><div class="ct"></div></div><div id="panel"><div id="tabs"></div><div id="modes"></div><div id="list"></div></div></div>
<div id="modal"></div><div id="toasts"></div><div id="title"></div>
<script>window.CC_VERSION="1.0";window.CC_SPR={"bg_0": "assets/bg_0.png", "bg_1": "assets/bg_1.png", "bg_2": "assets/bg_2.png", "chef_0": "assets/chef_0.png", "chef_1": "assets/chef_1.png", "chef_2": "assets/chef_2.png", "chef_3": "assets/chef_3.png", "chest": "assets/chest.png", "chunk": "assets/chunk.png", "coin": "assets/coin.png", "logo": "assets/logo.png", "m_conveyor": "assets/m_conveyor.png", "m_crusher": "assets/m_crusher.png", "m_foundry": "assets/m_foundry.png", "m_polisher": "assets/m_polisher.png", "nugget": "assets/nugget.png", "rock_0": "assets/rock_0.png", "rock_1": "assets/rock_1.png", "rock_2": "assets/rock_2.png", "ui_crew": "assets/ui_crew.png", "ui_fire": "assets/ui_fire.png", "ui_gear": "assets/ui_gear.png", "ui_gift": "assets/ui_gift.png", "ui_lock": "assets/ui_lock.png", "ui_mach": "assets/ui_mach.png", "ui_res": "assets/ui_res.png", "ui_shop": "assets/ui_shop.png", "ui_star": "assets/ui_star.png", "ui_x2": "assets/ui_x2.png", "w_blaster_0": "assets/w_blaster_0.png", "w_blaster_1": "assets/w_blaster_1.png", "w_blaster_2": "assets/w_blaster_2.png", "w_cart_0": "assets/w_cart_0.png", "w_cart_1": "assets/w_cart_1.png", "w_cart_2": "assets/w_cart_2.png", "w_geo_0": "assets/w_geo_0.png", "w_geo_1": "assets/w_geo_1.png", "w_geo_2": "assets/w_geo_2.png", "w_miner_0": "assets/w_miner_0.png", "w_miner_1": "assets/w_miner_1.png", "w_miner_2": "assets/w_miner_2.png", "w_porter_0": "assets/w_porter_0.png", "w_porter_1": "assets/w_porter_1.png", "w_porter_2": "assets/w_porter_2.png"};window.CC_PRIVACY="<h4>Politique de confidentialité — Crumble Crew</h4>\n<p><b>En bref :</b> aucun compte, aucune inscription. Ta progression reste sur ton appareil, les achats passent par Apple, et le jeu affiche des publicités Google AdMob que tu peux refuser.</p>\n<h4>Ta sauvegarde reste sur ton appareil</h4>\n<p>Niveaux, objets et réglages sont enregistrés uniquement sur ton appareil. Nous ne les recevons jamais. Supprimer le jeu efface la sauvegarde.</p>\n<h4>Achats intégrés</h4>\n<p>Les paiements sont gérés par Apple (App Store, StoreKit). Nous ne recevons ni coordonnées bancaires ni identité, seulement la liste des produits que tu possèdes. « Restaurer les achats » te permet de les récupérer sur un autre appareil. Aucun achat ne donne d’objet tiré au hasard, et il n’y a aucun abonnement.</p>\n<h4>Publicité (Google AdMob)</h4>\n<p>Des publicités plein écran apparaissent entre deux parties, et des vidéos bonus sont proposées si tu le veux. L’achat « Sans pub » retire les publicités plein écran. Le SDK Google Mobile Ads peut collecter l’identifiant publicitaire de l’appareil (IDFA), seulement si tu l’autorises dans la demande d’Apple (« Autoriser le suivi »), ainsi que des données techniques et d’interaction avec les annonces. Dans l’EEE, au Royaume-Uni et en Suisse, un écran de consentement de Google (UMP) te permet d’accepter, de refuser ou de gérer tes choix. Si tu refuses, seules des publicités non personnalisées s’affichent. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires. Comment Google utilise ces données : <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<h4>Ce que nous ne faisons pas</h4>\n<p>Aucun outil de mesure d’audience tiers en dehors d’AdMob, aucun profil, aucune vente de données, aucun accès aux contacts, photos, micro, caméra ou position GPS.</p>\n<h4>Enfants</h4>\n<p>Crumble Crew s’adresse à un public général. Nous ne collectons sciemment aucune donnée d’enfant, et les publicités excluent les contenus sensibles.</p>\n<h4>Tes droits et contact</h4>\n<p>Nous ne détenons aucune donnée qui t’identifie : il n’y a donc rien à consulter ni à supprimer chez nous. Tu peux effacer ta partie dans les Réglages. Les données publicitaires se gèrent avec Réglages → Choix publicitaires ou les outils de Google. Pour toute question : <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Politique complète : <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n<hr>\n<h4>Privacy policy — Crumble Crew</h4>\n<p><b>In short:</b> no account, no sign-up. Your progress stays on your device, purchases go through Apple, and the game shows Google AdMob ads that you can decline.</p>\n<p><b>Your save stays on your device:</b> levels, items and settings are kept only on your device. We never receive them. Deleting the game erases the save.</p>\n<p><b>In-app purchases:</b> payments are handled by Apple (App Store, StoreKit). We receive no payment or identity details, only which products you own. Restore purchases lets you get them back on another device. No purchase gives a random item, and there is no subscription.</p>\n<p><b>Advertising (Google AdMob):</b> full-screen ads appear between games, and bonus videos are offered if you want them. The “No ads” purchase removes full-screen ads. The Google Mobile Ads SDK may collect your device’s advertising identifier (IDFA), only if you allow it in Apple’s prompt (“Allow tracking”), as well as technical data and ad interaction data. In the EEA, the UK and Switzerland, Google’s consent screen (UMP) lets you accept, decline or manage your choices. If you decline, only non-personalised ads are shown. Change your mind any time in Settings → Ad choices. How Google uses this data: <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<p><b>What we don’t do:</b> no third-party analytics other than AdMob, no profiles, no data sales, no access to contacts, photos, microphone, camera or GPS location.</p>\n<p><b>Children:</b> Crumble Crew is meant for a general audience. We do not knowingly collect children’s data, and ads exclude sensitive content.</p>\n<p><b>Your rights and contact:</b> we hold no data that identifies you, so there is nothing to access or delete on our side. You can erase your progress in Settings. Ad data is managed with Settings → Ad choices or Google’s tools. Questions: <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Full policy: <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n";</script>
<script>// BETA IA — a simulated player inside the game, for tests and in-game video capture (spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Shared by every game: copy this file into <game>/src/beta.js, load it BEFORE the game scripts, and register the game's
// scenes after them with BETA.game({...}) (see <game>/src/beta-game.js).
// Turned on only by the address (?beta=ia) and never inside the iOS app (the native store handler is present there).
(() => {
  const Q = new URLSearchParams(location.search);
  const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
  const ON = !NATIVE && Q.get('beta') === 'ia';
  const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
  const opts = {
    scene: Q.get('scene') || 'boucle', style: Q.get('style') || 'pro', seed: num('seed', 0), save: Q.get('save') || 'neuf',
    vitesse: num('vitesse', 1), doigt: Q.get('doigt') !== '0', ui: Q.get('ui') || 'normal', duree: num('duree', 0),
    format: Q.get('format') || '', log: Q.get('log') === '1', auto: Q.get('auto') !== '0',
  };

  let rnd = Math.random;
  function seedRandom(seed) {
    let a = (seed >>> 0) || 1;
    rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    Math.random = rnd;
  }

  // ---- game clock ----
  // Normal mode: time runs ×1 to ×20 (performance.now, Date.now, requestAnimationFrame stamps and timers all follow).
  // Capture mode (?capture=1, used by tools/beta-record.mjs): time stands still and only moves with BETA.step(ms),
  // timers and animation frames included, so a slow PC still gives a perfect 30 frames per second video.
  let scale = 1;
  const CAPTURE = Q.get('capture') === '1';
  const realPerf = performance.now.bind(performance), realDate = Date.now, realRaf = requestAnimationFrame.bind(window), realCaf = cancelAnimationFrame.bind(window);
  const realSetTimeout = setTimeout.bind(window), realSetInterval = setInterval.bind(window), realClearTimeout = clearTimeout.bind(window), realClearInterval = clearInterval.bind(window);
  let pBase = realPerf(), pV = pBase, dV = realDate();
  const vPerf = () => CAPTURE ? pV : pV + (realPerf() - pBase) * scale;
  function setSpeed(s) { if (CAPTURE) { scale = Math.max(0.1, s); return; } const now = realPerf(); pV = pV + (now - pBase) * scale; dV = dV + (now - pBase) * scale; pBase = now; scale = Math.max(0.1, s); }
  let vAcc = 0;   // capture mode: milliseconds of video stepped so far

// ---------- the mine: layout in logical units (400 wide), scaled to the screen ----------
const cv = $('#cv'), cx = cv.getContext('2d');

// ---------- images (ChatGPT painted sprites when present, drawn fallbacks otherwise) ----------

  if (!n) { n = 1; c = costAt(start); } return { n, c };
}

<script>// Crumble Crew scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Every action is a real tap at a real screen position: the boulder, the chests, the nuggets, the shop buttons.
(() => {
  if (!window.BETA || !BETA.on) return;
  const S = () => CC.S(), G = CC.G, E = CC.E;
  const scr = (wx, wy) => { const v = CC.view(); return [v.OX + wx * v.SC, v.OY + wy * v.SC]; };
  const rock = A => { const v = CC.view(); const [x, y] = scr(v.L.rockX, v.L.rockY); const r = v.L.rockR * v.SC * 0.45; return [x + A.jitter(-r, r), y + A.jitter(-r * 0.6, r * 0.6)]; };
  const modalOpen = () => !!document.querySelector('#modal.on, #modal .card, .confirm');
  // close whatever popup is up the way a player would: the main button of the window
  async function clearPopups(A) {
    for (let i = 0; i < 4; i++) {
      const b = document.querySelector('#modal [data-go], #modal [data-c="1"], #modal [data-login], #modal [data-close]');
      if (!b || !b.offsetParent) return; await A.wait(A.jitter(500, 900)); await A.tapEl(b); await A.wait(400);
    }
  }
  if (BETA.opts.ui === 'propre') { const st = document.createElement('style'); st.textContent = '.adov{display:none!important}'; document.head.appendChild(st); }
  async function start(A) {
    if (A.opts.ui === 'propre' && S().consent == null) S().consent = false;   // clean takes: no consent window on camera (refused = no personalised ads)
    if (A.opts.ui === 'propre') S().owned.noads = true;      // clean takes: no interstitials
    if (G.phase === 'play') return;
    await A.wait(900); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(700);
    const c = document.querySelector('#modal [data-c]'); if (c) { await A.think(); await A.tapEl(A.opts.ui === 'propre' ? '#modal [data-c="0"]' : '#modal [data-c="1"]', 'consentement'); await A.wait(600); }
    await clearPopups(A);
  }
  // a burst of taps on the boulder (people tap fast in a clicker), catching any chest or nugget on the way
  async function burst(A, n) {
    for (let i = 0; i < n && A.running(); i++) {
      const ch = G.chests.find(c => !c.open && c.t > 0.4), ng = G.nuggets[0];
      if (ch) { const [x, y] = scr(ch.x, ch.y - 14); await A.tap(x, y, 'coffre'); A.mark('coffre'); await A.wait(1100); continue; }
      if (ng && ng.t > 0.25) { const [x, y] = scr(ng.x, ng.y); await A.tap(x, y, 'pépite'); A.mark('pépite attrapée'); continue; }
      const [x, y] = rock(A); await A.tap(x, y, 'rocher'); await A.realWait(A.jitter(60, 160));
    }
  }
  // buy the most useful thing the player can afford, through the panel buttons
  async function shop(A) {
    if (modalOpen()) return clearPopups(A);
    const tab = document.querySelector('#tabs [data-tab="crew"]'); if (tab && !tab.classList.contains('on') && !document.querySelector('[data-hire]')) { await A.tapEl(tab, 'onglet équipe'); await A.wait(300); }
    const pick = ['miner', 'porter', 'blaster', 'cart', 'geo'].map(k => document.querySelector(`[data-hire="${k}"]:not(.off)`)).filter(Boolean);
    const tutB = S().tut === 1 && document.querySelector('[data-hire="miner"]:not(.off)');   // the first-run tutorial asks for a miner: follow the hand
    if (pick.length) { const b = tutB || pick[Math.floor(A.rnd() * Math.min(2, pick.length))]; await A.think(); await A.tapEl(b, 'embauche'); A.mark('embauche ' + b.dataset.hire); return true; }
    return false;
  }
  async function machines(A) {
    const t = document.querySelector('#tabs [data-tab="mach"]'); if (!t) return; await A.tapEl(t, 'onglet machines'); await A.wait(400);
    const b = document.querySelector('[data-mach]:not(.off), [data-pick]:not(.off)'); if (b) { await A.think(); await A.tapEl(b, 'machine'); A.mark('machine'); }
    await A.wait(500); await A.tapEl('#tabs [data-tab="crew"]', 'onglet équipe');
  }
  // moments worth cutting on: watch the game state
  function watch(A) {
    let layer = S().layer, rockN = S().rock, lvl = S().level, fz = false;
    const iv = setInterval(() => { if (!A.running()) return clearInterval(iv);
      if (S().layer !== layer) { layer = S().layer; A.mark('couche cassée'); }
      if (S().rock !== rockN) { rockN = S().rock; A.mark('nouveau rocher'); }
      if (S().level !== lvl) { lvl = S().level; A.mark('niveau ' + lvl); }
      if (G.frenzyT > 0 && !fz) { fz = true; A.mark('frénésie'); } if (G.frenzyT <= 0) fz = false; }, 100);
  }
  // starting saves: a new game, about an hour in, late game (built by fast-forwarding the real economy)
  async function fastForward(minutes) {
    const S0 = S(); let sim = 0;
    while (sim < minutes * 60) { if (sim % 30 === 0) await new Promise(r => setTimeout(r, 40));   // let the page breathe between slices
      for (let i = 0; i < 20; i++) { CC.step(0.25); if (i % 2 === 0) CC.tapRock(200, 170, 0, 0); G.parts.length = 0; G.floats.length = 0; } sim += 5;
      for (let g = 0; g < 40; g++) { const o = []; for (const k of E.order) if (E.workers[k].unlock <= S0.layer) o.push(['w', k, E.workerCost(k, S0.w[k] || 0)]);
        for (const k of E.morder) if ((S0.m[k] || 0) < E.machines[k].max) o.push(['m', k, E.machineCost(k, S0.m[k] || 0)]); if (S0.pick < E.pick.max) o.push(['p', 0, E.pickCost(S0.pick)]);
        const ok = o.filter(x => x[2] <= S0.coins).sort((a, b) => a[2] - b[2]); if (!ok.length) break; const p = ok.find(x => x[0] === 'm') || ok[0];
        if (p[0] === 'w') CC.hire(p[1]); else if (p[0] === 'm') CC.upgrade(p[1]); else CC.upPick(); }
      document.querySelectorAll('#modal [data-go], #modal [data-close]').forEach(b => b.click()); }
    S0.tut = 99; G.floats.length = 0; G.parts.length = 0; G.chests.length = 0; G.nuggets.length = 0; G.pendingLevel = 0; CC.save();
    document.querySelectorAll('.banner, .toast').forEach(e => e.remove()); const c = document.querySelector('#chef'); if (c) c.classList.remove('on');
  }

  BETA.game({
    sfx: CC.SFX,
    logo: () => (window.CC_SPR && CC_SPR.logo) || '',
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => [S().layer, S().rock, Math.floor(Math.log10(1 + S().totals.earned))],
    async prepare(save, A) {
      if (A.opts.scene === 'onboarding') return;            // onboarding always starts from the title screen of a new game
      await start(A);
      if (save === 'milieu') await fastForward(25); else if (save === 'avance') await fastForward(90);
      if (A.opts.ui === 'propre') S().owned.noads = true;
      await clearPopups(A); await A.wait(save === 'neuf' ? 600 : 2500);   // let the fast-forward leftovers settle off camera
    },
    scenes: {
      // title -> first taps -> first hire -> first layer
      async onboarding(A) { watch(A); await start(A);
        for (let i = 0; i < 12 && A.running(); i++) { await burst(A, 6); if (i % 3 === 2) await shop(A); await clearPopups(A); } },
      // the satisfying core: tapping, chests and nuggets, crew growing
      async boucle(A) { watch(A); for (let i = 0; i < 10 && A.running(); i++) { await burst(A, 7 + Math.floor(A.rnd() * 5)); if (i % 2) await shop(A); await clearPopups(A); } },
      // before/after: the mine grows, sped up
      // time-lapse from a new game: a few seconds of play, then a jump of a few minutes of game, again and again (each jump is marked)
      async progression(A) { watch(A); let jump = 1.5;
        for (let i = 0; i < 12 && A.running(); i++) { await burst(A, 6); await shop(A); if (i % 3 === 2) await machines(A); await clearPopups(A);
          if (!A.running()) break; A.mark('ellipse +' + Math.round(jump) + ' min'); await fastForward(jump); jump *= 1.6; } },
      // the wow moment: frenzy on a nearly broken layer, the layer bursts
      async moment(A) { watch(A); await burst(A, 2); G.frenzy = 0.995; S().hp = Math.min(S().hp, E.layerHp(S().rock, Math.min(S().layer, E.layers.length - 1)) * 0.025); await burst(A, 22); await A.wait(1500); },
      // plays on until stopped (long tests, balance, memory)
      async idle(A) { watch(A); let i = 0; while (A.running()) { await burst(A, 8); if (i % 2) await shop(A); if (i % 10 === 9) await machines(A); await clearPopups(A); i++; } },
    },
