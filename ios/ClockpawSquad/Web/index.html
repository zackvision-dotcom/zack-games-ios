<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#23202B">
<title>Clockpaw Squad</title>
<style>
:root{--brass:#D4A24C;--steel:#3E6A8A;--brick:#C2463B;--cream:#F5E9D0;--patina:#5E9C8F;--ink:#23202B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
img.ui{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 16px;font-weight:900;border:3px solid var(--ink);transition:transform .08s;display:block;width:100%;margin-top:9px;font-size:17px}
.b1{background:var(--brass);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.b2{background:var(--cream);box-shadow:0 4px 0 var(--ink)}.b3{background:#fff;color:var(--brick);box-shadow:0 4px 0 var(--ink)}
.bad{background:var(--patina);color:#fff;text-shadow:0 2px 0 rgba(35,32,43,.4)}.bred{background:var(--brick);color:var(--cream)}
.b1:active,.b2:active,.b3:active,.rb:active,.hc:active,.ab:active,.tb:active{transform:translateY(3px)}.b1:disabled,.b2:disabled{opacity:.45}
.big{font-size:21px;padding:14px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
i.bo,i.ky{display:inline-block;width:1.15em;height:1.15em;background:center/contain no-repeat;vertical-align:-.2em}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;pointer-events:none;align-items:center;gap:6px}
#hud.on{display:flex}#hud button{pointer-events:auto}
.rb{width:42px;height:42px;flex:none;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);font-size:17px;font-weight:900;position:relative;display:grid;place-items:center}
.rb img.ui{width:32px;height:32px}
.rb.dot::after{content:'';position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--brick);border:2px solid var(--ink)}
.rb small.n{position:absolute;right:-6px;bottom:-5px;background:var(--brick);color:var(--cream);border:2px solid var(--ink);border-radius:9px;font-size:11px;padding:0 4px;line-height:15px}
.chip{display:flex;align-items:center;gap:4px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:3px 9px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:16px;white-space:nowrap}
#rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:rgba(35,32,43,.78);border-radius:12px;padding:5px 10px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#rinfo b{color:var(--cream);font-size:14px;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rinfo small{color:var(--cream);font-weight:900;font-size:12px;text-shadow:0 1px 0 var(--ink);display:flex;align-items:center;gap:3px}
#rinfo small img{width:15px;height:15px}
/* tray: the team, the actions, rewind / end turn */
#tray{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;padding:6px 6px calc(env(safe-area-inset-bottom) + 8px);background:rgba(35,32,43,.94);border-top:3px solid var(--brass)}
#tray.on{display:block}
#team{display:flex;gap:6px}
.hc{flex:1;min-width:0;position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:2px 4px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.hc img{width:40px;height:40px;object-fit:contain;flex:none;pointer-events:none}.hc span{font-size:12px;font-weight:900;line-height:1.1;text-align:left;pointer-events:none}
.hc.sel{background:var(--brass);box-shadow:0 0 0 3px var(--cream)}.hc.done{opacity:.45}.hc.done::after{content:'✓';position:absolute;right:4px;top:0;font-weight:900;font-size:18px}
.hc .sw{position:absolute;left:-6px;top:-8px;width:24px;height:24px;border-radius:50%;background:var(--patina);color:#fff;border:2px solid var(--ink);font-size:13px;font-weight:900;display:grid;place-items:center}
.hc.hint,.ab.hint,#endturn.hint,#rewbtn.hint{animation:hint .7s infinite alternate}@keyframes hint{to{transform:translateY(-4px);box-shadow:0 0 0 4px var(--brass)}}
#acts{display:flex;gap:6px;margin-top:6px;min-height:52px}
.ab{flex:1;min-width:0;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 6px;display:flex;align-items:center;gap:6px;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.ab img{width:34px;height:34px;flex:none;pointer-events:none}.ab b{display:block;font-size:13px;pointer-events:none}.ab small{display:block;font-size:10.5px;line-height:1.15;font-weight:700;opacity:.85;pointer-events:none}
.ab.on{background:var(--brass)}
#tinfo{flex:1;color:var(--cream);font-weight:800;font-size:13px;line-height:1.25;display:flex;align-items:center;padding:0 4px}
#trow{display:flex;gap:8px;align-items:center;margin-top:6px}
.tb{display:flex;align-items:center;gap:5px;border-radius:14px;padding:6px 12px;font-weight:900;border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.45);font-size:16px;white-space:nowrap}
.tb img{width:26px;height:26px}
#rewbtn{background:var(--cream)}#endturn{background:var(--brick);color:var(--cream);margin-left:auto}#endturn:disabled{opacity:.4}
/* Maître Tic */
#tic{position:fixed;left:8px;right:8px;z-index:8;display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(24px) scale(.92);transition:.25s;bottom:calc(env(safe-area-inset-bottom) + 178px)}
#tic.on{opacity:1;transform:none}
#tic .pf{width:76px;height:76px;flex:none;object-fit:contain;animation:pbob 1.6s ease-in-out infinite}@keyframes pbob{50%{transform:translateY(-4px) rotate(-2deg)}}
#tic .pt{background:var(--cream);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:4px 4px 0 rgba(0,0,0,.35);max-width:300px;margin-bottom:20px}
#tic.home{bottom:calc(env(safe-area-inset-bottom) + 96px)}
#tic.top{bottom:auto;top:calc(env(safe-area-inset-top) + 54px);align-items:flex-start}#tic.top .pf{width:60px;height:60px}#tic.top .pt{margin:8px 0 0;border-radius:4px 16px 16px 16px;font-size:14px;padding:7px 10px}
.bub{position:fixed;z-index:7;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:13px;max-width:200px;box-shadow:3px 3px 0 rgba(0,0,0,.35);pointer-events:none;animation:pop .3s cubic-bezier(.3,1.6,.5,1);transition:opacity .3s}
.bub.out{opacity:0}
/* home: the clock tower */
#home{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;background:var(--ink) center/cover no-repeat}
#home.on{display:flex}
#hhead{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;flex-direction:column;gap:6px;background:rgba(35,32,43,.88);border-bottom:3px solid var(--brass)}
.mrow{display:flex;align-items:center;gap:8px}
#plv{background:var(--brass);font-weight:900;border-radius:10px;padding:3px 9px;font-size:13px;white-space:nowrap;border:3px solid var(--ink)}
#xpbar{flex:1;height:14px;background:var(--ink);border:3px solid var(--cream);border-radius:8px;overflow:hidden}#xpbar i{display:block;height:100%;background:var(--patina);transition:width .4s}
#hmid{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 12px;gap:8px}
#hmid .logo{width:min(60vw,280px);margin-top:2px}
#hmid .b1{max-width:340px}
.flr{width:100%;max-width:380px;background:rgba(245,233,208,.95);border:3px solid var(--ink);border-radius:16px;padding:6px 8px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.flr h4{margin:0 0 5px;font-size:14px;display:flex;justify-content:space-between}.flr h4 small{font-size:12px;display:flex;align-items:center;gap:3px}.flr h4 img{width:15px;height:15px}
.rooms{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.rm{aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:10px;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.rm .cg{display:flex;gap:0}.rm .cg img{width:12px;height:12px}
.rm.lock{opacity:.35;background:#ddd}.rm.cur{background:var(--brass);animation:hint .8s infinite alternate}.rm.mini{border-color:var(--brick)}.rm.boss{background:var(--brick);color:var(--cream)}
.hcard{display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:7px 9px;width:100%;max-width:380px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hcard img{width:46px;height:46px;object-fit:contain}.hcard .tx{flex:1;min-width:0;font-weight:800;font-size:13px;line-height:1.25}.hcard .tx b{font-size:15px;display:block}
#hfoot{display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 10px);background:rgba(35,32,43,.92);border-top:3px solid var(--brass)}
#hfoot .rb{width:50px;height:50px;border-radius:16px}#hfoot .rb img.ui{width:38px;height:38px}
#hfoot small{display:block;text-align:center;font-weight:900;font-size:10.5px;margin-top:4px;color:var(--cream)}
/* overlays */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(20,18,28,.62);padding:14px}#modal.on{display:flex}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:14px;max-width:390px;width:100%;max-height:90vh;overflow:auto;box-shadow:7px 7px 0 rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
.card.wide{max-width:520px;text-align:left}@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:2px 0 8px;font-size:23px;text-align:center}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico img{width:110px;height:110px;object-fit:contain}.big-ico.s img{width:80px;height:80px}
.gain{font-size:26px;font-weight:900;color:var(--steel);margin:4px 0}.sub{font-size:13px;color:var(--steel);font-weight:800}
.stat{display:flex;justify-content:space-between;font-weight:800;padding:3px 4px;border-bottom:2px dashed rgba(35,32,43,.15)}
.cogs{display:flex;justify-content:center;gap:10px;margin:6px 0}
.cog{width:86px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;line-height:1.1}
.cog img{width:62px;height:62px;opacity:.25;filter:grayscale(1)}.cog.on img{opacity:1;filter:none;animation:clack .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes clack{0%{transform:scale(2.2) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lg small{font-size:9px;font-weight:800}.lg b{font-size:11px}.lg i{width:20px;height:20px}.lg.got{opacity:.4}.lg.now{background:var(--brass)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:2px solid rgba(35,32,43,.15)}.sw input{width:24px;height:24px;accent-color:var(--brass)}.sw select{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:3px 6px}
.ver{font-size:11px;opacity:.6;margin-top:8px;text-align:center}.legal{font-size:13px}
.it{display:flex;align-items:center;gap:9px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 9px;margin-bottom:8px;text-align:left}
.it .ico{width:50px;height:50px;flex:none;display:grid;place-items:center}.it .ico img{width:50px;height:50px;object-fit:contain}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;font-size:12px;line-height:1.25;opacity:.85}
.dots{display:flex;gap:3px;margin-top:3px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}.dots i.on{background:var(--brass)}.dots i.ws{background:var(--brick);animation:blink .6s infinite alternate}@keyframes blink{to{opacity:.4}}
.buy{min-width:80px;background:var(--patina);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:15px;white-space:nowrap;text-shadow:0 1px 0 rgba(35,32,43,.4)}
.buy.ad{background:var(--steel)}.buy.ky{background:var(--brass);color:var(--ink);text-shadow:none}.buy.off{opacity:.45}.buy:active{transform:translateY(3px)}
.own{font-weight:900;color:var(--patina);min-width:70px;text-align:center}
.note{font-size:12px;text-align:center;margin:2px 0 10px;font-weight:700;opacity:.8}
.pbar{height:12px;background:#fff;border:2px solid var(--ink);border-radius:7px;overflow:hidden;margin:5px 0}.pbar i{display:block;height:100%;background:var(--brass)}
.cos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.co{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px;display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:900;min-height:104px;text-align:center;line-height:1.1}
.co .wear{position:relative;width:58px;height:58px}.co .wear img{position:absolute;object-fit:contain}.co .wear .hb{inset:0;width:100%;height:100%}.co .wear .ac{left:22%;top:-14%;width:56%;height:56%}
.co.lock .wear{opacity:.35;filter:grayscale(1)}.co.on{background:var(--brass)}.co small{font-size:10px;font-weight:800}
.hrow{display:flex;gap:6px;flex-wrap:wrap}.hb2{flex:1 0 28%;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px;font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;text-align:center}
.hb2 img{width:44px;height:44px;object-fit:contain}.hb2.lock{opacity:.4}.hb2 small{font-size:10px;font-weight:700}
h3{margin:10px 0 6px;font-size:16px;text-align:left}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(20,18,28,.6);padding:20px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:7px 14px;font-weight:900;box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:pop .3s;transition:opacity .4s;max-width:90vw;text-align:center}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:28%;z-index:25;text-align:center;font-size:40px;font-weight:900;color:var(--brass);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:ban 1.8s cubic-bezier(.2,1.4,.4,1) forwards}
.banner.r{color:var(--brick)}.banner.c{color:var(--cream)}@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;align-items:center;justify-content:center}.adbox{color:var(--cream);text-align:center}.adtag{opacity:.7;font-weight:800}.adart img{width:120px;margin:20px}.adcount{font-size:44px;font-weight:900}
#replaytag{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:9;display:none;background:var(--brick);color:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:900;font-size:15px;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
#replaytag.on{display:block;animation:blink .5s infinite alternate}
/* title */
#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 30px) 24px calc(env(safe-area-inset-bottom) + 40px);background:var(--ink) center/cover no-repeat}
#title.on{display:flex}#title .logo img{width:min(86vw,420px)}#title .tbg{width:min(80vw,46vh);animation:pbob 2.4s ease-in-out infinite}
#title p{font-weight:900;margin:4px 0;font-size:16px;color:var(--cream);text-align:center}#title .b1{max-width:320px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div><div id="tray"></div><div id="replaytag"></div>
<div id="tic"><img class="pf" alt=""><div class="pt"></div></div>
<div id="home"><div id="hhead"></div><div id="hmid"></div><div id="hfoot"></div></div>
<div id="modal"></div><div id="toasts"></div><div id="title"></div>
<script>window.CP_VERSION="1.0";window.CP_SPR={"bg_room": "assets/bg_room.png", "bolt": "assets/bolt.png", "cog_star": "assets/cog_star.png", "costume_0": "assets/costume_0.png", "costume_1": "assets/costume_1.png", "costume_2": "assets/costume_2.png", "costume_3": "assets/costume_3.png", "costume_4": "assets/costume_4.png", "costume_5": "assets/costume_5.png", "costume_6": "assets/costume_6.png", "costume_7": "assets/costume_7.png", "fx_bolt": "assets/fx_bolt.png", "fx_ko": "assets/fx_ko.png", "fx_spring": "assets/fx_spring.png", "h_cat": "assets/h_cat.png", "h_hamster": "assets/h_hamster.png", "h_owl": "assets/h_owl.png", "h_rabbit": "assets/h_rabbit.png", "h_turtle": "assets/h_turtle.png", "key_gold": "assets/key_gold.png", "logo": "assets/logo.png", "r_basic": "assets/r_basic.png", "r_boss_cuckoo": "assets/r_boss_cuckoo.png", "r_heavy": "assets/r_heavy.png", "r_ko": "assets/r_ko.png", "r_miniboss": "assets/r_miniboss.png", "r_shooter": "assets/r_shooter.png", "r_spring": "assets/r_spring.png", "t_crate": "assets/t_crate.png", "t_floor": "assets/t_floor.png", "t_gear": "assets/t_gear.png", "t_wall": "assets/t_wall.png", "t_window": "assets/t_window.png", "tic_0": "assets/tic_0.png", "tic_1": "assets/tic_1.png", "tic_2": "assets/tic_2.png", "tic_3": "assets/tic_3.png", "title_bg": "assets/title_bg.png", "toolbox": "assets/toolbox.png", "ui_gift": "assets/ui_gift.png", "ui_hint": "assets/ui_hint.png", "ui_rewind": "assets/ui_rewind.png", "ui_settings": "assets/ui_settings.png", "ui_shop": "assets/ui_shop.png"};window.CP_PRIVACY="<h4>Politique de confidentialité — Clockpaw Squad</h4>\n<p>Clockpaw Squad fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. Aucun achat ne donne d’objet tiré au hasard, et il n’y a aucun abonnement.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) peuvent être envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Clockpaw Squad convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Clockpaw Squad</h4>\n<p>Clockpaw Squad works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Ad choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. No purchase gives a random item, and there is no subscription.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) may be sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Clockpaw Squad suits all ages but is not directed at children. We do not <script>// Clockpaw Squad — the rules of a room: a 6 × 8 grid seen from above, 3 clockwork heroes, grumpy box robots.
// One turn per room: each hero may act once (any order), then the robots that are still standing strike.
// Pushes are deterministic, cell by cell: a pushed robot shoves the robots in front of it (chain), a robot pushed
// into a gear is crushed, one pushed through a window flies out, one squashed against a wall, a crate or a hero takes a knock.
// Shared by the game (game.js), the BETA robot (beta-game.js), the solver (tools/solve.mjs) and the bot (tools/bot.mjs).
(function (root) {
  'use strict';
  const COLS = 6, ROWS = 8;

  const DN = { U: 0, R: 1, D: 2, L: 3 };
  // each hero has two actions
  const HERO = {
    cat: { acts: ['push', 'pounce'], hp: 3 },       // pushes in melee / pounces in a line then pushes
    rabbit: { acts: ['jump', 'kick'], hp: 3 },      // jumps anywhere close and shoves its 4 neighbours on landing / kicks 2 cells
    turtle: { acts: ['shield', 'charge'], hp: 4 },  // shields itself and its neighbours / charges in a line and shoves hard (3)
    owl: { acts: ['swap', 'hypno'], hp: 3 },        // pendulum: swaps places with a robot / turns a robot round
    hamster: { acts: ['zap', 'magnet'], hp: 3 },    // dynamo: zaps every robot around / pulls a robot in a line
  };
  const HEROES = Object.keys(HERO);
  // the robots: square boxes with a moustache and one eye. atk: hit (the cell in front), leap (2 cells ahead), shot (a beam), shot2 (both ways)
  const BOT = {
    basic: { hp: 1, atk: 'hit' },
    shooter: { hp: 1, atk: 'shot' },
    heavy: { hp: 2, atk: 'hit', anchor: 1 },        // too heavy to push: a shove only knocks it

<script>// Clockpaw Squad scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Every action is a real gesture: a tap on the hero, a tap on the action button when it is not the default one, a tap on the

  async function solveRoom(A, opt = {}) {

      await until(A, () => !H.busy() && G.S, 8000); const k = H.roomKey(), sol = H.SOL[k]; if (!sol || !G.S) return false; const ph = G.ph;
      if (opt.mistake) { await mistake(A, sol); opt.mistake = 0; }
      for (const m of sol.seq) { if (!A.running()) return false; await A.think(); await move(A, m, opt.look !== 0); if (G.S.phase === 'won' || G.ph !== ph) break; }
      if (G.S && G.S.phase === 'play' && G.ph === ph && G.seq.length) { await A.think(); await A.tapEl('#endturn', 'fin du tour'); }
      await until(A, () => G.ph !== ph || visible('#modal [data-again]') || visible('#modal [data-go]') || (G.S && G.S.phase === 'lost' && !H.busy()), 30000);
      if (visible('#modal [data-again]') || visible('#modal [data-go]')) return true;
      if (G.S && G.S.phase === 'lost') return false;
    }
    return false;
  }
  async function next(A) {   // from the end card to the next room
    await A.wait(A.jitter(1600, 2200));
    const b = visible('#modal [data-next]') || visible('#modal [data-go]'); if (b) { await A.tapEl(b, 'salle suivante'); await A.wait(900); }
    if (visible('#modal [data-go]')) { await A.wait(900); await A.tapEl('#modal [data-go]', 'suite'); await A.wait(900); }
  }
  // ---- moments worth cutting on ----
  function watch(A) {
    let dying = 0, chain = 0, phase = '', rw = false, rp = false, ph = G.ph, room = G.L && G.L.id;
    const iv = setInterval(() => { if (!A.running()) return clearInterval(iv); if (!G.S) return;
      if (G.L && G.L.id !== room) { room = G.L.id; A.mark('salle ' + room); }
      if (G.dying.length > dying && !G.replay) A.mark(G.dying.some(d => d.how === 'gear') ? 'K.O. dans l’engrenage' : G.dying.some(d => d.how === 'window') ? 'K.O. par la fenêtre' : 'K.O.'); dying = G.dying.length;
      if (G.chainShown > chain && G.chainShown >= 2) A.mark('pousse en chaîne ×' + G.chainShown); chain = G.chainShown;
      if (G.S.phase !== phase && !G.tl) { if (G.S.phase === 'won' && !G.replay) A.mark('salle libérée'); if (G.S.phase === 'lost') A.mark('raté'); phase = G.S.phase; }
      if (!!G.rw !== rw) { if (G.rw) A.mark('remonter le temps'); rw = !!G.rw; }
      if (G.replay !== rp) { if (G.replay) A.mark('replay accéléré'); rp = G.replay; }
      if (G.ph !== ph) { A.mark('le coucou recule, phase ' + (G.ph + 1)); ph = G.ph; }
      const on = document.querySelectorAll('#modal .cog.on').length; if (on === 3 && !watch.three) { watch.three = 1; A.mark('3 rouages'); } if (!on) watch.three = 0;
    }, 100);
  }
  // ---- off camera: a tower that has been played ----
  function makeSave(kind) {
    const s = S(), d = new Date(); s.tut = 1; s.consent = s.consent == null ? false : s.consent; s.login = { last: d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), streak: 3, pending: false };
    const upto = kind === 'avance' ? 23 : kind === 'milieu' ? 10 : 3; s.cogs = {}; for (let i = 1; i <= upto; i++) s.cogs[i] = [1, 1, i % 3 ? 1 : 0];
    s.cur = upto + 1; s.bolts = kind === 'avance' ? 2200 : 420; s.plv = kind === 'avance' ? 9 : kind === 'milieu' ? 4 : 2; s.xp = 40; s.said = {}; for (let i = 1; i <= 24; i++) s.said['r' + i] = 1;
    if (kind === 'avance') { s.up = { cat: 2, rabbit: 2, turtle: 1, bolts: 2 }; s.costumes = { 0: 1, 1: 1, 4: 1 }; s.costume = 1; }
    H.save();
  }
  const SCENE_ROOM = { boucle: 10, moment: 3, idle: 0 };
  BETA.game({
    sfx: H.SFX,
    logo: () => H.src('logo'),
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => G.S ? [G.L && G.L.id, G.ph, G.S.phase, G.S.acts, G.S.u.length, G.hist.length, !!G.rw] : [G.mode],
    async prepare(save, A) {
      if (A.opts.scene === 'onboarding') return;            // onboarding starts from the title screen of a new game
      makeSave(A.opts.scene === 'progression' ? 'neuf' : save === 'neuf' ? 'milieu' : save);
      await start(A); await A.wait(500); await clean(A);
      const room = SCENE_ROOM[A.opts.scene] || S().cur; H.startRoom(Math.min(24, room));
      document.querySelectorAll('.bub').forEach(b => b.remove()); await A.wait(500); document.getElementById('tic').classList.remove('on');
    },
    scenes: {
      // title -> consent -> Maître Tic's tutorial: the cat shoves a robot into the gear, then the rabbit's jump
      async onboarding(A) { watch(A); await start(A); await A.wait(2600);
        for (let i = 0; i < 2 && A.running(); i++) { if (!G.L) break; const ok = await solveRoom(A); if (!ok) break; await next(A); await A.wait(1200); } },
      // the core: a room, the live preview, a wrong move rewound one time out of two, then the right line and the slow-motion chain
      async boucle(A) { watch(A); await A.wait(800); await solveRoom(A, { mistake: A.rnd() < 0.5 ? 1 : 0 }); await A.wait(2500); },
      // time-lapse: room after room at triple speed, the tower filling with cogs
      async progression(A) { watch(A); A.speed(3);
        for (let n = 0; n < 6 && A.running(); n++) { const ok = await solveRoom(A, { look: 0 }); if (!ok) break; await next(A); } },
      // the wow moment: three robots lined up, the turtle's charge pushes them one by one into the gear, in slow motion
      async moment(A) { watch(A); await A.wait(500); await solveRoom(A); await A.wait(2500); },
      // plays on until stopped (long tests): room after room, then the tower again
      async idle(A) { watch(A);
        while (A.running()) { if (G.mode !== 'room') { H.startRoom(Math.min(24, S().cur)); await A.wait(800); continue; }
          const ok = await solveRoom(A, { mistake: A.rnd() < 0.3 ? 1 : 0 }); if (!ok) { H.startRoom(G.L ? G.L.id : 1); await A.wait(800); continue; }
          if (G.L && G.L.id === 24) { await A.wait(2500); H.startRoom(1); await A.wait(800); } else await next(A); } },
    },
  });
})();
