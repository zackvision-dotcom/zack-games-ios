.gi canvas{width:100%;height:auto}.gi.leg{background:#FFF1CC}
.ccard{position:fixed;left:50%;top:18%;z-index:46;width:240px;margin-left:-120px;perspective:800px;animation:rcin .5s cubic-bezier(.3,1.5,.5,1)}.ccard.out{opacity:0;transition:opacity .3s}

.ccard.legendaire .fr{box-shadow:0 0 0 6px var(--yolk),8px 8px 0 rgba(0,0,0,.4)}
@keyframes rflip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}@keyframes rcin{from{transform:scale(.4) translateY(80px);opacity:0}}
</style>

irmin_tete": "assets/firmin_tete.png", "fond_aube": "assets/fond_aube.png", "fond_orage": "assets/fond_orage.png", "helice": "assets/helice.png", "ilot": "assets/ilot.png", "ilot_tour": "assets/ilot_tour.png", "logo": "assets/logo.png", "lune": "assets/lune.png", "nacelle": "assets/nacelle.png", "nuage_aube": "assets/nuage_aube.png", "nuage_jour": "assets/nuage_jour.png", "nuage_orage": "assets/nuage_orage.png", "ship_classique": "assets/ship_classique.png", "ship_nuit": "assets/ship_nuit.png", "ship_rayures": "assets/ship_rayures.png", "ship_rouge": "assets/ship_rouge.png", "soleil": "assets/soleil.png", "voleur": "assets/voleur.png"};window.NC_PRIVACY="<h4>Politique de confidentialité — Nimbus Catch</h4>\n<p>Nimbus Catch fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix de confidentialité.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. Aucun achat ne donne d’objet tiré au hasard ni d’amélioration de puissance, et il n’y a aucun abonnement.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) peuvent être envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Nimbus Catch convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Nimbus Catch</h4>\n<p>Nimbus Catch works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Privacy choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. No purchase gives a random item or a power upgrade, and there is no subscription.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) may be sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Nimbus Catch suits all ages but is not directed at children. We do not knowingly collect personal data from children.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>
<script>// BETA IA — a simulated player inside the game, for tests and in-game video capture (spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Shared by every game: copy this file into <game>/src/beta.js, load it BEFORE the game scripts, and register the game's
// scenes after them with BETA.game({...}) (see <game>/src/beta-game.js).
// Turned on only by the address (?beta=ia) and never inside the iOS app (the native store handler is present there).
(() => {
  const Q = new URLSearchParams(location.search);
  const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
  const ON = !NATIVE && Q.get('beta') === 'ia';
  const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
  const opts = {
    scene: Q.get('scene') || 'boucle', style: Q.get('style') || 'pro', seed: num('seed', 0), save: Q.get('save') || 'neuf',
    vitesse: num('vitesse', 1), doigt: Q.get('doigt') !== '0', ui: Q.get('ui') || 'normal', duree: num('duree', 0),
    format: Q.get('format') || '', log: Q.get('log') === '1', auto: Q.get('auto') !== '0',
  };

  // ---- seeded randomness: same seed, same game (needed to redo a take) ----
  let rnd = Math.random;
  function seedRandom(seed) {
    let a = (seed >>> 0) || 1;
    rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    Math.random = rnd;
  }

  // ---- game clock ----
  // Normal mode: time runs ×1 to ×20 (performance.now, Date.now, requestAnimationFrame stamps and timers all follow).
  // Capture mode (?capture=1, used by tools/beta-record.mjs): time stands still and only moves with BETA.step(ms),
  // timers and animation frames included, so a slow PC still gives a perfect 30 frames per second video.
  let scale = 1;
  const CAPTURE = Q.get('capture') === '1';
  const realPerf = performance.now.bind(performance), realDate = Date.now, realRaf = requestAnimationFrame.bind(window), realCaf = cancelAnimationFrame.bind(window);
  const realSetTimeout = setTimeout.bind(window), realSetInterval = setInterval.bind(window), realClearTimeout = clearTimeout.bind(window), realClearInterval = clearInterval.bind(window);
  let pBase = realPerf(), pV = pBase, dV = realDate();
  const vPerf = () => CAPTURE ? pV : pV + (realPerf() - pBase) * scale;

<script>// Shared "juice": flying coins, confetti, pops, dust and hearts (DOM + CSS only, cheap on phones). From Pocket Dungeon Dash, in the Nimbus Catch palette.
window.JUICE = (() => {
  const css = `
.jz{position:fixed;z-index:60;pointer-events:none;left:0;top:0;will-change:transform,opacity}
.jz-coin{width:26px;height:26px;object-fit:contain;transition:transform .7s cubic-bezier(.55,-0.25,.4,1),opacity .7s}
.jz-conf{width:8px;height:12px;border-radius:2px;animation:jzfall var(--d) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes jzfall{0%{transform:translate(var(--x0),var(--y0)) rotate(0)}100%{transform:translate(var(--x1),var(--y1)) rotate(var(--r));opacity:0}}
.jz-dust{width:10px;height:10px;border-radius:50%;background:rgba(255,243,224,.95);animation:jzdust .6s ease-out forwards}
@keyframes jzdust{0%{transform:translate(var(--x0),var(--y0)) scale(.6);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1.8);opacity:0}}
.jz-heart{font-size:20px;animation:jzheart 1.1s ease-out forwards}
@keyframes jzheart{0%{transform:translate(var(--x0),var(--y0)) scale(.4);opacity:0}25%{opacity:1;transform:translate(var(--x0),calc(var(--y0) - 14px)) scale(1.2)}100%{transform:translate(var(--x0),calc(var(--y0) - 54px)) scale(1);opacity:0}}
.jz-pop{animation:jzpop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes jzpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.jz-bump{animation:jzbump .35s ease-out}@keyframes jzbump{40%{transform:scale(1.25)}}
.jz-flash{position:fixed;inset:0;z-index:58;pointer-events:none;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,243,224,.8),rgba(255,243,224,0) 45%);animation:jzflash .7s ease-out forwards}@keyframes jzflash{to{opacity:0}}

      setTimeout(() => { c.style.transform = `translate(${x1 - 13}px,${y1 - 13}px) scale(.9)`; c.style.opacity = '.4'; }, 30 + i * 55);

// ---------- drawing ----------
function draw() {
  const s = V.sc * V.d, Z = E.ZONES[G.zone - 1]; g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = Z.sky[0]; g.fillRect(0, 0, cv.width, cv.height);

  // the creatures swim under the surface: dark silhouettes over the cloud sea
  for (const sh of G.shadows) ART.creature(g, sh.k, sh.x, sh.y, sh.s, '', null, T, true, sh.v < 0);
  if (G.giant) { G.giant.t += 1 / 60; G.giant.x += 1.6; ART.creature(g, 'whale', G.giant.x, SEA + 150, 2.4, '', null, T, true, false); if (G.giant.x > W + 220) G.giant = null; }

  const f = G.float;
  if (G.phase === 'fight' && G.fight) { const F = G.fight, cx = f.x + F.x * 60, cy = SEA + 24 + F.dist * 150; ART.creature(g, F.c, cx, cy, F.c.legend ? 1.8 : 1.1, '', null, T, true, F.x < 0); lineTo(cx, cy, F.tension); }
  for (const b of G.bubbles) ART.bubble(g, b.x, b.y, b.r, T);
  ART.airship(g, SHIP[0], SHIP[1], T, S.paint); ART.firmin(g, SHIP[0] + 4, SHIP[1] + 18, { t: G.firT + T, pose: G.firPose, outfit: S.outfit });

  ART.line(g, 3, '#8C5A36'); g.beginPath(); g.moveTo(SHIP[0] + 18, SHIP[1] + 30); g.lineTo(TIP[0], TIP[1] + Math.sin(T * 1.3) * 3 + (G.phase === 'fight' ? 6 : 0)); g.stroke();
  if (G.phase === 'flying') { const k = G.flyT, x = lerp(f.x0, f.x, k), y = lerp(f.y0, f.y, k) - Math.sin(k * Math.PI) * 120; lineTo(x, y, 0); ART.float(g, x, y, T, 0); }
  if (G.phase === 'wait') { lineTo(f.x, f.y, 0); ART.float(g, f.x, f.y, T, G.bite > 0 ? 1 : 0); if (G.bite > 0) { g.fillStyle = P.cloud; g.beginPath(); g.arc(f.x, f.y - 26, 13, 0, TAU); g.fill(); ART.line(g, 2.5); g.stroke(); g.fillStyle = P.red; g.font = '900 18px ui-rounded,system-ui'; g.textAlign = 'center'; g.fillText('!', f.x, f.y - 20); } }
  if (G.phase === 'aim') gauge();
  if (G.phase === 'leap' && G.leap) { const F = G.fight, k = clamp(G.leap.t / 1.3, 0, 1), x = lerp(G.leap.x, SHIP[0] + 10, k), y = SEA - Math.sin(k * Math.PI) * 170 + k * (SHIP[1] - SEA + 30);
    const rc = E.RAR.find(r => r.id === F.r).col; ART.creature(g, F.c, x, y, (F.c.legend ? 1.6 : 1.2) * (1 - k * .4), F.c.c, rc, T, false, false); if (F.r !== 'commune') { g.globalAlpha = .4; g.fillStyle = rc; g.beginPath(); g.arc(x, y, 38, 0, TAU); g.fill(); g.globalAlpha = 1; } }
  if (G.bird) ART.thief(g, G.bird.x, G.bird.y, T, G.bird.flee ? 1 : -1);
  if (G.bolt) ART.bolt(g, G.bolt.x, G.bolt.y, G.bolt.a);
  for (const p of G.parts) { g.globalAlpha = 1 - p.t / p.life; g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); } g.globalAlpha = 1;

}
function lineTo(x, y, tn) { const k = clamp(tn, 0, 1); g.strokeStyle = tn > 1 ? P.red : `rgb(${255},${Math.round(248 - k * 160)},${Math.round(240 - k * 170)})`; g.lineWidth = 1.6 + k; g.beginPath(); g.moveTo(TIP[0], TIP[1]); g.quadraticCurveTo((TIP[0] + x) / 2, Math.max(TIP[1], y) + 30 * (1 - k), x, y); g.stroke(); }

  if (!G.drag) { g.fillStyle = P.cloud; g.font = '800 14px ui-rounded,system-ui'; g.textAlign = 'center'; g.fillText(t('pull'), W / 2, SEA - 40); } }

  g.fillStyle = P.cloud; g.font = '900 13px ui-rounded,system-ui'; g.textAlign = 'center'; g.fillText(G.hold ? (F.tension > .95 ? t('release') : '⟵  ⟶') : t('hold'), W / 2, y - 8);
  const d = 1 - clamp(F.dist, 0, 1); g.fillStyle = 'rgba(38,32,58,.45)'; g.fillRect(W - 22, 200, 10, 140); g.fillStyle = '#7DBE6A'; g.fillRect(W - 22, 200 + 140 * (1 - d), 10, 140 * d); ART.line(g, 2); g.strokeRect(W - 22, 200, 10, 140); }

  m.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const id = b.dataset.o, o = E.outfits.find(x => x.id === id); if (S.outfits[id]) S.outfit = id; else if (o && o.pearls && S.pearls >= o.pearls) { S.pearls -= o.pearls; S.outfits[id] = 1; S.outfit = id; SFX.fanfare(); } else return; save(); shipModal(); renderHome(); });
}
function trapsModal() { if (!S.said.trap) { S.said.trap = 1; say('trap', 2600); }
  const m = openModal(`<h2>${t('traps')}</h2>${S.traps.map((tr, i) => { if (!tr) return `<div class="it"><div class="tx"><b>#${i + 1}</b></div>${E.traps.opts.map((o, j) => `<button class="buy" data-set="${i}:${j}">${t('trapSet', o.h)}</button>`).join('')}</div>`;
      const ready = tr.end <= Date.now(); return `<div class="it"><div class="tx"><b>#${i + 1}</b><small>${ready ? '' : t('trapWait', left(tr.end - Date.now()))}</small></div>${ready ? `<button class="buy" data-take="${i}">${t('trapReady', tr.shells)}</button>` : `<button class="buy gm" data-fin="${i}">${E.finishPearls(Math.ceil((tr.end - Date.now()) / 60000))} 💧</button><button class="buy ad" data-fad="${i}">▶</button>`}</div>`; }).join('')}<p class="note">${t('pearlNote')}</p><button class="b2" data-close>OK</button>`, 'wide');
  m.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.set.split(':').map(Number), o = E.traps.opts[j]; S.traps[i] = { end: Date.now() + o.h * 36e5, shells: o.shells }; save(); trapsModal(); renderHome(); });
  m.querySelectorAll('[data-take]').forEach(b => b.onclick = () => { const i = +b.dataset.take; S.shells += S.traps[i].shells; S.traps[i] = null; save(); SFX.coins(); trapsModal(); renderHome(); });
  m.querySelectorAll('[data-fin]').forEach(b => b.onclick = () => { const i = +b.dataset.fin, cost = E.finishPearls(Math.ceil((S.traps[i].end - Date.now()) / 60000)); if (S.pearls < cost) return; S.pearls -= cost; S.traps[i].end = Date.now(); save(); trapsModal(); });
  m.querySelectorAll('[data-fad]').forEach(b => b.onclick = async () => { if (await Ads.rewarded('trap')) { S.traps[+b.dataset.fad].end = Date.now(); save(); trapsModal(); } }); }
// the wind merchant's chest: shells only, odds shown before opening
function chestModal() { if (!S.said.chest) { S.said.chest = 1; say('chest', 2800); } const O = E.chest.odds, free = S.chestDay !== today();
  const m = openModal(`<h2>${t('chest')}</h2><div class="big-ico">${ico('coffre', '🎁', 120)}</div><p class="sub">${t('chestOdds', O[0].p, O[1].p, O[2].p, E.chest.dup)}</p><button class="b1 big" data-open ${S.shells < E.chest.shells ? 'disabled' : ''}>${t('chestOpen', E.chest.shells)}</button>${free ? `<button class="b2 bad" data-free>▶ ${t('chestAd')}</button>` : ''}<button class="b2" data-close>OK</button>`);
  m.querySelector('[data-open]').onclick = () => { if (S.shells < E.chest.shells) return; S.shells -= E.chest.shells; openChest(); };
  const f = m.querySelector('[data-free]'); if (f) f.onclick = async () => { if (await Ads.rewarded('chest')) { S.chestDay = today(); openChest(); } }; }
// a painted sprite as an <img> for the interface, or the emoji when the sprite is missing
const ico = (n, emo, px = 48) => window.NC_SPR && NC_SPR[n] ? `<img src="${NC_SPR[n]}" alt="" style="width:${px}px;height:${px}px;object-fit:contain;vertical-align:middle">` : emo;
function openChest() { let q = Math.random() * 100, r = 'epique'; for (const o of E.chest.odds) { if (q < o.p) { r = o.r; break; } q -= o.p; }
  const pool = E.loot.filter(x => x.r === r), it = pool[(Math.random() * pool.length) | 0]; let dup = false;
  if (it.k === 'bait') S.goldBait += it.id === 'appat_dore' ? 1 : 0; else if (it.k === 'outfit') { dup = !!S.outfits[it.id]; S.outfits[it.id] = 1; } else { dup = !!S.decos[it.id]; S.decos[it.id] = 1; }
  if (dup) S.shells += E.chest.dup; save(); SFX.card(r === 'epique' ? 'epique' : r); JUICE.confetti(r === 'epique' ? 90 : 40); track('chest_open', { r, id: it.id, dup });
  openModal(`<h2>${t('r_' + (r === 'commun' ? 'commune' : r))}</h2><div class="big-ico">${it.k === 'outfit' ? ico('firmin_card_' + it.id, '🧢', 120) : it.k === 'bait' ? ico(it.id === 'appat_dore' ? 'appat_dore' : 'appat', '🪱', 120) : ico(it.id, '🫙', 120)}</div><p><b>${t((it.k === 'outfit' ? 'o_' : it.k === 'bait' ? 'b_' : 'd_') + it.id)}</b></p><p class="sub">${dup ? t('dup', E.chest.dup) : t('got')}</p><button class="b2" data-close>OK</button>`); renderHome(); }
function shopModal() { Store.init();
  const m = openModal(`<h2>${t('shop')}</h2>${E.store.map(it => `<div class="it"><div class="tx"><b>${t('s_' + it.id)}</b><small>${t('s_' + it.id + 'Sub')}</small></div>${it.once && S.owned[it.id] ? `<span class="own">${t('own')}</span>` : `<button class="buy price" data-buy="${it.id}">${Store.price(it)}</button>`}</div>`).join('')}<p class="note">${t('pearlNote')}</p><button class="b2" data-close>OK</button>`, 'wide');
  m.querySelectorAll('[data-buy]').forEach(b => b.onclick = async () => { SFX.ui(); if (await Store.buy(E.store.find(x => x.id === b.dataset.buy))) shopModal(); }); }
function settingsModal() { const sw = (k, l) => `<label class="sw">${l}<input type="checkbox" data-s="${k}" ${S[k] ? 'checked' : ''}></label>`;
  const m = openModal(`<h2>${t('settings')}</h2>${sw('sound', t('sound'))}${sw('music', t('music'))}${sw('vib', t('vib'))}<label class="sw">${t('lang')}<select data-lang>${I.langs.map(l => `<option value="${l}" ${l === I.lang ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('')}</select></label>
    <button class="b2" data-restore>${t('restore')}</button>${NADS() ? `<button class="b2" data-ump>${t('privacyChoices')}</button>` : ''}<button class="b2" data-priv>${t('privacy')}</button><div class="ver">Nimbus Catch ${window.NC_VERSION || ''}</div><button class="b2" data-close>OK</button>`, 'wide');
  m.querySelectorAll('[data-s]').forEach(c => c.onchange = () => { S[c.dataset.s] = c.checked; save(); });
  m.querySelector('[data-lang]').onchange = e => { S.lang = e.target.value; I.set(S.lang); save(); settingsModal(); renderHome(); };
  m.querySelector('[data-restore]').onclick = () => Store.restore(); const u = m.querySelector('[data-ump]'); if (u) u.onclick = () => nads('consentForm');
  m.querySelector('[data-priv]').onclick = () => openModal(`<div class="legal">${window.NC_PRIVACY || ''}</div><button class="b2" data-close>OK</button>`, 'wide'); }

// ---------- title & loop ----------
function showTitle() { G.mode = 'title'; const el = $('#title'); el.classList.add('on');
  el.innerHTML = `<div class="logo">${window.NC_SPR && NC_SPR.logo ? `<img src="${NC_SPR.logo}" alt="Nimbus Catch" style="width:min(88vw,430px);display:block">` : '<h1>Nimbus<br>Catch</h1>'}</div><canvas id="tship" width="360" height="300"></canvas><div style="width:100%;display:flex;flex-direction:column;align-items:center"><p>${t('tapToStart')}</p><button class="b1 huge" data-play>${t('play')}</button></div>`;
  el.querySelector('[data-play]').onclick = async () => { audioInit(); SFX.ui(); el.classList.remove('on'); await Ads.init(); Store.init(); if (S.catches === 0) startOuting(1); else goHome(); }; }
function drawTitle() { const c = $('#tship'); if (!c || G.mode !== 'title') return; const q = c.getContext('2d'), T = performance.now() / 1000; q.setTransform(1, 0, 0, 1, 0, 0); q.clearRect(0, 0, 360, 300); q.setTransform(1.6, 0, 0, 1.6, 0, 40); ART.airship(q, 112, 70, T, S.paint); ART.firmin(q, 116, 88, { t: T, outfit: S.outfit, pose: 'dance' }); }
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { tick(dt); draw(); drawTitle(); if (G.mode === 'home' && ((now / 200) | 0) % 2 === 0) drawShip(); if (G.mode !== 'play' || G.phase === 'aim' || G.phase === 'wait') musicTick(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop); }
showTitle(); requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.NC = { G, S: () => S, SFX, E, save, startOuting, goHome, say, toScreen, closeModal, resetSave: () => { S = fresh(); I.set(S.lang); save(); }, floatScreen: () => G.float && toScreen(G.float.x, G.float.y), scale: () => V.sc };
})();
</script>
<script>// Nimbus Catch scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Real gestures: the cast is a real downward drag (A.drag), the strike a real tap (A.tap); the fight is a finger held down that
// slides left/right after the creature and lifts when the line turns red (pointer events on the canvas, like a thumb).
// The 5 scenes of the plan: lancer (perfect cast), combat (the line turns red, "Let go!", reeled in), legende (the storm whale
// leaps in slow motion, LEGENDARY card = App Store preview n° 1), voliere (20 creatures flying in the jar), carnet (the logbook).
(() => {
  if (!window.BETA || !BETA.on) return;
  const D = window.NC, G = D.G, S = () => D.S(), E = D.E, cv = document.getElementById('cv');
  if (BETA.opts.ui === 'propre') { const st = document.createElement('style'); st.textContent = '.adov{display:none!important}[data-x2]{display:none!important}.price{visibility:hidden!important}'; document.head.appendChild(st); }
  const ev = (type, x, y) => cv.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: x, clientY: y, pointerId: 7, pointerType: 'touch', isPrimary: true }));
  async function until(A, cond, sec) { const t0 = performance.now(); while (A.running() && !cond() && (performance.now() - t0) / 1000 < sec) await A.wait(100); }
  async function start(A) { if (A.opts.ui === 'propre') { if (S().consent == null) S().consent = false; S().owned.noads = true; } if (G.mode !== 'title') return; await A.wait(900); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(900); }
  // one full catch: cast (power p), strike when the float dives, fight (follow the pulls, let go on red)
  async function cast(A, p = .84, label = 'lancer') {
    await until(A, () => G.mode === 'play' && G.phase === 'aim', 8); if (!A.running()) return;
    const k = D.scale(), x = innerWidth / 2 + A.jitter(-10, 10), y = innerHeight * .45; await A.think();
    await A.drag(x, y, x + A.jitter(-6, 6), y + p * 170 * k, label, 650); if (G.perfect) A.mark('lancer parfait : étincelles');
  }
  async function strike(A) { await until(A, () => (G.phase === 'wait' && G.bite > 0) || G.phase === 'aim', 9); if (G.phase !== 'wait') return false; await A.wait(A.jitter(160, 320)); const f = D.floatScreen(); await A.tap(f[0], f[1] - 20, 'ferrer'); A.mark('FERRÉ !'); return G.phase === 'fight'; }
  async function fightIt(A, o = {}) {
    const x0 = innerWidth / 2, y0 = innerHeight * .78; ev('pointerdown', x0, y0); let red = false;
    while (A.running() && G.phase === 'fight') { const F = G.fight;
      if (F.tension > (o.risky ? 1.02 : .82)) { if (!red && F.tension > .95) { red = true; A.mark('la ligne rougit : Relâche !'); } ev('pointerup', x0, y0); await A.wait(A.jitter(380, 520)); ev('pointerdown', x0, y0); }
      ev('pointermove', x0 + F.dir * 50, y0); await A.wait(90); }
    ev('pointerup', x0, y0);
    if (G.phase === 'leap') { A.mark('la créature jaillit des nuages au ralenti'); await until(A, () => !!document.querySelector('.ccard'), 4); A.mark('la carte se retourne'); }
  }
  async function catchOne(A, o = {}) { await cast(A, o.p || .84, o.label); if (await strike(A)) await fightIt(A, o); await A.wait(o.card || 2600); const c = document.querySelector('.ccard'); if (c) c.click(); await A.wait(600); }
  function makeSave(kind) {
    const s = S(); s.consent = false; s.tut = 2; s.catches = 30; s.outings = 4; s.said = { t2: 1, t4: 1, t5: 1, follow: 1, bird: 1, light: 1, storm: 1, trap: 1, chest: 1 };
    s.login = { last: new Date().getFullYear() + '-' + (new Date().getMonth() + 1) + '-' + new Date().getDate(), streak: 2, pending: false };
    s.ups = kind === 'avance' ? { moulinet: 3, ligne: 3, appat: 2 } : { moulinet: 2, ligne: 1, appat: 1 }; s.shells = 900; s.lvl = 6;
    const ids = E.CR.filter(c => !c.legend).slice(0, kind === 'avance' ? 20 : 9).map(c => c.id); for (const id of ids) { s.book[id] = 1; s.aviary[id] = 1; const c = E.CR.find(x => x.id === id); s.rec[id] = Math.round(c.cm[0] + (c.cm[1] - c.cm[0]) * .7); }
    D.save();
  }
  BETA.game({
    sfx: D.SFX, endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement', progress: () => [G.mode, G.phase, G.cast, S().catches],
    async prepare(save, A) {
      const sc = A.opts.scene; if (sc === 'onboarding') { D.resetSave(); return; }
      makeSave(sc === 'voliere' || sc === 'carnet' || save === 'avance' ? 'avance' : 'milieu'); await start(A); D.closeModal(); await A.wait(300);
      if (sc === 'legende' || sc === 'moment') { S().goldBait = 3; S().useGold = true; D.startOuting(2); D.G.forceLegend = true; }   // the golden bait in the storm sky: the whale bites (forced for the take)
      else if (sc === 'voliere' || sc === 'carnet') D.goHome(); else D.startOuting(sc === 'combat' ? 2 : 1);
      document.getElementById('firmin').classList.remove('on'); await A.wait(300);
    },
    scenes: {
      onboarding: async A => { await start(A); for (let i = 0; i < 3 && A.running(); i++) await catchOne(A, { card: 2400 }); await A.wait(3000); },
      lancer: async A => { await catchOne(A, { p: .84, label: 'lancer parfait' }); await A.wait(1500); },
      boucle: async A => { for (let i = 0; i < 3 && A.running(); i++) await catchOne(A); },
      combat: async A => { await catchOne(A, { risky: true }); await A.wait(1500); },
      legende: async A => { await catchOne(A, { p: .86, card: 4200, label: 'appât doré dans l’orage' }); await A.wait(1500); },
      moment: async A => { await catchOne(A, { p: .86, card: 4200 }); },
      voliere: async A => { await A.wait(1200); await A.tapEl('#hfoot [data-f="aviary"]', 'la volière'); A.mark('la volière : 20 créatures'); await A.wait(7000); },
      carnet: async A => { await A.wait(1200); await A.tapEl('#hfoot [data-f="book"]', 'le carnet'); A.mark('le carnet et les records'); await A.wait(2500); const c = document.querySelector('#modal .card'); if (c) c.scrollBy({ top: 600, behavior: 'smooth' }); await A.wait(3500); },
      idle: async A => { while (A.running()) { if (G.mode === 'home') { await A.tapEl('#hmid [data-z="1"]', 'partir'); await A.wait(1200); continue; } const a = document.querySelector('#modal [data-again]'); if (a) { await A.tapEl(a, 'nouvelle sortie'); await A.wait(1200); continue; } await catchOne(A); } },
    },
  });
})();
</script>
