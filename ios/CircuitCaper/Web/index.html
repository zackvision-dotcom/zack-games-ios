<script>window.CC_VERSION="1.0";window.CC_SPR={"d_alarm": "assets/d_alarm.png", "d_button": "assets/d_button.png", "d_cam": "assets/d_cam.png", "d_door": "assets/d_door.png", "d_door_open": "assets/d_door_open.png", "d_elev": "assets/d_elev.png", "d_exit": "assets/d_exit.png", "d_lamp_off": "assets/d_lamp_off.png", "d_lamp_on": "assets/d_lamp_on.png", "d_painting": "assets/d_painting.png", "d_sack": "assets/d_sack.png", "d_safe": "assets/d_safe.png", "d_switch": "assets/d_switch.png", "d_trap": "assets/d_trap.png", "d_trap_open": "assets/d_trap_open.png", "deco_aquarium": "assets/deco_aquarium.png", "deco_armor": "assets/deco_armor.png", "deco_cat": "assets/deco_cat.png", "deco_chandelier": "assets/deco_chandelier.png", "deco_flamingo": "assets/deco_flamingo.png", "deco_globe": "assets/deco_globe.png", "deco_record": "assets/deco_record.png", "deco_rug": "assets/deco_rug.png", "deco_throne": "assets/deco_throne.png", "deco_vase": "assets/deco_vase.png", "guard_alert": "assets/guard_alert.png", "guard_ko": "assets/guard_ko.png", "guard_w0": "assets/guard_w0.png", "guard_w1": "assets/guard_w1.png", "logo": "assets/logo.png", "loot_0": "assets/loot_0.png", "loot_1": "assets/loot_1.png", "loot_2": "assets/loot_2.png", "loot_3": "assets/loot_3.png", "loot_4": "assets/loot_4.png", "loot_5": "assets/loot_5.png", "loot_6": "assets/loot_6.png", "loot_7": "assets/loot_7.png", "rico_fall": "assets/rico_fall.png", "rico_g0": "assets/rico_g0.png", "rico_g1": "assets/rico_g1.png", "rico_sneak": "assets/rico_sneak.png", "rico_w0": "assets/rico_w0.png", "rico_w1": "assets/rico_w1.png", "rico_w2": "assets/rico_w2.png", "rico_win": "assets/rico_win.png", "title_bg": "assets/title_bg.png", "ui_fast": "assets/ui_fast.png", "ui_gear": "assets/ui_gear.png", "ui_gift": "assets/ui_gift.png", "ui_hide": "assets/ui_hide.png", "ui_hint": "assets/ui_hint.png", "ui_lock": "assets/ui_lock.png", "ui_map": "assets/ui_map.png", "ui_retry": "assets/ui_retry.png", "ui_star": "assets/ui_star.png", "ui_star0": "assets/ui_star0.png", "wall_0": "assets/wall_0.png", "wall_1": "assets/wall_1.png", "wall_2": "assets/wall_2.png", "wall_3": "assets/wall_3.png", "wall_4": "assets/wall_4.png", "wall_5": "assets/wall_5.png"};window.CC_PRIVACY="<h4>Politique de confidentialité — Circuit Caper</h4>\n<p><b>En bref :</b> aucun compte, aucune inscription. Ta progression reste sur ton appareil, les achats passent par Apple, et le jeu affiche des publicités Google AdMob que tu peux refuser.</p>\n<h4>Ta sauvegarde reste sur ton appareil</h4>\n<p>Niveaux, objets et réglages sont enregistrés uniquement sur ton appareil. Nous ne les recevons jamais. Supprimer le jeu efface la sauvegarde.</p>\n<h4>Achats intégrés</h4>\n<p>Les paiements sont gérés par Apple (App Store, StoreKit). Nous ne recevons ni coordonnées bancaires ni identité, seulement la liste des produits que tu possèdes. « Restaurer les achats » te permet de les récupérer sur un autre appareil. Aucun achat ne donne d’objet tiré au hasard, et il n’y a aucun abonnement.</p>\n<h4>Publicité (Google AdMob)</h4>\n<p>Des publicités plein écran apparaissent entre deux parties, et des vidéos bonus sont proposées si tu le veux. L’achat « Sans pub » retire les publicités plein écran. Le SDK Google Mobile Ads peut collecter l’identifiant publicitaire de l’appareil (IDFA), seulement si tu l’autorises dans la demande d’Apple (« Autoriser le suivi »), ainsi que des données techniques et d’interaction avec les annonces. Dans l’EEE, au Royaume-Uni et en Suisse, un écran de consentement de Google (UMP) te permet d’accepter, de refuser ou de gérer tes choix. Si tu refuses, seules des publicités non personnalisées s’affichent. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires. Comment Google utilise ces données : <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<h4>Ce que nous ne faisons pas</h4>\n<p>Aucun outil de mesure d’audience tiers en dehors d’AdMob, aucun profil, aucune vente de données, aucun accès aux contacts, photos, micro, caméra ou position GPS.</p>\n<h4>Enfants</h4>\n<p>Circuit Caper s’adresse à un public général. Nous ne collectons sciemment aucune donnée d’enfant, et les publicités excluent les contenus sensibles.</p>\n<h4>Tes droits et contact</h4>\n<p>Nous ne détenons aucune donnée qui t’identifie : il n’y a donc rien à consulter ni à supprimer chez nous. Tu peux effacer ta partie dans les Réglages. Les données publicitaires se gèrent avec Réglages → Choix publicitaires ou les outils de Google. Pour toute question : <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Politique complète : <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n<hr>\n<h4>Privacy policy — Circuit Caper</h4>\n<p><b>In short:</b> no account, no sign-up. Your progress stays on your device, purchases go through Apple, and the game shows Google AdMob ads that you can decline.</p>\n<p><b>Your save stays on your device:</b> levels, items and settings are kept only on your device. We never receive them. Deleting the game erases the save.</p>\n<p><b>In-app purchases:</b> payments are handled by Apple (App Store, StoreKit). We receive no payment or identity details, only which products you own. Restore purchases lets you get them back on another device. No purchase gives a random item, and there is no subscription.</p>\n<p><b>Advertising (Google AdMob):</b> full-screen ads appear between games, and bonus videos are offered if you want them. The “No ads” purchase removes full-screen ads. The Google Mobile Ads SDK may collect your device’s advertising identifier (IDFA), only if you allow it in Apple’s prompt (“Allow tracking”), as well as technical data and ad interaction data. In the EEA, the UK and Switzerland, Google’s consent screen (UMP) lets you accept, decline or manage your choices. If you decline, only non-personalised ads are shown. Change your mind any time in Settings → Ad choices. How Google uses this data: <a href=\"https://policies.google.com/technologies/ads\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/ads</a></p>\n<p><b>What we don’t do:</b> no third-party analytics other than AdMob, no profiles, no data sales, no access to contacts, photos, microphone, camera or GPS location.</p>\n<p><b>Children:</b> Circuit Caper is meant for a general audience. We do not knowingly collect children’s data, and ads exclude sensitive content.</p>\n<p><b>Your rights and contact:</b> we hold no data that identifies you, so there is nothing to access or delete on our side. You can erase your progress in Settings. Ad data is managed with Settings → Ad choices or Google’s tools. Questions: <a href=\"mailto:contact@zackvision.fr\" target=\"_blank\">contact@zackvision.fr</a>. Full policy: <a href=\"https://zackvision.fr/jeux/confidentialite/\" target=\"_blank\" rel=\"noopener\">https://zackvision.fr/jeux/confidentialite/</a></p>\n";</script>
<script>// BETA IA — a simulated player inside the game, for tests and in-game video capture (spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Shared by every game: copy this file into <game>/src/beta.js, load it BEFORE the game scripts, and register the game's
// scenes after them with BETA.game({...}) (see <game>/src/beta-game.js).
// Turned on only by the address (?beta=ia) and never inside the iOS app (the native store handler is present there).
(() => {
  const Q = new URLSearchParams(location.search);
  const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
  const ON = !NATIVE && Q.get('beta') === 'ia';
  const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
  const opts = {
    scene: Q.get('scene') || 'boucle', style: Q.get('style') || 'pro', seed: num('seed', 0), save: Q.get('save') || 'neuf',
    vitesse: num('vitesse', 1), doigt: Q.get('doigt') !== '0', ui: Q.get('ui') || 'normal', duree: num('duree', 0),
    format: Q.get('format') || '', log: Q.get('log') === '1', auto: Q.get('auto') !== '0',
  };

  let rnd = Math.random;
  function seedRandom(seed) {
    let a = (seed >>> 0) || 1;
    rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    Math.random = rnd;

  // Normal mode: time runs ×1 to ×20 (performance.now, Date.now, requestAnimationFrame stamps and timers all follow).
  // Capture mode (?capture=1, used by tools/beta-record.mjs): time stands still and only moves with BETA.step(ms),
  // timers and animation frames included, so a slow PC still gives a perfect 30 frames per second video.
  let scale = 1;
  const CAPTURE = Q.get('capture') === '1';
  const realPerf = performance.now.bind(performance), realDate = Date.now, realRaf = requestAnimationFrame.bind(window), realCaf = cancelAnimationFrame.bind(window);
  const realSetTimeout = setTimeout.bind(window), realSetInterval = setInterval.bind(window), realClearTimeout = clearTimeout.bind(window), realClearInterval = clearInterval.bind(window);
  let pBase = realPerf(), pV = pBase, dV = realDate();
  const vPerf = () => CAPTURE ? pV : pV + (realPerf() - pBase) * scale;
  function setSpeed(s) { if (CAPTURE) { scale = Math.max(0.1, s); return; } const now = realPerf(); pV = pV + (now - pBase) * scale; dV = dV + (now - pBase) * scale; pBase = now; scale = Math.max(0.1, s); }
  let vAcc = 0;   // capture mode: milliseconds of video stepped so far
  const videoNow = () => CAPTURE ? vAcc : realPerf();
  // capture-mode scheduler
  let tid = 1e6; const timers = new Map(); let rafs = [];
  function installClock() {
    performance.now = vPerf;
    Date.now = () => Math.round(dV0 + (vPerf() - pV0));
    if (!CAPTURE) {
      window.requestAnimationFrame = cb => realRaf(() => cb(vPerf()));
      window.setTimeout = (f, ms, ...a) => realSetTimeout(f, (ms || 0) / scale, ...a);
      window.setInterval = (f, ms, ...a) => realSetInterval(f, (ms || 0) / scale, ...a);
      return;
    }
    window.requestAnimationFrame = cb => { const id = ++tid; rafs.push([id, cb]); return id; };
    window.cancelAnimationFrame = id => { rafs = rafs.filter(r => r[0] !== id); };
    window.setTimeout = (f, ms, ...a) => { const id = ++tid; timers.set(id, { at: pV + Math.max(0, ms || 0), f, a, every: 0 }); return id; };
    window.setInterval = (f, ms, ...a) => { const id = ++tid; const every = Math.max(1, ms || 0); timers.set(id, { at: pV + every, f, a, every }); return id; };
    window.clearTimeout = window.clearInterval = id => { timers.delete(id); };
  }
  const pV0 = pV, dV0 = dV;
  // Moves the game clock by ms (game time = ms × speed), runs due timers in order, then one animation frame, then lets the page paint.
  async function step(ms) {
    vAcc += ms; const target = pV + ms * scale;
    // timers due now; one set from inside a callback waits for the next step (like a new browser task), so long jobs can slice themselves
    const due = [...timers].filter(([, t]) => t.at <= target).sort((x, y) => x[1].at - y[1].at);
    for (const [id, t] of due) {
      if (timers.get(id) !== t) continue; pV = Math.max(pV, t.at);

const LOGIN = [50, 80, 120, 160, 220, 300, 600];

    <button class="b2" data-tuto>${t('tuReplay')}</button><button class="b2" data-consent>${t('adChoices')}</button>${zvButtons()}<button class="b2" data-privacy>${t('privacy')}</button><button class="b3" data-reset>${t('resetGame')}</button><button class="b2 big" data-close>${t('close')}</button><div class="ver">Circuit Caper ${window.CC_VERSION || ''}</div>`);

function titleScreen() {
  G.mode = 'title'; const el = $('#title');
  el.innerHTML = `<div class="logo">${SPR.logo ? `<img src="${SPR.logo}" alt="Circuit Caper">` : '<h1>Circuit<br><span>Caper</span></h1>'}<p>${t('subtitle')}</p></div><div class="hero">${SPR.title_bg ? '' : '🦝'}</div><button class="b1 big" data-play>${Object.keys(S.stars).length ? t('cont') : t('play')}</button>`;
  el.classList.add('on'); el.querySelector('[data-play]').onclick = () => { audioInit(); SFX.fanfare(); el.classList.remove('on'); S.consent == null ? consentModal(false) : begin(); };

  Ads.init(); ensureLogin(); $('#game').classList.add('on'); renderHud();
  Store.init();
  const next = LV.find(L => !S.stars[L.id] && unlocked(L.id));

addEventListener('resize', layout);
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; G.t += dt; if (G.mode === 'heist') heistTick(dt); musicTick(); draw(); requestAnimationFrame(frame); }

<script>// Circuit Caper scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// The player drags real wires between the sockets on screen (the winning wiring of tools/solve.mjs), starts the heist,
// presses the buttons on time, then cracks the safe by tapping when the needle crosses the green notch.
(() => {
  if (!window.BETA || !BETA.on) return;
  const K = window.CAPER, G = K.G, S = () => K.S();
  if (BETA.opts.ui === 'propre') { const st = document.createElement('style'); st.textContent = '.adov{display:none!important}#modal [data-double]{display:none!important}#bar [data-a="hintad"]{visibility:hidden!important}'; document.head.appendChild(st); }
  const visible = sel => { const e = document.querySelector(sel); return e && e.offsetParent ? e : null; };
  async function start(A) {
    if (A.opts.ui === 'propre' && S().consent == null) S().consent = false;   // clean takes: no consent window on camera (refused = no personalised ads)
    if (A.opts.ui === 'propre') S().owned.noads = true;
    if (G.mode !== 'title') return;
    await A.wait(900); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(700);
    if (visible('#modal [data-c]')) { await A.think(); await A.tapEl(A.opts.ui === 'propre' ? '#modal [data-c="0"]' : '#modal [data-c="1"]', 'consentement'); await A.wait(700); }
    const gift = visible('#modal [data-claim], #modal [data-close]'); if (gift) { await A.wait(500); await A.tapEl(gift, 'fermer'); await A.wait(400); }
  }
  // plan: drag each wire of the winning wiring, like a player who knows the answer
  async function wire(A, L) {
    const sol = (window.CSOL || {})[L.id]; if (!sol) return false;
    for (const [a, b] of Object.entries(sol.w)) {
      if (!A.running()) return false; if (G.wires[a] === b) continue;
      const sa = K.sock(a), sb = K.sock(b); if (!sa || !sb) continue;
      await A.think(); await A.drag(sa.x, sa.y, sb.x, sb.y, `câble ${a}→${b}`, A.jitter(450, 700)); await A.wait(250);
    }
    return true;
  }
  async function heist(A, L) {
    const sol = (window.CSOL || {})[L.id] || { pr: [] };
    await A.think(); if (!(await A.tapEl('#bar [data-a="go"]', 'lancer le casse'))) return false;
    const presses = [...(sol.pr || [])].sort((x, y) => x.t - y.t);
    for (let i = 0; i < 1200 && A.running() && G.mode === 'heist'; i++) {
      if (presses.length && G.s && G.s.t >= presses[0].t - 0.02) { presses.shift(); await A.tapEl('#bar [data-a="press"]', 'bouton'); }
      await A.wait(50);
    }
    return G.mode === 'win';
  }
  // the safe: tap when the needle is inside the notch (a "debutant" player misses on purpose now and then)
  async function safe(A) {
    for (let i = 0; i < 400 && A.running() && !(G.dial && G.dial().alive); i++) await A.wait(50);
    let taps = 0; const d0 = G.dial(), r = d0.el.querySelector('canvas').getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const ang = v => ((v % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2), gap = (x, y) => Math.abs(((x - y + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    let pa = d0.a, pt = performance.now(), w = 3.2;   // needle speed, measured live (rad per second of game time)

      const d = G.dial(), now = performance.now(); if (now > pt) { const dv = ang(d.a - pa); if (dv > 0 && dv < 1) w = w * 0.7 + (dv / ((now - pt) / 1000)) * 0.3; pa = d.a; pt = now; }
      const lead = 0.24 * A.opts.vitesse, ahead = d.a + w * lead;   // a tap lands about 0.24 s after it starts
      const miss = A.opts.style === 'debutant' && A.rnd() < 0.35;
      if (gap(ahead, d.target) < 0.1 && !miss) { await A.tap(cx, cy, 'coffre-fort'); taps++; await A.wait(300); pa = G.dial().a; pt = performance.now(); }
      else await A.wait(16);
    }

  }
  async function afterWin(A) {
    await A.wait(1800);   // let the stars land
    const n = visible('#modal [data-next]'); if (n) { await A.think(); await A.tapEl(n, 'suivant'); await A.wait(900); }
  }
  // a popup over the screen (daily gift, consent…): close it the way a player would
  async function clearPopups(A) {
    for (let i = 0; i < 4; i++) {
      const b = visible('#modal [data-claim]') || visible('#modal [data-close]'); if (!b) return;
      await A.wait(A.jitter(400, 800)); await A.tapEl(b, b.dataset.claim != null ? 'cadeau' : 'fermer'); await A.wait(500);
    }
  }
  async function playLevel(A, L) {
    for (let k = 0; k < 3 && (!G.lvl || G.lvl.id !== L.id || G.mode !== 'plan'); k++) {
      await clearPopups(A);
      if (G.mode !== 'map') { K.mapScreen(); await A.wait(600); }
      await A.think(); await A.tapEl(`#mapv [data-l="${L.id}"]`, 'niveau ' + L.id); await A.wait(900);
    }
    if (!G.lvl || G.mode !== 'plan') { A.ev('erreur', { msg: 'niveau ' + L.id + ' pas ouvert' }); return false; }

    return won;

    sfx: K.SFX,
    logo: () => (window.CP_SPR || window.CC_SPR || {}).logo || (document.querySelector('#title .logo img') || {}).src || '',
    endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement',
    progress: () => [G.mode, G.lvl && G.lvl.id, G.s && Math.round(G.s.t)],
    async prepare(save, A) {
      setSave(save); if (A.opts.scene === 'onboarding') return;
      await start(A); await A.wait(800);
      if (G.mode !== 'map' && !(G.lvl && G.mode === 'plan')) { K.mapScreen(); await A.wait(500); }
      await A.wait(900); await clearPopups(A);
    },
    scenes: {
      async onboarding(A) { await start(A); await A.wait(1200); for (let i = 0; i < 2 && A.running(); i++) await playLevel(A, G.lvl && G.mode === 'plan' ? G.lvl : nextLevel()); },
      async boucle(A) { await playLevel(A, nextLevel()); },
      async progression(A) { A.speed(Math.max(2, A.opts.vitesse)); for (let i = 0; i < 4 && A.running(); i++) await playLevel(A, nextLevel()); },
      async moment(A) {   // straight into the heist of a wired level: the run, the loot, the safe
        const L = nextLevel(); K.startLevel(L); await A.wait(400);
        const sol = (window.CSOL || {})[L.id]; if (sol) Object.assign(G.wires, sol.w);
        if (await heist(A, L)) { A.mark('braquage réussi'); await safe(A); await A.wait(1500); }
      },
      async idle(A) { while (A.running()) await playLevel(A, nextLevel()); },
    },
  });
})();
