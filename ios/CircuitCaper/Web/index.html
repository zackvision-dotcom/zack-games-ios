<script>window.CC_VERSION="1.0";window.CC_SPR={};window.CC_PRIVACY="<h4>Politique de confidentialité — Circuit Caper</h4>\n<p>Circuit Caper fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix publicitaires.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. RevenueCat vérifie les reçus d’achat avec un identifiant anonyme.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) sont envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Circuit Caper convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Circuit Caper</h4>\n<p>Circuit Caper works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Ad choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. RevenueCat checks receipts with an anonymous identifier.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) are sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Circuit Caper suits all ages but is not directed at children. We do not knowingly collect personal data from children.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>
<script>// Circuit Caper — the heist simulation (shared by the game and tools/solve.mjs). Pure logic, no drawing.

(function (root) {

    const s = {
      L, t: 0, wires: Object.assign({}, wires), presses: (presses || []).slice().sort((a, b) => a.t - b.t), done: null, why: '', alarm: false,
      rico: { f: L.start.f, x: L.start.x, step: 0, wait: 0, loot: 0, inElev: null, dir: 1, detour: null },
      doors: L.doors.map(d => ({ ...d, open: !!d.open })), lamps: L.lamps.map(l => ({ ...l, on: l.on !== false })),
      guards: L.guards.map(g => ({ ...g, dir: g.dir || 1, ko: false, fall: 0, wait: 0 })), cams: L.cams.map(c => ({ ...c, seeing: false, off: false })),
      traps: L.traps.map(tr => ({ ...tr, open: 0 })), elevs: L.elevs.map(e => ({ ...e, at: e.at != null ? e.at : e.floors[0], move: 0, from: 0 })),
      sws: L.sws.map(w => ({ ...w, hit: false })), btns: L.btns.map(b => ({ ...b })), loot: L.loot.map(o => ({ ...o, got: false })), events: [],
    };

  }

  function emit(s, src) {
    const tgt = s.wires[src];

    if (o.id[0] === 'D') o.open = !o.open;
    else if (o.id[0] === 'L') o.on = !o.on;
    else if (o.id[0] === 'T') { o.open = TRAP_OPEN; for (const g of s.guards) if (!g.ko && g.f === o.f && Math.abs(g.x - o.x) < 0.5) { g.ko = true; g.fall = 1; s.events.push({ k: 'ko', id: g.id }); } }
    else if (o.id[0] === 'E') { if (!o.move && !o.pending) o.pending = 0.5; }

    // traps
    for (const tr of s.traps) if (tr.open > 0) { tr.open -= DT;
      for (const g of s.guards) if (!g.ko && g.f === tr.f && Math.abs(g.x - tr.x) < 0.5) { g.ko = true; g.fall = 1; s.events.push({ k: 'ko', id: g.id }); }
      if (r.f === tr.f && Math.abs(r.x - tr.x) < 0.45 && !r.inElev) { s.done = 'fail'; s.why = 'fell'; return; } }
    // Rico follows his route
    const st = L.route[r.step];
    if (!st) { s.done = 'win'; return; }
    let moved = false;
    if (st.go != null || r.detour) {
      let target = r.detour ? r.detour.to : st.go;

      const dir = Math.sign(target - r.x);
      if (Math.abs(target - r.x) < 0.02) { r.x = target; r.step++; r.wait = 0; }
      else { const nx = r.x + dir * RICO_SPEED * DT, stop = s.doors.find(d => !d.open && d.f === r.f && ((dir > 0 && d.x > r.x + 0.01 && d.x <= nx + 0.35) || (dir < 0 && d.x < r.x - 0.01 && d.x >= nx - 0.35)));

    } else if (st.elev) {

      if (!r.inElev) { if (e.at === r.f && !e.move && Math.abs(r.x - e.x) < 0.6) { r.inElev = e.id; r.x = e.x; r.wait = 0; } else { r.wait += DT; if (r.wait > STUCK * 2) { s.done = 'fail'; s.why = 'stuck'; return; } } }
      else if (!e.move && r.f === st.to) { r.inElev = null; r.step++; r.wait = 0; }
      else if (!e.move) { r.wait += DT; if (r.wait > STUCK * 2) { s.done = 'fail'; s.why = 'stuck'; return; } }
    } else if (st.wait) { r.wait += DT; if (r.wait >= st.wait) { r.wait = 0; r.step++; } }

<script>// Circuit Caper — world 1 (the museum): 15 levels + the big vault. Positions in tiles; floor 0 is the ground floor.

function giftModal() {
  const k = S.login.streak;
  openModal(`<h2>${t('login')}</h2><div class="login">${LOGIN.map((v, i) => `<div class="lg ${i < k - (S.login.pending ? 1 : 0) ? 'got' : ''} ${i === k - 1 && S.login.pending ? 'now' : ''}"><small>${t('day')} ${i + 1}</small>💰<b>${v}</b></div>`).join('')}</div>${S.login.pending ? `<button class="b1 big" data-claim>${t('claim')}</button>` : ''}<button class="b2" data-close>${t('close')}</button>`);
  const c = modal.querySelector('[data-claim]'); if (c) c.onclick = () => { S.coins += LOGIN[k - 1]; S.login.pending = false; save(); SFX.fanfare(); JUICE.confetti(50); renderHud(); giftModal(); };
  modal.querySelector('[data-close]').onclick = closeModal;
}
function settingsModal() {
  const sw = (k, l) => `<label class="sw"><span>${l}</span><input type="checkbox" data-k="${k}" ${S[k] ? 'checked' : ''}></label>`;
  openModal(`<h2>${t('settings')}</h2>${sw('sound', t('sound'))}${sw('music', t('music'))}${sw('vib', t('vibration'))}<label class="sw"><span>${t('language')}</span><select data-lang>${I.langs.map(l => `<option value="${l}" ${l === S.lang ? 'selected' : ''}>${I.names[l]}</option>`).join('')}</select></label>
    <button class="b2" data-consent>${t('adChoices')}</button><button class="b2" data-privacy>${t('privacy')}</button><button class="b3" data-reset>${t('resetGame')}</button><button class="b2 big" data-close>${t('close')}</button><div class="ver">Circuit Caper ${window.CC_VERSION || ''}</div>`);
  modal.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { S[c.dataset.k] = c.checked; save(); });
  modal.querySelector('[data-lang]').onchange = e => { S.lang = e.target.value; I.set(S.lang); save(); renderHud(); renderBar(); settingsModal(); };
  modal.querySelector('[data-consent]').onclick = () => consentModal(true);
  modal.querySelector('[data-privacy]').onclick = () => { openModal(`<div class="legal">${window.CC_PRIVACY || ''}</div><button class="b2 big" data-close>${t('close')}</button>`, 'wide'); modal.querySelector('[data-close]').onclick = settingsModal; };
  modal.querySelector('[data-reset]').onclick = async () => { if (await confirmBox(t('resetSure'))) { localStorage.removeItem(KEY); location.reload(); } };
  modal.querySelector('[data-close]').onclick = closeModal;
}
function consentModal(fromSettings) {
  openModal(`<h2>${t('consentTitle')}</h2><p>${t('consentText')}</p><div class="row2"><button class="b2" data-c="0">${t('refuse')}</button><button class="b1" data-c="1">${t('accept')}</button></div>`);
  modal.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.consent = b.dataset.c === '1'; save(); fromSettings ? settingsModal() : (closeModal(), begin()); });
}
function titleScreen() {
  G.mode = 'title'; const el = $('#title');
  el.innerHTML = `<div class="logo">${SPR.logo ? `<img src="${SPR.logo}" alt="Circuit Caper">` : '<h1>Circuit<br><span>Caper</span></h1>'}<p>${t('subtitle')}</p></div><div class="hero">🦝</div><button class="b1 big" data-play>${Object.keys(S.stars).length ? t('cont') : t('play')}</button>`;
  el.classList.add('on'); el.querySelector('[data-play]').onclick = () => { audioInit(); SFX.fanfare(); el.classList.remove('on'); S.consent == null ? consentModal(false) : begin(); };
}
function begin() {
  ensureLogin(); $('#game').classList.add('on'); renderHud();
  const next = LV.find(L => !S.stars[L.id] && unlocked(L.id));
  if (!Object.keys(S.stars).length) { startLevel(LV[0]); setTimeout(() => rico('r_hello'), 100); setTimeout(() => rico('r_plan'), 4200); }
  else { mapScreen(); setTimeout(() => rico('r_back'), 300); if (S.login.pending) setTimeout(giftModal, 600); }
}
addEventListener('resize', layout);
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; G.t += dt; if (G.mode === 'heist') heistTick(dt); musicTick(); draw(); requestAnimationFrame(frame); }
window.CAPER = { G, S: () => S, startLevel, LV, startHeist, pressBtn, toPlan, C };
titleScreen(); requestAnimationFrame(frame);
})();
</script>
