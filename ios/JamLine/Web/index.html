<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4A90C2">
<title>Jam Line</title>
<style>
:root{--red:#E63946;--cream:#FFF3E0;--wood:#C98B4B;--woodd:#9C6532;--green:#6BAA5C;--blue:#4A90C2;--ink:#2A2233;--gold:#F4C430;--orange:#F7931E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--woodd);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
img.ui{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.b1,.b2,.b3{border-radius:16px;padding:11px 16px;font-weight:900;border:3px solid var(--ink);transition:transform .08s;display:block;width:100%;margin-top:9px;font-size:17px}
.b1{background:var(--red);color:var(--cream);box-shadow:0 4px 0 var(--ink)}
.b2{background:var(--cream);box-shadow:0 4px 0 var(--ink)}.b3{background:#fff;color:var(--red);box-shadow:0 4px 0 var(--ink)}
.bad{background:var(--green);color:var(--ink)}
.b1:active,.b2:active,.b3:active,.rb:active,.tb:active{transform:translateY(3px)}.b1:disabled,.b2:disabled{opacity:.45}
.big{font-size:21px;padding:14px}.huge{font-size:24px;padding:16px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
i.gd,i.gm{display:inline-block;width:1.15em;height:1.15em;background:center/contain no-repeat;vertical-align:-.2em}
/* HUD: the orders at the top */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;flex-direction:column;gap:5px;padding:calc(env(safe-area-inset-top) + 8px) 8px 4px;pointer-events:none}
#hud.on{display:flex}#hud button,#hud .ord{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:6px}
.rb{width:42px;height:42px;flex:none;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);font-size:16px;font-weight:900;position:relative;display:grid;place-items:center}
.rb img.ui{width:30px;height:30px}
.rb.dot::after{content:'';position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.chip{display:flex;align-items:center;gap:4px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:3px 9px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:15px;white-space:nowrap}
.chip.sm{font-size:12px;padding:2px 8px;border-width:2px;box-shadow:0 2px 0 rgba(0,0,0,.3)}.chip.over{background:#ffd6d6}.chip.ok{background:#e2f3d8}
#orders{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}#orders::-webkit-scrollbar{display:none}
.ord{flex:none;display:flex;align-items:center;gap:3px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:2px 7px 2px 3px;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:14px;position:relative}
.ord img{width:30px;height:30px;object-fit:contain}.ord img.cl{width:26px;height:26px;margin-right:-4px}.ord.done{background:#e2f3d8}.ord.done::after{content:'✓';position:absolute;right:-6px;top:-8px;background:var(--green);border:2px solid var(--ink);border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.ord small{font-size:10px;opacity:.8;display:block;line-height:1}
/* tools at the bottom */
#tools{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;gap:6px;padding:10px 6px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none;overflow-x:auto;scrollbar-width:none}#tools::-webkit-scrollbar{display:none}#tools>:first-child{margin-left:auto}#tools>:last-child{margin-right:auto}
#tools.on{display:flex}#tools>*{pointer-events:auto}
.tb{width:56px;height:60px;flex:none;border-radius:16px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:10px;position:relative;transition:transform .08s}
.tb img{width:34px;height:34px;object-fit:contain}.tb.on{background:var(--gold);transform:translateY(-4px)}.tb.off{opacity:.4}
.tb .n{position:absolute;right:-6px;top:-8px;background:var(--red);color:var(--cream);border:2px solid var(--ink);border-radius:10px;min-width:20px;font-size:12px;padding:0 4px}
.tb.pulse{animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.12);background:var(--gold)}}
/* Lulu */
#lulu{position:fixed;left:6px;right:6px;z-index:8;display:flex;align-items:flex-end;gap:4px;pointer-events:none;opacity:0;transform:translateY(24px) scale(.92);transition:.25s;bottom:calc(env(safe-area-inset-bottom) + 84px)}
#lulu.on{opacity:1;transform:none}
#lulu .lf{width:86px;height:86px;flex:none;object-fit:contain;animation:gbob 1.6s ease-in-out infinite}@keyframes gbob{50%{transform:translateY(-4px) rotate(-2deg)}}
#lulu.dance .lf{animation:dance .45s ease-in-out infinite alternate}@keyframes dance{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-10px)}}
#lulu .lt{background:var(--cream);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:4px 4px 0 rgba(0,0,0,.35);max-width:280px;margin-bottom:24px}
#lulu.top{bottom:auto;top:calc(env(safe-area-inset-top) + 92px)}
#lulu.home{bottom:calc(env(safe-area-inset-bottom) + 96px)}
#lulu.tut{bottom:calc(env(safe-area-inset-bottom) + 10px)}
/* the surprise client at the window */
#knock{position:fixed;right:8px;z-index:9;display:none;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:4px 10px 4px 4px;box-shadow:4px 4px 0 rgba(0,0,0,.35);font-weight:900;font-size:13px;animation:knock .5s ease-in-out 3}
#knock.on{display:flex}#knock img{width:46px;height:46px}#knock img.p{width:30px;height:30px}#knock.live{animation:none;background:#fff6d6}
@keyframes knock{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}}
/* home: Lulu's shop by the river */
#home{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;background:var(--blue)}
#home.on{display:flex}
#hhead{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;flex-direction:column;gap:6px;background:rgba(42,34,51,.88);border-bottom:3px solid var(--cream)}
.mrow{display:flex;align-items:center;gap:8px}
#plv{background:var(--gold);font-weight:900;border-radius:10px;padding:3px 9px;font-size:13px;white-space:nowrap;border:3px solid var(--ink)}
#xpbar{flex:1;height:14px;background:var(--ink);border:3px solid var(--cream);border-radius:8px;overflow:hidden}#xpbar i{display:block;height:100%;background:var(--green);transition:width .6s}
#hmid{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 12px 14px;gap:8px}
#hmid .logo{width:min(60vw,250px)}
.scene{position:relative;width:100%;max-width:400px;aspect-ratio:4/3;border:4px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 rgba(0,0,0,.35);background:#bfe3f2 center/cover no-repeat}
.scene img{position:absolute;object-fit:contain;pointer-events:none}.scene .lu{animation:gbob 2s ease-in-out infinite}.scene .new{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.map{width:100%;max-width:400px;background:rgba(42,34,51,.55);border:3px solid var(--cream);border-radius:16px;padding:8px}
.map h3{margin:0 0 6px;color:var(--cream);font-size:15px;text-align:left}
.lvls{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lv{aspect-ratio:1;background:var(--cream);border:3px solid var(--ink);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.35);position:relative}
.lv small{font-size:8px;letter-spacing:-1px;color:var(--gold);-webkit-text-stroke:.5px var(--ink)}.lv.lock{opacity:.45}.lv.cur{background:var(--gold);animation:pulse .9s infinite alternate}.lv.chef{background:#ffe1c4}
#hmid .b1{max-width:400px}
.hcard{display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:7px 9px;width:100%;max-width:400px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hcard>img{width:46px;height:46px;object-fit:contain}.hcard .tx{flex:1;min-width:0;font-weight:800;font-size:13px;line-height:1.25}.hcard .tx b{font-size:15px;display:block}
#hfoot{display:flex;justify-content:space-around;padding:8px 4px calc(env(safe-area-inset-bottom) + 10px);background:rgba(42,34,51,.92);border-top:3px solid var(--cream)}
#hfoot .rb{width:46px;height:46px;border-radius:14px}#hfoot .rb img.ui{width:36px;height:36px}
#hfoot small{display:block;text-align:center;font-weight:900;font-size:10px;margin-top:4px;color:var(--cream)}
/* overlays */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(42,34,51,.6);padding:14px}#modal.on{display:flex}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:14px;max-width:390px;width:100%;max-height:90vh;overflow:auto;box-shadow:7px 7px 0 rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.3,1.6,.5,1);text-align:center}
.card.wide{max-width:520px;text-align:left}@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:2px 0 8px;font-size:23px;text-align:center}.card p{margin:6px 0 10px;line-height:1.35}
.big-ico img{width:120px;height:120px;object-fit:contain}.big-ico.s img{width:90px;height:90px}
.gain{font-size:30px;font-weight:900;margin:4px 0}.sub{font-size:13px;opacity:.85;font-weight:800}
.stat{display:flex;justify-content:space-between;font-weight:800;padding:3px 4px;border-bottom:2px dashed rgba(42,34,51,.15)}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}.st{width:96px;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:12px;line-height:1.15}
.st img{width:74px;height:74px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}.st.on img{transform:scale(1)}.st small{font-weight:800;opacity:.8;font-size:11px}.st.miss img{transform:scale(.8);opacity:.35}
.xpl{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px;margin:4px 0}.xpl .pbar{flex:1;margin:0}.xpl .pbar i{transition:width 1.2s cubic-bezier(.3,1,.5,1)}
.near{background:#fff6d6;border:2px dashed var(--ink);border-radius:12px;padding:6px;font-weight:800;font-size:13px;margin:6px 0}
.login{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.lg{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lg small{font-size:9px;font-weight:800}.lg b{font-size:11px}.lg i{width:20px;height:20px}.lg.got{opacity:.4}.lg.now{background:var(--gold)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;border-bottom:2px solid rgba(42,34,51,.15)}.sw input{width:24px;height:24px;accent-color:var(--red)}.sw select{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:3px 6px}
.ver{font-size:11px;opacity:.6;margin-top:8px;text-align:center}.legal{font-size:13px}
.it{display:flex;align-items:center;gap:9px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 9px;margin-bottom:8px;text-align:left}
.it .ico{width:50px;height:50px;flex:none;display:grid;place-items:center;position:relative}.it .ico img{width:50px;height:50px;object-fit:contain}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;font-size:12px;line-height:1.25;opacity:.85}
.it.lock .ico img{filter:grayscale(1);opacity:.45}
.buy{min-width:80px;background:var(--green);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:15px;white-space:nowrap}
.buy.ad{background:var(--gold)}.buy.gm{background:var(--cream)}.buy.off{opacity:.45}.buy:active{transform:translateY(3px)}
.own{font-weight:900;color:#3d7a2e;min-width:70px;text-align:center}
.note{font-size:12px;text-align:center;margin:2px 0 10px;font-weight:700;opacity:.8}
.pbar{height:12px;background:#fff;border:2px solid var(--ink);border-radius:7px;overflow:hidden;margin:5px 0}.pbar i{display:block;height:100%;background:var(--green)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gi{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;min-height:100px;text-align:center}
.gi img{width:56px;height:56px;object-fit:contain}.gi.lock img{opacity:.3;filter:grayscale(1) brightness(.6)}.gi.on{background:var(--gold)}.gi small{font-size:10px;line-height:1.1;font-weight:800}
.gi.rec{background:#fff6e4}.gi.rec.lock{background:#eee}
h3{margin:10px 0 6px;font-size:16px;text-align:left}
.confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(42,34,51,.6);padding:20px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 100px);left:0;right:0;z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:7px 14px;font-weight:900;box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:pop .3s;transition:opacity .4s;max-width:90vw;text-align:center}.toast.out{opacity:0}
.banner{position:fixed;left:0;right:0;top:30%;z-index:45;text-align:center;font-size:40px;font-weight:900;color:var(--red);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:ban 1.8s cubic-bezier(.2,1.4,.4,1) forwards;padding:0 10px}
.banner.g{color:var(--green)}.banner.c{color:var(--cream)}.banner.y{color:var(--gold)}.banner.s{font-size:28px;top:5%}@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.adov{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;align-items:center;justify-content:center}.adbox{color:var(--cream);text-align:center}.adtag{opacity:.7;font-weight:800}.adart img{width:120px;margin:20px}.adcount{font-size:44px;font-weight:900}
/* the recipe card that flips */
.rcard{position:fixed;left:50%;top:26%;z-index:46;width:150px;height:200px;margin-left:-75px;perspective:700px;pointer-events:none;animation:rcin 2.6s forwards}
.rcard .in{position:absolute;inset:0;transform-style:preserve-3d;animation:rflip .7s .35s cubic-bezier(.3,1.4,.5,1) both}
.rcard .fr,.rcard .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:4px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);text-align:center;font-weight:900;padding:6px}
.rcard .bk{transform:rotateY(180deg);background:var(--red) center/70% no-repeat}.rcard .fr img{width:96px;height:96px}.rcard .fr small{color:var(--red);font-size:12px}
@keyframes rflip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}@keyframes rcin{0%{transform:scale(.4) translateY(40px);opacity:0}12%{transform:none;opacity:1}85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-40px) scale(.8)}}
/* title */
/* first-run tutorial: the skip button (top right, in place of the coin chip, hidden meanwhile); the hand is drawn on the canvas */
#tskip{position:fixed;z-index:9;top:calc(env(safe-area-inset-top) + 8px);right:8px;min-width:88px;height:44px;padding:0 14px;border-radius:999px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:900;font-size:16px;display:none}
body.tuto #tskip{display:block}body.tuto #hgold{visibility:hidden}
#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 30px) 24px calc(env(safe-area-inset-bottom) + 40px);background:var(--blue)}
#title.on{display:flex}#title .logo img{width:min(88vw,430px)}#title .tbg{width:min(70vw,40vh);animation:gbob 2.4s ease-in-out infinite}
#title p{font-weight:900;margin:4px 0;font-size:17px;color:var(--cream);text-align:center;text-shadow:0 2px 0 var(--ink)}#title .b1{max-width:320px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div><div id="tools"></div><div id="knock"></div>
<div id="lulu"><img class="lf" alt=""><div class="lt"></div></div>
<div id="home"><div id="hhead"></div><div id="hmid"></div><div id="hfoot"></div></div>

<script>// Jam Line — stand-in art, drawn at startup in the art direction's palette: flat shapes, a thick even #2A2233 outline, one hard shadow,
