png", "momo_profil": "assets/momo_profil.png", "momo_rate": "assets/momo_rate.png", "momo_tete": "assets/momo_tete.png", "momo_tire": "assets/momo_tire.png", "oeuf": "assets/oeuf.png", "oeuf_splat": "assets/oeuf_splat.png", "olive": "assets/olive.png", "olive_splat": "assets/olive_splat.png", "passoire": "assets/passoire.png", "poele": "assets/poele.png", "rouleau": "assets/rouleau.png", "saucisse": "assets/saucisse.png", "servi_assiette": "assets/servi_assiette.png", "servi_plateau": "assets/servi_plateau.png", "servi_poele": "assets/servi_poele.png", "servi_pot": "assets/servi_pot.png", "tomate": "assets/tomate.png", "tomate_splat": "assets/tomate_splat.png", "torchon": "assets/torchon.png", "up_enseigne": "assets/up_enseigne.png", "up_lampes": "assets/up_lampes.png", "up_lustre": "assets/up_lustre.png", "up_nappes": "assets/up_nappes.png", "up_piano": "assets/up_piano.png", "up_tables": "assets/up_tables.png", "up_terrasse": "assets/up_terrasse.png", "up_vitrail": "assets/up_vitrail.png", "ventilo": "assets/ventilo.png"};window.TB_PRIVACY="<h4>Politique de confidentialité — Toss Bistro</h4>\n<p>Toss Bistro fonctionne hors ligne. Ta partie est enregistrée uniquement sur ton appareil. Nous ne demandons ni compte, ni nom, ni adresse e-mail.</p>\n<h4>Publicités</h4>\n<p>Le jeu affiche des publicités via Google AdMob. Si tu acceptes les publicités personnalisées, Google peut utiliser un identifiant publicitaire de ton appareil (IDFA sur iPhone, après ton autorisation ; identifiant publicitaire Android) pour choisir les annonces. Si tu refuses, les annonces ne sont pas personnalisées. Tu peux changer d’avis à tout moment dans Réglages → Choix de confidentialité.</p>\n<h4>Achats</h4>\n<p>Les achats passent par l’App Store ou Google Play. Nous ne voyons jamais tes données de paiement. Aucun achat ne donne d’objet tiré au hasard ni d’amélioration de puissance, et il n’y a aucun abonnement.</p>\n<h4>Statistiques et plantages</h4>\n<p>Des statistiques anonymes (progression, durée des parties, plantages) peuvent être envoyées à GameAnalytics et Firebase Crashlytics pour améliorer le jeu. Elles ne contiennent ni nom, ni e-mail, ni position.</p>\n<h4>Enfants</h4>\n<p>Toss Bistro convient à tous les âges mais ne s’adresse pas spécialement aux enfants. Nous ne collectons sciemment aucune donnée personnelle d’enfant.</p>\n<h4>Tes droits</h4>\n<p>Tu peux effacer ta partie dans Réglages → Effacer la partie. Pour toute question ou pour exercer tes droits (RGPD), écris-nous via la page d’assistance indiquée sur la fiche du jeu.</p>\n<hr>\n<h4>Privacy policy — Toss Bistro</h4>\n<p>Toss Bistro works offline. Your progress is stored only on your device. We ask for no account, name or email address.</p>\n<p><b>Ads:</b> the game shows ads through Google AdMob. If you accept personalised ads, Google may use your device’s advertising identifier (IDFA on iPhone, after your permission; Android advertising ID) to choose ads. If you decline, ads are not personalised. Change this any time in Settings → Privacy choices.</p>\n<p><b>Purchases:</b> purchases go through the App Store or Google Play. We never see your payment details. No purchase gives a random item or a power upgrade, and there is no subscription.</p>\n<p><b>Analytics and crashes:</b> anonymous statistics (progress, session length, crashes) may be sent to GameAnalytics and Firebase Crashlytics to improve the game. They contain no name, email or location.</p>\n<p><b>Children:</b> Toss Bistro suits all ages but is not directed at children. We do not knowingly collect personal data from children.</p>\n<p><b>Your rights:</b> erase your progress in Settings → Erase progress. For questions or GDPR requests, contact us through the support page linked on the store listing.</p>\n";</script>
<script>// BETA IA — a simulated player inside the game, for tests and in-game video capture (spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Shared by every game: copy this file into <game>/src/beta.js, load it BEFORE the game scripts, and register the game's
// scenes after them with BETA.game({...}) (see <game>/src/beta-game.js).
// Turned on only by the address (?beta=ia) and never inside the iOS app (the native store handler is present there).
(() => {
  const Q = new URLSearchParams(location.search);
  const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store);
  const ON = !NATIVE && Q.get('beta') === 'ia';
  const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
  const opts = {
    scene: Q.get('scene') || 'boucle', style: Q.get('style') || 'pro', seed: num('seed', 0), save: Q.get('save') || 'neuf',
    vitesse: num('vitesse', 1), doigt: Q.get('doigt') !== '0', ui: Q.get('ui') || 'normal', duree: num('duree', 0),
    format: Q.get('format') || '', log: Q.get('log') === '1', auto: Q.get('auto') !== '0',
  };

  // ---- seeded randomness: same seed, same game (needed to redo a take) ----
  let rnd = Math.random;
  function seedRandom(seed) {
    let a = (seed >>> 0) || 1;
    rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    Math.random = rnd;
  }

  // ---- game clock ----
  // Normal mode: time runs ×1 to ×20 (performance.now, Date.now, requestAnimationFrame stamps and timers all follow).
  // Capture mode (?capture=1, used by tools/beta-record.mjs): time stands still and only moves with BETA.step(ms),
  // timers and animation frames included, so a slow PC still gives a perfect 30 frames per second video.
  let scale = 1;
  const CAPTURE = Q.get('capture') === '1';
  const realPerf = performance.now.bind(performance), realDate = Date.now, realRaf = requestAnimationFrame.bind(window), realCaf = cancelAnimationFrame.bind(window);
  const realSetTimeout = setTimeout.bind(window), realSetInterval = setInterval.bind(window), realClearTimeout = clearTimeout.bind(window), realClearInterval = clearInterval.bind(window);
  let pBase = realPerf(), pV = pBase, dV = realDate();
  const vPerf = () => CAPTURE ? pV : pV + (realPerf() - pBase) * scale;
  function setSpeed(s) { if (CAPTURE) { scale = Math.max(0.1, s); return; } const now = realPerf(); pV = pV + (now - pBase) * scale; dV = dV + (now - pBase) * scale; pBase = now; scale = Math.max(0.1, s); }
  let vAcc = 0;   // capture mode: milliseconds of video stepped so far
  const videoNow = () => CAPTURE ? vAcc : realPerf();
  // capture-mode scheduler
  let tid = 1e6; const timers = new Map(); let rafs = [];
  function installClock() {
    performance.now = vPerf;
    Date.now = () => Math.round(dV0 + (vPerf() - pV0));
    if (!CAPTURE) {
      window.requestAnimationFrame = cb => realRaf(() => cb(vPerf()));
      window.setTimeout = (f, ms, ...a) => realSetTimeout(f, (ms || 0) / scale, ...a);
      window.setInterval = (f, ms, ...a) => realSetInterval(f, (ms || 0) / scale, ...a);
      return;
    }
    window.requestAnimationFrame = cb => { const id = ++tid; rafs.push([id, cb]); return id; };
    window.cancelAnimationFrame = id => { rafs = rafs.filter(r => r[0] !== id); };
    window.setTimeout = (f, ms, ...a) => { const id = ++tid; timers.set(id, { at: pV + Math.max(0, ms || 0), f, a, every: 0 }); return id; };
    window.setInterval = (f, ms, ...a) => { const id = ++tid; const every = Math.max(1, ms || 0); timers.set(id, { at: pV + every, f, a, every }); return id; };
    window.clearTimeout = window.clearInterval = id => { timers.delete(id); };
  }
  const pV0 = pV, dV0 = dV;

<script>// Toss Bistro — the rules: Momo's kitchen seen from the front like a theatre set (360 × 640 world units, portrait),
// one ingredient thrown with a slingshot pull, bouncing on the utensils hung on the walls, and one dish to land in.
// Pure and deterministic (fixed 1/240 s step, no Math.random): the game, the level generator, the solver and the BETA robot

// which is what lets the game slow down the last 1.5 s of a success before it happens.
(function (root) {

  const MAT = {
    wall:   { e: .34, f: .80, sfx: 'tok' },

    hood:   { e: .55, f: .90, sfx: 'clang', ut: 1 },
    ladle:  { e: .74, f: .95, sfx: 'dzing', ut: 1 },
    towel:  { e: .12, f: .45, sfx: 'pof', ut: 1 },

<script>// Toss Bistro — vector stand-ins drawn on the canvas in the game's flat style (thick ink outline, flat colours, one hard shadow,

// ---------- drawing ----------
function draw() {

  const sh = G.shake > 0 ? (Math.random() - .5) * G.shake * 10 : 0;

  const z = G.zoom, cx = G.cam[0], cy = G.cam[1];

  const B = G.B, sp = G.spec;

  ART.target(g, sp.target, G.phase === 'aim' && G.tries === 0 && G.L.id <= 3 ? (Math.sin(G.time * 4) + 1) / 2 : 0);
  // the dining room

    if (G.pull) { ART.line(g, 3, P.red); g.beginPath(); g.moveTo(st[0] - 14, st[1] - 6); g.lineTo(ix, iy); g.lineTo(st[0] + 14, st[1] - 6); g.stroke(); }

    const [x, y, a] = sample(G.rec, G.pt); if (G.phase === 'fly' || G.rec.result === 'win') ART.ingredient(g, kind, x, y, a, G.sq, r);
  }

  g.restore();

  if (G.slow > .02) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = 'rgba(34,32,46,' + (.85 * G.slow) + ')'; const bh = cv.height * .07 * G.slow; g.fillRect(0, 0, cv.width, bh); g.fillRect(0, cv.height - bh, cv.width, bh); }
}
function ghostHand(st) {   // the tutorial's ghost hand: press on the egg, pull back down-left, let go

// ---------- "Share the slow-mo": a vertical 6-8 s clip of the last throw, through the native share sheet ----------
// The clip is re-drawn from the recording into a 720 × 1280 canvas and recorded with MediaRecorder; the iOS shell hands it to

    const blob = await recordClip(R);
    if (ZVK()) { const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); await ZVK().shareFile('toss-bistro.' + (blob.type.includes('mp4') ? 'mp4' : 'webm'), b64, t('shareClipText')); }

      ART.dining(q, C.W, C.FLOOR, C.H, 8, clap, real, true); ART.momo(q, spec.start[0] + (spec.start[0] < C.W / 2 ? -30 : 30), spec.start[1] + 44, { pose: pt >= R.t ? 'dance' : 'throw', t: real, outfit: S.outfit, s: .82, flip: spec.start[0] > C.W / 2 });

      if (real > 6.2) { q.fillStyle = 'rgba(34,32,46,.86)'; q.fillRect(0, 0, W, H); q.font = '900 92px ui-rounded,system-ui,sans-serif'; q.textAlign = 'center'; q.fillStyle = P.cream; q.fillText('Toss Bistro', W / 2, H / 2); q.font = '800 40px ui-rounded,system-ui,sans-serif'; q.fillStyle = P.yolk; q.fillText(I.lang === 'en' ? 'Free on the App Store' : 'Gratuit sur l’App Store', W / 2, H / 2 + 70); }

<script>// Toss Bistro scenes for the BETA IA simulated player (shared core: beta.js, spec: ZVisionAI/partage/spec-mode-beta-ia.md).
// Every throw is a real gesture: the finger presses on the ingredient, pulls back by the solver's pull vector (levels.js: sol, solB,
// solT) and lets go. A missed throw is a real pull too, just a little off. The 5 scenes of the plan:
// trick (TRICK SHOT, App Store preview n° 1), crepe, echec (the funny failure and the instant retry), montagne (fans and ice),
// bistro (the bistro grown, the terrace, Momo's outfits); plus onboarding, boucle, progression and idle.
(() => {
  if (!window.BETA || !BETA.on) return;
  const D = window.TB, cv = document.getElementById('cv'), G = D.G, S = () => D.S(), LV = D.LV;
  if (BETA.opts.ui === 'propre') { const st = document.createElement('style'); st.textContent = '.adov{display:none!important}[data-x2]{display:none!important}.price{visibility:hidden!important}'; document.head.appendChild(st); }
  const visible = sel => { const e = document.querySelector(sel); return e && e.offsetParent ? e : null; };
  const LI = id => LV.findIndex(l => l.id === id);
  async function until(A, cond, sec) { const t0 = performance.now(); while (A.running() && !cond() && (performance.now() - t0) / 1000 < sec) await A.wait(120); }
  async function start(A) {
    if (A.opts.ui === 'propre') { if (S().consent == null) S().consent = false; S().owned.noads = true; }
    if (G.mode !== 'title') return; await A.wait(1000); await A.tapEl('#title [data-play]', 'jouer'); await A.wait(900);
  }
  // the throw: press on the ingredient, pull back along `pull` (world units), let go
  async function fling(A, pull, label = 'lancer', off = 0) {
    await until(A, () => G.mode === 'play' && G.phase === 'aim', 6); if (!A.running()) return;
    const [x, y] = D.startScreen(), k = D.scale(), C = D.C;
    let tp = pull;
    if (off) {   // a miss is a real pull a little off; checked with the game's own physics so it really misses (never a lucky win)
      for (let i = 0; i < 60; i++) { const a = A.jitter(-off, off) * (1 + i / 30), c = Math.cos(a), sn = Math.sin(a), m = 1 + A.jitter(-.08, .08);
        const q = [(pull[0] * c - pull[1] * sn) * m, (pull[0] * sn + pull[1] * c) * m]; tp = q; if (C.simulate(G.B, q, { magnet: G.spec.magnet }).result !== 'win') break; } }
    // the finger lands within a pixel of the aim; on release the pull is the planned one exactly (a 10-bounce trick shot is chaotic:
    // half a pixel of rounding in the drag would turn it into a miss)
    const snap = () => { if (G.drag) G.pull = [tp[0], tp[1]]; };
    cv.addEventListener('pointerup', snap, { capture: true, once: true });
    await A.think(); await A.drag(x, y, x + tp[0] * k, y + tp[1] * k, label, A.opts.style === 'rapide' ? 420 : 720);
    cv.removeEventListener('pointerup', snap, { capture: true });
    A.mark(label);
    await until(A, () => G.phase !== 'fly', 9);
  }
  function watch(A) {
    let ph = '', stars = 0, b = 0;
    const iv = setInterval(() => { if (!A.running()) return clearInterval(iv);
      if (G.phase !== ph) { if (G.phase === 'win') A.mark(G.trick ? 'TRICK SHOT ! la salle est debout' : 'PARFAIT ! servi'); if (G.phase === 'fail') A.mark('raté drôle : ' + (G.rec ? G.rec.result : '')); ph = G.phase; }
      if (G.phase === 'fly' && G.slow > .5 && b !== -1) { A.mark('ralenti automatique'); b = -1; } if (G.phase !== 'fly') b = 0;
      const st = document.querySelectorAll('#modal .st.on').length; if (st > stars) { stars = st; if (st === 3) A.mark('3 étoiles'); } if (!document.querySelector('#modal .st')) stars = 0;
    }, 100);
  }
  function makeSave(kind) {
    const s = S(); s.consent = s.consent == null ? false : s.consent; s.login = { last: new Date().getFullYear() + '-' + (new Date().getMonth() + 1) + '-' + new Date().getDate(), streak: 3, pending: false };
    const upto = kind === 'avance' ? LV.length : 12; s.unl = upto; s.plays = 30; s.said = { l1: 1, l2: 1, l3: 1, l3b: 1, chef10: 1, chef20: 1, k2: 1, bistro: 1, garden: 1, box: 1 };
    for (let i = 0; i < upto - 1; i++) s.best[LV[i].id] = [true, i % 3 !== 1, i % 2 === 0];
    s.gold = kind === 'avance' ? 2400 : 520; s.plv = kind === 'avance' ? 9 : 4; s.xp = 30;
    for (const d of (kind === 'avance' ? ['tables', 'nappes', 'lampes', 'piano', 'enseigne', 'terrasse'] : ['tables', 'nappes'])) s.bistro[d] = 1;
    if (kind === 'avance') { s.outfits.beret = 1; s.outfits.lunettes = 1; s.outfit = 'lunettes'; }
    for (let i = 0; i < upto - 1; i++) s.book[window.TBE.dishes[i]] = 1; D.save();
  }
  const trickLevel = () => { let best = null; for (const l of LV) { if (l.chef || !l.solT) continue; if (!best || l.trickB > best.trickB) best = l; } return best; };
  const progress = () => [G.mode, G.L && G.L.id, G.tries, G.phase];

  async function onboarding(A) {   // the first 30 seconds: the egg that can't miss, one pan bounce, the crepe
    watch(A); await start(A); await A.wait(3500);
    await fling(A, LV[0].sol, 'premier lancer : l’œuf dans la casserole'); await until(A, () => visible('#modal [data-next]'), 4); await A.wait(1800);
    await A.tapEl('#modal [data-next]', 'niveau suivant'); await A.wait(2600); await fling(A, LV[1].sol, 'un rebond sur la poêle'); await until(A, () => visible('#modal [data-next]'), 5); await A.wait(1600);
    await A.tapEl('#modal [data-next]', 'niveau suivant'); await A.wait(3000); await fling(A, LV[2].sol, 'la crêpe : premier essai', .12); await A.wait(1500);
    if (G.phase !== 'win') { await fling(A, LV[2].sol, 'la crêpe : deuxième essai'); } await A.wait(4000);
  }
  async function trick(A) { watch(A); const L = trickLevel(); await A.wait(1500); await fling(A, L.solT, 'TRICK SHOT : ' + L.trickB + ' rebonds'); await A.wait(4500); }
  async function crepe(A) { watch(A); const L = G.L; await A.wait(1400); await fling(A, L.sol, 'la crêpe : le salto au ralenti'); await A.wait(4200); }
  async function echec(A) { watch(A); const L = G.L; await A.wait(1300); await fling(A, L.sol, 'raté : l’œuf s’écrase', .35); await A.wait(900); await fling(A, L.sol, 'rejouer instantané', .25); await A.wait(900); await fling(A, L.sol, 'encore un… servi !'); await A.wait(3800); }
  async function montagne(A) { watch(A); const L = G.L; await A.wait(1500); await fling(A, L.solB || L.sol, 'la montagne : ventilateur et glace'); await A.wait(4200); }
  async function bistro(A) { watch(A); await A.wait(1500); await A.tapEl('#hmid [data-bistro]', 'le bistro'); await A.wait(2400); await A.tapEl('#modal [data-close]', 'fermer'); await A.wait(800); await A.tapEl('#hfoot [data-f="shop"]', 'tenues de Momo'); await A.wait(2600); D.closeModal(); await A.wait(1500); }
  async function boucle(A) { watch(A); for (let n = 0; n < 3 && A.running(); n++) { const L = G.L; await A.wait(1200); await fling(A, L.sol, 'lancer', n === 0 ? .2 : 0); await A.wait(1500); if (G.phase === 'fail') await fling(A, L.sol, 'rejouer'); await until(A, () => visible('#modal [data-next]'), 5); await A.wait(1500); const b = visible('#modal [data-next]'); if (b) await A.tapEl(b, 'niveau suivant'); await A.wait(1600); } }
  async function idle(A) { watch(A);
    while (A.running()) {
      if (G.mode === 'home') { const b = visible('#hmid [data-play]'); if (b) await A.tapEl(b, 'jouer'); await A.wait(1500); continue; }
      const n = visible('#modal [data-next]'); if (n) { await A.wait(1500); await A.tapEl(n, 'niveau suivant'); await A.wait(1500); continue; }
      if (G.mode === 'play' && G.phase === 'aim') { const L = G.spec; await fling(A, L.sol || [-40, 90], 'lancer', G.tries ? 0 : .15); }
      await A.wait(700);
    } }

  BETA.game({
    sfx: D.SFX, endText: () => document.documentElement.lang === 'en' ? 'Play free' : 'Joue gratuitement', progress,
    async prepare(save, A) {
      const sc = A.opts.scene;
      if (sc === 'onboarding') { D.resetSave(); return; }
      makeSave(save === 'neuf' ? 'milieu' : save === 'avance' || sc === 'bistro' ? 'avance' : save);
      await start(A); await A.wait(400); D.closeModal();
      const crepeL = LV.find(l => !l.chef && l.ing === 'crepe' && l.id > 3) || LV[2], k2 = LV.find(l => l.kitchen === 2 && !l.chef && l.shapes.some(s => s.k === 'fan')) || LV[0];
      const pick = { trick: trickLevel(), moment: trickLevel(), crepe: crepeL, echec: LV[LI(6)] || LV[5], montagne: k2, progression: k2, boucle: LV[LI(7)] || LV[6] }[sc];
      if (pick) { D.startLevel(LV.indexOf(pick)); await A.wait(300); }
      if (sc === 'bistro') D.goHome();
      document.getElementById('momo').classList.remove('on'); await A.wait(300);
    },
    scenes: { onboarding, trick, moment: trick, crepe, echec, montagne, progression: montagne, bistro, boucle, idle },
  });
